    const allData = {"general": [{"title": "\u20b930 lakh investment: FD vs SCSS vs Post Office MIS\u2014which offers the highest monthly income?", "full_content": "Are you an investor with \u20b9 30 lakh to deploy? Are you looking to invest in various fixed-income instruments and small savings schemes to generate meaningful returns?\n\nFor investors with this amount, the choice among a bank fixed deposit (FD), the Senior Citizen Savings Scheme (SCSS) , and the Post Office Monthly Income Scheme (MIS) depends entirely on factors such as interest rates, eligibility criteria, deposit limits, lock-in periods, payout frequency, and similar considerations.\n\nIt is vital to note that as of today, the SCSS scheme offers an interest rate of 8.2% per annum, whereas Post Office MIS offers 7.4%. However, the SCSS scheme is specifically designed for senior citizens.\n\nFurthermore, these schemes cater to different investors and aim to fulfil distinct financial objectives for them. Keeping this in mind, let us look at the interest rate and how much monthly income \u20b9 30,000 lakh invested in each scheme can generate.\n\nNote: For updated rates and features, of small savings schemes, refer to the official website of India Post*\n\nSCSS calculation : \u20b9 30 lakh \u00d7 8.2% = \u20b9 2.46 lakh a year, equivalent to \u20b9 20,500 a month. It is critical to note that the actual interest in this scheme is paid quarterly. MIS has a deposit ceiling, so \u20b9 30 lakh cannot normally be invested in a single account.\n\nWith the maximum joint MIS deposit of \u20b9 15 lakh, the monthly interest is \u20b9 9,250 per account; two eligible accounts could therefore generate \u20b9 18,500 per month, subject to account eligibility rules, regulations and stipulations.\n\nThe answer to this depends on the kind of investor one is and which scheme works for them. Still, SCSS wins in the stated \u20b9 30 lakh comparison, provided the investor is eligible to invest. This is because it generates \u20b9 61,500 every quarter, equivalent to \u20b9 20,500 per month before taxation.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "European shares sag on Tehran\u2019s Hormuz zone plan and imminent ECB hike", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:59 PM IST", "pub_date_relative": "6m ago"}, {"title": "Newly listed metal stock Rajputana Stainless to be in focus on Tuesday after order win from Suzlon Energy", "full_content": "Shares of Rajputana Stainless , the manufacturer of long and flat stainless-steel products, are likely to remain in focus in Tuesday's trade, September 8, after the company secured a fresh order from Suzlon Energy.\n\nIn a post-market filing on Monday, the company said it received an order from Suzlon Energy for a 2.10 MW wind power project in Gujarat. Under the contract, Rajputana Stainless will set up one Suzlon S120_140 wind turbine generator with a capacity of 2,100 kW at the Jamjodhpur site in Gujarat.\n\nThe order, awarded by a domestic entity, is valued at \u20b9 16.21 crore plus GST per wind turbine generator and is to be executed within 11 months, according to the filing.\n\nRajputana Stainless said the order does not involve any interest from its promoter or promoter group in the awarding entity and does not fall under related-party transactions.\n\nThe company recently listed its shares on the stock exchanges, making the order win an early business development for the newly listed company.\n\nThe company's shares made their stock market debut in March, listing at the same price as the issue price of \u20b9 122 apiece. However, the stock soon attracted strong demand from investors.\n\nThe following month, the stock gained 35%, and the momentum has persisted, with shares crossing the \u20b9 180 mark. Considering Monday's closing price of \u20b9 186, the stock is trading 52% higher than its IPO price. From its low of \u20b9 101, the stock has rebounded nearly 84%.\n\nIt has finished each of the last three months in the green, with August emerging as the strongest month, when the stock jumped 25%.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago"}, {"title": "FTSE 100 today: Stocks recover as surging oil buoys energy amid Hormuz standoff", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "Tech Rally Surges in Asia as Kospi Soars", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "XRP Ledger Volume Rose 79% in a Year With Traders Down 40%. Is XRP Being Used or Just Traded?", "full_content": "Skip to navigation Skip to main content Skip to right column XRP Ledger Volume Rose 79% in a Year With Traders Down 40%. Is XRP Being Used or Just Traded? Sam Daodu Mon, September 7, 2026 at 8:15 AM CDT 6 min read XRP-USD Quick Read XRP Ledger order-book volume averaged 3.57 million XRP a day in Q2 2026, up 79% from a year earlier, while daily trading accounts fell 40% from 1,864 to 1,111, according to Evernorth.\n\nThe number of addresses active in a day on XRPL fell more than 23% in the first half of 2026 even as the ledger added 490,000 new ones, and on-chain exchange volume across seven major networks fell 46% over the same period.\n\nTokenized assets on XRPL averaged $3.72 billion in Q2 2026, 30 times a year earlier, and RLUSD balances averaged $539 million, up 642%, for $4.26 billion of value held on the ledger against $99 million at the end of 2024.\n\nXRP trades at $1.41, down 50% year-over-year, and must hold above $1.52 to confirm the recent bounce is more than a short squeeze.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMore XRP (CRYPTO:XRP) changed hands on the XRP Ledger, the blockchain XRP runs on, in the second quarter of 2026, and fewer accounts did the trading. Order-book trading on the ledger's built-in exchange rose 79% from a year earlier, to 3.57 million XRP a day from 1.99 million, according to Evernorth's Q2 2026 XRP Liquidity Report. The number of accounts placing those trades fell 40% over the same period, from 1,864 a day to 1,111.\n\nMeanwhile, the XRP price trades at $1.41 as of September 6, 2026, down 50% over the past year even as trading on the ledger grew.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:45 PM IST", "pub_date_relative": "21m ago"}, {"title": "Is Oklo at $41 a Bargain or a Trap? Here's the Answer.", "full_content": "Skip to navigation Skip to main content Skip to right column Is Oklo at $41 a Bargain or a Trap? Here's the Answer. Jack Delaney, The Motley Fool Mon, September 7, 2026 at 8:14 AM CDT 3 min read OKLO NVDA As of Sept. 4, Oklo 's (NYSE: OKLO) stock price has dropped 42% in 2026. Oklo trades at $41.27 as of this writing and inches closer to its 52-week low of $36.61, and some investors may be wondering whether this is an opportune time to buy Oklo stock.\n\nBased on what analysts are forecasting over the next 12 months, here's the answer.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs a company without commercial operations, Oklo doesn't yet generate meaningful revenue. It's also in an industry filled with regulatory hurdles, and Oklo is trying to accomplish something unique through its vertically integrated business model, where it does everything from fuel fabrication to selling power and heat to recycling the fuel.\n\nThat means there are plenty of risks involved with Oklo, and purchasing its shares today is all about what it could accomplish in the future.\n\nThat said, based on analysts' price targets, more aggressive investors may view the rewards as outweighing the risks and consider it a bargain at today's price. According to CNN, the median price target from the 20 analysts covering Oklo over the next 12 months is $80. From the Sept. 4 closing price of $41.27, this represents a gain of roughly 94%. For the full picture, the most bullish price target from the group is $122, while the lowest is $14.\n\nPrice targets aren't perfect predictors, but they do help establish risk-to-reward frameworks. The range those analysts have, from $14 to $122, suggests the extreme price swings this stock could face.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:44 PM IST", "pub_date_relative": "22m ago"}, {"title": "UK\u2019s Jaguar Land Rover to cut nearly 10% of workforce under turnaround plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago"}, {"title": "Global Growth Fund is Re-Evaluating Flutter Entertainment\u2019s (FLUT) Strategic Fit", "full_content": "Skip to navigation Skip to main content Skip to right column Global Growth Fund is Re-Evaluating Flutter Entertainment\u2019s (FLUT) Strategic Fit Soumya Eswaran Mon, September 7, 2026 at 8:13 AM CDT 3 min read FLUT Sands Capital , an investment management company, released its second-quarter 2026 investor letter for \"Sands Capital Global Growth Fund\". The letter can be downloaded here . Global Growth seeks the best growth businesses worldwide, leveraging a research team that explores both developed and emerging markets for sustainable competitive advantages. In the quarter, global equities rebounded strongly, driven by AI infrastructure, a key market theme, with demand for computing capacity remaining robust and large tech firms maintaining significant capital investments. Emerging markets, led by Korea and Taiwan, outperformed U.S. and developed markets for six consecutive quarters. The strategy's portfolio returned 22.2%, outperforming the MSCI All Country World Index's 14.9%. The quarter's gains were mainly due to earnings growth in AI infrastructure businesses. Relative results were driven by information technology and industrials, while financials and communication services detracted. The strategy is positioned to capitalize on evolving growth opportunities, with substantial exposure to AI infrastructure and other long-term prospects. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Sands Capital Global Growth Fund highlighted Flutter Entertainment plc (NYSE: FLUT ). Headquartered in New York, New York, Flutter Entertainment plc (NYSE:FLUT) is a leading gambling and sports betting company. On September 04, 2026, Flutter Entertainment plc (NYSE:FLUT) closed at $100.11 per share. Over the past month, Flutter Entertainment plc (NYSE:FLUT) returned 6.19%, but its shares are down 65.24% over the past year.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago"}, {"title": "UAE says its energy exports will not be \u2019held hostage\u2019 by Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Have more than \u20b95 lakh in one bank FD? Sanjay Kathuria warns of a hidden risk and reveals how to shield your money", "full_content": "Fixed deposits are often seen as one of the safest investment options, but there is a limit to how much of your bank deposit is protected if the bank fails. This becomes important for investors who keep large sums in FDs with a single bank.\n\nIn a post on X, Sanjay Kathuria shared a clip from his appearance on The Ranveer Show podcast and highlighted the risk of putting a large FD amount in one bank.\n\nKathuria mentioned that the \u201c RBI guarantees your FD up to \u20b9 5 lakh, per bank. Put \u20b9 5 lakh in HDFC, \u20b9 5 lakh in ICICI, even if both banks collapse tomorrow, you get both \u20b9 5 lakh back. Not a combined 5, each bank separately.\u201d\n\nThe protection comes through deposit insurance provided by the Deposit Insurance and Credit Guarantee Corporation ( DICGC ). The insurance cover is up to \u20b9 5 lakh per depositor per bank, including principal and interest.\n\nThe DICGC insures deposits such as savings, fixed, current, and recurring deposits, with certain exceptions, including:\n\nFor example, if an individual has \u20b9 3.5 lakh in a savings account, \u20b9 50,000 in a current account and \u20b9 1.75 lakh in an FD with Bank A, the total deposits with Bank A would be \u20b9 5.75 lakh. However, the DICGC insurance cover would be limited to \u20b9 5 lakh per depositor per bank.\n\nIf you have deposits with multiple banks, the \u20b9 5 lakh deposit insurance limit applies separately to each bank.\n\nSuppose an investor puts \u20b9 50 lakh in an FD with one bank. The investor cannot assume that the entire \u20b9 50 lakh will be protected under deposit insurance if the bank fails. The insured amount is capped at \u20b9 5 lakh per depositor per bank.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago"}, {"title": "Tetra Tech (TTEK): Navigating Growth Amid Infrastructure Investment Uncertainty", "full_content": "Skip to navigation Skip to main content Skip to right column Tetra Tech (TTEK): Navigating Growth Amid Infrastructure Investment Uncertainty Soumya Eswaran Mon, September 7, 2026 at 8:10 AM CDT 3 min read TTEK Sands Capital , an investment management company, released its second-quarter 2026 investor letter for \"Sands Capital Global Growth Fund\". The letter can be downloaded here . Global Growth seeks the best growth businesses worldwide, leveraging a research team that explores both developed and emerging markets for sustainable competitive advantages. In the quarter, global equities rebounded strongly, driven by AI infrastructure, a key market theme, with demand for computing capacity remaining robust and large tech firms maintaining significant capital investments. Emerging markets, led by Korea and Taiwan, outperformed U.S. and developed markets for six consecutive quarters. The strategy's portfolio returned 22.2%, outperforming the MSCI All Country World Index's 14.9%. The quarter's gains were mainly due to earnings growth in AI infrastructure businesses. Relative results were driven by information technology and industrials, while financials and communication services detracted. The strategy is positioned to capitalize on evolving growth opportunities, with substantial exposure to AI infrastructure and other long-term prospects. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Sands Capital Global Growth Fund highlighted Tetra Tech, Inc. (NASDAQ: TTEK ). Tetra Tech, Inc. (NASDAQ:TTEK) is a US-based consulting and engineering services company focusing on water, environment, and sustainable infrastructure. On September 04, 2026, Tetra Tech, Inc. (NASDAQ:TTEK) closed at $35.91 per share. Over the past month, Tetra Tech, Inc. (NASDAQ:TTEK) returned 2.48%, but its shares are up 0.56% over the past year. Tetra Tech, Inc.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:40 PM IST", "pub_date_relative": "26m ago"}, {"title": "Goldman says higher interest rates could dent this real-estate firm", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:40 PM IST", "pub_date_relative": "26m ago"}, {"title": "Greenland welcomes major funding boost from EU amid Trump\u2019s annexation threats", "full_content": "European Commission President Ursula von der Leyen on Monday announced a fresh funding boost for Greenland, seeking to shore up Arctic ties with the self-governing Danish territory amid U.S. President Donald Trump 's annexation drive.\n\nSpeaking alongside Greenlandic Prime Minister Jens-Frederik Nielsen and Danish Prime Minister Mette Frederiksen, the EU chief said the 200-million-euro ($232.3 million) funding package reflects \"a clear choice\" by Greenland to strengthen ties with the 27-nation bloc.\n\n\"This partnership package focuses mainly on three domains, or strategic priorities. We call them the big Cs: connectivity, clean energy [and] critical raw materials,\" Von der Leyen told reporters at a news conference.\n\nThe funds, which is to be invested this year and in 2027, is designed to bolster ties between the EU and the Arctic, with Von der Leyen describing Greenland as \"a strategic ally and a trusted friend.\"\n\nIt comes shortly after Icelanders voted to reject restarting EU membership negotiations and as Trump renews his push to acquire Greenland on national security grounds.\n\n\"The European Union continues to be, not only an important partner for Greenland, but also a loyal and trusted friend,\" Greenland's Nielsen said.\n\n\"Through these challenging times, your support to us is unfailing. You have stood by us and continue to stand by us. We feel it and are deeply grateful. Thank you,\" he added.\n\nAsked whether they had any concerns about how Trump may react to the funding package and what message he should take from the announcement, Denmark's Frederiksen said: \"We have been under pressure and it has been very clear, and we are very thankful for the great support that we have received from our European partners \u2014 but, by the way, also globally.\"", "source": "CNBC Top News", "pub_date_str": "07 Sep 2026, 06:39 PM IST", "pub_date_relative": "27m ago"}, {"title": "Rising CPU Demand Positions Arm Holdings (ARM) for Gains", "full_content": "Skip to navigation Skip to main content Skip to right column Rising CPU Demand Positions Arm Holdings (ARM) for Gains Soumya Eswaran Mon, September 7, 2026 at 8:09 AM CDT 3 min read ARM Sands Capital , an investment management company, released its second-quarter 2026 investor letter for \"Sands Capital Global Growth Fund\". The letter can be downloaded here . Global Growth seeks the best growth businesses worldwide, leveraging a research team that explores both developed and emerging markets for sustainable competitive advantages. In the quarter, global equities rebounded strongly, driven by AI infrastructure, a key market theme, with demand for computing capacity remaining robust and large tech firms maintaining significant capital investments. Emerging markets, led by Korea and Taiwan, outperformed U.S. and developed markets for six consecutive quarters. The strategy's portfolio returned 22.2%, outperforming the MSCI All Country World Index's 14.9%. The quarter's gains were mainly due to earnings growth in AI infrastructure businesses. Relative results were driven by information technology and industrials, while financials and communication services detracted. The strategy is positioned to capitalize on evolving growth opportunities, with substantial exposure to AI infrastructure and other long-term prospects. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Sands Capital Global Growth Fund highlighted Arm Holdings plc (NASDAQ: ARM ) as new holding. Arm Holdings plc (NASDAQ:ARM) is a UK-based technology company that develops and licenses central processing unit designs and related technologies for semiconductor companies and original equipment manufacturers. On September 04, 2026, Arm Holdings plc (NASDAQ:ARM) closed at $252.09 per share. Over the past month, Arm Holdings plc (NASDAQ:ARM) declined 5.88%, and its shares gained 81.18% over the past 52 weeks.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:39 PM IST", "pub_date_relative": "27m ago"}, {"title": "Barclays increases stake in Central Asia Metals to 5.66%", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:38 PM IST", "pub_date_relative": "27m ago"}, {"title": "Far-right AfD landslide in German state piles pressure on federal government", "full_content": "A landslide electoral victory for the far-right in the small but significant state of Saxony-Anhalt over the weekend is sending shockwaves through Europe and piling pressure on Germany's federal government.\n\nAlternative for Germany (AfD) secured the highest share of the vote at 43.8%, well above the 17.2% of the incumbent Christian Democratic Union Party (CDU), which also leads the country's national coalition under Chancellor Friedrich Merz. Initial results show the AfD securing 39 of 83 parliamentary seats, leaving it three seats short of an outright majority and uncertain over its ability to form a new state government.\n\nA so-called \"firewall\" sees other parties in Germany agree not to cooperate with far-right in a way that would give it political power. However, AfD candidate Ulrich Siegmund said Monday that the party would hold discussions with \"individual parliamentary groups or individual MPs\" to see if they would support it in governing.\n\nIn a press conference, Merz said the election showed the need for reform but said Germany's \"institutions were resilient and stable.\"\n\n\"This message is also directed at our friends in Europe and across the globe,\" he said, according to a Reuters report.\n\nThe \"extraordinary\" result may be the \"most consequential German state-election result of the postwar era,\" Mujtaba Rahman, managing director for Europe at consultancy Eurasia Group, said Monday.\n\nWhile the AfD has been growing in popularity for years , particularly in eastern Germany , the result raises the prospect of the hard right taking power in a German state for the first time since the Nazi era.\n\nAt the state level, the party has pledged stringently anti-refugee and anti-migrant policies, including accelerating deportations and separating the children of refugees into different classrooms, while encouraging SMEs to use AI rather than migrant workers and financially incentivizing families to have more children.", "source": "CNBC Top News", "pub_date_str": "07 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago"}, {"title": "Tech companies look to Argentina\u2019s windswept Patagonia to build massive data centers", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:36 PM IST", "pub_date_relative": "30m ago"}, {"title": "Cathie Wood Has Stuck With Tesla Through Repeated Missed Robotaxi Deadlines. Here's Why She's Still Buying.", "full_content": "Skip to navigation Skip to main content Skip to right column Cathie Wood Has Stuck With Tesla Through Repeated Missed Robotaxi Deadlines. Here's Why She's Still Buying. Ryan Vanzo, The Motley Fool Mon, September 7, 2026 at 8:05 AM CDT 4 min read TSLA NVDA Ark Invest, Cathie Wood's investment firm, has traded in and out of Tesla (NASDAQ: TSLA) stock for nearly a decade. It turns out, however, that the firm might have been better off never selling down its position.\n\nIn 2016, for example, Ark Invest acquired its first stake in Tesla at roughly $13 per share. In 2017, the firm purchased the stock every quarter at prices between $17 and $22 per share. In 2018, the buying continued through the first three quarters of the year at prices ranging from $20 to $22 per share.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nIn the fourth quarter of 2018, however, Ark Invest unloaded 5 million Tesla shares at roughly $21.50 per share, nearly cutting its stake in half. With Tesla stock now trading at nearly $400 per share, slashing its Tesla stake so early in the company's growth journey was clearly a mistake.\n\nOver the years that followed, Wood would authorize many additional acquisitions and dispositions of Tesla stock. Some of the trades paid off. Others were regrettable. Still, Wood clearly understood the electric vehicle (EV) company's growth potential earlier than most investors or analysts.\n\nNow, Wood is buying even more Tesla stock. After the company released its last quarterly report, Ark Invest plowed $50 million into Tesla stock, adding 160,000 shares to its holdings.\n\nWood remains exceptionally bullish on Tesla even at a $1.2 trillion market cap.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:35 PM IST", "pub_date_relative": "31m ago"}, {"title": "At 62, She Put $35,750 Into Her 401(k) and $8,750 Into an HSA. Only One Lowered Her Social Security Wages.", "full_content": "Skip to navigation Skip to main content Skip to right column At 62, She Put $35,750 Into Her 401(k) and $8,750 Into an HSA. Only One Lowered Her Social Security Wages. Gerelyn Terzo Mon, September 7, 2026 at 8:04 AM CDT 5 min read Quick Read 401(k) deferrals up to $35,750 for workers aged 60 through 63 don't reduce Social Security covered wages, but cafeteria-plan HSA contributions do.\n\nHSA contributions routed through payroll save $76.50 per $1,000 in employee payroll taxes but shrink the earnings Social Security uses to calculate benefits.\n\nReduced Social Security wages only matter if this year ranks among a worker's top 35 earning years and income stays below the $184,500 wage base.\n\nMany financial professionals are salespeople paid on what they push, not whether you end up wealthier. A fiduciary is the opposite. The SEC legally requires them to put your interests first. Advisor.com's free matching tool pairs you with vetted fiduciaries from major national firms, all in under three minutes. See who you match with today.\n\nA 62-year-old worker directs $35,750 into her workplace 401(k), taking advantage of the enhanced catch-up available in her early sixties. She also sends $8,750 into a family Health Savings Account (HSA) through payroll. Both deductions shrink the paycheck she takes home. Only one lowers the wages Social Security sees.\n\nHer 401(k) contribution still counts as Social Security and Medicare wages even though traditional deferrals generally escape current federal income tax. HSA contributions made through a qualifying cafeteria plan can avoid all three. The HSA gives her an extra tax break today, but it also leaves a slightly smaller number on her Social Security earnings record.\n\nFor 2026, someone age 60, 61, 62 or 63 can contribute as much as $35,750 to a qualifying 401(k) if the plan permits catch-ups.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:34 PM IST", "pub_date_relative": "31m ago"}], "cfa": [{"title": "\u20b930 lakh investment: FD vs SCSS vs Post Office MIS\u2014which offers the highest monthly income?", "full_content": "Are you an investor with \u20b9 30 lakh to deploy? Are you looking to invest in various fixed-income instruments and small savings schemes to generate meaningful returns?\n\nFor investors with this amount, the choice among a bank fixed deposit (FD), the Senior Citizen Savings Scheme (SCSS) , and the Post Office Monthly Income Scheme (MIS) depends entirely on factors such as interest rates, eligibility criteria, deposit limits, lock-in periods, payout frequency, and similar considerations.\n\nIt is vital to note that as of today, the SCSS scheme offers an interest rate of 8.2% per annum, whereas Post Office MIS offers 7.4%. However, the SCSS scheme is specifically designed for senior citizens.\n\nFurthermore, these schemes cater to different investors and aim to fulfil distinct financial objectives for them. Keeping this in mind, let us look at the interest rate and how much monthly income \u20b9 30,000 lakh invested in each scheme can generate.\n\nNote: For updated rates and features, of small savings schemes, refer to the official website of India Post*\n\nSCSS calculation : \u20b9 30 lakh \u00d7 8.2% = \u20b9 2.46 lakh a year, equivalent to \u20b9 20,500 a month. It is critical to note that the actual interest in this scheme is paid quarterly. MIS has a deposit ceiling, so \u20b9 30 lakh cannot normally be invested in a single account.\n\nWith the maximum joint MIS deposit of \u20b9 15 lakh, the monthly interest is \u20b9 9,250 per account; two eligible accounts could therefore generate \u20b9 18,500 per month, subject to account eligibility rules, regulations and stipulations.\n\nThe answer to this depends on the kind of investor one is and which scheme works for them. Still, SCSS wins in the stated \u20b9 30 lakh comparison, provided the investor is eligible to invest. This is because it generates \u20b9 61,500 every quarter, equivalent to \u20b9 20,500 per month before taxation.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Newly listed metal stock Rajputana Stainless to be in focus on Tuesday after order win from Suzlon Energy", "full_content": "Shares of Rajputana Stainless , the manufacturer of long and flat stainless-steel products, are likely to remain in focus in Tuesday's trade, September 8, after the company secured a fresh order from Suzlon Energy.\n\nIn a post-market filing on Monday, the company said it received an order from Suzlon Energy for a 2.10 MW wind power project in Gujarat. Under the contract, Rajputana Stainless will set up one Suzlon S120_140 wind turbine generator with a capacity of 2,100 kW at the Jamjodhpur site in Gujarat.\n\nThe order, awarded by a domestic entity, is valued at \u20b9 16.21 crore plus GST per wind turbine generator and is to be executed within 11 months, according to the filing.\n\nRajputana Stainless said the order does not involve any interest from its promoter or promoter group in the awarding entity and does not fall under related-party transactions.\n\nThe company recently listed its shares on the stock exchanges, making the order win an early business development for the newly listed company.\n\nThe company's shares made their stock market debut in March, listing at the same price as the issue price of \u20b9 122 apiece. However, the stock soon attracted strong demand from investors.\n\nThe following month, the stock gained 35%, and the momentum has persisted, with shares crossing the \u20b9 180 mark. Considering Monday's closing price of \u20b9 186, the stock is trading 52% higher than its IPO price. From its low of \u20b9 101, the stock has rebounded nearly 84%.\n\nIt has finished each of the last three months in the green, with August emerging as the strongest month, when the stock jumped 25%.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FTSE 100 today: Stocks recover as surging oil buoys energy amid Hormuz standoff", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "XRP Ledger Volume Rose 79% in a Year With Traders Down 40%. Is XRP Being Used or Just Traded?", "full_content": "Skip to navigation Skip to main content Skip to right column XRP Ledger Volume Rose 79% in a Year With Traders Down 40%. Is XRP Being Used or Just Traded? Sam Daodu Mon, September 7, 2026 at 8:15 AM CDT 6 min read XRP-USD Quick Read XRP Ledger order-book volume averaged 3.57 million XRP a day in Q2 2026, up 79% from a year earlier, while daily trading accounts fell 40% from 1,864 to 1,111, according to Evernorth.\n\nThe number of addresses active in a day on XRPL fell more than 23% in the first half of 2026 even as the ledger added 490,000 new ones, and on-chain exchange volume across seven major networks fell 46% over the same period.\n\nTokenized assets on XRPL averaged $3.72 billion in Q2 2026, 30 times a year earlier, and RLUSD balances averaged $539 million, up 642%, for $4.26 billion of value held on the ledger against $99 million at the end of 2024.\n\nXRP trades at $1.41, down 50% year-over-year, and must hold above $1.52 to confirm the recent bounce is more than a short squeeze.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMore XRP (CRYPTO:XRP) changed hands on the XRP Ledger, the blockchain XRP runs on, in the second quarter of 2026, and fewer accounts did the trading. Order-book trading on the ledger's built-in exchange rose 79% from a year earlier, to 3.57 million XRP a day from 1.99 million, according to Evernorth's Q2 2026 XRP Liquidity Report. The number of accounts placing those trades fell 40% over the same period, from 1,864 a day to 1,111.\n\nMeanwhile, the XRP price trades at $1.41 as of September 6, 2026, down 50% over the past year even as trading on the ledger grew.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:45 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Is Oklo at $41 a Bargain or a Trap? Here's the Answer.", "full_content": "Skip to navigation Skip to main content Skip to right column Is Oklo at $41 a Bargain or a Trap? Here's the Answer. Jack Delaney, The Motley Fool Mon, September 7, 2026 at 8:14 AM CDT 3 min read OKLO NVDA As of Sept. 4, Oklo 's (NYSE: OKLO) stock price has dropped 42% in 2026. Oklo trades at $41.27 as of this writing and inches closer to its 52-week low of $36.61, and some investors may be wondering whether this is an opportune time to buy Oklo stock.\n\nBased on what analysts are forecasting over the next 12 months, here's the answer.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs a company without commercial operations, Oklo doesn't yet generate meaningful revenue. It's also in an industry filled with regulatory hurdles, and Oklo is trying to accomplish something unique through its vertically integrated business model, where it does everything from fuel fabrication to selling power and heat to recycling the fuel.\n\nThat means there are plenty of risks involved with Oklo, and purchasing its shares today is all about what it could accomplish in the future.\n\nThat said, based on analysts' price targets, more aggressive investors may view the rewards as outweighing the risks and consider it a bargain at today's price. According to CNN, the median price target from the 20 analysts covering Oklo over the next 12 months is $80. From the Sept. 4 closing price of $41.27, this represents a gain of roughly 94%. For the full picture, the most bullish price target from the group is $122, while the lowest is $14.\n\nPrice targets aren't perfect predictors, but they do help establish risk-to-reward frameworks. The range those analysts have, from $14 to $122, suggests the extreme price swings this stock could face.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:44 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements an NYSE:FLUT) returned 6.19%, but its shares are down 65.24% over the past year.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Have more than \u20b95 lakh in one bank FD? Sanjay Kathuria warns of a hidden risk and reveals how to shield your money", "full_content": "Fixed deposits are often seen as one of the safest investment options, but there is a limit to how much of your bank deposit is protected if the bank fails. This becomes important for investors who keep large sums in FDs with a single bank.\n\nIn a post on X, Sanjay Kathuria shared a clip from his appearance on The Ranveer Show podcast and highlighted the risk of putting a large FD amount in one bank.\n\nKathuria mentioned that the \u201c RBI guarantees your FD up to \u20b9 5 lakh, per bank. Put \u20b9 5 lakh in HDFC, \u20b9 5 lakh in ICICI, even if both banks collapse tomorrow, you get both \u20b9 5 lakh back. Not a combined 5, each bank separately.\u201d\n\nThe protection comes through deposit insurance provided by the Deposit Insurance and Credit Guarantee Corporation ( DICGC ). The insurance cover is up to \u20b9 5 lakh per depositor per bank, including principal and interest.\n\nThe DICGC insures deposits such as savings, fixed, current, and recurring deposits, with certain exceptions, including:\n\nFor example, if an individual has \u20b9 3.5 lakh in a savings account, \u20b9 50,000 in a current account and \u20b9 1.75 lakh in an FD with Bank A, the total deposits with Bank A would be \u20b9 5.75 lakh. However, the DICGC insurance cover would be limited to \u20b9 5 lakh per depositor per bank.\n\nIf you have deposits with multiple banks, the \u20b9 5 lakh deposit insurance limit applies separately to each bank.\n\nSup ock every quarter at prices between $17 and $22 per share. In 2018, the buying continued through the first three quarters of the year at prices ranging from $20 to $22 per share.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nIn the fourth quarter of 2018, however, Ark Invest unloaded 5 million Tesla shares at roughly $21.50 per share, nearly cutting its stake in half. With Tesla stock now trading at nearly $400 per share, slashing its Tesla stake so early in the company's growth journey was clearly a mistake.\n\nOver the years that followed, Wood would authorize many additional acquisitions and dispositions of Tesla stock. Some of the trades paid off. Others were regrettable. Still, Wood clearly understood the electric vehicle (EV) company's growth potential earlier than most investors or analysts.\n\nNow, Wood is buying even more Tesla stock. After the company released its last quarterly report, Ark Invest plowed $50 million into Tesla stock, adding 160,000 shares to its holdings.\n\nWood remains exceptionally bullish on Tesla even at a $1.2 trillion market cap.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:35 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "At 62, She Put $35,750 Into Her 401(k) and $8,750 Into an HSA. Only One Lowered Her Social Security Wages.", "full_content": "Skip to navigation Skip to main content Skip to right column At 62, She Put $35,750 Into Her 401(k) and $8,750 Into an HSA. Only One Lowered Her Social Security Wages. Gerelyn Terzo Mon, September 7, 2026 at 8:04 AM CDT 5 min read Quick Read 401(k) deferrals up to $35,750 for workers aged 60 through 63 don't reduce Social Security covered wages, but cafeteria-plan HSA contributions do.\n\nHSA contributions routed through payroll save $76.50 per $1,000 in employee payroll taxes but shrink the earnings Social Security uses to calculate benefits.\n\nReduced Social Security wages only matter if this year ranks among a worker's top 35 earning years and income stays below the $184,500 wage base.\n\nMany financial professionals are salespeople paid on what they push, not whether you end up wealthier. A fiduciary is the opposite. The SEC legally requires them to put your interests first. Advisor.com's free matching tool pairs you with vetted fiduciaries from major national firms, all in under three minutes. See who you match with today.\n\nA 62-year-old worker directs $35,750 into her workplace 401(k), taking advantage of the enhanced catch-up available in her early sixties. She also sends $8,750 into a family Health Savings Account (HSA) through payroll. Both deductions shrink the paycheck she takes home. Only one lowers the wages Social Security sees.\n\nHer 401(k) contribution still counts as Social Security and Medicare wages even though traditional deferrals generally escape current federal income tax. HSA contributions made through a qualifying cafeteria plan can avoid all three. The HSA gives her an extra tax break today, but it also leaves a slightly smaller number on her Social Security earnings record.\n\nFor 2026, someone age 60, 61, 62 or 63 can contribute as much as $35,750 to a qualifying 401(k) if the plan permits catch-ups.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:34 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Clearing Up Confusion Surrounding ETs and Index Funds", "full_content": "Skip to navigation Skip to main content Skip to right column Clearing Up Confusion Surrounding ETs and Index Funds Christian Drerup Mon, September 7, 2026 at 8:00 AM CDT 5 min read Quick Read An index fund describes an investment strategy, while ETF describes fund structure, meaning an index fund can itself be an ETF.\n\nETFs trade at fluctuating prices anytime during market hours, while index mutual funds price only once after the market closes.\n\nBoth funds charge annual expense ratios, but ETFs can also carry trading costs like commissions and bid-ask spreads, making neither automatically cheaper.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nETFs and index funds are popular investments, especially for people looking for a fairly simple way to invest in multiple companies at once. The terms can be confusing and are often used interchangeably, but they do not mean exactly the same thing. The biggest differences become clearer once you understand how these funds are structured, purchased, priced, and traded.\n\nETF stands for exchange-traded fund. An ETF collects money from multiple investors and uses it to hold several investments. They can include stocks, bonds, or other assets. In this way, buying just one share of an ETF means you could be investing in dozens or even hundreds of different assets. Just like individual stocks, ETFs are bought and sold on stock exchanges during the trading day.\n\nAn index fund is an investment fund that follows a particular market index. Let's take the S&P 500 for example. An S&P 500 index fund tries to match the performance of the S&P 500 by investing in a variety of companies within that index. Instead of having a manager making decisions about which exact stocks to buy and sell on your behalf, the fund automatically tracks its specific index.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:30 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Apple May Be the Safest AI Stock Nobody Calls an AI Stock", "full_content": "Skip to navigation Skip to main content Skip to right column Why Apple May Be the Safest AI Stock Nobody Calls an AI Stock Vandita Jadeja Mon, September 7, 2026 at 8:00 AM CDT 5 min read AAPL MSFT GOOG Quick Read Apple (AAPL) deploys AI across 2.5 billion active devices without hyperscaler capex, supporting a $364 price target with a 90% confidence BUY rating.\n\nApple's 42x P/E dwarfs Microsoft (MSFT) and Alphabet (GOOGL), but its unmatched 171% ROE and 32% operating margin justify the premium valuation.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Apple didn't make the cut. Enter your email to see the names that beat AAPL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nApple ( NASDAQ:AAPL ) rarely gets grouped with the pure-play AI names, but I think that is exactly why it is one of the most interesting AI-adjacent setups in mega-cap tech right now. With over 2.5 billion active devices and a newly unveiled Siri AI running on custom silicon, Apple owns the distribution layer everyone else is trying to reach.\n\nOur 24/7 Wall St. price target for Apple is $363.99 over the next 12 months, pointing to an upside of 11.87% from the current price of $325.81. Our model output skews constructive, with a high confidence reading of 90%.\n\nApple shares have run hard into this window. AAPL is up 4.91% on the week, 5.34% on the month, 19.92% year to date, and 40.58% over the trailing year. The stock now sits roughly 6% off its 52-week high of $344.27, well above the low of $225.12. Meanwhile, Bloomberg reports Tim Cook delivered a 2,300% stock gain before handing the CEO seat to John Ternus.\n\n24/7 Wall St has helped investors make money for over two decades, and our top analysts just finished ranking the definitive Top 10 Stocks To Buy Now . Not the ten biggest companies. Not the ten everyone is arguing about.", "source": "Yahoo Finance", "pub_date_str": "07 Sep 2026, 06:30 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gaiety Galaxy Shut Down By Mumbai Police Following 'Hanuman Ansh' Ruckus", "full_content": "The violations reportedly came to light during an investigation into a ruckus at the cinema following the removal of the film Hanuman Ansh from screening.", "source": "NDTV Profit", "pub_date_str": "07 Sep 2026, 06:26 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Apple\u2019s Sept. 9 Event Could Change Everything", "full_content": "Skip to navigation Skip to main content Skip to right column Apple\u2019s Sept. 9 Event Could Change Everything Alex Sirois Mon, September 7, 2026 at 7:55 AM CDT 4 min read AAPL MSFT GOOG Quick Read Apple (AAPL) beat EPS estimates nine straight quarters, returned $62B to shareholders, and runs a Services segment at a 76% gross margin.\n\nDespite owning Microsoft (MSFT) and Alphabet (GOOGL), the author directs fresh capital to Apple for its unmatched hardware install base and aggressive buyback program.\n\nTim Cook called memory pricing a \"100-year flood,\" yet Apple guided roughly 10% revenue growth and gross margins near 48% for the September quarter.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Apple didn't make the cut. Enter your email to see the names that beat AAPL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nI keep clicking buy on Apple ( NASDAQ:AAPL ), and my brokerage statement shows it. The Sept.     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
