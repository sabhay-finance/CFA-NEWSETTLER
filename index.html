t market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Sep 2026, 12:44 PM IST", "pub_date_relative": "20m ago"}, {"title": "Which small savings schemes offer tax benefits with no investment limit? Check the complete comparison", "full_content": "Are you an investor aspiring to invest in the government-backed savings options? Small Savings Schemes that can help in combining tax benefits with the freedom to invest without any upper ceiling?\n\nThen the investment choices you have are limited. This is because, for example, the Senior Citizen Savings Scheme (SCSS) has a ceiling of \u20b9 30 lakh for an eligible investor. On similar lines, the Sukanya Samriddhi Yojana (SSY) also has a ceiling of \u20b9 1.5 lakh in a financial year.\n\nAs of 5 September 2026, the National Savings Certificate (NSC) and the 5-year Post Office Time Deposit (TD) are two such small savings schemes that meet both criteria. Still, it is essential to keep in mind that the tax benefit is subject to the applicable income-tax rules and the overall deduction limit.\n\nThis is because the National Savings Certificate (NSC) has a 5-year maturity and permits investments starting from \u20b9 1,000, with no maximum investment limit. Furthermore, the deposits in this scheme qualify for deduction under Section 80C, subject to the overall \u20b9 1.5 lakh limit applicable to eligible investments.\n\nNSC investments, hence, suit investors who aspire to invest in a scheme with a fixed tenure and government backing, while also allowing them to invest more than \u20b9 1.5 lakh.\n\nThe 5-year Post Office Time Deposit is yet another scheme with no maximum investment limit. Not only this, but it is specifically the five-year TD that qualifies for the Section 80C deduction; the one-, two- and three-year TDs do not receive this particular tax benefit.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 12:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "Paying over \u20b950,000 rent per month? Here's what tenants must do to avoid income tax penalty, interest", "full_content": "Tenants paying more than \u20b9 50,000 in monthly rent must deduct TDS before making the payment to their landlords as failing to comply with this rule can lead to penalty and other such consequences.\n\nTDS data helps the government track high-value rental transactions and collect tax directly at the source. It is the tenant's responsibility to deduct the amount and deposit it with the government.\n\nThis provision falls under Section 194-IB of the Income-tax Act and applies to individuals and Hindu Undivided Families ( HUFs ) who are not not required to get their accounts audited. This means even salaried taxpayers, who may have no business income, fall under its scope.\n\nIf the rent paid to a resident landlord exceeds \u20b9 50,000 per month, the tenant must deduct 2% TDS before making the payment. The rate was reduced from 5% to 2%, with effect from October 1, 2024.\n\nTDS on rent is deducted once a year. It can be either deducted in the last month of the financial year or the last month of the tenancy if the property is vacated during the year, whichever is earlier.\n\nFor example, if you pay \u20b9 1 lakh per month as rent for a Mumbai flat for the entire financial year, the total annual rent would be \u20b9 12 lakh. At 2%, the total TDS would be \u20b9 24,000. This amount would be deducted from the rent payable in the final month, with the remaining amount paid to the landlord.\n\nHowever, the \u20b9 24,000 tax deduction is not a permanent loss for the landlord. It is deposited with the government on the landlord's behalf. The landlord can claim that TDS amount as a tax credit while filing the income tax return (ITR) for the relevant year, subject to the applicable tax liability.\n\nThe provision covers rent paid for the use of land, buildings, factory premises, and other specified assets, such as machinery, furniture, fittings and equipment, under a lease, tenancy or similar arrangement.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 12:38 PM IST", "pub_date_relative": "27m ago"}, {"title": "Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks SECTIONS Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks By Nikhil Agarwal , ETMarkets.com Last Updated: Sep 05, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal AMC is favouring high-growth themes including defence, renewables, hospitals, digital businesses and capital markets, while limiting exposure to large banks, IT, commodities, FMCG and traditional vehicles. Its concentrated, high-beta strategy targets sustained earnings growth and alpha.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving ook", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a How the rise of institutional investors is changing the IPO playbook The Economic Times daily newspaper is available online now. Read Today's Paper How the rise of institutional investors is changing the IPO playbook SECTIONS How the rise of institutional investors is changing the IPO playbook By Mahavir Lunawat , ET CONTRIBUTORS Last Updated: Sep 05, 2026, 11:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s IPO market is evolving beyond capital raising, with mutual funds, AIFs, insurers, global institutions and family offices driving deeper participation. Growing institutional selectivity highlights the need for sharper price discovery, better segmentation and a potential micro-cap category.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Sep 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "NSE IPO: Latest GMP price, expected date of opening, allotment to listing | All facts and news that you must know", "full_content": "NSE IPO news: After a nearly decade-long wait, the initial public offering (IPO) of the National Stock Exchange (NSE) has finally received approval from the market regulator, SEBI, to raise funds through a public issue. Upon receipt of the observation letter from SEBI, the grey market became active for the NSE IPO . According to IPO Watch, the NSE IPO GMP (grey market premium) today is \u20b9 200. However, the NSE has yet to announce the IPO price band, subscription opening date, and other details.\n\nSpeaking on the expected NSE IPO price band, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe market valuation of the NSE IPO is around \u20b9 30,000 crore, and the total number of shares offered is around 14.89 crore. So, the exact price of the NSE's shares is around \u20b9 2015 ( \u20b9 30,000 crore / 14.89 crore).\u201d\n\nIf the NSE IPO is launched at a customary 10% to 15% premium, then we can expect the NSE IPO price band to be in the \u20b9 1800 to \u20b9 1900 range. However, if the NSE decides to maximise its IPO returns, the public issue may come at a higher valuation, and the NSE IPO price band may fall in the \u20b9 2000 to \u20b9 2200 range.\n\nBy quoting its anonymous sources, Reuters reported that large prospective investors, including Indian mutual funds, indicated they would be comfortable buying shares at around \u20b9 1,800 apiece.\n\nAccording to Reuters, the NSE is targeting a listing in the week starting September 21. So, the NSE IPO listing date may fall on 21 September 2026 at the earliest and 25 September 2026 at the latest. Quoting its anonymous sources, Reuters further reports that NSE is expected to begin book-building on September 11, with the price band likely to be announced on September 15.\n\nAs mentioned above, IPO Watch reports that the NSE IPO GMP today is \u20b9 200.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "ITAT says genuine F&O profits cannot be called bogus without evidence linking traders to manipulation", "full_content": "The Income Tax Appellate Tribunal (ITAT), Mumbai, categorically ruled that tax authorities cannot treat fair and genuine futures and options (F&O) and commodity trading profits as bogus or simply accommodation entries merely on the basis of an investigative report.\n\nSubsequently, the tribunal dismissed the Revenue\u2019s appeal in the case of a Mumbai resident, Rakhi Vipul Jogi, explaining the aspects in detail and upholding the cancellation of a reassessment in which her F&O and commodity trading profits were treated as unexplained income. Keeping these basics in mind, let us discuss the case and its core facts in detail.\n\nJogi had declared a total income of \u20b9 7.36 lakh for the Assessment Year 2012-13. Her return was initially processed under Section 143(1) of the Income Tax Act, 1961. Then, in 2019, the Assessing Officer (AO) reopened the case again based on information from the investigation wing, Kolkata, regarding the alleged misuse of the National Multi-Commodity Exchange platform.\n\nThe AO found that Jogi made purchases worth \u20b9 2.77 crore and subsequently sold goods worth \u20b9 2.782 crore through her broker, Star Commodities. Thus, earning a profit of \u20b9 8.07 lakh. This profit was treated as \u2018an accommodation\u2019 entry, with an additional \u20b9 24,225 added as estimated commission. Sections 68 and 69C of the Income Tax Act, 1961 were involved. Furthermore, the AO also treated a \u20b9 50 lakh property purchase as an unexplained investment.\n\nStill, it is vital to keep in mind that the Commissioner of Income Tax (Appeals) quashed the reassessment, noting that neither Jogi nor her broker appeared in the lists cited by the investigation department. The ITAT clearly agreed.\n\nThe tribunal clarified that information from the investigation wing can serve as a basis for reopening an assessment.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "SGB 2021-22 Series VI: RBI fixes \u20b915,334 redemption price, \u20b91 lakh investment gains over 227% in 5 years", "full_content": "Investors who bought Sovereign Gold Bonds (SGBs) 2021-22 Series VI are set to get an opportunity to exit their investment at a significantly higher value than the original issue price. The Reserve Bank of India (RBI) has fixed the premature redemption price for the series at \u20b9 15,334 per unit, with the redemption date falling on 7 September 2026.\n\nThe SGB 2021-22 Series VI was issued on 7 September 2021. Investors who purchased the bonds online and paid digitally received a \u20b9 50 discount and paid \u20b9 4,682 per gram, while the issue price for other investors was \u20b9 4,732 per gram.\n\nAt \u20b9 15,334, the redemption value is more than three times the discounted online issue price.\n\nFor an investor who bought the bonds online at \u20b9 4,682 per unit, the increase in value works out to \u20b9 10,652 per unit.\n\nThat translates into an absolute price gain of about 227.5% over the original issue price.\n\nFor example, an investor who put \u20b9 1 lakh into the SGB at the discounted issue price would have purchased about 21.36 units. At the RBI's redemption price of \u20b9 15,334, those units would be worth approximately \u20b9 3.28 lakh.\n\nThis calculation does not include the interest earned during the holding period.\n\nSGBs carry a fixed interest rate of 2.5% per annum, calculated on the original investment amount. Interest is paid twice a year. Therefore, investors who have held the bonds since 2021 would have received additional interest income over and above the appreciation in the value of their gold -linked investment.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pubmatic chairman, chief innovation officer Goel sells $106,526 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "India's cyclical recovery faces risks; oil supply shock, AI capex may hit corporate margins from Q2FY27: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's cyclical recovery faces risks; oil supply shock, AI capex may hit corporate margins from Q2FY27: Report The Economic Times daily newspaper is available online now. Read Today's Paper India's cyclical recovery faces risks; oil supply shock, AI capex may hit corporate margins from Q2FY27: Report SECTIONS India's cyclical recovery faces risks; oil supply shock, AI capex may hit corporate margins from Q2FY27: Report ANI Last Updated: Sep 05, 2026, 12:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s economic recovery faces growing risks from the oil supply shock, fading domestic stimulus and slowing AI investment, Nuvama Institutional Equities said. The brokerage expects pressure on corporate margins to emerge from Q2FY27, with small- and mid-cap companies and cyclical sectors particularly exposed.\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "05 Sep 2026, 12:57 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "F&O Talk: Nifty indicating little evidence of sustained recovery, says Sudeep Shah; outlines BSE, Groww strategy amid CAS", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a F&O Talk: Nifty indicating little evidence of sustained recovery, says Sudeep Shah; outlines BSE, Groww strategy amid CAS The Economic Times daily newspaper is available online now. Read Today's Paper F&O Talk: Nifty indicating little evidence of sustained recovery, says Sudeep Shah; outlines BSE, Groww strategy amid CAS SECTIONS F&O Talk: Nifty indicating little evidence of sustained recovery, says Sudeep Shah; outlines BSE, Groww strategy amid CAS By Veer Sharma , ETMarkets.com Last Updated: Sep 05, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nifty faces continued bearish pressure after a fourth weekly decline, with 23,750-23,700 as crucial support and 24,150-24,200 resistance. Analysts expect volatility to stay subdued, while Bank Nifty remains range-bound. BSE, Groww and Angel One also await decisive breakouts for direction.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Sep 2026, 12:44 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Which small savings schemes offer tax benefits with no investment limit? Check the complete comparison", "full_content": "Are you an investor aspiring to invest in the government-backed savings options? Small Savings Schemes that can help in combining tax benefits with the freedom to invest without any upper ceiling?\n\nThen the investment choices you have are limited. This is because, for example, the Senior Citizen Savings Scheme (SCSS) has a ceiling of \u20b9 30 lakh for an eligible investor. On similar lines, the Sukanya Samriddhi Yojana (SSY) also has a ceiling of \u20b9 1.5 lakh in a financial year.\n\nAs of 5 September 2026, the National Savings Certificate (NSC) and the 5-year Post Office Time Deposit (TD) are two such small savings schemes that meet both criteria. Still, it is essential to keep in mind that the tax benefit is subject to the applicable income-tax rules and the overall deduction limit.\n\nThis is because the National Savings Certificate (NSC) has a 5-year maturity and permits investments starting from \u20b9 1,000, with no maximum investment limit. Furthermore, the deposits in this scheme qualify for deduction under Section 80C, subject to the overall \u20b9 1.5 lakh limit applicable to eligible investments.\n\nNSC investments, hence, suit investors who aspire to invest in a scheme with a fixed tenure and government backing, while also allowing them to invest more than \u20b9 1.5 lakh.\n\nThe 5-year Post Office Time Deposit is yet another scheme with no maximum investment limit. Not only this, but it is specifically the five-year TD that qualifies for the Section 80C deduction; the one-, two- and three-year TDs do not receive this particular tax benefit.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 12:38 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Paying over \u20b950,000 rent per month? Here's what tenants must do to avoid income tax penalty, interest", "full_content": "Tenants paying more than \u20b9 50,000 in monthly rent must deduct TDS before making the payment to their landlords as failing to comply with this rule can lead to penalty and other such consequences.\n\nTDS data helps the government track high-value rental transactions and collect tax directly at the source. It is the tenant's responsibility to deduct the amount and deposit it with the government.\n\nThis provision falls under Section 194-IB of the Income-tax Act and applies to individuals and Hindu Undivided Families ( HUFs ) who are not not required to get their accounts audited. This means even salaried taxpayers, who may have no business income, fall under its scope.\n\nIf the rent paid to a resident landlord exceeds \u20b9 50,000 per month, the tenant must deduct 2% TDS before making the payment. The rate was reduced from 5% to 2%, with effect from October 1, 2024.\n\nTDS on rent is deducted once a year. It can be either deducted in the last month of the financial year or the last month of the tenancy if the property is vacated during the year, whichever is earlier.\n\nFor example, if you pay \u20b9 1 lakh per month as rent for a Mumbai flat for the entire financial year, the total annual rent would be \u20b9 12 lakh. At 2%, the total TDS would be \u20b9 24,000. This amount would be deducted from the rent payable in the final month, with the remaining amount paid to the landlord.\n\nHowever, the \u20b9 24,000 tax deduction is not a permanent loss for the landlord. It is deposited with the government on the landlord's behalf. The landlord can claim that TDS amount as a tax credit while filing the income tax return (ITR) for the relevant year, subject to the applicable tax liability.\n\nThe provision covers rent paid for the use of land, buildings, factory premises, and other specified assets, such as machinery, furniture, fittings and equipment, under a lease, tenancy or similar arrangement.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 12:38 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks SECTIONS Motilal Oswal AMC CEO Prateek Agrawal explains why he is avoiding large banks, IT and FMCG stocks By Nikhil Agarwal , ETMarkets.com Last Updated: Sep 05, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal AMC is favouring high-growth themes including defence, renewables, hospitals, digital businesses and capital markets, while limiting exposure to large banks, IT, commodities, FMCG and traditional vehicles. Its concentrated, high-beta strategy targets sustained earnings growth and alpha.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and  ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How the rise of institutional investors is changing the IPO playbook", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a How the rise of institutional investors is changing the IPO playbook The Economic Times daily newspaper is available online now. Read Today's Paper How the rise of institutional investors is changing the IPO playbook SECTIONS How the rise of institutional investors is changing the IPO playbook By Mahavir Lunawat , ET CONTRIBUTORS Last Updated: Sep 05, 2026, 11:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s IPO market is evolving beyond capital raising, with mutual funds, AIFs, insurers, global institutions and family offices driving deeper participation. Growing institutional selectivity highlights the need for sharper price discovery, better segmentation and a potential micro-cap category.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Sep 2026, 11:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSE IPO: Latest GMP price, expected date of opening, allotment to listing | All facts and news that you must know", "full_content": "NSE IPO news: After a nearly decade-long wait, the initial public offering (IPO) of the National Stock Exchange (NSE) has finally received approval from the market regulator, SEBI, to raise funds through a public issue. Upon receipt of the observation letter from SEBI, the grey market became active for the NSE IPO . According to IPO Watch, the NSE IPO GMP (grey market premium) today is \u20b9 200. However, the NSE has yet to announce the IPO price band, subscription opening date, and other details.\n\nSpeaking on the expected NSE IPO price band, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe market valuation of the NSE IPO is around \u20b9 30,000 crore, and the total number of shares offered is around 14.89 crore. So, the exact price of the NSE's shares is around \u20b9 2015 ( \u20b9 30,000 crore / 14.89 crore).\u201d\n\nIf the NSE IPO is launched at a customary 10% to 15% premium, then we can expect the NSE IPO price band to be in the \u20b9 1800 to \u20b9 1900 range. However, if the NSE decides to maximise its IPO returns, the public issue may come at a higher valuation, and the NSE IPO price band may fall in the \u20b9 2000 to \u20b9 2200 range.\n\nBy quoting its anonymous sources, Reuters reported that large prospective investors, including Indian mutual funds, indicated they would be comfortable buying shares at around \u20b9 1,800 apiece.\n\nAccording to Reuters, the NSE is targeting a listing in the week starting September 21. So, the NSE IPO listing date may fall on 21 September 2026 at the earliest and 25 September 2026 at the latest. Quoting its anonymous sources, Reuters further reports that NSE is expected to begin book-building on September 11, with the price band likely to be announced on September 15.\n\nAs mentioned above, IPO Watch reports that the NSE IPO GMP today is \u20b9 200.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "ITAT says genuine F&O profits cannot be called bogus without evidence linking traders to manipulation", "full_content": "The Income Tax Appellate Tribunal (ITAT), Mumbai, categorically ruled that tax authorities cannot treat fair and genuine futures and options (F&O) and commodity trading profits as bogus or simply accommodation entries merely on the basis of an investigative report.\n\nSubsequently, the tribunal dismissed the Revenue\u2019s appeal in the case of a Mumbai resident, Rakhi Vipul Jogi, explaining the aspects in detail and upholding the cancellation of a reassessment in which her F&O and commodity trading profits were treated as unexplained income. Keeping these basics in mind, let us discuss the case and its core facts in detail.\n\nJogi had declared a total income of \u20b9 7.36 lakh for the Assessment Year 2012-13. Her return was initially processed under Section 143(1) of the Income Tax Act, 1961. Then, in 2019, the Assessing Officer (AO) reopened the case again based on information from the investigation wing, Kolkata, regarding the alleged misuse of the National Multi-Commodity Exchange platform.\n\nThe AO found that Jogi made purchases worth \u20b9 2.77 crore and subsequently sold goods worth \u20b9 2.782 crore through her broker, Star Commodities. Thus, earning a profit of \u20b9 8.07 lakh. This profit was treated as \u2018an accommodation\u2019 entry, with an additional \u20b9 24,225 added as estimated commission. Sections 68 and 69C of the Income Tax Act, 1961 were involved. Furthermore, the AO also treated a \u20b9 50 lakh property purchase as an unexplained investment.\n\nStill, it is vital to keep in mind that the Commissioner of Income Tax (Appeals) quashed the reassessment, noting that neither Jogi nor her broker appeared in the lists cited by the investigation department. The ITAT clearly agreed.\n\nThe tribunal clarified that information from the investigation wing can serve as a basis for reopening an assessment.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 11:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SGB 2021-22 Series VI: RBI fixes \u20b915,334 redemption price, \u20b91 lakh investment gains over 227% in 5 years", "full_content": "Investors who bought Sovereign Gold Bonds (SGBs) 2021-22 Series VI are set to get an opportunity to exit their investment at a significantly higher value than the original issue price. The Reserve Bank of India (RBI) has fixed the premature redemption price for the series at \u20b9 15,334 per unit, with the redemption date falling on 7 September 2026.\n\nThe SGB 2021-22 Series VI was issued on 7 September 2021. Investors who purchased the bonds online and paid digitally received a \u20b9 50 discount and paid \u20b9 4,682 per gram, while the issue price for other investors was \u20b9 4,732 per gram.\n\nAt \u20b9 15,334, the redemption value is more than three times the discounted online issue price.\n\nFor an investor who bought the bonds online at \u20b9 4,682 per unit, the increase in value works out to \u20b9 10,652 per unit.\n\nThat translates into an absolute price gain of about 227.5% over the original issue price.\n\nFor example, an investor who put \u20b9 1 lakh into the SGB at the discounted issue price would have purchased about 21.36 units. At the RBI's redemption price of \u20b9 15,334, those units would be worth approximately \u20b9 3.28 lakh.\n\nThis calculation does not include the interest earned during the holding period.\n\nSGBs carry a fixed interest rate of 2.5% per annum, calculated on the original investment amount. Interest is paid twice a year. Therefore, investors who have held the bonds since 2021 would have received additional interest income over and above the appreciation in the value of their gold -linked investment.", "source": "LiveMint Money", "pub_date_str": "05 Sep 2026, 11:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Have Rs 5 Lakh In Your Bank Account? SIP, Lumpsum Or FD-Where Should You Put It?", "full_content": "The decision should not be based solely on which option has the highest potential return. The investment horizon, risk tolerance and financial goals should all be considered before investing Rs 5 lakh.", "source": "NDTV Profit", "pub_date_str": "05 Sep 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "917% Return in 5 Years: Can This Power Stock Extend Its Multibagger Run?", "full_content": "From a FY21 loss to Rs 213 crore PAT in FY26, Schneider Electric Infrastructure has undergone a major earnings turnaround, investors will now look forward to order execution for future growth and other expansion plans", "source": "NDTV Profit", "pub_date_str": "05 Sep 2026, 11:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the larg     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
