tes are due on Wednesday, with investors watching for insights on the Fed's October decision to leave interest rates unchanged. Traders are currently pricing in a 95% chance of a quarter-percentage-point hike in December, per the CME Group's FedWatch tool.\n\nElsewhere in the market, a selloff in key technology and AI stocks continued on Monday amid growing calls to reinstate Jensen Huang as Nvidia's CEO. A source familiar with the matter told CNBC on Monday that Nvidia's board of directors is not discussing bringing back the founder.\n\nAdditionally, the Commerce Department on Monday moved to close a loophole that let Chinese firms lease Nvidia's computing power from locations in other countries.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 01:53 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Parents Have Rs 30 Lakh In Savings But No Pension: How Can They Generate Monthly Income?", "full_content": "Putting the entire Rs 30 lakh into one investment avenue may not be the wisest approach. Retired parents should keep a separate cash reserve for medical bills, household emergencies and other unplanned expenses.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:53 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Why cash flow matters as much as asset allocation", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen families discuss long-term wealth management, the focus often falls on strategic asset allocation: how much to invest in equities versus fixed income, domestic versus international markets, real estate or gold. But even the most carefully constructed portfolio can unravel if it is disconnected from an investor's cash flow.\n\nIn over two decades of advising families as a financial life planner, I have observed this recurring vulnerability. Investors devote considerable time to calibrating their exposure across asset classes but often overlook the cash flow dynamics that determine whether their portfolios can withstand financial pressures.\n\nToo often, these two disciplines are treated separately. Cash flow is seen as routine financial bookkeeping, covering household expenses, advance tax obligations and loan commitments, while asset allocation is viewed as portfolio construction. In practice, they are two sides of the same rupee. For investors with established, multi-asset portfolios, understanding how cash flow shapes portfolio durability is essential to preserving wealth over the long term.\n\nAn investor's balance sheet may reflect a high psychological appetite for risk, but actual risk capacity is determined by liquidity.\n\nConsider a senior corporate executive, startup founder or successful business owner in India with significant wealth spread across real estate, mutual funds and direct equity holdings. While their net worth may be substantial, their operating cash flows could be vulnerable to variable compensation cycles, business slowdowns or delayed milestone payouts.\n\nIf such an investor maintains an aggressive growth portfolio , heavily weighted towards mid-cap equity mutual funds and long-term capital assets, without an accompanying liquidity strategy, a sudden cash crunch can create an uncomfortable dilemma.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Guarantor loan liability: Can banks deduct EMIs from your pension account if borrower defaults? What High Court ruled", "full_content": "Imagine retiring from government service and relying on your monthly pension to meet household expenses. You had stood as a guarantor for someone\u2019s loan while you were still employed. Years later, the borrower stops paying the EMIs, and the bank begins deducting money from your pension account to recover the outstanding dues.\n\nThis is what happened to a retired police personnel in Jammu and Kashmir, who approached the court after the bank allegedly continued making deductions despite his request to stop them.\n\nThe Jammu and Kashmir and Ladakh High Court examined this issue in its 13 November 2026 judgment in Nazir Ahmad Kuchay vs Jammu and Kashmir Bank Limited .\n\nThe case raised an important question: can a bank use a pension account to recover a loan taken by someone else when the pensioner had guaranteed its repayment?\n\nThe retired police personnel, Nazir Ahmad Kuchay, had stood as a guarantor for another individual who obtained financial assistance from Jammu and Kashmir Bank. A guarantor is someone who promises to repay a loan if the borrower fails to do so.\n\nWhen the borrower defaulted on the loan instalments, the bank began deducting the dues from Kuchay's bank account. By then, he had retired from government service and was dependent on his pension to support himself and his family.\n\nAfter learning about the deductions, he approached the bank and explained his financial dependence on pension income. The bank assured him that further deductions would stop. However, the deductions allegedly continued.\n\nKuchay subsequently filed a civil suit seeking recovery of the deducted money and an injunction, which is a court order restraining someone from taking a particular action. He also sought interim relief, or temporary protection, until the case was decided.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Kaynes Technology stock in pain as Street falls out of love", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nKaynes Technology India\u2019s shares dropped to a 52-week low of \u20b9 2,744 on Monday after September quarter (Q2FY27) earnings plunged. Consolidated net profit fell 62% year-on-year, thanks to high interest and depreciation expenses due to the commissioning of new projects.\n\nOperating cash flow was negative. Kaynes changed its statutory auditor and restated its FY26 financial statements involving changes in provisioning, borrowings and other items.\n\nEbitda fell 16% y-o-y to \u20b9 126 crore and revenue grew 4% to \u20b9 952 crore, with smart meter sales dropping almost 80%. The segment\u2019s revenue contribution shrank to 6% from 30% a year ago.\n\nThe core electronics manufacturing services (EMS) revenue grew 34% y-o-y. EMS growth was 42% in H1. The management is confident of 30%-plus growth in FY27. The total order book grew 31% to \u20b9 10,000 crore in Q2.\n\nUnderstandably, Nuvama Institutional Equities cut its earnings-per-share for FY27 and FY28 by 37% each to factor the Q2 earnings miss and outlook.\n\nThe management reduced meter supplies to prioritize the recovery of outstanding receivables from state government, which rose to \u20b9 1,402 crore in Q1, 1.5 times FY26 segment sales. Kaynes reduced the outstanding to \u20b9 1,091 crore by Q2 and plans to ramp up supplies only after it falls below \u20b9 750 crore.\n\nIt is in discussions with potential partners to handle installation and operations and maintenance, while retaining manufacturing .", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Sensex Zooms 500 Points, Nifty Above 25,400; Asian Paints Extends Gains, Brainbees Solutions Zooms 12%", "full_content": "Brent crude fell below $92 per barrel on Tuesday, extending losses from the previous session as expectations of higher global supply outweighed persistent geopolitical tensions in the Middle East.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "From DINKs to SINKs: how household type shapes money plan", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHousehold traditionally meant a married couple with children, living on one or two incomes, with money going towards running the home, raising children, paying for their education and saving for retirement. Today, the picture looks different. Some couples are child-free by choice, some are waiting for the right time to start a family, while others have pets instead of children.\n\nThese changing choices have given rise to a vocabulary of household acronyms: DINK (dual income, no kids), SINK (single income, no kids), DEWK (dual earners with kids), HENRY (high earners, not rich yet) and DINKWAD (dual income, no kids, with a dog). Made popular in the west, these household labels are finding their way into Indian conversations, too. Most households won\u2019t fit one acronym for life, but each stage asks something different of your money. Read on for a quick lowdown on how each of these households should think about their household money at each stage.\n\nThe DINK stage often feels like the most comfortable phase of life. Two incomes split the bills, there are no childcare costs, and couples enjoy extra cash, faster savings and full control over their schedule.\n\nAnooj Mehta, Partner at 1Finance, says a DINK couple has two salaries and nobody else draws from them, but the bigger danger is lifestyle inflation.\n\nSuresh Sadagopan, founder of Ladder7 Financial Advisories, said having no kids is a double-edged sword: financial planning becomes easier, but expenses catch up with income, and with a fair amount of protection, people tend to take more risk and spend on indulgences.\n\nChandigarh-based Manpreet Kaur and Jaspreet Singh, married for six years, live on freelance incomes that vary every month. \u201cWith our current lifestyle, saving has been difficult,\u201d Kaur said, citing spending on travel, eating out and organic groceries.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From Skyfall' To Spectre': How Much The 7 Highest-Grossing James Bond Films Earned Worldwide", "full_content": "A look at the seven highest-grossing James Bond films that topped the worldwide box office charts, with a look at their collections, stories and star casts.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Large-Cap Allocation Rising In Portfolios, Says WhiteOak Capital's Aashish Somaiyaa", "full_content": "Somaiyaa expects mutual fund redemptions to increase as investors who remained invested through the recent period of subdued returns begin to recover their capital and book profits.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Promoter pledging climbs as more companies cross the 90% mark", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMore companies joined the ranks of those with almost all their promoter holdings pledged in the September quarter, raising questions about funding pressures and their vulnerability to a market correction.\n\nA Mint analysis of 4,592 BSE-listed companies showed that 12.4% of them had promoter shares pledged at the end of September (Q2). Of the total, 42 companies, or about 1%, had more than 90% of promoter holdings pledged, up from 34 in Q1 and 36 a year earlier, according to ACE Equity data.\n\nThe count rose almost 24% sequentially to its highest level in the five quarters examined. After falling from 36 in September 2025 to 29 in December, it climbed to 30 in March, 34 in June and 42 in September.\n\n\u201cThe increase in companies with over 90% of promoter holdings pledged, from 34 in June to 42 in September, is a concern worth monitoring, though it does not necessarily indicate financial distress,\u201d said Mayur Shah, head PMS\u2013fund manager at Anand Rathi Advisors.\n\nPromoters may borrow against shares to fund expansion, for working capital or for personal needs. Rising pledging alongside declining promoter ownership, weak cash flows and increasing debt could, however, point to financial stress, he said.\n\nThe distinction between promoter borrowing and a company\u2019s finances is important.\n\n\u201cThe first thing to understand is that it is not the company but the promoter who is pledging the shares,\u201d said Aswini Bajaj, CEO of business consultancy firm Leveraged Growth.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia Q3 Preview: After Jensen Huang's Exit As CEO And $2 Trillion Wipeout, Can Strong Earnings Change The Narrative?", "full_content": "Nvidia is scheduled to report its Q3 CY26 results later on Tuesday, with the Street closely tracking its data centre business, AI infrastructure demand, margins and management's outlook for the coming quarters.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kaynes Technology shares extend losses, fall another 4%; should investors worry about its Q2 performance?", "full_content": "A Ksheerasagar Published 17 Nov 2026, 01:09 PM IST Prefer Livemint on Google After plunging 13% in the previous session, the sell-off in Kaynes Technology showed no signs of easing, with the electronics manufacturing services (EMS) major falling another 4% in Tuesday's trade on November 17 to \u20b9 3,845 apiece. This extended its earnings-led decline for a second consecutive session.\n\nThe Street was disappointed with Kaynes Technology's performance in the September quarter, which was impacted by the scale-down of its smart-metering business. The company reported several weak operating metrics.\n\nNot only did its profit after tax decline 62% year-on-year (YoY), but gross debt also increased to \u20b9 1,810 crore, while working capital days rose to 225 from 210.\n\nIts commitment to refrain from raising funds over the next 12 months also raised concerns, as this could either require a curtailment of capex or greater reliance on debt, potentially putting further pressure on its profit and loss (P&L), said domestic brokerage firm JM Financial.\n\nThe weak performance not only weighed on investor sentiment and prompted brokerages to reassess their outlook on the stock. JM Financial cut its target price to \u20b9 3,050 from \u20b9 3,850 and retained its Reduce rating.\n\nJefferies also lowered its target price on Kaynes Technology to \u20b9 3,625 per share, implying an upside of approximately 22% from Monday's closing price of \u20b9 2,980. The brokerage said the company's Q2 FY27 performance had sharply missed estimates, prompting it to lower its earnings forecasts for FY27-FY29.\n\nMotilal Oswal, however, reiterated its Buy rating on the stock with a target price of \u20b9 3,820, based on 30 times its December 2027 estimated earnings per share (EPS).\n\nThe brokerage cut its FY27 and FY28 earnings estimates by 28% and 22%, respectively, factoring in the muted quarterly performance and lower earnings expectations across the core EMS, OSAT, PCB, and smart-metering businesses.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NSE or BSE: Why are experts bullish on NSE shares? Here's what technical charts hint at? | Target price, stop-loss", "full_content": "Dhanya Nagasundaram Published 17 Nov 2026, 12:59 PM IST Prefer Livemint on Google The rally in exchange stocks has brought the spotlight back on two of India's leading market infrastructure companies \u2014 the National Stock Exchange of India (NSE) and Bombay Stock Exchange (BSE). While NSE has strengthened its position as a dominant player in the country's capital markets, BSE has been gaining ground, supported by improving trading activity and market-share gains. With both stocks scaling fresh highs, investors are now weighing which exchange offers the more attractive opportunity.\n\nNSE shares have climbed nearly 20% above their IPO price of \u20b9 1,785, extending their gains after a modest listing. The stock debuted on the BSE at \u20b9 1,800, a premium of 0.84% over the issue price. It touched an intraday high of \u20b9 1,878 during its debut session before settling at \u20b9 1,818.\n\nThe rally has gathered momentum since then. NSE shares recently crossed the \u20b9 2,000 mark, hitting a fresh high today of \u20b9 2,134 on the BSE on Tuesday, up around 3% during the session. At this level, the exchange's market capitalisation stood at approximately \u20b9 5.26 lakh crore, surpassing the \u20b9 5 trillion milestone.\n\nBSE shares have also participated in the rally. The stock gained around 2.6% to touch an intraday high of \u20b9 3,989.70 on the NSE, approaching the psychologically important \u20b9 4,000 mark. Its market capitalisation stood at approximately \u20b9 1.63 lakh crore.\n\nThe broader buying interest in exchange stocks comes amid improving trading volumes, renewed institutional and foreign investor activity, expectations of relief on long-term capital gains taxation, and a more constructive outlook from brokerages. Reduced stress in the margin trading facility (MTF) segment has also added to the supportive market backdrop.\n\nHowever, the investment case for the two exchanges is not identical.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms, BLS Polymers, Shiprocket, more: 23 stocks to watch as anchor lock-in expires this week | List", "full_content": "SFCTECH BONFIG HORIZONIND LALITHAA Pranati Deva Published 17 Nov 2026, 12:55 PM IST Prefer Livemint on Google IPO lock-in ends : As many as 23 recently listed companies are set to witness the expiry of their anchor investor lock-in periods between November 16 and November 30, potentially bringing a fresh supply of shares into the stock market.\n\nTonbo Imaging India, BLS Polymers, Shiprocket, Jio Platforms, Zetwerk Manufacturing Business and Paras Healthcare are among the prominent names facing the expiry, with several stocks already delivering substantial returns over their initial public offering (IPO) issue prices.\n\nAccording to the latest IPO Lock-In Monitor by PL Capital's research division, 11 companies will see their 30-day anchor investor lock-in periods expire, while another 12 companies will witness the expiry of their 90-day lock-in periods.\n\n\"Between 16 November and 30 November 2026, 23 companies are scheduled for an anchor lock-in expiry, with 11 companies under the 30-day lock-in period and 12 companies under the 90-day lock-in period. Across the upcoming 30-day expiries, the proportion of shares becoming eligible for trading ranges from approximately 13% to 22% of the respective companies' total shares, with most companies around 15% of total shares,\" PL Research said.\n\nThe unlocking of shares does not necessarily mean anchor investors will sell their holdings. However, the additional supply could influence near-term stock movements depending on investor decisions and market demand.\n\nAmong the 11 companies approaching their 30-day anchor investor lock-in expiry, Fusion CX, Zetwerk Manufacturing Business and Paras Healthcare have the highest proportion of shares becoming eligible for trading, at approximately 22% each.\n\nHD Fire Protect, Tonbo Imaging India, Sahajanand Medical Technologies , Bonfiglioli Transmissions , EAAA India Alternatives, BLS Polymers and SFC Environmental Technologies will each see approximately 15% of their total shares unlocked.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FIIs, MFs raise stakes in 5 largecap stocks for two straight quarters; shares rally up to 80%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News FIIs, MFs raise stakes in 5 largecap stocks for two straight quarters; shares rally up to 80% Written by Ritesh Presswala , ETMarkets.com | Nov 17, 2026, 12:58:06 PM IST 1 / 6 Smart Money Institutional investors, such as foreign institutional investors (FIIs) and mutual funds (MFs), closely track companies through extensive research and analysis. Their shareholding patterns can offer valuable insights into institutional investment trends, particularly when both investor groups increase their exposure to the same stocks. An ET Markets analysis of shareholding data reveals that FIIs and mutual funds have raised their stakes for two consecutive quarters \u2013 April-June and July-September \u2013 in five large-cap stocks. Interestingly, all five stocks have delivered double-digit returns, with gains ranging from 12% to 80% in FY27 so far. (Data Source: ACE Equity)\n\nThe stock has surged 79% in FY27 so far, climbing from Rs 141 to Rs 251. Institutional interest has risen sharply alongside the rally. FIIs increased their stake from 4.17% in March 2026 to 5.19% in June and further to 9.84% in September. Mutual funds followed a similar trajectory, raising their holding from 4.91% to 8.15% and then 11.68% over the same period.\n\nShares have rallied 50% in FY27 so far, rising from Rs 150 to Rs 225. FIIs steadily increased their exposure, taking their stake from 2.51% in March 2026 to 6.89% in June and 10.90% in September. Mutual fund holdings also climbed from 5.25% to 8.69% and further to 10.72% during the three quarters.\n\nThe stock has gained 47% in FY27 so far, advancing from Rs 501 to Rs 735. Institutional ownership has expanded significantly, with FII holdings jumping from 4.26% in March 2026 to 12.76% in June and 18.26% in September.", "source": "Economic Times Markets", "pub_date_str": "17 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "India May Attract More Foreign Flows As AI Trade Loses Steam, Says KCM Trade's Tim Waterer", "full_content": "Waterer said the direction of the AI trade and crude oil prices would be important in determining how long the current trend in emerging markets lasts.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 12:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia warns chip buyers of legal risks tied to China AI access, sources tell CNBC", "full_content": "Nvidia warned its customers that new legislation on Chinese companies remotely accessing its artificial-intelligence chips could expose it and them to U.S. \"legal action,\" sources told CNBC.\n\nThe chip giant is facing increasing scrutiny from U.S. lawmakers over Chinese companies' access to its advanced chips, which U.S. export controls restrict from going to China.\n\nNvidia messaged chip buyers in recent months to caution that the proposed Remote Access Security Act, or RASA, would give the U.S. government broader authority to control access to cloud services in the same way as physical hardware, potentially exposing both parties to legal risk, according to two people with direct knowledge of the matter. The people asked not to be named while discussing private communications.\n\nIt also said that, for now, it would not sell its chips to customers who rent more than 50% of the graphics processing units, or GPUs, to Chinese companies, the people said.\n\nSeparately, the Financial Times reported earlier this month that Nvidia verbally told data-center clients to direct at least 51% of their services to non-Chinese customers under future contracts.\n\nRegulators have had limited powers to control companies' access to those chips through cloud services hosted overseas.\n\nRASA passed the House of Representatives in January but has not yet passed the Senate. Remote access to the chips has provoked the ire of President Donald Trump 's administration, which has sought to keep the chips out of China to maintain the U.S. lead in the AI race.\n\nCNBC reported on Nov. 5 that Chinese lab Moonshot AI sought access to Nvidia chips through data centers in Europe. The Trump administration previously singled the company out, accusing it in July of accessing the chips through centers in East Asia.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 12:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ABSL, HDFC to ICICI Prudential: Which AMC stock to buy amid stock market rally? Experts' views, target price, stop-loss", "full_content": "AMC Stocks to Buy: Amid a strong rally on Dalal Street, AMC stocks are under the bulls' radar. Flagship AMC stocks, Aditya Birla Sun Life shares, are up by over 2.50%; HDFC AMC shares are trading higher by 3.50%; Nippon Life India AMC shares are up by nearly 4%; while ICICI Prudential's share price is slightly higher than its previous day's close.\n\nAccording to stock market experts, investing in Asset Management Companies (AMCs) during an Indian stock market rally offers a direct way to ride the expansion of the domestic capital markets. They said that AMCs earn a percentage-based management fee on their total AUM. As AUM climbs during a market upswing, revenue and operating profits scale up. They advised investors to consider margin stability and compounding benefits when selecting an AMC stock.\n\nWhether one should buy an AMC stock amid strong rally on Dalal Street, Anuj Gupta, a SEBI-registered market expert, said, \u201cBullish market sentiment encourages retail investors to start or scale up Systematic Investment Plans (SIPs). In India, SIP flows consistently cross tens of thousands of crores monthly, providing a sticky, recurring revenue base. \u2022 Once an AMC builds its infrastructure and distribution network, handling higher asset volumes does not proportionally increase fixed costs, leading to stronger profit margins.\u201d\n\nOn factors to look at while selecting an AMC stock, the SEBI-registered market expert said, \u201cOne should check an AMC stock on factors like earnings momentum and ROE, high-margin compounder, and income, etc.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 12:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "U.S. agencies say they initiated investigation into Nvidia partner Megaspeed in 2024", "full_content": "The U.S. Commerce and Justice Department on Monday stateside said they had initiated an investigation into Singapore-based company Megaspeed in 2024 to \"address inaccurate information circulating in public reporting.\"\n\nMegaspeed International, a cloud computing firm that operates data centers across Southeast Asia, has been drawn into the fallout surrounding the leadership shake-up at chip giant Nvidia .\n\nIn a joint release, the departments outlined a timeline of their investigations into Megaspeed, saying the probes began in 2024 over potential export-control violations.\n\nIn June 2025, Nvidia placed Megaspeed on its \"no sell\" list, after Commerce Department investigators requested records from Nvidia concerning direct or indirect sales to the company.\n\nIn the same month, U.S. officials and Singapore police conducted an in-person inspection of Megaspeed and interviewed Alice Huang, who was allegedly involved in a relationship with Nvidia co-founder Jensen Huang.\n\n\"Following this enforcement action, the Department of Justice took the lead role in the criminal investigation of Megaspeed,\" the statement said.\n\nOn Wednesday, Commerce Secretary Howard Lutnick also reposted the statement , adding, \"The Department of Commerce works to protect the U.S. economy and our critical industries every day. We are very proud of the work of the Bureau of Industry and Security.\"\n\nIn response to the statement, Chris McGuire , senior fellow for China and emerging technologies at the Council of Foreign Relations wrote on X, \"Very, very strange statement tonight... about Megaspeed. The facts here just don't add up, and this does nothing to explain why Commerce did not cut Megaspeed off from chips.\" McGuire said that Megaspeed kept buying chips after Nvidia put them on their no-trade list, and asked if Nvidia also blacklisted Megaspeed's subsidaries Speedmatrix and PT Megaspeed International.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 12:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's CAD may touch 1.2% of GDP in FY27 as oil, gold demand pose risks: UBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's CAD may touch 1.2% of GDP in FY27 as oil, gold demand pose risks: UBI The Economic Times daily newspaper is available online now. Read Today's Paper India's CAD may touch 1.2% of GDP in FY27 as oil, gold demand pose risks: UBI SECTIONS India's CAD may touch 1.2% of GDP in FY27 as oi evenue grew 14.1% to \u20b92,395.8 crore. However, adjusted EBITDA and gross margins weakened. Management expects stronger performance in Q3.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 11:52 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Leaked Records Show Deutsche Bank Courting Russian Oligarchs - The New York Times", "full_content": "Leaked Records Show Deutsche Bank Courting Russian Oligarchs The New York Times Deutsche Bank shares fall 5% as it defends itself from media reports based on leaks Reuters \u2018Katastrophe\u2019: inside the chaos at Deutsche Bank Financial Times 'Inside Deutsche Bank': An investigation by 230 journalists and 50 news orgs into 15 million files Le Monde.fr Deutsche Bank protected Trump from scrutiny, leak shows Follow the Money - Platform for investigative journalism", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 11:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "PNB vs Canara Bank: Which PSU bank is a better stock to buy Nifty Bank at record high, and why? Experts' views, targets", "full_content": "Shares of Punjab National Bank and Canara Bank are moving sharply higher as the Nifty PSU Bank index and Bank Nifty hit record highs during Tuesday's morning deals", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 11:21 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Coal India begins IPO preparations for Northern, Central Coalfields", "full_content": "Each of the issues is likely to be about \u20b94,000-5,000 crore in size, with a 10% dilution by the parent entity", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 11:04 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why Silver rates crashed from record high of \u20b94 lakh per kg price to below \u20b91.75 lakh? Experts explain 3 key reasons", "full_content": "Silver prices have plunged nearly 60% from their January record highs, with a stronger US dollar, expectations of higher interest rates, concerns over industrial demand and aggressive profit-booking driving the correction. Experts identify three key factors behind the precious metal's sharp reversal", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 11:03 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Inflation Crosses 6%: Did RBI Act Too Late? | The Morning Brief Decode", "full_content": "", "source": "Economic Times Economy", "pub_date_str": "17 Nov 2026, 10:56 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TTK Healthcare shares soar 20%: Board to consider bonus issue of preference shares on Nov 20 - Key things to know", "full_content": "TTK Healthcare shares rose 20% on November 17 after the company said its board would consider issuing non-convertible redeemable preference shares to existing equity shareholders as a bonus. The board is scheduled to discuss the proposed scheme on November 20, 2026.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 10:52 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decision     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
