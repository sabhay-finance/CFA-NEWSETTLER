<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "The Sinking of a Malibu Megaproject - WSJ", "full_content": "The Sinking of a Malibu Megaproject WSJ", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 07:42 PM IST", "pub_date_relative": "12m ago"}, {"title": "For JPMorgan, Amazon, fighting AI bots like Meta Muse may not be a winning long-term strategy", "full_content": "The biggest names in banking and retail are starting to fight the tech titans, and one another, over a new kind of customer: the AI personal agent.\n\nJPMorgan Chase , Charles Schwab, Amazon , Neiman Marcus and Kohl's have moved to block personal agents like Meta Muse just as consumers start sending them out to find better savings rates , shop for deals and cancel subscriptions.\n\nThe era of agentic AI has arrived, but there is uncertainty about what the landscape will look like when virtual storefronts become flooded with AI agents or when a business tries to block them.\n\nReports last week of AI agents going rogue in customer accounts \u2014 and prominent politicians including Sen. Mark Warner and Sen. Bernie Sanders calling for bot legislation in response to the headlines \u2014 come on the heels of JPMorgan Chase CEO Jamie Dimon saying the bank currently blocks external AI agents from operating on behalf of retail customers, citing security risks.\n\nSome other retailers are leaning in. Walmart announced last week it is opening the virtual doors to AI agents that customers prefer to use. \"We price products, not people, so the prices that an AI agent sees are the same prices that a human would see on Walmart.com, with applicable offers and fees shown before purchase,\" the company said in a blog post announcing the decision.\n\nA recent audit of 51 large U.S. retailers' published access rules by Billions Network, an identity-verification company, found only 11 have taken a deliberate position on AI agents. Five, including Amazon, Kohl's and Neiman Marcus, explicitly restrict them, while 37 block shopping agents largely by accident, through older bot rules written for scrapers. None has a way for a verified agent to complete a purchase.\n\nBased on Billions Network's analysis, blocking an agent can occur in multiple ways: blocking a specific bot from a third-party by its rules (e.g.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 07:39 PM IST", "pub_date_relative": "15m ago"}, {"title": "Bangladesh sets up wage board as garment workers\u2019 unrest shuts factories", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:36 PM IST", "pub_date_relative": "18m ago"}, {"title": "NordFX Launches Oil Loss Insurance for New Brent and WTI Traders", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:32 PM IST", "pub_date_relative": "22m ago"}, {"title": "Midterm US elections, earnings, jobs data loom for AI-wary stock market", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "This is the biggest threat to the AI-powered bull market", "full_content": "Blockbuster earnings growth has helped to power the stock market higher in 2026. In 2027, that engine might stall.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago"}, {"title": "OPEC+ keeps December oil output targets steady ahead of tougher call for 2027", "full_content": "OPEC+ oil-producing countries kept December \u200bproduction targets steady on Sunday, confirming \u200bexpectations that no further policy adjustments will occur until next year, as the group continues to struggle with export disruptions from the Iran war.\n\nSeven core OPEC+ members \u2014 Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman \u2014 made the decision in an online \u2060meeting \u200con Sunday, OPEC said in a statement. While Gulf members have been boosting exports disrupted for months by the conflict, most are still pumping well below their targets.\n\nOPEC+ comprises the Organization of the Petroleum Exporting Countries and allies including Russia. Only the seven members \u2014 plus the United Arab Emirates until \u200cit quit OPEC in May \u2014 have been involved in monthly output decisions in recent years. All members of the 21-country group are due to meet on November 29, when analysts \u200bexpect it will decide 2027 quotas.\n\n\"Today's decision was the easy one,\" said Jorge Leon, an analyst at Rystad. \"The much more important test comes at the November 29 ministerial meeting, when OPEC+ will decide its 2027 production framework.\"\n\nOil prices jumped more than 2% on Friday, with \u2060Brent crude settling at almost $118 a barrel, the highest since April, as traders braced for a potential escalation in the Iran war \u200cafter the US midterm elections.\n\nThe International Energy Agency and other \u200cforecasters have warned of excess supply in 2027 should Gulf flows return to normal.\n\n\"OPEC+ faces an extremely difficult call for 2027,\" Leon added. \"The group has to plan around huge uncertainty over the US-Iran war, the pace of recovery through the \u2060Strait of Hormuz, and the size of the surplus that could emerge once disrupted barrels return.\"\n\nThe seven members have been boosting output targets for much of 2026 and, in September, completed the phased rollback of a 1.65 million-barrel-per-day supply cut first agreed in 2023. At earlier meetings, they kept the targets steady for \u200bOctober and November.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 07:24 PM IST", "pub_date_relative": "29m ago"}, {"title": "Cash rewards coming? PFC, CONCOR, RITES, to Sonata- These firms to announce dividend with Q2 results 2026 this week", "full_content": "CONCOR GOPAL KKCL Sharmila Bhadoria Published 1 Nov 2026, 07:03 PM IST Prefer Livemint on Google Dividend announcement this week: As we enter the final leg of earnings season for the second quarter of financial year 2026-27, multiple firms are scheduled to announce their Q2 results 2026 in the coming week.\n\nPower Finance Corporation , Container Corporation of India Limited (CONCOR), RITES, Sonata Software are among the key firms that may announce dividends alongside their corporate earnings this week.\n\nAt least twenty firms are scheduled to hold their board of directors meeting this week to announce corporate earnings. Alongside Q2FY27 results, these firms may also consider and approve dividends.\n\nCONCOR, Amara Raja Energy and Mobility, MOIL, Gopal Snacks , and Kewal Kiran Clothing are scheduled to announce their Q2 results on Monday, November 2. Additionally, their board may also consider and announce payout.\n\nTAAL Tech, BMW Ventures, and Mobavenue AI Tech are among key firms that may announce dividend, alongside Q2FY27, on Tuesday, November 3. PFC, Aurobindo Pharma, Dabur India, Premier Energies, Dr Lal Pathlabs, Shipping Corporation of India, NLC India and RITES may announce dividend, alongside Q2, on November 4.\n\nNBCC India, Emami, and Sonata Software are among the key firms that are scheduled to announce Q2 results on November 5 and investors can also expect dividend reward too.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 07:03 PM IST", "pub_date_relative": "51m ago"}, {"title": "Mandaviya rolls out EPFO services through WhatsApp: Check PF balance, passbook and latest transactions on your phone", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has launched WhatsApp-based services to help subscribers access their provident fund account information and resolve compliance-related issues without visiting EPFO offices.\n\nUnion Labour and Employment Minister Mansukh Mandaviya launched the facility on 1 November 2026, during EPFO's 74th Foundation Day celebrations in New Delhi. The initiative is aimed at making routine provident fund services more accessible through a platform widely used by mobile phone users.\n\nAccording to the Ministry of Labour and Employment, subscribers will be able to check their PF balance, access information from their passbooks and view their latest five transactions through EPFO's verified WhatsApp service . The facility will also provide personalised guidance and assistance to members in completing requirements under the Pradhan Mantri Viksit Bharat Rozgar Yojana (PMVBRY).\n\nThe new facility is designed to provide access to commonly used EPFO services without requiring members to log in to multiple platforms or visit a regional EPFO office.\n\nThe PMVBRY-related assistance is particularly relevant for members whose benefits or compliance requirements are pending because of incomplete Aadhaar authentication or other documentation-related issues.\n\nEPFO has described the facility as a verified WhatsApp service. However, the 1 November launch announcement does not specify the official WhatsApp number or provide a step-by-step activation process.\n\nMembers should therefore use only the WhatsApp contact details published on EPFO's official website or verified communication channels. They should avoid sharing their UAN password, OTP, Aadhaar details or bank credentials with unverified numbers.\n\nIn May 2026, Mandaviya had indicated that members would be able to initiate conversations by sending a 'Hello' message to EPFO's verified WhatsApp number.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 07:02 PM IST", "pub_date_relative": "52m ago"}, {"title": "Iranian negotiators in Qatar to continue talks to end the U.S.-Iran war: Reuters", "full_content": "Iranian negotiators were in Doha on Sunday for a third consecutive day of talks with Qatari mediators aimed at pushing for a deal to end the U.S.-Israeli war on Iran, an official briefed on the discussions told Reuters.\n\nThe talks come amid concerns that the conflict could escalate again after the Nov. 3 U.S. midterm elections . President Donald Trump has said the United States will not launch new attacks on Iran before the vote and that talks with Tehran have been productive, though he has not ruled out further military action thereafter.\n\nIran has repeatedly said it would respond to any new attacks by striking U.S. and Israeli targets in neighboring countries, as the eight-month-old war continues to disrupt global oil supplies and spill over across the Middle East.\n\nIran's Supreme Leader Ayatollah Mojtaba Khamenei issued a statement on Saturday ordering the armed forces to be prepared to respond to any attacks. The Iranian military later announced it was taking steps to improve its readiness.\n\nU.S. Secretary of State Marco Rubio said on Saturday that Trump has not decided whether to launch new strikes against Iran, but would prefer to resolve the conflict diplomatically.\n\nQatari mediators were in Tehran on Friday for discussions with Iranian officials before moving the talks to Doha on Saturday, an official had told Reuters. The talks were being coordinated in regular contacts with Washington, the official added.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago"}, {"title": "Liverpool Vs Arsenal Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online In India?", "full_content": "Liverpool will host defending champions Arsenal in a crucial Premier League encounter at Anfield on Sunday. Here's everything you need to know about the match, including live streaming and telecast details in India.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 07:00 PM IST", "pub_date_relative": "54m ago"}, {"title": "Sebi to delist penny stocks: Market regulator plans AI-based s nflict solutions amid G20 summit ET Online Last Updated: Nov 01, 2026, 07:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has engaged in discussions with Russia, Europe, and Ukraine regarding the ongoing conflict and its impact. These talks focused on preventing attacks on civilian shipping and restoring grain exports affected by Black Sea disruptions. External Affairs Minister S. Jaishankar emphasised the complexity of discussions around ceasing attacks on energy installations. Various interpretations of what constitutes energy installations have complicated these discussions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 06:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi Arabia stocks lower at close of trade; Tadawul All Share down 0.84%", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 06:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "OPEC+ holds December oil output target", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 06:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Companies promised AI gains \u2014 here's how the payoff showed up in earnings", "full_content": "Some companies are beginning to report financial benefits from artificial intelligence investments, as interest in the technology shifts from hype to measurable returns in the latest quarter.\n\nCorporate AI investment has surged as companies look to boost efficiency and become more profitable, reaching $581.7 billion in 2025, up 130% from the previous year, according to the Stanford HAI 2026 AI Index report .\n\nAs CEOs tout the tech's benefits and hyperscalers like Microsoft , Amazon , Google and Meta are expected to spend $700 billion combined this year on its infrastructure, investors are looking for measurable gains.\n\nNow, with third-quarter earnings season underway, some companies are beginning to put numbers around those benefits.\n\nSpanish banking giant Santander said Wednesday that it saw AI initiatives generate 194 million euros ($216 million) in business value in the first nine months of 2026 .\n\nSantander Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera told CNBC that AI is helping the bank reduce low-value tasks so employees can focus on higher-value work.\n\n\"This affects both revenue and costs, so we are actually in the quarter where we can actually link directly to AI a positive contribution,\" Cantera said.\n\n\"AI is being embedded in all the processes that we are conducting at the bank, so it's really difficult to just say how much comes from AI, but clearly AI is improving the quality of our services to clients.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 06:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Top Wall Street analysts are bullish on these 3 stocks for the long haul", "full_content": "The ongoing earnings season, Middle East tensions and buzz ahead of the U.S. midterm elections have been keeping investors busy. Further, worries about elevated artificial intelligence spending are weighing on investor sentiment.\n\nInvestors looking beyond the short-term noise and focusing on long-term returns can track top Wall Street analysts to pick the right stocks, backed by strong research.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nThis week's first stock pick is Datadog , an AI-powered observability and security platform. The company will announce its results for the third quarter on Nov. 4. Datadog is seeing strong demand for its offerings, thanks to cloud migration and rapid AI adoption. TipRanks' KPIs tool for DDOG shows the growth in its customer base over the past few years amid increasing market penetration and growing adoption of its products.\n\nTipRanks Heading into Q3 FY26 earnings, Bank of America analyst Koji Ikeda reiterated a buy rating on Datadog stock and raised his price target to $335 from $305. The analyst noted that industry checks and data indicate that infrastructure software demand is strengthening, with AI increasingly driving usage and growth.\n\nIkeda called Datadog and Atlassian his top picks, saying that companies that can show that AI is a tailwind to growth could see their valuation rerate, even at premium multiples. He added that the total addressable market for observability is growing faster than anticipated, driven by accelerated growth of enterprise AI and the rapid ramp of consumer AI agents.\n\nThe five-star analyst believes that focus will be on revenue growth, which he estimates to be 28.7% for Q3 FY26 versus the Street's consensus of 29.1%. Ikeda thinks that the market is underestimating the growth prospects of DDOG 's security products.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crocs stock jumped 25% after earnings. Here's why that might be just the beginning", "full_content": "Since CNBC flagged Crocs' depressed valuation on Oct. 13, the stock has surged 30%, fueled by a massive 25.5% post-earnings rally on Thursday.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Maruti Suzuki Hits Record Monthly Sales As Brezza Leads SUV Charge: Three Indicators To Watch", "full_content": "Maruti Suzuki achieved the milestone despite a high base following the previous GST rate cut. SUV sales touched an all-time monthly high of 73,058 units, while small car sales grew 38% year-on-year to 40,646 units.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 06:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "The midterm election could reshape the muni bond market. Here\u2019s what investors need to know", "full_content": "The outcome of Tuesday's election is expected to have broad implications across the market, including municipal bonds.\n\nThe spotlight has been on the battle for congressional control and whether Democrats will wrest the House of Representatives, the Senate or both from Republicans. But for the muni market, what happens at the state level could have bigger repercussions \u2014 at least in the near term.\n\nThere is an array of initiatives on ballots around the nation that could change tax laws and add to bond supply. Taxes matter to muni investors since the income received is free of federal tax, as well as state tax if the holder lives in the state where the bond is issued.\n\nDepending on the location, ballot measures are up for approval that would either provide tax breaks, or raise taxes on the wealthy.\n\n\"It's a complete bifurcation between red and blue states,\" said Dan Close, head of municipals at Nuveen. \"Blue states are trying to put in place graduated income tax structures, trying to capture more revenue from high-income earners. Red states are promoting affordability by trying to cut property taxes.\"\n\nRed states are those that predominantly vote Republican, while blue states swing toward Democrats.\n\nFor instance, California has a proposition known as the \" billionaire tax ,\" which would impose a one-time levy equal to 5% of the wealth of certain taxpayers with at least $1 billion in assets. The state also has a measure on the ballot that would make a temporary tax hike permanent on individuals earning over $371,000, adjusted annually for inflation. The tax is currently set to expire in 2031.\n\n\"The impact to the muni bond market will be to make the exemption more valuable,\" Close said of the possible passage of tax increases. Investors will likely seek shelter in the muni market, which would send bond prices higher, he noted.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Unicaja Q3 2026 slides show 8% profit gain, 95% payout ratio", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 05:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "ONGC Recruitment 2026: Applications Open For 3,047 Apprentice Vacancies, Apply By November 20", "full_content": "The recruitment drive, announced under advertisement number ONGC/APPR/1/2026, covers technical, vocational and graduate-level disciplines across 24 work centres.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "China\u2019s Communist Party demands loyalty, vows to tighten discipline", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 05:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "PM Modi Approves North Corridor Of Bullet Train Project: Delhi-Guwahati Trip In Eight Hours", "full_content": "Proposed extension will connect Guwahati with Delhi through major cities across Uttar Pradesh, Bihar and West Bengal, cutting travel time to around eight hours.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Binance resumes withdrawals following $6.3 billion hack, says 90% of stolen user assets are covered", "full_content": "Binance said Sunday that it has resumed withdrawals of bitcoin and other cryptocurrencies following the record theft of around $6.3 billion in token assets from its hot wallets.\n\n\"First batch network now opened in phase one of withdrawals is $BTC bitcoin network,\" Binance said in an X post .\n\nIt later said withdrawals have also been restored for the Ethereum Network and BNB Smart Chain.\n\nThe exchange said Saturday that it has covered up to 90% of the assets in the heist announced Thursday.\n\nSeparately, the FBI said late Saturday that \u200bit has determined North \u200bKorea \u200bwas responsible for the \u2060theft.\n\nBinance also said it will continue to buy the remaining relevant token assets through market and over-the-counter channels until the covered amount reaches 100% for all tokens.\n\n\"All BTC, ETH, USDT, BNB, SOL, USDC, XRP, USD1, RLUSD, and ZEC are fully backed 100%,\" Binance said in a statement . \"Binance will absorb the financial impact of these stolen funds, not our users.\"\n\nThe exchange said the outstanding 10% consists of tokens outside its top 10 that are \"less liquid, which means they may take longer to source in the required amounts.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 05:49 PM IST", "pub_date_relative": "2h ago"}, {"title": "Binance restarts customer withdrawals after $6.3bn heist", "full_content": "Crypto exchange to reimburse users whose assets were stolen in hack blamed on North Korea-linked group", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 05:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Racing de Santander Vs Real Madrid Live Streaming: When, Where To Watch LaLiga Match On TV, Online?", "full_content": "Kylian Mbappe and Co. will aim to continue their winning run as Real Madrid take on Racing Santander at El Sardinero.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "Real Chocolate May Become a Luxury Food - Newser", "full_content": "Real Chocolate May Become a Luxury Food Newser How Do You Save the World\u2019s Chocolate Supply? You Reinvent Chocolate WSJ Your Halloween Candy Costs More. Is It Secretly Grown in a Lab? Yahoo A sweet deal or impossible bar? How the sustainable cocoa alternatives stack up Wicked Leeks Is the future of chocolate being cultivated in this Seaport lab? The Boston Globe", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 05:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "Xcel Energy Q3 2026 slides: $70B plan targets 11% rate base growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 05:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Sun Pharma shares gain despite Q2 profit slips 36% YoY | Should you buy, sell or hold? What brokerage says, target price", "full_content": "Dhanya Nagasundaram Published 1 Nov 2026, 05:41 PM IST Prefer Livemint on Google Sun Pharmaceutical Industries shares ended 0.87% higher at \u20b9 1,778.25 apiece on the BSE on Friday, shrugging off a 36.36% year-on-year decline in consolidated net profit for the September quarter. The stock has gained 2.02% over the past week and 1.04% over the past two weeks.\n\nThe drugmaker reported a consolidated net profit of \u20b9 1,988.53 crore for the July-September quarter, compared with \u20b9 3,124.95 crore in the corresponding period last year. The decline was largely due to exceptional expenses linked to its proposed acquisition of Organon and litigation in the US.\n\nRevenue, however, continued to grow. Consolidated revenue from operations rose 11.9% year-on-year to \u20b9 16,198.71 crore from \u20b9 14,478.31 crore a year earlier.\n\nIndia remained a key growth driver, with formulation sales in the domestic market climbing 17.3% to \u20b9 5,552.3 crore. The segment contributed 34.5% to Sun Pharma's consolidated sales during the quarter.\n\nGlobal innovative medicines also supported revenue growth. Sales in this business rose 6.9% to around $356 million, accounting for 21.1% of the company's total sales. Emerging markets contributed another 20.7% to consolidated revenue.\n\nDuring the post-results earnings call, the company said growth in innovative medicines was supported by demand across the US and international markets, with products including Ilumya, Ciqua and Odumzo contributing to performance.\n\nHowever, higher costs weighed on the bottom line. Total expenses increased to \u20b9 12,287.83 crore during the quarter from \u20b9 10,780.62 crore in the year-ago period.\n\nSun Pharma reported exceptional charges of around \u20b9 1,269 crore, largely comprising approximately \u20b9 923 crore towards the settlement of a US generic-pricing antitrust litigation case and \u20b9 346 crore in expenses related to the proposed Organon acquisition.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tax twist for OMC stocks: Indian Oil, BPCL, HPCL shares in 2 Nov focus after this decision by Govt on petrol, diesel", "full_content": "IOC Sharmila Bhadoria Published 1 Nov 2026, 05:41 PM IST Prefer Livemint on Google Tax twist for OMC stocks: Shares of Indian Oil Corporation Limited (IOCL), Bharat Petroleum Corporation Limited (BPCL) and Hindustan Petroleum Corporation Limited (HPCL) will remain in focus on Monday following the central government\u2019s latest decision on fuel taxation.\n\nThe central government, on Saturday, October 31, raised windfall gains tax on export of diesel and aviation turbine fuel (ATF) and slashed the levy to zero on petrol for the fortnight beginning October 31.\n\nIOCL share price closed 0.12% lower at \u20b9 130 per share on BSE with a market capitalisation of \u20b9 1,83,576.10 crore on Friday, October 30. Higher diesel export duty can put pressure on export realisations from refining operations, whereas a cut on petrol export duty would bring some relief.\n\nBPCL stock closed 1.47% lower at \u20b9 284.30 per share on BSE with an Mcap of \u20b9 1,23,342.68 crore on Friday. HPCL share price ended 0.72% lower at \u20b9 339.50 per share on BSE with an MCap of \u20b9 72,239.57 crore.\n\nThe government marginally hiked duty on ATF exports to \u20b9 11/litre from \u20b9 10.5/litre for the fortnight. The special additional excise duty (SAED) rate also increased on diesel exports. The SAED, along with road and infrastructure cess on export of diesel surged from \u20b9 8.5 per litre to \u20b9 11.5 per litre.\n\nThe duty on petrol exports was also slashed to nil by the government on Saturday. Petrol exports duty stood at \u20b9 2.5 per litre earlier. The recent changes on petrol duty came months after the government imposed export duty on diesel and ATF in March.\n\nThe windfall tax was levied on fuels to increase their domestic availability amid the war in West Asia.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jailer 2 Box Office Collection Day 18: Rajinikanth Starrer Edges Closer To Next Big Milestone On Third Sunday", "full_content": "Jailer 2 has earned Rs 8.86 crore gross so far on Day 18 so far.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "The Week Ahead: Q2 Earnings, PMI Data, US Jobs Report, IPO Listings In Focus", "full_content": "The September-quarter earnings season will remain in focus, with several major Indian companies scheduled to announce their results during the week.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "A Hot Dog Shop Owner Helped Us Taste 15 Brands \u2014 These Are the 3 We\u2019d Buy Again - Food & Wine", "full_content": "A Hot Dog Shop Owner Helped Us Taste 15 Brands \u2014 These Are the 3 We\u2019d Buy Again Food & Wine", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 05:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Why AI is boosting Meta's ad business while hurting Google search", "full_content": "Google and Facebook have been dominant internet brands for the past two decades, turning billions of eyeballs into trillions in advertising dollars over that stretch. But with the ChatGPT era altering how consumers engage online, the companies are diverging.\n\nIn the third quarter , Meta's ad business grew more than twice as quickly as Google's Search and other unit, backing up Mark Zuckerberg's claim that his company's investments in artificial intelligence are leading to better targeting tools for brands to promote goods and services across Facebook and Instagram.\n\nGoogle's problem is that chatbots are becoming an alternative to search, leading consumers to do a lot less clicking on blue links, and thus hurting Google's ad revenue. Anthropic's Claude chatbot and Meta's recently launched Muse assistant are adding to the mix of options. Meanwhile, users are spending more time scrolling on Instagram, giving Meta more advertising opportunities.\n\n\"It's a double-edged sword, because as AI revolutionizes discovery, people might come across tools they like better than Google,\" Nate Elliott, an analyst covering AI at Emarketer, told CNBC in an email. \"If ChatGPT or Claude or Muse is better at helping them find what they're looking for, people's search habits might change for the first time in a generation. That's potentially catastrophic for Google's ad business.\"\n\nMeta's ad revenue increased 26% in the quarter from a year earlier to $63.1 billion, compared to 12% growth for Google's search division, which brought in $63.4 billion. That 14-point growth gap is the widest in Meta's favor since 2021, and it puts the two businesses neck and neck by size, though Google got an additional $11 billion in third-quarter revenue from YouTube.\n\nFollowing its disappointing third-quarter earnings report on Wednesday, Alphabet had its worst day ever on the stock market, plunging more than 12% and wiping out about $500 billion in market cap.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "US critical minerals push delivers a gold rush \u2014 for Washington lobbyists", "full_content": "Billions in government backing have produced a flurry of deals but little increase in domestic production", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "CEO SUNDAY: Avelo Airlines CEO reveals the habit he credits for his success - Fox Business", "full_content": "CEO SUNDAY: Avelo Airlines CEO reveals the habit he credits for his success Fox Business", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "The 10 Best New Products at Aldi in November - Allrecipes", "full_content": "The 10 Best New Products at Aldi in November Allrecipes 15 ALDI Finds We\u2019re Adding To Our Carts This November Southern Living What's New At Aldi In November 2026: 17 Finds To Grab This Month Chowhound What\u2019s New At Aldi This Week Sporked Aldi November Finds includes flurry of seasonal treats Snack Food & Wholesale Bakery", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Premada Oorali Box Office Collection Day 37: Kannada Sleeper Hit's Earnings Jump Over 60%", "full_content": "The film earned Rs 1.35 crore net on Day 37 from 747 shows.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:18 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 01, 2026, 05:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sensex and Nifty ended the week up about 0.5%, supported by resilient large-cap, IT and healthcare stocks. However, midcap and smallcap indices fell as much as 2% amid rising crude oil prices, inflation concerns and a global technology sell-off.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 05:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "E100-compatible cars in India: Will motor insurance premiums rise, and what happens to coverage and claim settlements?", "full_content": "The Ministry of Road Transport and Highways (MoRTH) has amended the Central Motor Vehicles Rules, 1989, to formally recognise E100 alongside E85 for vehicles designed and certified to run on these higher ethanol blends. The amended rules provide a regulatory framework for manufacturers to bring E100-compatible vehicles to the market. However, the approval does not extend to conventional petrol cars or vehicles certified only for E20 fuel.\n\nFor buyers, the insurance implications are particularly relevant because fuel compatibility, engine protection and policy exclusions can affect whether a claim is accepted.\n\nThe good news is that E100 compatibility alone is not expected to result in higher motor insurance premiums. However, insurers will continue to assess these vehicles based on their design, repair costs and claims experience, industry experts said.\n\n\"These are factory-built, regulator-recognised vehicles rather than aftermarket conversions. We therefore see no inherent reason for E100-compatible vehicles to carry any premium loading,\" said Amit Agarwal, executive vice-president, retail underwriting (motor and health) and financial assurance, IndusInd General Insurance.\n\nThe introduction of E100-compatible vehicles does not automatically mean higher motor insurance premiums. Insurers consider several factors while pricing a policy, including the vehicle's make, model, variant, value , repair and replacement costs, safety features and claims experience.\n\nMotor insurance has two components: third-party liability and own-damage cover.\n\nThird-party premiums are determined by rates notified by MoRTH in consultation with the Insurance Regulatory and Development Authority of India (IRDAI). For private cars, these rates are linked to engine capacity.\n\nOwn-damage premiums, on the other hand, depend on the insured declared value (IDV), geographical location, cubic capacity, vehicle age and the insurer's claims experience.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 05:15 PM IST", "pub_date_relative": "2h ago"}, {"title": "Afghanistan Vs Zimbabwe Live Streaming: When And Where To Watch AFG Vs ZIM 3rd T20I", "full_content": "Here are the date, time, venue and live-streaming details for the Afghanistan vs Zimbabwe 3rd T20I.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "From Wall Street to D-Street: What history suggests for S&P 500 returns, impact on India stock market, Sensex, Nifty", "full_content": "The outcome of the November 2026 US midterm elections could have significant geopolitical and market implications for India, although the impact on domestic equities may be felt more through movements in crude oil prices, the dollar and US bond yields than through a direct shift in US policy towards New Delhi.\n\nEmkay Global Financial Services expects familiar trade and immigration-related frictions between India and the US to persist even if Democrats gain control of Congress. While a Democratic majority could increase scrutiny of President Donald Trump's tariff and immigration policies, it is unlikely to substantially limit his executive powers. For Indian markets, the bigger concern is the possibility of a renewed escalation in the Iran conflict after the elections, which could push crude oil prices higher, worsen India's balance of payments (BoP) position and put pressure on the rupee and equities.\n\nThe brokerage believes that a decline in the dollar, US Treasury yields and crude oil prices would be supportive of Indian equities. However, it cautions that the geopolitical backdrop could turn less favourable, with a possible escalation in the Iran conflict threatening to trigger another spike in oil prices.\n\nAgainst this backdrop, the US midterm elections will be closely watched by global investors. Historical data suggests that US equities have tended to perform well in the months following midterm elections, particularly when the result produces political gridlock. However, Emkay believes the current market environment is less favourable than in previous cycles, raising questions about whether the S&P 500 can repeat its historical post-election gains.\n\nAccording to Emkay Global Financial Services, the implications of a potential Democratic victory are likely to be more geopolitical than directly market-related for India.\n\nA Democratic-controlled Congress could intensify scrutiny of Trump's tariff decisions and immigration policies.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 04:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Binance To Begin Customer Withdrawals In Phases After $6.3B Heist: What Phase 1 Includes", "full_content": "Binance's preliminary investigation suggested that the attackers gained access to systems associated with withdrawals and used them to facilitate unauthorised transfers from cryptocurrency wallets.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 04:51 PM IST", "pub_date_relative": "3h ago"}, {"title": "GST refund new rules from November 1: here's what changes for businesses", "full_content": "The 57th GST council, at its October 8 meeting, approved several process reforms aimed at easing compliance for businesses. These changes include simplified registrations for small e-commerce sellers, faster refunds and easier norms for post supply discounts among others.\n\nThe council decisions implemented through administrative processes will be brought into effect in phases, starting from November 1, 2026.\n\nOne of the key changes is the move towards faster GST refund processing, which has traditionally been a time-consuming process. Under the existing framework, refund claims under Section 54 of the CGST Act are required to be processed within 60 days of receiving a complete application.\n\nHowever, businesses often face additional delays due to manual verification, repeated scrutiny and back-and-forth communication with tax officers. Even the initial acknowledgement of refund applications, which is required within 15 days from the claim submission, can take longer in practice.\n\nUnder the new system, full refund claim of excess balance in the electronic cash ledger will be sanctioned automatically by the system, without requiring any intervention from tax officers.\n\nFor refund claims on account of zero-rated supplies and inverted duty structure, 90% of the amount claimed will be sanctioned on provisional basis automatically by the system on the basis of identification and evaluation of risk.\n\nThis essentially means that eligible businesses will no longer have to wait for manual officer verification to receive the refund, potentially reducing processing delays and improving cash flow.\n\nEarlier, the facility of provisional refunds of up to 90% was available for specified refund categories, including those arising from zero-rated supplies. The latest reform extends this benefit to eligible refund claims arising from an inverted duty structure as well, according to a blog post by Taxguru .", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 04:44 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "For JPMorgan, Amazon, fighting AI bots like Meta Muse may not be a winning long-term strategy", "full_content": "The biggest names in banking and retail are starting to fight the tech titans, and one another, over a new kind of customer: the AI personal agent.\n\nJPMorgan Chase , Charles Schwab, Amazon , Neiman Marcus and Kohl's have moved to block personal agents like Meta Muse just as consumers start sending them out to find better savings rates , shop for deals and cancel subscriptions.\n\nThe era of agentic AI has arrived, but there is uncertainty about what the landscape will look like when virtual storefronts become flooded with AI agents or when a business tries to block them.\n\nReports last week of AI agents going rogue in customer accounts \u2014 and prominent politicians including Sen. Mark Warner and Sen. Bernie Sanders calling for bot legislation in response to the headlines \u2014 come on the heels of JPMorgan Chase CEO Jamie Dimon saying the bank currently blocks external AI agents from operating on behalf of retail customers, citing security risks.\n\nSome other retailers are leaning in. Walmart announced last week it is opening the virtual doors to AI agents that customers prefer to use. \"We price products, not people, so the prices that an AI agent sees are the same prices that a human would see on Walmart.com, with applicable offers and fees shown before purchase,\" the company said in a blog post announcing the decision.\n\nA recent audit of 51 large U.S. retailers' published access rules by Billions Network, an identity-verification company, found only 11 have taken a deliberate position on AI agents. Five, including Amazon, Kohl's and Neiman Marcus, explicitly restrict them, while 37 block shopping agents largely by accident, through older bot rules written for scrapers. None has a way for a verified agent to complete a purchase.\n\nBased on Billions Network's analysis, blocking an agent can occur in multiple ways: blocking a specific bot from a third-party by its rules (e.g.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 07:39 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NordFX Launches Oil Loss Insurance for New Brent and WTI Traders", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:32 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Midterm US elections, earnings, jobs data loom for AI-wary stock market", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This is the biggest threat to the AI-powered bull market", "full_content": "Blockbuster earnings growth has helped to power the stock market higher in 2026. In 2027, that engine might stall.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OPEC+ keeps December oil output targets steady ahead of tougher call for 2027", "full_content": "OPEC+ oil-producing countries kept December \u200bproduction targets steady on Sunday, confirming \u200bexpectations that no further policy adjustments will occur until next year, as the group continues to struggle with export disruptions from the Iran war.\n\nSeven core OPEC+ members \u2014 Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman \u2014 made the decision in an online \u2060meeting \u200con Sunday, OPEC said in a statement. While Gulf members have been boosting exports disrupted for months by the conflict, most are still pumping well below their targets.\n\nOPEC+ comprises the Organization of the Petroleum Exporting Countries and allies including Russia. Only the seven members \u2014 plus the United Arab Emirates until \u200cit quit OPEC in May \u2014 have been involved in monthly output decisions in recent years. All members of the 21-country group are due to meet on November 29, when analysts \u200bexpect it will decide 2027 quotas.\n\n\"Today's decision was the easy one,\" said Jorge Leon, an analyst at Rystad. \"The much more important test comes at the November 29 ministerial meeting, when OPEC+ will decide its 2027 production framework.\"\n\nOil prices jumped more than 2% on Friday, with \u2060Brent crude settling at almost $118 a barrel, the highest since April, as traders braced for a potential escalation in the Iran war \u200cafter the US midterm elections.\n\nThe International Energy Agency and other \u200cforecasters have warned of excess supply in 2027 should Gulf flows return to normal.\n\n\"OPEC+ faces an extremely difficult call for 2027,\" Leon added. \"The group has to plan around huge uncertainty over the US-Iran war, the pace of recovery through the \u2060Strait of Hormuz, and the size of the surplus that could emerge once disrupted barrels return.\"\n\nThe seven members have been boosting output targets for much of 2026 and, in September, completed the phased rollback of a 1.65 million-barrel-per-day supply cut first agreed in 2023. At earlier meetings, they kept the targets steady for \u200bOctober and November.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 07:24 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cash rewards coming? PFC, CONCOR, RITES, to Sonata- These firms to announce dividend with Q2 results 2026 this week", "full_content": "CONCOR GOPAL KKCL Sharmila Bhadoria Published 1 Nov 2026, 07:03 PM IST Prefer Livemint on Google Dividend announcement this week: As we enter the final leg of earnings season for the second quarter of financial year 2026-27, multiple firms are scheduled to announce their Q2 results 2026 in the coming week.\n\nPower Finance Corporation , Container Corporation of India Limited (CONCOR), RITES, Sonata Software are among the key firms that may announce dividends alongside their corporate earnings this week.\n\nAt least twenty firms are scheduled to hold their board of directors meeting this week to announce corporate earnings. Alongside Q2FY27 results, these firms may also consider and approve dividends.\n\nCONCOR, Amara Raja Energy and Mobility, MOIL, Gopal Snacks , and Kewal Kiran Clothing are scheduled to announce their Q2 results on Monday, November 2. Additionally, their board may also consider and announce payout.\n\nTAAL Tech, BMW Ventures, and Mobavenue AI Tech are among key firms that may announce dividend, alongside Q2FY27, on Tuesday, November 3. PFC, Aurobindo Pharma, Dabur India, Premier Energies, Dr Lal Pathlabs, Shipping Corporation of India, NLC India and RITES may announce dividend, alongside Q2, on November 4.\n\nNBCC India, Emami, and Sonata Software are among the key firms that are scheduled to announce Q2 results on November 5 and investors can also expect dividend reward too.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 07:03 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mandaviya rolls out EPFO services through WhatsApp: Check PF balance, passbook and latest transactions on your phone", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has launched WhatsApp-based services to help subscribers access their provident fund account information and resolve compliance-related issues without visiting EPFO offices.\n\nUnion Labour and Employment Minister Mansukh Mandaviya launched the facility on 1 November 2026, during EPFO's 74th Foundation Day celebrations in New Delhi. The initiative is aimed at making routine provident fund services more accessible through a platform widely used by mobile phone users.\n\nAccording to the Ministry of Labour and Employment, subscribers will be able to check their PF balance, access information from their passbooks and view their latest five transactions through EPFO's verified WhatsApp service . The facility will also provide personalised guidance and assistance to members in completing requirements under the Pradhan Mantri Viksit Bharat Rozgar Yojana (PMVBRY).\n\nThe new facility is designed to provide access to commonly used EPFO services without requiring members to log in to multiple platforms or visit a regional EPFO office.\n\nThe PMVBRY-related assistance is particularly relevant for members whose benefits or compliance requirements are pending because of incomplete Aadhaar authentication or other documentation-related issues.\n\nEPFO has described the facility as a verified WhatsApp service. However, the 1 November launch announcement does not specify the official WhatsApp number or provide a step-by-step activation process.\n\nMembers should therefore use only the WhatsApp contact details published on EPFO's official website or verified communication channels. They should avoid sharing their UAN password, OTP, Aadhaar details or bank credentials with unverified numbers.\n\nIn May 2026, Mandaviya had indicated that members would be able to initiate conversations by sending a 'Hello' message to EPFO's verified WhatsApp number.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 07:02 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Sebi to delist penny stocks: Market regulator plans AI-based surveillance of such firms", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Sebi to delist penny stocks: Market regulator plans AI-based surveillance of such firms The Economic Times daily newspaper is available online now. Read Today's Paper Sebi to delist penny stocks: Market regulator plans AI-based surveillance of such firms SECTIONS Sebi to delist penny stocks: Market regulator plans AI-based surveillance of such firms ET Bureau Last Updated: Nov 01, 2026, 06:55:00 PM IST Rate Story Follow us Share Font Size Abc Smal
