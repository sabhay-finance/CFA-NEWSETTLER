 exchange has adjusted the trading price of the existing listed entity to account for the value of the business being transferred into a separate company.\n\nThis is why the movement can look particularly alarming. In fact, against the exchange\u2019s newly adjusted base price of around \u20b9 260, the stock has actually jumped 5% from its true adjusted value to its day's high of \u20b9 273.\n\nFor existing shareholders, the value has not disappeared. Instead, a portion of the business value is being repositioned into a new entity through the demerger.\n\nUnder the approved scheme of arrangement, HEG\u2019s business has been divided into two distinct entities, with shareholders receiving shares in the newly carved-out company under a 1:1 demerger ratio.\n\nThe existing listed company is HEG Advanced Materials Ltd, which has been renamed and will focus on advanced materials and carbon applications. It will also retain the company\u2019s advanced materials, battery energy solutions and green power businesses.\n\nThe second entity is HEG Graphite.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:56 PM IST", "pub_date_relative": "13m ago"}, {"title": "Spire Healthcare shares jump 3% on \u00a31.03 billion takeover deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:56 PM IST", "pub_date_relative": "13m ago"}, {"title": "European stocks fall and Asia-Pacific markets rise as investors assess renewed Middle East hostilities", "full_content": "European stocks traded lower on Monday as Asia-Pacific markets broadly rose, with investor attention focused on the latest developments in the U.S.-Iran war.\n\nEurope's main Stoxx 600 benchmark dipped almost 0.1% in morning trade, with Germany's DAX leading losses, sliding 0.14%. The U.K. FTSE 100 fell 0.12%, while France's CAC 40 lost 0.06%. The Italian FTSE MIB gained 0.37%.\n\nJapan's Nikkei 225 added nearly 2%, while the Topix rose 0.33%. The Kospi advanced 3.65%, while the s "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:42 PM IST", "pub_date_relative": "27m ago"}, {"title": "Copper overbought at $6.68 with weak ADX: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:42 PM IST", "pub_date_relative": "27m ago"}, {"title": "Bitcoin trapped in $77.5K-$82.2K range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:42 PM IST", "pub_date_relative": "27m ago"}, {"title": "London Gas Oil stretched 10% above 50MA: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:42 PM IST", "pub_date_relative": "27m ago"}, {"title": "Crude Oil WTI double-top at $93.64 resistance: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:42 PM IST", "pub_date_relative": "27m ago"}, {"title": "Balance investment portfolio: Check why equity allocation should reflect financial goals", "full_content": "An individual who started investing aggressively when markets were doing well said that they are now uncomfortable with their level of equity exposure. They asked Mint whether they should reduce their investing even though their long-term goal is still several years away.\n\nIn response to the query, Feroze Azeez, joint chief executive at Anand Rathi Wealth, said that the time a person starts investing can make a big difference to how they view their portfolio.\n\nTo explain it better, Azeez said the investors who started before 2020 and those who began investing more heavily after 2020. \u201cIf you started after 2020, you have seen a lot happen in a relatively short period,\u201d he said, noting that markets recovered strongly after the pandemic and continued to rise, with equities doing particularly well through much of 2024.\n\nIn September 2024, the Nifty 50 reached a high, after which markets became more volatile, moving up and down more sharply.\n\nFor some investors, Azeez said, this may have changed how comfortable they feel with risk. \u201cA portfolio that seemed perfectly comfortable when markets were rising may now feel overly invested in equities .\u201d\n\nOn the other hand, he said, those who started investing before 2020 may have already experienced more market cycles and seen how equity can reward investors who stay invested over the long term.\n\nAccording to Feroze Azeez, investors questioning their equity exposure should look past current market conditions and focus entirely on their specific financial objectives and timelines.\n\nFor instance, a long-term goal like retirement 20 years away justifies a heavier equity allocation. Based on an individual's risk tolerance, financial standing, and return expectations, an allocation of 60-80% in equity\u2014with the remainder in debt\u2014can be considered. While equity historically provides superior long-term growth, incorporating debt creates a more balanced portfolio.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "Air India Maps Next Phase: Chairman Sets Sight On Safety, Cost Rigor Amid Global Headwinds", "full_content": "Chandrasekaran acknowledged that the past 18 months tested Air India extensively. External headwinds\u2014including widespread geopolitical disruptions, airspace closures, and sharp fuel price volatility\u2014combined with the tragic accident involving flight AI171, had placed severe strain on operations.", "source": "NDTV Profit", "pub_date_str": "07 Sep 2026, 12:35 PM IST", "pub_date_relative": "33m ago"}], "cfa": [{"title": "U.S. Energy Secretary Wright says Iran nuclear deal may never happen", "full_content": "U.S. Energy Secretary Chris Wright on Sunday said the U.S. may not reach an elusive deal to constrain Iran from obtaining a nuclear weapon, as the U.S.-Iran conflict enters its seventh month.\n\n\"There may not be a nuclear agreement. It may be simply destroying their capabilities to do it,\" Wright said on ABC News' \"This Week.\" \"An agreement may await the next administration in Iran. We simply don't know that.\"\n\nTrump has repeatedly said preventing Iran from obtaining a nuclear weapon is a central objective of the U.S. campaign. He has also sought a negotiated deal with Iran throughout the war, which has sent energy prices soaring worldwide.\n\nWright's comments suggest the administration may pursue its goal of preventing an Iranian nuclear weapon without reaching a negotiated nuclear agreement.\n\nPressed on whether Wright's comments mean the U.S. will continue striking Iran when it attempts to rebuild its nuclear infrastructure, the energy secretary said, \"You have to destroy their capabilities to do it.\"\n\n\"We are degrading their capacity to develop nuclear weapons and ultimately to deliver them if they develop them,\" he said. \"It is a 47-year-long effort. This is not trivial, but the United States will get the job done and we will work in cooperation with our allies in the region.\"\n\nAsked about his comments again later during an appearance on CBS' \"Face the Nation,\" Wright said President Donald Trump's preference \"is always to have a negotiated settlement and not use a military solution unless absolutely necessary.\"\n\n\"The biggest role of our military in the region right now is to stop the export of any Iranian crude or crude-related products, natural gas, whatever,\" he said. \"We are strangling their economy to try to bring either a change in policy from the existing regime or a new regime.\"", "source": "CNBC Top News", "pub_date_str": "07 Sep 2026, 01:05 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE IPO: GMP on fire even without price band announcement \u2014 Check latest rate today, expected allotment, listing date", "full_content": "NSE IPO: The initial public offering (IPO) of the National Stock Exchange (NSE), finally received the SEBI's approval to launch its mega issue worth \u20b9 30,000 crore. The exchange received the market regulator's approval after nearly a decade of waiting. After the NSE IPO news of SEBI's nod to launch its long-awaited public issue made the grey market active, and it started showing a premium within a few minutes of the news break.\n\nThe IPO Watch website started showcasing a \u20b9 200 premium within a few minutes of the NSE IPO news about SEBI's not to its mega \u20b9 30,000 crore public offer. This means NSE IPO GMP (Grey Market Premium) on Friday was \u20b9 200. However, the IPO Watch is showing the NSE IPO GMP at \u20b9 285 today. This means, NSE IPO GMP has shot up from \u20b9 200 to \u20b9 285, up \u20b9 85 from Friday's GMP. On Monday, last week, when the market was expecting SEBI's nod to the most-awaited IPO by the end of that week, the NSE IPO GMP was around \u20b9 20. This means the NSE IPO GMP has surged from \u20b9 20 to \u20b9 285 in one week, and SEBI's nod to launch the IPO is a major reason for this surge.\n\nAccording to the Draft Red Herring Prospectus (DRHP) of NSE IPO, the exchange has offered around 14.89 crore. The NSE IPO size is around \u20b9 30,000 crore. So, according to the NSE valuations, one NSE share comes around \u20b9 2,015.\n\nOn what could be the possible NSE IPO price band, which market is estimating, Anuj Gupta, a SEBI-registered market expert, said, \u201cWhen a public issue hits the primary market, the company management offers some premium to investors, which ranges from 5% to 15%. This premium percentage on the valuations depends on the company's face value.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:59 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "HEG share price falls over 64% to \u20b9260: Don\u2019t panic! Here\u2019s what actually happened", "full_content": "HEG Ltd\u2019s stock price appeared to suffer a dramatic collapse on Monday, September 7, leaving investors looking at a fall of 64% on their trading screens. The stock, which had closed at approximately \u20b9 728 on Friday, opened at around \u20b9 260 today, creating the appearance of a massive wealth erosion within a single trading session.\n\nHowever, investors should not mistake the sharp fall displayed on their screens for an actual destruction of value. There has been no financial meltdown at HEG and no catastrophic negative development behind the sudden decline. Instead, the steep adjustment is directly linked to the company\u2019s demerger, which has resulted in its share price being recalibrated to reflect the separation of a major part of its business.\n\nSeptember 7 is the official ex-date for the HEG demerger . As a result, the stock exchange has adjusted the trading price of the existing listed entity to account for the value of the business being transferred into a separate company.\n\nThis is why the movement can look particularly alarming. In fact, against the exchange\u2019s newly adjusted base price of around \u20b9 260, the stock has actually jumped 5% from its true adjusted value to its day's high of \u20b9 273.\n\nFor existing shareholders, the value has not disappeared. Instead, a portion of the business value is being repositioned into a new entity through the demerger.\n\nUnder the approved scheme of arrangement, HEG\u2019s business has been divided into two distinct entities, with shareholders receiving shares in the newly carved-out company under a 1:1 demerger ratio.\n\nThe existing listed company is HEG Advanced Materials Ltd, which has been renamed and will focus on advanced materials and carbon applications. It will also retain the company\u2019s advanced materials, battery energy solutions and green power businesses.\n\nThe second entity is HEG Graphite.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:56 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Spire Healthcare shares jump 3% on \u00a31.03 billion takeover deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:56 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "European stocks fall and Asia-Pacific markets rise as investors assess renewed Middle East hostilities", "full_content": "European stocks traded lower on Monday as Asia-Pacific markets broadly rose, with investor attention focused on the latest developments in the U.S.-Iran war.\n\nEurope's main Stoxx 600 benchmark dipped almost 0.1% in morning trade, with Germany's DAX leading losses, sliding 0.14%. The U.K. FTSE 100 fell 0.12%, while France's CAC 40 lost 0.06%. The Italian FTSE MIB gained 0.37%.\n\nJapan's Nikkei 225 added nearly 2%, while the Topix rose 0.33%. The Kospi advanced 3.65%, while the small-cap Kosdaq gained 1.08%. Australia's benchmark S&P/ASX 200 was flat. Hong Kong's Hang Seng index was down nearly 1%, while mainland China's CSI 300 inched 0.19% higher.\n\nMiddle East turmoil persisted, following news that the U.S. struck three Iranian oil tankers after saying warships were targeted with ballistic missiles. U.S. Secretary of Energy Chris Wright said that the Iran nuclear deal may not happen anytime soon.\n\n\"There may not be a nuclear agreement. It may be simply destroying their capabilities to do it,\" Wright said on ABC News' \"This Week.\" \"An agreement may await the next administration in Iran. We simply don't know that.\"\n\nPreventing Iran from acquiring a nuclear weapon has repeatedly been cited by President Donald Trump as a key objective of the U.S. campaign. At the same time, Trump has continued to pursue a diplomatic agreement with Tehran during the war, which has driven energy prices sharply higher around the world.\n\nWright's remarks indicate that the administration could seek to eliminate Iran's ability to develop a nuclear weapon even without securing a formal agreement with Tehran.\n\nU.S. stock markets will be closed on Monday due to a holiday.", "source": "CNBC Top News", "pub_date_str": "07 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FTSE 100 today: Stocks slip as U.S.-Iran Gulf conflict escalates", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "United Breweries raises the bar with a new growth recipe. Now it has to deliver", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe United Breweries Ltd (UBL) stock hit a new 52-week low of \u20b9 1,275.30 on Monday. Investors are hardly enthused by its EverGreen 2030 strategy unveiled at Capital Markets Day last week. UBL eyes a low teens Ebitda margin from high-single digit (9.2% in Q1FY27) over the next three to five years.\n\nIt is betting on improving state mix, portfolio mix and productivity, instead of relying on volume-led operating leverage. It aims for double-digit organic net sales growth from mid-to-high single-digit. UBL has the recipe, but execution is crucial, especially given the disappointments on this front.\n\nUBL sees a large opportunity in beer segment underpinned by India\u2019s low per capita beer consumption of 2.5 litres (versus 25 litres globally) and 25 million consumers reaching the legal drinking age annually. India is a priority market for Heineken in terms of volume and premiumization. To insulate margins from global commodity and supply chain shocks, its new productivity initiative targets 100% domestic sourcing of malt and glass bottles.\n\nPremiumization, through Heineken Silver and Kingfisher Ultra, should aid category growth and margins.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Israel-Hezbollah clashes kill 11 as Lebanon president calls for U.S. support to save truce", "full_content": "At least 11 people were killed, including two children and two medics, in Israeli strikes on a residential building in a town in southern Lebanon on Monday, Lebanon's state news agency reported.\n\nThe strike extends a run of Israeli attacks that have killed civilians in southern Lebanon over the weekend, testing a U.S.-brokered ceasefire that has failed to yield a full halt in hostilities since taking effect in late June.\n\nAt least seven people, including two women, were killed in Israeli strikes across southern Lebanon on Sunday, with six others wounded, Reuters reported , citing Lebanon's Health Ministry. Israel described those strikes as retaliation for Hezbollah drones fired at its forces.\n\nPrior to the strikes, Israel's military had issued an evacuation order for residents in the area earlier on Monday. Israeli military spokesperson Ella Waweya, in a social media post, called on residents inside a building marked on an accompanying map in Deir al-Zahrani \u2014 and in adjacent structure ve Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Balance investment portfolio: Check why equity allocation should reflect financial goals", "full_content": "An individual who started investing aggressively when markets were doing well said that they are now uncomfortable with their level of equity exposure. They asked Mint whether they should reduce their investing even though their long-term goal is still several years away.\n\nIn response to the query, Feroze Azeez, joint chief executive at Anand Rathi Wealth, said that the time a person starts investing can make a big difference to how they view their portfolio.\n\nTo explain it better, Azeez said the investors who started before 2020 and those who began investing more heavily after 2020. \u201cIf you started after 2020, you have seen a lot happen in a relatively short period,\u201d he said, noting that markets recovered strongly after the pandemic and continued to rise, with equities doing particularly well through much of 2024.\n\nIn September 2024, the Nifty 50 reached a high, after which markets became more volatile, moving up and down more sharply.\n\nFor some investors, Azeez said, this may have changed how comfortable they feel with risk. \u201cA portfolio that seemed perfectly comfortable when markets were rising may now feel overly invested in equities .\u201d\n\nOn the other hand, he said, those who started investing before 2020 may have already experienced more market cycles and seen how equity can reward investors who stay invested over the long term.\n\nAccording to Feroze Azeez, investors questioning their equity exposure should look past current market conditions and focus entirely on their specific financial objectives and timelines.\n\nFor instance, a long-term goal like retirement 20 years away justifies a heavier equity allocation. Based on an individual's risk tolerance, financial standing, and return expectations, an allocation of 60-80% in equity\u2014with the remainder in debt\u2014can be considered. While equity historically provides superior long-term growth, incorporating debt creates a more balanced portfolio.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Holiday: Is US Stock Market Open Or Closed On Labor Day? Check Holiday Schedule", "full_content": "After Labor Day, the remaining full-day closures in 2026 are Thanksgiving Day on Nov. 26 and Christmas Day on Dec. 25.", "source": "NDTV Profit", "pub_date_str": "07 Sep 2026, 12:32 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market | South Korea\u2019s NPS suspends FX hedging as won hits near two-year high: Reports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market | South Korea\u2019s NPS suspends FX hedging as won hits near two-year high: Reports Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market | South Korea\u2019s NPS suspends FX hedging as won hits near two-year high: Reports SECTIONS Global Market | South Korea\u2019s NPS suspends FX hedging as won hits near two-year high: Reports By Anupam Nagar , ETMarkets.com Last Updated: Sep 07, 2026, 12:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korea\u2019s National Pension Service has suspended foreign exchange hedging as the won strengthened to a near two-year high against the dollar. The move could affect dollar supply and demand in the domestic market, with the pension fund\u2019s large overseas holdings making its currency transactions significant for South Korea\u2019s foreign exchange market.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Sep 2026, 12:29 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HDFC Bank\u2019s retail investor base triples as small-ticket bets replace deep conviction", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHDFC Bank\u2019s small-shareholder base more than tripled since Sashidhar Jagdishan took charge as chief executive officer in October 2020, although the stock gained only 18% through 4 September.\n\nThe number of retail shareholders (individuals holding nominal share capital of up to \u20b9 1 lakh) rose from 1.27 million in December 2020, the first quarter after Jagdishan took charge, to 4.41 million as of 30 June, a Mint analysis of ACE Equity data showed.\n\nHDFC Bank\u2019s addition of 3.14 million retail investors over this period was the highest among 34 listed lenders. Yes Bank ranked second with an addition of 2.52 million, followed by IDFC First Bank with 1.73 million.\n\nYet, the combined stake of retail investors in HDFC Bank rose only 1.13 percentage points, from 9.19% to 10.32%. The shareholder count expanded three-and-a-half times, but ownership barely budged\u2014a sign that participation became broader, not necessarily deeper.\n\nSantosh Meena, head of research at Swastika Investmart, said this indicates that most newcomers took small-ticket positions. The merger with HDFC Ltd in 2023 also expanded the register, making it difficult to infer buy-the-dip behaviour from the count alone.\n\n\u201cThe stronger evidence of sustained capital conviction comes from domestic institutions rather than the sheer number of small shareholders,\u201d Meena said.\n\nThe rise was anything but steady. HDFC Bank\u2019s retail shareholder base increased in 12 of the 22 quarters through June 2026 and declined in 10 quarters.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:25 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stopped NPS contributions for a few years? Here\u2019s how much your retirement corpus could lose", "full_content": "The National Pension System (NPS) is a market-linked retirement savings scheme that helps build a solid retirement corpus. In this scheme, anyone who wishes to secure their financial future can contribute a set amount each month and enjoy market returns and tax benefits.\n\nUnlike the Employees' Pension Scheme ( EPS ), which automatically diverts 8.33% of the employer's contribution into the retirement pension pool for formal-sector workers, voluntary schemes like the NPS operate on an entirely different structure.\n\nBut what happens to your NPS account when contributions stop for a few years? This can be a common concern among investors, as pausing retirement savings may become unavoidable due to financial constraints, a spell of unemployment, emergency expenses or other unforeseen circumstances.\n\nYes, an NPS subscriber can temporarily stop making fresh contributions for a few months or even several years.\n\nHowever, if you halt contributions for some time, it does not mean that the money already accumulated in the account should be withdrawn. It also does not stop earning returns during this period.\n\nIt continues to benefit from market-linked returns, although the value can rise or fall, depending on the performance of the underlying investments. NPS contributions are invested in diversified portfolios like equity , corporate bonds, and government securities.\n\nSince NPS does not offer fixed returns and depends entirely on market cycles, it's hard to estimate the value of your final retirement corpus .\n\nFor illustrative purposes, let's consider a 40-year-old individual who plans to retire at 60 and contributes \u20b9 10,000 per month to NPS. If the investment earns an assumed 12% annual return, continuing the contribution for 20 years could build a corpus of about \u20b9 99,91,476, according to the SBI Pension Funds NPS calculator.", "source": "LiveMint Money", "pub_date_str": "07 Sep 2026, 12:25 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jaiprakash Power Ventures share price jumps 3% after opening in red | What's behind the rally?", "full_content": "Jaiprakash Power Ventures share price jumped over 3.31% on NSE on Monday, after the stock opened in red. The stock opened lower at \u20b9 16.29 per share but recovered from its early losses to move into positive territory, hitting an intraday high of \u20b9 17.14 on September 7.\n\nIt is to be noted that there are no major triggers behind the sudden rise in the Jaiprakash Power Ventures share price. The market capitalisation of Jaiprakash Power Ventures stood at \u20b9 11,431.57 crore, as of 12 pm on Monday.\n\nJaiprakash Power Ventures Limited reported a consolidated net profit of \u20b9 468.84 crore for the quarter ended June 30, 2026, compared with a net loss of \u20b9 13.37 crore in the quarter ended March 31, 2026. On a year-on-year basis, consolidated profit increased from \u20b9 278.13 crore in the corresponding quarter of the previous year to \u20b9 468.84 crore.\n\nRevenue from operations climbed to \u20b9 1,806.49 crore in Q1 from \u20b9 1,470.79 crore in Q4, supported largely by growth in the power segment. The company also recognised an exceptional item of \u20b9 193.63 crore towards provisions for surrendering the Amelia (North) and Bandha North Coal Mines, citing their financial and operational unviability.\n\nOn a standalone basis, the company posted a net profit of \u20b9 468.95 crore in the June quarter, against a net loss of \u20b9 23.35 crore in the previous quarter. Total income rose to \u20b9 1,806.43 crore from \u20b9 1,470.71 crore, while expenses declined to \u20b9 1,235.94 crore from \u20b9 1,478.77 crore in the preceding quarter.\n\nEBITDA rose 26.47% year-on-year to \u20b9 760.49 crore in the current quarter, compared with \u20b9 601.29 crore in the corresponding quarter of the previous year. The EBITDA margin also improved to 42.75% from 38% a year earlier, indicating stronger operating profitability and improved cost efficiency.", "source": "LiveMint Markets", "pub_date_str": "07 Sep 2026, 12:18 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by we     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
