    const allData = {"general": [{"title": "New EPF wage ceiling: What changes for your PF, pension and insurance", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Centre has raised the wage ceiling for mandatory Employees\u2019 Provident Fund Organisation (EPFO) coverage from \u20b9 15,000 to \u20b9 25,000 a month, according to a gazette notification issued on Thursday.\n\nThe revised ceiling, effective from 17 September, will bring more employees under mandatory provident fund coverage. It was last revised in 2014 from \u20b9 6,500 to \u20b9 15,000.\n\nThe change will affect not just provident fund contributions, but also pension eligibility and Employees\u2019 Deposit Linked Insurance (EDLI) benefits.\n\nEmployees' Provident Fund ( EPF ) membership is mandatory for employees whose PF wages, as defined under the Code on Social Security, are up to the notified wage ceiling. Those having wages above the ceiling can also opt to contribute to the EPF by submitting a joint declaration form with their employer. They can contribute either 12% of the wage ceiling or 12% of their actual PF wages (basic salary, dearness or any other retaining allowances), subject to the employer\u2019s internal policy.\n\n\u201cThe announcement is most relevant for two categories of employees: Those drawing \u2018wages\u2019 between \u20b9 15,000 and \u20b9 25,000 for whom the EPFO enrolment is presently optional and will now be made mandatory, and existing members whose contributions are currently restricted to the \u20b9 15,000 ceiling,\u201d said Anurag Jain, co-founder and partner, tax and regulatory consultancy firm ByTheBook Consulting Llp.\n\n\u201cEmployees drawing \u2018wages\u2019 above \u20b9 25,000 at the time of joining will remain \u2018excluded employees\u2019, unless already an existing PF member,\u201d added Jain. This means a fresher with monthly wages above \u20b9 25,000 can choose to remain outside the EPFO covera ly Autonomous Flight Across the U.S. - WSJ", "full_content": "Joby Says it Completed First Fully Autonomous Flight Across the U.S. WSJ Autonomous airplane completes first cross-country flight Popular Science Joby Flies Autonomous Caravan Coast-to-Coast AVweb Aviation company says it completed fully autonomous flight across the U.S. WCNC Joby Aviation\u2019s 3,100-mile autonomous flight signals its push beyond electric air taxis TechCrunch", "source": "Google News Business", "pub_date_str": "20 Sep 2026, 12:38 PM IST", "pub_date_relative": "28m ago"}, {"title": "Bitcoin trapped between $78.5K-$82K in breakout standoff: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 12:32 PM IST", "pub_date_relative": "34m ago"}, {"title": "US, China set for talks on AI, tariffs and critical minerals ahead of summit", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 12:11 PM IST", "pub_date_relative": "55m ago"}, {"title": "ST certificate cancelled 40 years later: Retired employee loses claim to full pension benefits, what Madras HC said", "full_content": "The Madras High Court has upheld the cancellation of a Chennai Port Trust employee\u2019s Scheduled Tribe (ST) community certificate after authorities concluded that he belonged to the Urali Gounder community and not the Urali tribe. The court also refused to direct the release of his full pension, gratuity , leave salary and other terminal benefits.\n\nIn A. Jegannathan v. The Chairman, Chennai Port Trust & Others, decided on 16 September 2026, Justice D. Bharatha Chakravarthy held that the verification of a community certificate could not be blocked merely because the employee had retired or the certificate had been issued decades earlier.\n\nJegannathan was issued a community certificate stating that he belonged to the Hindu Urali tribe, which is recognised as a Scheduled Tribe in Tamil Nadu. He was subsequently appointed at the Chennai Port Trust against ettling higher. The daily chart formed a Doji-like candle, reflecting indecision after the recent decline, with buyers showing support at lower levels but supply emerging near the highs.\n\n\u201cSectoral participation was largely positive, led by Metal (+1.51%), Media (+1.34%), Realty (+1.19%) and Chemical (+1.17%), while IT (-1.03%), Consumer Durables (-0.43%), FMCG (-0.23%) and Auto (-0.11%) remained weak. Support is placed at 23,150\u201323,200, while 23,450\u201323,500 remains the immediate resistance zone. PCR at 0.98 suggests a balanced setup, while India VIX declined 7.36% to 11.3850. Highest CE OI around 23,400\u201323,500 may cap upside, whereas PE OI concentration around 23,300\u201323,000 provides a potential cushion,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty closed at 56,358.70, up 302.95 points (+0.54%), after opening mildly higher at 56,172.85. Initial selling took the index to 56,073.55, where strong buying interest emerged and supported a sustained recovery towards the session high of 56,497.45.", "source": "LiveMint Markets", "pub_date_str": "20 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Resident Evil Box Office Collection Day 2: Austin Abrams Starrer Gets Weekend Boost, Mints This Amount", "full_content": "'Resident Evil' earned Rs 3.20 crore net in India on Day 2. Its India net total has now reached Rs 5.80 crore, while the India gross stands at Rs 6.93 crore.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 4,169 crore IPO rush this week: 19 issues to open for subscription; NSE to lead 12 listings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Rs 4,169 crore IPO rush this week: 19 issues to open for subscription; NSE to lead 12 listings The Economic Times daily newspaper is available online now. Read Today's Paper Rs 4,169 crore IPO rush this week: 19 issues to open for subscription; NSE to lead 12 listings SECTIONS Rs 4,169 crore IPO rush this week: 19 issues to open for subscription; NSE to lead 12 listings By Akash Podishetti , ETMarkets.com Last Updated: Sep 20, 2026, 11:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s primary market is set for a busy week, with 19 IPOs aiming to raise around Rs 4,169 crore, led by Elevate Campuses and Varmora Granito. The week will also see 12 listings, including NSE, as investors track grey market trends.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Sep 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Missed \u20b9431 on credit card bill, charged \u20b930,000 interest; know the consequences of not making the full payment", "full_content": "An Reddit user recently shared their experience on the social media platform, claiming that they were charged hefty finance charges after falling short on their credit card payment by just \u20b9 431.\n\nThe incident highlights how even a small unpaid amount on a credit card bill can potentially trigger additional interest and other charges when the full outstanding is not cleared by the due date.\n\nAccording to the post, the user's total credit card bill stood at \u20b9 4,17,770.38 and the person paid \u20b9 4,17,339 before the due date.\n\nDespite the small shortfall, the user said the bank subsequently levied finance charges of around \u20b9 25,794. In addition, GST of about \u20b9 4,643 was also charged on the finance charges, taking the total additional amount to about \u20b9 30,437.\n\nDisclaimer: This report is based on user-generated content from social media. Livemint has not independently verified the claims and does not endorse them.\n\nThe user noted that the most confusing part about the situation was that, even though they made multiple part-payments, the bank's app did not clearly show how much of the statement balance was still outstanding.\n\nThe Reddit post has drawn attention to the importance of checking the total amount due on a credit card statement and ensuring that the entire outstanding balance is paid within the due date.\n\nA credit card grace period is the interest-free time between the end of your billing cycle and your payment due date. So, if you don't pay your bills by the due date, or even pay only the minimum amount due, the bank charges interest on the balance amount. This will keep adding up until you make the full payment.", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. Treasury's Bessent, China's He to hold talks on AI, trade, critical minerals: Reuters", "full_content": "U.S. Treasury Secretary Scott Bessent and Chinese Vice Premier He Lifeng are set to meet on Sunday to try to tee up potential agreements on AI , tariffs and critical minerals for a high-stakes Washington summit this week between U.S. President Donald Trump and Chinese President Xi Jinping .\n\nThe meetings at JP Morgan Chase's headquarters in Manhattan, which also will include U.S. Trade Representative Jamieson Greer , are due to start at about 10:30 a.m. (1430 GMT) and are expected to run all day.\n\nKey topics will be the status of a U.S.-China trade truce that is set to expire on November 10, flows of Chinese rare-earth magnets and critical minerals that US officials say are insufficient and potential guard rails for artificial intelligence after reports of key security breaches involving AI models.\n\nThe most likely outcome, analysts say, would be for Washington and Beijing to agree on small steps to show they are continuing to avoid escalating tensions in a delicate trade relationship that has major consequences for the global economy.\n\n\"I think there will be some show of deliverables because of the fact that it's a presidential summit coming, but I don't feel like we're on the verge of some sort of breakthrough,\" said Anna Ashton, a longtime China trade analyst and founder of Ashton Intelligence. \"I think status quo is probably both sides' general best expectation.\"\n\nMany of the issues that He, Bessent and Greer will have to work through for Trump and Xi are holdovers from the two leaders' meeting in Beijing in May, including an effort on both sides to cut tariffs on non-strategic goods and Chinese pledges to increase purchases of US agricultural goods by $17 billion a year and to purchase more than 200 Boeing aircraft.\n\nThe Bessent-He-Greer meeting follows a pattern set over the past 16 months, in which the three officials met in European and Asian cities to tee up potential agreements for Trump and Xi.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Viksit Bharat depends on Viksit Rajya\u2019: CEA calls for more private capital, higher state capex", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a \u2018Viksit Bharat depe  "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 11:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Camp David Exit Follows Middle-East Flare-Up: Did Houthi Strikes Trigger Trump\u2019s Return?", "full_content": "Trump returned early from Camp David without explanation amid Iran and Russia-NATO tensions. An aircraft was intercepted near the site, while unverified reports cited Iran's heightened readiness. European leaders warned of possible Russian threats.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Uday Kotak lays out 7 priorities for Viksit Bharat, warns against economic complacency", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Uday Kotak lays out 7 priorities for Viksit Bharat, warns against economic complacency The Economic Times daily newspaper is available online now. Read Today's Paper Uday Kotak lays out 7 priorities for Viksit Bharat, warns against economic complacency SECTIONS Uday Kotak lays out 7 priorities for Viksit Bharat, warns against economic complacency ET Online Last Updated: Sep 20, 2026, 11:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Veteran banker Uday Kotak urged India to avoid complacency despite its strong global position, calling for tighter fiscal management, financial-sector reforms and stronger domestic production. Speaking at a Finance Ministry conference, Kotak outlined seven priorities for Viksit Bharat, including fiscal consolidation, reducing import dependence, addressing gold holdings and balancing regulation with economic growth.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "20 Sep 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Germany\u2019s IW institute triples growth forecast for 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Iran sets terms for US talks as Houthis step up attacks on Saudi Arabia", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "New EPF wage ceiling: What changes for your PF, pension and insurance", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Centre has raised the wage ceiling for mandatory Employees\u2019 Provident Fund Organisation (EPFO) coverage from \u20b9 15,000 to \u20b9 25,000 a month, according to a gazette notification issued on Thursday.\n\nThe revised ceiling, effective from 17 September, will bring more employees under mandatory provident fund coverage. It was last revised in 2014 from \u20b9 6,500 to \u20b9 15,000.\n\nThe change will affect not just provident fund contributions, but also pension eligibility and Employees\u2019 Deposit Linked Insurance (EDLI) benefits.\n\nEmployees' Provident Fund ( EPF ) membership is mandatory for employees whose PF wages, as defined under the Code on Social Security, are up to the notified wage ceiling. Those having wages above the ceiling can also opt to contribute to the EPF by submitting a joint declaration form with their employer. They can contribute either 12% of the wage ceiling or 12% of their actual PF wages (basic salary, dearness or any other retaining allowances), subject to the employer\u2019s internal policy.\n\n\u201cThe announcement is most relevant for two categories of employees: Those drawing \u2018wages\u2019 between \u20b9 15,000 and \u20b9 25,000 for whom the EPFO enrolment is presently optional and will now be made mandatory, and existing members whose contributions are currently restricted to the \u20b9 15,000 ceiling,\u201d said Anurag Jain, co-founder and partner, tax and regulatory consultancy firm ByTheBook Consulting Llp.\n\n\u201cEmployees drawing \u2018wages\u2019 above \u20b9 25,000 at the time of joining will remain \u2018excluded employees\u2019, unless already an existing PF member,\u201d added Jain. This means a fresher with monthly wages above \u20b9 25,000 can choose to remain outside the EPFO coverage.\n\nIf employee contribution to the EPF is restricted to 12% of the wage ceiling, the maximum monthly contribution would rise from \u20b9 1,800 (12% of \u20b9 15,000) to \u20b9 3,000 (12% of \u20b9 25,000).", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 12:58 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Govt rolls out GOBARdhan rules with assured CBG offtake, 10-year price support", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Govt rolls out GOBARdhan rules with assured CBG offtake, 10-year price support The Economic Times daily newspaper is available online now. Read Today's Paper Govt rolls out GOBARdhan rules with assured CBG offtake, 10-year price support SECTIONS Govt rolls out GOBARdhan rules with assured CBG offtake, 10-year price support PTI Last Updated: Sep 20, 2026, 12:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The government\u2019s Rs 23,731-crore GOBARdhan scheme aims to give India\u2019s CBG industry a more predictable business model, with assured offtake, a government-backed price for at least 10 years and capital support. The framework seeks to address buyer and financing concerns, while turning agricultural waste, cattle dung and other organic waste into energy.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Sep 2026, 12:52 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India must rethink cross-border payments beyond corridors, put customers first: Deloitte", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India must rethink cross-border payments beyond corridors, put customers first: Deloitte The Economic Times daily newspaper is available online now. Read Today's Paper India must rethink cross-border payments beyond corridors, put customers first: Deloitte SECTIONS India must rethink cross-border payments beyond corridors, put d other terminal benefits.\n\nIn A. Jegannathan v. The Chairman, Chennai Port Trust & Others, decided on 16 September 2026, Justice D. Bharatha Chakravarthy held that the verification of a community certificate could not be blocked merely because the employee had retired or the certificate had been issued decades earlier.\n\nJegannathan was issued a community certificate stating that he belonged to the Hindu Urali tribe, which is recognised as a Scheduled Tribe in Tamil Nadu. He was subsequently appointed at the Chennai Port Trust against an ST-reserved vacancy and served for more than three decades before retiring on 31 January 2013.\n\nHis retirement benefits were not fully released because verification of his community status was pending. He approached the High Court seeking full pension , commutation, gratuity, leave salary and other terminal benefits.\n\nThe dispute over his community status, however, was not new. According to the State Level Scrutiny Committee, verification had begun soon after his appointment. The certificate was referred for verification in 1983, and revenue authorities subsequently raised questions about his claimed ST status.\n\nThe records considered by the authorities included the petitioner's school records, which described his community as Urali Gounder. The Salem Collector had concluded in 1984 that the certificate was not genuine and that the petitioner had failed to establish that he belonged to the Urali tribe.\n\nThe matter went through several rounds of litigation.", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 12:08 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UPI\u2019s new MDR pot: 5% of collections to be used for bringing small merchants online", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealt     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
