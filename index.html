<script>

    const allData = {"general": [{"title": "\u2018I don\u2019t begrudge them their money\u2019: My husband and I have friends who spend, spend, spend. How do we keep up?", "full_content": "\u201cA weekend away isn\u2019t a weekend away. It\u2019s a luxury hotel, expensive meals and a last-minute upgrade.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Sep 2026, 07:00 PM IST", "pub_date_relative": "5m ago"}, {"title": "Trump-Xi meeting: Why China's self-sufficiency changes the calculus", "full_content": "BEIJING \u2014 The trade deficit that escalated tensions between China and the U.S. in recent years has yet to shrink significantly, and the world's second-largest economy faces deep challenges. But China's efforts to build up self-sufficiency have reduced the threat to its domestic market from global trade developments.\n\nU.S. President Donald Trump and Chinese President Xi Jinping are expected to meet this week for their second in-person summit of the year. U.S. concerns about artificial intelligence have gained prominence in the days ahead of the meeting.\n\nBut the best that businesses are hoping for is an extension of a trade truce reached last fall. Even then, tariffs have done little to dent America's appetite for Chinese goods.\n\nWhile an escalation in trade tensions last April briefly sent the U.S. trade deficit with China to its lowest level since 2017, surging demand for AI-related parts have helped send it higher again so far this year, according to China Customs data accessed through Wind Information.\n\nAnd even as the U.S. has diversified away from China, it's hard for the world to shake its dependence on the Asian country.\n\nAsia still accounts for more than 60% of U.S. imports, the same as before \"Liberation Day,\" pointed out Jens Eskelund, president of the European Chamber of Commerce in China.\n\nHe estimated between half and three-quarters of container traffic from China to Southeast Asia subsequently heads on to other destinations.\n\nThat's all sped up the pace at which the world relies on China-made goods.", "source": "CNBC Finance", "pub_date_str": "23 Sep 2026, 06:59 PM IST", "pub_date_relative": "6m ago"}, {"title": "Railways notifies UPS rules for employees covered by NPS: \u20b910,000 minimum pension, 25-year full pension", "full_content": "The Ministry of Railways on Wednesday, September 23, notified the rules for implementing the Unified Pension Scheme (UPS) for its employees covered by the National Pension System (NPS).\n\nThe rules spell out eligibility requirements, employee and government contributions, pension calculation, lump-sum benefits, minimum and maximum pension provisions, Voluntary Retirement Scheme (VRS) rules and the process for switching from the UPS to the NPS.\n\nUnder the notified framework, eligible railway employees will receive a minimum assured pension of \u20b9 10,000 after completing 10 years of qualifying service. Employees who have completed 25 years of service will be eligible for the full assured pension. The rules also allow eligible employees to seek voluntary retirement after completing 20 years of service.\n\nThe central government introduced the UPS under the NPS from April 1, 2025. Different government departments have subsequently been bringing their employees under the scheme, with the railways now notifying its own implementation rules.\n\nThe UPS will be available to railway employees appointed on or after January 1, 2004, who are covered by the NPS.\n\nHowever, the scheme does not cover all categories of railway workers. Casual and daily-wage employees, contract workers and certain employees governed by separate pension regulations will not be eligible to join the UPS.\n\nA railway employee subscribing to the UPS will have to contribute 10% of basic pay plus dearness allowance (DA) every month to their individual UPS account.\n\nThe contribution requirement will continue even when an employee is on probation or is deputed to a Central or state government department.", "source": "LiveMint Money", "pub_date_str": "23 Sep 2026, 06:58 PM IST", "pub_date_relative": "7m ago"}, {"title": "Five9 President Andy Dignan Sells Shares for $244,510", "full_content": "Skip to navigation Skip to main content Skip to right column Five9 President Andy Dignan Sells Shares for $244,510 John Ballard, The Motley Fool Wed, September 23, 2026 at 6:22 AM PDT 4 min read FIVN Andy Dignan, President of Five9 (NASDAQ:FIVN), sold 6,986 shares at $35.00 per share on Sept. 17, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($35.00); post-transaction value based on Sept. 17, 2026, market close ($34.50).\n\nHow does this transaction relate to the executive's total equity exposure? Following this sale, Andy Dignan retains direct ownership of 237,614 shares, which represents a total position value of approximately $8.8 million based on the Sept. 21, 2026, market close of $37.01.\n\nWhat is the context of the Rule 10b5-1 plan? The trading plan was adopted on Sept. 2, 2025, more than a full year before this execution, ensuring the transaction was scheduled well in advance of current market conditions.\n\nWhat has been the stock's performance relative to the transaction date? At the time of the transaction on Sept. 17, 2026, the company had delivered a 33% one-year total return.\n\nWhat is the insider's current ownership level in the company? The President holds a 0.31% ownership stake in the firm, providing continued alignment with institutional and retail shareholders while facilitating personal portfolio management.\n\nFive9 provides cloud-based contact center software and services that enable enterprises to manage customer interactions across multiple communication channels, including voice, email, chat, and social media.\n\nThe company operates a subscription-based SaaS business model, generating recurring revenue from enterprise customers who license its virtual contact center platform and integrated applications.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:52 PM IST", "pub_date_relative": "13m ago"}, {"title": "Micron Wall Street Target Hits $2,000 as Traders Pile In Before Earnings", "full_content": "Skip to navigation Skip to main content Skip to right column Micron Wall Street Target Hits $2,000 as Traders Pile In Before Earnings Omor Ibne Ehsan Wed, September 23, 2026 at 6:20 AM PDT 5 min read MU Quick Read MU has surged 284% year to date, with analyst price targets ranging wildly from a $1,515 consensus to a Street-high $2,000 before earnings.\n\nMicron locked in 16 take-or-pay customer agreements through 2030 carrying $100 billion in minimum revenue floors and $22 billion in prepaid deposits.\n\nIf Micron's September 30 gross margin guide steps below 86%, the mean-reversion bear case wins and the $2,000 target quietly disappears.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Micron Technology didn't make the cut. Enter your email to see the names that beat MU. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMicron ( NASDAQ:MU ) closed at $1,096.16 after a 5% session, capping a week that added 18.17%. Market cap now sits near $1.24 trillion. Fiscal Q4 results are due September 30, 2026, after the close.\n\nThat is the setup you are being asked to underwrite: a memory stock up 284.3% year to date, heading into a report the company itself guided to $50.0 billion in revenue and roughly $31.00 non-GAAP EPS.\n\nThe $2,000 Street-high number circulating around this name came from two firms in late June and a third days later. Since then, two cuts in August and a hold in mid-September have moved the other way. Consensus target sits at $1,515. The stock still trades below its 52-week high of $1,254.81, and the sell side has rarely disagreed this violently about one company.\n\nWhen analyst targets span a multiple rather than a margin, that signals something the average does not: nobody can model mid-cycle earnings for a memory maker inside an artificial intelligence buildout.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Silver Stocks Are Turning High Margins Into Dividends for Shareholders. 1 Precious Metals Stock to Buy Right Now.", "full_content": "Skip to navigation Skip to main content Skip to right column Silver Stocks Are Turning High Margins Into Dividends for Shareholders. 1 Precious Metals Stock to Buy Right Now. Courtney Carlsen, The Motley Fool Wed, September 23, 2026 at 6:20 AM PDT 3 min read WPM SI=F NVDA Gold and silver prices surged into 2026, then pulled back sharply. That said, precious metals remain in focus amid rising fiscal debt and geopolitical tensions, and prices remain elevated.\n\nHigher metals prices can translate into wider margins, and precious metals streaming company Wheaton Precious Metals (NYSE: WPM) is turning that tailwind into something investors can really appreciate: cold, hard cash. After raising its dividend by 18% earlier this year, Wheaton still has plenty of room to reward shareholders.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nTraditional miners dig ore out of the ground and sell their gold, silver, or other metals at prevailing spot market prices. Rising prices boost revenue and margins -- that is, if costs don't rise in tandem.\n\nRunning a physical mine involves high operational costs, including heavy-duty equipment, diesel fuel, and labor. Rising diesel and fuel costs have eroded mining operating margins, eating into the windfall cash flows operators would otherwise realize during precious metal rallies.\n\nThis is where Wheaton Precious Metals' business stands out. The company operates a precious metals streaming business model. The company provides funds to mining companies to build or expand operations. In return, it secures long-term agreements that allow it to purchase a fixed percentage of future silver and gold production at low, predetermined contractual cash costs .\n\nThis structure helps shield Wheaton from inflation and boosts cash flow.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq set for lower start as oil prices move higher and Treasury yields rise - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq set for lower start as oil prices move higher and Treasury yields rise MarketWatch Stocks and Bonds Drift as Brent Ends Run of Losses: Markets Wrap Bloomberg.com Wall St set to open lower as oil, bond yields tick up Reuters Stock Market Today: Futures Slip After Nasdaq Closes at Fresh Record; Oil Prices, Treasury Yields Edge Higher Investopedia Stock Futures Slip as Markets Weigh Middle East Diplomacy WSJ", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "IonQ Surges 11% as NVIDIA Research Center Deal Follows Error-Decoder Breakthrough; D-Wave Climbs 5%, Rigetti Rises 4%", "full_content": "Skip to navigation Skip to main content Skip to right column IonQ Surges 11% as NVIDIA Research Center Deal Follows Error-Decoder Breakthrough; D-Wave Climbs 5%, Rigetti Rises 4% David Moadel Wed, September 23, 2026 at 6:19 AM PDT 6 min read IONQ NVDA QUBT RGTI QTUM Quick Read IonQ surges 11% on a real-time quantum error decoder breakthrough and securing the first on-premise slot at NVIDIA's quantum research center.\n\nD-Wave and Rigetti climb 5% and 4% on theme-buying alone, with no catalysts of their own, making those sympathy gains vulnerable to quick reversal.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and IonQ didn't make the cut. Enter your email to see the names that beat IONQ. The report is free. Enter your email and see if any of your stocks made the cut.\n\nShares of IonQ ( NYSE:IONQ ) are rallying in Wednesday morning trading on two company announcements landing back to back: an error-decoder breakthrough disclosed after Tuesday's close, and a premarket disclosure that IonQ's Superion 256 system will be the first on-premise quantum computing deployment at NVIDIA 's ( NASDAQ:NVDA ) Accelerated Quantum Research Center. This move looks company-specific rather than a re-rating of the whole quantum theme.\n\nThe Defiance Quantum ETF ( NASDAQ:QTUM ) is down 0.3% in Wednesday morning trading. By comparison, the SPDR S&P 500 ETF Trust ( NYSEARCA:SPY ) is down 0.1%, so the wider tape is essentially unchanged while IonQ pulls away from the pack.\n\nIonQ stock is at $45.29, up 11% in Wednesday morning trading, and the size of the move against a slightly lower sector fund signals the bid is squarely on this name. Meanwhile, D-Wave Quantum ( NASDAQ:QBTS ) stock is at $18.38, up 5%, riding read-across without an announcement of its own.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Budget 2027-28 process begins October 12 with month-long pre-budget meetings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Budget 2027-28 process begins October 12 with month-long pre-budget meetings The Economic Times daily newspaper is available online now. Read Today's Paper Budget 2027-28 process begins October 12 with month-long pre-budget meetings SECTIONS Budget 2027-28 process begins October 12 with month-long pre-budget meetings PTI Last Updated: Sep 23, 2026, 06:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Pre-budget meetings for the Union Budget 2027-28 will commence on October 12 and continue until November 13. These discussions aim to finalize the Revised Estimate for 2026-27 and the Budget Estimate for 2027-28. Ministries are required to submit necessary details by October 6 to facilitate these meetings. The Budget is expected to address economic growth, job creation, and domestic demand.\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago"}, {"title": "Typical job search advice isn't working in today's market. Experts' new rules for landing a role right now", "full_content": "It's hard to find work in today's job market: Employers aren't hiring because of economic pressures and because they'd rather invest in artificial intelligence. AI, once billed as a promising solution to get people hired faster, is causing headaches for candidates and recruiters alike.\n\nJob seekers aren't feeling optimistic. More than half, 55%, of job seekers say employers have the upper hand in the hiring landscape, and 67% feel pressured to accept the first job offer that they get, according to ZipRecruiter's recent survey of more than 1,500 job seekers between July 25 and Aug. 12.\n\n\"The success of job search strategies is lower right now across the board,\" Daniel Zhao, chief economist at the company review site Glassdoor, tells CNBC Make It.\n\nSome well-meaning career advice that worked in the past may not apply in today's market, or may not work as well as it used to. Here's what hiring experts say are the new rules to finding a job right now.\n\nRoughly half, 47%, of workers say they've used AI to apply to jobs, with resume writing help among the most common use cases, according to a CNBC and SurveyMonkey Quarterly AI and Jobs Survey of 1,686 workers in July.\n\nTurns out, a lot of AI-generated resumes are now ending up in a recruiter wasteland.\n\nUsing AI to do the same thing everyone else is doing won't help you stand out, Zhao says: \"You get these resumes and application materials that are very, very similar to each other because people have used the same types of prompts to to customize their application.\"\n\nAt this point, \"never use AI to write your entire resume,\" says Sam DeMase, career expert at the jobs site ZipRecruiter.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "IREN Has Microsoft and $14 Billion of Funding. Execution Is the Real Test", "full_content": "Skip to navigation Skip to main content Skip to right column IREN Has Microsoft and $14 Billion of Funding. Execution Is the Real Test Habib Ur Rehman Wed, September 23, 2026 at 6:14 AM PDT 3 min read IREN MSFT BTC-USD IREN's AI pivot has reached the point where the balance sheet looks almost as dramatic as the growth plan. The Bitcoin miner-turned-AI cloud operator ended June with about $7.6 billion of cash, including $1.7 billion that was restricted, while management says says existing cash, committed GPU financing and customer prepayments provide roughly $14 billion of funding capacity. The first major proof point is already live: Microsoft Corporation (NASDAQ: MSFT ) accepted the first Horizon deployment in August under a broader multiyear arrangement, while IREN Limited (NASDAQ: IREN ) is redirecting sites, capital and staff toward AI cloud infrastructure. The question is whether that cash pile represents protection or simply the opening balance for an even larger spending cycle.\n\nIREN Limited (NASDAQ:IREN) says its 2026 capacity is largely sold and that recent customer prepayments can fund roughly half of GPU capital expenditure on new contracts. Management is targeting cumulative delivery of about 300 megawatts of IT load in 2026 and 800 megawatts in 2027, with fiscal 2027 capital spending estimated at $25 billion to $30 billion. The Microsoft relationship supports the bull case because a large customer can improve financing terms and utilization visibility. It does not eliminate schedule risk, equipment lead times or the possibility that project costs rise faster than contracted economics.\n\nHedge funds moved aggressively into IREN before the latest delivery milestone. Insider Monkey's database showed 69 holders in Q2 2026, up from 53 in Q1. Value Aligned Research Advisors increased its position 78% to about 8.47 million shares. Short interest was 93.61 million shares as of August 31, around 25.01% of float with 2.06 days to cover.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago"}, {"title": "Is UroGen\u2019s (URGN) Commercial Engine Strong Enough To Fund Its Pipeline Ambitions?", "full_content": "Skip to navigation Skip to main content Skip to right column Is UroGen\u2019s (URGN) Commercial Engine Strong Enough To Fund Its Pipeline Ambitions? Maham Fatima Wed, September 23, 2026 at 6:13 AM PDT 5 min read URGN UroGen Pharma (NASDAQ: URGN ) operates as a specialized oncology and urology therapeutics company anchored by proprietary sustained-release technology platforms. By developing localized drug delivery systems designed to retain therapeutics in targeted tissue sites for extended periods, the company addresses the significant clinical limitations of systemic toxicity and rapid clearance common in traditional cancer treatments. Its underlying business model relies on high-margin product adoption, long-term intellectual property protection, and recurring clinical validation that insulates its commercial portfolio against generic competition and supports durable portfolio compounding across specialized care channels.\n\nOn August 20, UroGen Pharma announced an Option and Research License Agreement with IntraGel Therapeutics, paired with an investment of up to $7 million in IntraGel's equity. The deal gives UroGen a research license and options to develop as many as three oncology products built on IntraGel's SRGel platform, along with a separate option to eventually acquire TumoCure, an experimental head and neck cancer therapy still working through clinical development. It is a bet on technology UroGen does not yet own outright, layered onto a business that already has one approved product and a pipeline racing toward its next milestones.\n\nUroGen's existing business gave it something to build on heading into this deal. On August 5, 2026, the company reported that ZUSDURI generated $50.4 million in revenue for the second quarter of 2026, up 73% from the first quarter.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago"}, {"title": "AMD Is Up 293% in a Year and Still Climbing. This is Where It\u2019ll Trade in 2027", "full_content": "Skip to navigation Skip to main content Skip to right column AMD Is Up 293% in a Year and Still Climbing. This is Where It\u2019ll Trade in 2027 Vandita Jadeja Wed, September 23, 2026 at 6:11 AM PDT 5 min read AMD META Quick Read AMD crossed $1 trillion in market cap, up 291% in a year, with Lisa Su pledging to significantly exceed a $20 annual EPS target.\n\nFY2027 EPS estimates climbed nearly 20% in just 90 days, with 33 upward analyst revisions signaling Wall Street is still playing catch-up.\n\nA path to $900 runs through gigawatt-scale MI450 GPU deals with Anthropic, Meta, and OpenAI, plus gross margins expanding from 43% to 56%.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AMD didn't make the cut. Enter your email to see the names that beat AMD. The report is free. Enter your email and see if any of your stocks made the cut.\n\nThe AI chip race has a new heavyweight, and AMD ( NASDAQ: AMD ) is no longer playing catch-up. Shares are up 291.07% over the past year and 187.4% year-to-date, with the stock crossing the $1 trillion market cap milestone this week.\n\nChair and CEO Lisa Su told investors the company will \"significantly exceed its $20 annual EPS target within its strategic timeframe,\" a stunning upgrade tied to gigawatt-scale Instinct deployments with Anthropic, Meta, and OpenAI.\n\nWith momentum this strong, the question is how high shares can climb. Here is the path for AMD to hit $900 per share in 2027.\n\nThe analyst consensus one-year target sits at $616.51, essentially in line with today's $615.50 share price. That reflects a lag more than skepticism: 80% of covering analysts rate AMD a Buy or Strong Buy, with zero sells.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "Micron vs. Sandisk: Which AI Memory Stock Has More Room to Run?", "full_content": "Skip to navigation Skip to main content Skip to right column Micron vs. Sandisk: Which AI Memory Stock Has More Room to Run? Harsh Chauhan, The Motley Fool Wed, September 23, 2026 at 6:11 AM PDT 3 min read MU NVDA SNDK Micron Technology (NASDAQ: MU) and Sandisk (NASDAQ: SNDK) have been multibagger investments over the past year, making investors significantly richer owing to the incredible demand for memory in artificial intelligence (AI) data centers.\n\nWhile Micron stock has surged by an incredible 541% over the past year, Sandisk has clocked phenomenal gains of 1,600%. The good news for investors is that Wall Street expects both stocks to jump higher. Let's take a closer look at their prospects and check which one of these two stocks is likely to deliver bigger gains.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nMicron's 12-month median price target of $1,600 points to a 53% jump from current levels, according to 57 analysts covering the stock. Sandisk stock, on the other hand, is projected to jump by 24% over the coming year, based on its median price target of $2,200 as per 32 analysts covering it.\n\nIt is easy to see why analysts are forecasting a bigger jump in Micron stock. The company sells both dynamic random-access memory (DRAM) and NAND flash memory, while Sandisk is a pure-play NAND flash manufacturer. What's more, Micron enjoys a bigger market share of 15% in NAND flash compared to Sandisk's share of 11%, according to Counterpoint Research.\n\nAdditionally, Micron has been gaining share in the fast-growing DRAM market. Its share of this space increased to 24% in Q2 this year, up from 22% in Q1.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "Oil holds near two-week lows while diesel cracks hit record", "full_content": "Skip to navigation Skip to main content Skip to right column Oil holds near two-week lows while diesel cracks hit record By Anushree Mukherjee Wed, September 23, 2026 at 6:10 AM PDT 3 min read CL=F By Anushree Mukherjee\n\nLONDON, Sept 23 (Reuters) - Oil prices held near their lowest in more than two weeks on Wednesday as improving Gulf crude supplies weighed on the market, though diesel refining margins hit a record \u200chigh on potential restrictions to US diesel exports.\n\nBrent crude futures rose $1.33, or 1.34%, to $100.58 a barrel by 1303 \u200cGMT while West Texas Intermediate futures gained 65 cents, or 0.72%, to $91.17.\n\nThe Brent benchmark hit its lowest since September 8 in the previous session at $97.36. \u200bWTI touched its lowest since September 1 earlier on Wednesday.\n\nMeanwhile, European low-sulphur gasoil's premium to Brent crude futures hit a record of about $95 a barrel after U.S. President Donald Trump said he backed the idea of a diesel export ban to lower prices that have hit record highs owing to a global supply shortage.\n\nEurope has been highly dependent on diesel and jet fuel imports from the \u200cUnited States since the US-Israeli war on Iran \u2060has disrupted Middle East supplies.\n\n\"Brent is being underpinned by surging gasoil prices amid renewed worries the US may introduce a diesel export ban,\" said Ole Hansen, head of commodity strategy at Saxo \u2060Bank.\n\nAnalysts and market watchers, however, have warned that such a measure would do little to ease high energy prices and could worsen supply and economic disruptions around the globe.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago"}, {"title": "One of These S&P 500 Funds Has Trailed for 10 Years. Its Fans Say That\u2019s the Point.", "full_content": "Skip to navigation Skip to main content Skip to right column One of These S&P 500 Funds Has Trailed for 10 Years. Its Fans Say That\u2019s the Point. Trey Thoelcke Wed, September 23, 2026 at 6:10 AM PDT 4 min read AAPL RSP Quick Read SPYM's cap-weighted structure delivered +323% over 10 years versus RSP's +203%, as mega-cap tech giants automatically captured more capital with every gain.\n\nApple alone holds 6.59% of SPYM's $154 billion in assets, making it a concentrated mega-cap bet disguised as broad market diversification.\n\nRSP weights all 500 stocks equally and tilts toward industrials and financials, only outperforming SPYM when mega-cap tech leadership durably fades.\n\nTwo retirees, same $1 million, same 4% rule, buy one finished with $1.4 million, the other hit $0 in 12 years. Our free reader guide explains the flaw that separated them, and the income-first method built to avoid it.\n\nTwo funds hold nearly identical rosters of large American companies drawn from the same S&P benchmark. The only meaningful difference between SPDR Portfolio S&P 500 ETF ( NYSEARCA:SPYM ) and Invesco S&P 500 Equal Weight ETF ( NYSEARCA:RSP ) is how much of each name they own. That single choice has produced a decade of divergent returns, and the very reason SPYM won is why its owners should look closely at what they hold.\n\nSPYM last traded at $91.12, and RSP at $212.70, both delayed intraday marks pulled on Wednesday morning. Both funds have a full decade of price history on record, so every window below is a clean, like-for-like comparison.\n\nSPYM leads across every window, and the separation widens over longer horizons. The one-month column shows the gap still opening in real time.\n\nSPYM weights each S&P 500 constituent by market capitalization, so the biggest companies drive the bulk of returns. The N-PORT filing dated June 30, 2026, shows Apple alone at 6.59% of net assets, worth roughly $10.1 billion inside a fund carrying $153.9 billion in total net assets.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago"}, {"title": "Morgan Stanley Just Put a $54 Target on This AI-Pivoting Bitcoin Miner. Amazon Is Already a Customer", "full_content": "Skip to navigation Skip to main content Skip to right column Morgan Stanley Just Put a $54 Target on This AI-Pivoting Bitcoin Miner. Amazon Is Already a Customer Habib Ur Rehman Wed, September 23, 2026 at 6:09 AM PDT 3 min read CIFR AMZN BTC-USD Cipher Digital's transformation from Bitcoin miner to AI-infrastructure landlord is becoming easier to value because the company now has a real hyperscaler customer. Morgan Stanley raised its price target on September 18 to $54 from $43.50 while keeping an Overweight rating. A major asset supporting Cipher's AI-infrastructure thesis is a 15-year, roughly $5.5 billion lease at Cipher's Black Pearl site with Amazon.com, Inc. (NASDAQ: AMZN ). For Cipher Digital Inc. (NASDAQ: CIFR ), the trade is no longer simply that old mining sites might someday host AI. It is whether long-term cloud contracts can justify the capital required to turn power into data-center capacity.\n\nCipher Digital Inc. (NASDAQ:CIFR) agreed to provide about 300 megawatts at Black Pearl to Amazon Web Services under a 15-year arrangement. Cipher began delivering capacity in August 2026, two months ahead of schedule, and said rent had commenced. Cipher also has a separate Barber Lake transaction backed by Google, which adds another hyperscaler validation point. The bull case is that powered sites with interconnection rights have become scarce enough that Cipher can monetize land and electricity at infrastructure-like contract values rather than crypto-cycle multiples.\n\nThe bear case is financing and execution. A long lease only becomes valuable after the data center is built, commissioned and delivered on schedule. Construction overruns, equipment lead times or a higher cost of capital can eat into returns before rent starts. Cipher's legacy mining exposure also means investors are underwriting a business-model transition while new projects consume cash.\n\nAmazon.com, Inc.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:39 PM IST", "pub_date_relative": "25m ago"}, {"title": "Zcash Surges 72% in a Month After Paradigm Reveals ZEC Holdings. Is It Too Late to Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column Zcash Surges 72% in a Month After Paradigm Reveals ZEC Holdings. Is It Too Late to Buy? Sam Daodu Wed, September 23, 2026 at 6:09 AM PDT 6 min read ZCASH-USD Quick Read Zcash tripled since July 1 and gained 221% before Paradigm's September 16 ZEC disclosure, meaning 83% of the rally predated that news.\n\nCypherpunk Technologies is targeting a 5% ZEC stake, implying roughly $840 million in additional buying at current prices.\n\nZcash's $25.6 billion market cap sits near an all-time high, and a Grayscale ETF approval could open mainstream brokerage demand.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Grayscale Zcash Trust didn't make the cut. Enter your email to see the names that beat ZCSH. The report is free. Enter your email and see if any of your stocks made the cut.\n\nZcash (CRYPTO:ZEC) has grown impressively, rising about 72% in just a month and more than tripling since July 1, 2026. This surge was fueled further when Paradigm, a major player in crypto funding, announced on September 16 that it owns ZEC. Given that these events occurred in such close succession, it's easy to speculate whether Paradigm's announcement sparked the rally and if it's too late to buy Zcash now.\n\nHowever, the rally began before Paradigm made its announcement, which affects whether early or late investors have an advantage. As of September 22, Zcash is trading at $1,520, only 4% below its recent peak of $1,585 reached on September 18. So, the question remains: Is it too late to buy Zcash, and what could trigger the next wave of growth?\n\nZcash closed at $417 on July 1 and soared to $1,337 by September 16\u2014the day Paradigm co-founder Matt Huang shared on X that his firm holds ZEC. This represents a remarkable 221% gain before Paradigm's news.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago"}, {"title": "Our top 10 things to watch in the stock market Wednesday", "full_content": "Microsoft lands an analyst upgrade, and Meta Connect is here.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 06:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "U.S. 30-year mortgage rate hits 7.12%, highest since May 2024", "full_content": "Skip to navigation Skip to main content Skip to right column U.S. 30-year mortgage rate hits 7.12%, highest since May 2024 Cris Tolomia Wed, September 23, 2026 at 6:07 AM PDT 2 min read The average rate on a 30-year fixed-rate mortgage climbed to 7.12% in the week ended September 18, the highest level since May 2024, according to the Mortgage Bankers Association. The week-over-week move represented a rise of 15 basis points from 6.97%.\n\nThe rate increase weighed on loan demand. Overall, the MBA's seasonally adjusted index showed application volume down 1.5% compared with the week prior. Refinance applications slid 3% over the week and stood 62% below year-ago levels \u2014 marking the slowest refinancing pace since February 2025. Purchase applications slipped 1% from the previous week and came in 11% under the pace recorded a year earlier.\n\nWith fixed rates elevated, more borrowers shifted toward adjustable-rate mortgages. The ARM share of applications rose to 9.8% from 8.4% the prior week. \"With fixed rates much higher, more borrowers opted for ARMs, with the ARM share reaching 9.8%, as rates for 5/1 ARMs were more than a percentage point lower than those for fixed rate loans,\" Mike Fratantoni, MBA's senior vice president and chief economist, said in a statement. The average rate on 5/1 ARMs fell to 6.10% from 6.23%.\n\nThe Federal Reserve last week raised its benchmark interest rate by a quarter of a percentage point to the 3.75%\u20134.00% range, according to Reuters . Nearly all Fed policymakers projected at least one additional rate increase before year-end. Because mortgage rates move in tandem with U.S. Treasury yields, the upward pressure on oil prices and the inflation fears that followed the joint U.S.-Israeli strikes against Iran in late February have fed directly into borrowing costs.\n\nSince the Iran conflict broke out, mortgage rates have climbed by more than one percentage point in total, according to Reuters.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago"}], "cfa": [{"title": "Trump-Xi meeting: Why China's self-sufficiency changes the calculus", "full_content": "BEIJING \u2014 The trade deficit that escalated tensions between China and the U.S. in recent years has yet to shrink significantly, and the world's second-largest economy faces deep challenges. But China's efforts to build up self-sufficiency have reduced the threat to its domestic market from global trade developments.\n\nU.S. President Donald Trump and Chinese President Xi Jinping are expected to meet this week for their second in-person summit of the year. U.S. concerns about artificial intelligence have gained prominence in the days ahead of the meeting.\n\nBut the best that businesses are hoping for is an extension of a trade truce reached last fall. Even then, tariffs have done little to dent America's appetite for Chinese goods.\n\nWhile an escalation in trade tensions last April briefly sent the U.S. trade deficit with China to its lowest level since 2017, surging demand for AI-related parts have helped send it higher again so far this year, according to China Customs data accessed through Wind Information.\n\nAnd even as the U.S. has diversified away from China, it's hard for the world to shake its dependence on the Asian country.\n\nAsia still accounts for more than 60% of U.S. imports, the same as before \"Liberation Day,\" pointed out Jens Eskelund, president of the European Chamber of Commerce in China.\n\nHe estimated between half and three-quarters of container traffic from China to Southeast Asia subsequently heads on to other destinations.\n\nThat's all sped up the pace at which the world relies on China-made goods.", "source": "CNBC Finance", "pub_date_str": "23 Sep 2026, 06:59 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Railways notifies UPS rules for employees covered by NPS: \u20b910,000 minimum pension, 25-year full pension", "full_content": "The Ministry of Railways on Wednesday, September 23, notified the rules for implementing the Unified Pension Scheme (UPS) for its employees covered by the National Pension System (NPS).\n\nThe rules spell out eligibility requirements, employee and government contributions, pension calculation, lump-sum benefits, minimum and maximum pension provisions, Voluntary Retirement Scheme (VRS) rules and the process for switching from the UPS to the NPS.\n\nUnder the notified framework, eligible railway employees will receive a minimum assured pension of \u20b9 10,000 after completing 10 years of qualifying service. Employees who have completed 25 years of service will be eligible for the full assured pension. The rules also allow eligible employees to seek voluntary retirement after completing 20 years of service.\n\nThe central government introduced the UPS under the NPS from April 1, 2025. Different government departments have subsequently been bringing their employees under the scheme, with the railways now notifying its own implementation rules.\n\nThe UPS will be available to railway employees appointed on or after January 1, 2004, who are covered by the NPS.\n\nHowever, the scheme does not cover all categories of railway workers. Casual and daily-wage employees, contract workers and certain employees governed by separate pension regulations will not be eligible to join the UPS.\n\nA railway employee subscribing to the UPS will have to contribute 10% of basic pay plus dearness allowance (DA) every month to their individual UPS account.\n\nThe contribution requirement will continue even when an employee is on probation or is deputed to a Central or state government department.", "source": "LiveMint Money", "pub_date_str": "23 Sep 2026, 06:58 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Five9 President Andy Dignan Sells Shares for $244,510", "full_content": "Skip to navigation Skip to main content Skip to right column Five9 President Andy Dignan Sells Shares for $244,510 John Ballard, The Motley Fool Wed, September 23, 2026 at 6:22 AM PDT 4 min read FIVN Andy Dignan, President of Five9 (NASDAQ:FIVN), sold 6,986 shares at $35.00 per share on Sept. 17, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($35.00); post-transaction value based on Sept. 17, 2026, market close ($34.50).\n\nHow does this transaction relate to the executive's total equity exposure? Following this sale, Andy Dignan retains direct ownership of 237,614 shares, which represents a total position value of approximately $8.8 million based on the Sept. 21, 2026, market close of $37.01.\n\nWhat is the context of the Rule 10b5-1 plan? The trading plan was adopted on Sept. 2, 2025, more than a full year before this execution, ensuring the transaction was scheduled well in advance of current market conditions.\n\nWhat has been the stock's performance relative to the transaction date? At the time of the transaction on Sept. 17, 2026, the company had delivered a 33% one-year total return.\n\nWhat is the insider's current ownership level in the company? The President holds a 0.31% ownership stake in the firm, providing continued alignment with institutional and retail shareholders while facilitating personal portfolio management.\n\nFive9 provides cloud-based contact center software and services that enable enterprises to manage customer interactions across multiple communication channels, including voice, email, chat, and social media.\n\nThe company operates a subscription-based SaaS business model, generating recurring revenue from enterprise customers who license its virtual contact center platform and integrated applications.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:52 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron Wall Street Target Hits $2,000 as Traders Pile In Before Earnings", "full_content": "Skip to navigation Skip to main content Skip to right column Micron Wall Street Target Hits $2,000 as Traders Pile In Before Earnings Omor Ibne Ehsan Wed, September 23, 2026 at 6:20 AM PDT 5 min read MU Quick Read MU has surged 284% year to date, with analyst price targets ranging wildly from a $1,515 consensus to a Street-high $2,000 before earnings.\n\nMicron locked in 16 take-or-pay customer agreements through 2030 carrying $100 billion in minimum revenue floors and $22 billion in prepaid deposits.\n\nIf Micron's September 30 gross margin guide steps below 86%, the mean-reversion bear case wins and the $2,000 target quietly disappears.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Micron Technology didn't make the cut. Enter your email to see the names that beat MU. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMicron ( NASDAQ:MU ) closed at $1,096.16 after a 5% session, capping a week that added 18.17%. Market cap now sits near $1.24 trillion. Fiscal Q4 results are due September 30, 2026, after the close.\n\nThat is the setup you are being asked to underwrite: a memory stock up 284.3% year to date, heading into a report the company itself guided to $50.0 billion in revenue and roughly $31.00 non-GAAP EPS.\n\nThe $2,000 Street-high number circulating around this name came from two firms in late June and a third days later. Since then, two cuts in August and a hold in mid-September have moved the other way. Consensus target sits at $1,515. The stock still trades below its 52-week high of $1,254.81, and the sell side has rarely disagreed this violently about one company.\n\nWhen analyst targets span a multiple rather than a margin, that signals something the average does not: nobody can model mid-cycle earnings for a memory maker inside an artificial intelligence buildout.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Silver Stocks Are Turning High Margins Into Dividends for Shareholders. 1 Precious Metals Stock to Buy Right Now.", "full_content": "Skip to navigation Skip to main content Skip to right column Silver Stocks Are Turning High Margins Into Dividends for Shareholders. 1 Precious Metals Stock to Buy Right Now. Courtney Carlsen, The Motley Fool Wed, September 23, 2026 at 6:20 AM PDT 3 min read WPM SI=F NVDA Gold and silver prices surged into 2026, then pulled back sharply. That said, precious metals remain in focus amid rising fiscal debt and geopolitical tensions, and prices remain elevated.\n\nHigher metals prices can translate into wider margins, and precious metals streaming company Wheaton Precious Metals (NYSE: WPM) is turning that tailwind into something investors can really appreciate: cold, hard cash. After raising its dividend by 18% earlier this year, Wheaton still has plenty of room to reward shareholders.\n\nMissed AI's \"Act 1\"? Act 2 Could Be 15x Bigger. Most investors think they missed the AI boat because they didn't buy Nvidia in 2005. But according to our analysts, we're only at the end of \"Act 1\"\u2014the R&D phase. \"Act 2\" is the global rollout. Continue \u00bb\n\nTraditional miners dig ore out of the ground and sell their gold, silver, or other metals at prevailing spot market prices. Rising prices boost revenue and margins -- that is, if costs don't rise in tandem.\n\nRunning a physical mine involves high operational costs, including heavy-duty equipment, diesel fuel, and labor. Rising diesel and fuel costs have eroded mining operating margins, eating into the windfall cash flows operators would otherwise realize during precious metal rallies.\n\nThis is where Wheaton Precious Metals' business stands out. The company operates a precious metals streaming business model. The company provides funds to mining companies to build or expand operations. In return, it secures long-term agreements that allow it to purchase a fixed percentage of future silver and gold production at low, predetermined contractual cash costs .\n\nThis structure helps shield Wheaton from inflation and boosts cash flow.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq set for lower start as oil prices move higher and Treasury yields rise - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq set for lower start as oil prices move higher and Treasury yields rise MarketWatch Stocks and Bonds Drift as Brent Ends Run of Losses: Markets Wrap Bloomberg.com Wall St set to open lower as oil, bond yields tick up Reuters Stock Market Today: Futures Slip After Nasdaq Closes at Fresh Record; Oil Prices, Treasury Yields Edge Higher Investopedia Stock Futures Slip as Markets Weigh Middle East Diplomacy WSJ", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IonQ Surges 11% as NVIDIA Research Center Deal Follows Error-Decoder Breakthrough; D-Wave Climbs 5%, Rigetti Rises 4%", "full_content": "Skip to navigation Skip to main content Skip to right column IonQ Surges 11% as NVIDIA Research Center Deal Follows Error-Decoder Breakthrough; D-Wave Climbs 5%, Rigetti Rises 4% David Moadel Wed, September 23, 2026 at 6:19 AM PDT 6 min read IONQ NVDA QUBT RGTI QTUM Quick Read IonQ surges 11% on a real-time quantum error decoder breakthrough and securing the first on-premise slot at NVIDIA's quantum research center.\n\nD-Wave and Rigetti climb 5% and 4% on theme-buying alone, with no catalysts of their own, making those sympathy gains vulnerable to quick reversal.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and IonQ didn't make the cut. Enter your email to see the names that beat IONQ. The report is free. Enter your email and see if any of your stocks made the cut.\n\nShares of IonQ ( NYSE:IONQ ) are rallying in Wednesday morning trading on two company announcements landing back to back: an error-decoder breakthrough disclosed after Tuesday's close, and a premarket disclosure that IonQ's Superion 256 system will be the first on-premise quantum computing deployment at NVIDIA 's ( NASDAQ:NVDA ) Accelerated Quantum Research Center. This move looks company-specific rather than a re-rating of the whole quantum theme.\n\nThe Defiance Quantum ETF ( NASDAQ:QTUM ) is down 0.3% in Wednesday morning trading. By comparison, the SPDR S&P 500 ETF Trust ( NYSEARCA:SPY ) is down 0.1%, so the wider tape is essentially unchanged while IonQ pulls away from the pack.\n\nIonQ stock is at $45.29, up 11% in Wednesday morning trading, and the size of the move against a slightly lower sector fund signals the bid is squarely on this name. Meanwhile, D-Wave Quantum ( NASDAQ:QBTS ) stock is at $18.38, up 5%, riding read-across without an announcement of its own.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Budget 2027-28 process begins October 12 with month-long pre-budget meetings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Budget 2027-28 process begins October 12 with month-long pre-budget meetings The Economic Times daily newspaper is available online now. Read Today's Paper Budget 2027-28 process begins October 12 with month-long pre-budget meetings SECTIONS Budget 2027-28 process begins October 12 with month-long pre-budget meetings PTI Last Updated: Sep 23, 2026, 06:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Pre-budget meetings for the Union Budget 2027-28 will commence on October 12 and continue until November 13. These discussions aim to finalize the Revised Estimate for 2026-27 and the Budget Estimate for 2027-28. Ministries are required to submit necessary details by October 6 to facilitate these meetings. The Budget is expected to address economic growth, job creation, and domestic demand.\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IREN Has Microsoft and $14 Billion of Funding. Execution Is the Real Test", "full_content": "Skip to navigation Skip to main content Skip to right column IREN Has Microsoft and $14 Billion of Funding. Execution Is the Real Test Habib Ur Rehman Wed, September 23, 2026 at 6:14 AM PDT 3 min read IREN MSFT BTC-USD IREN's AI pivot has reached the point where the balance sheet looks almost as dramatic as the growth plan. The Bitcoin miner-turned-AI cloud operator ended June with about $7.6 billion of cash, including $1.7 billion that was restricted, while management says says existing cash, committed GPU financing and customer prepayments provide roughly $14 billion of funding capacity. The first major proof point is already live: Microsoft Corporation (NASDAQ: MSFT ) accepted the first Horizon deployment in August under a broader multiyear arrangement, while IREN Limited (NASDAQ: IREN ) is redirecting sites, capital and staff toward AI cloud infrastructure. The question is whether that cash pile represents protection or simply the opening balance for an even larger spending cycle.\n\nIREN Limited (NASDAQ:IREN) says its 2026 capacity is largely sold and that recent customer prepayments can fund roughly half of GPU capital expenditure on new contracts. Management is targeting cumulative delivery of about 300 megawatts of IT load in 2026 and 800 megawatts in 2027, with fiscal 2027 capital spending estimated at $25 billion to $30 billion. The Microsoft relationship supports the bull case because a large customer can improve financing terms and utilization visibility. It does not eliminate schedule risk, equipment lead times or the possibility that project costs rise faster than contracted economics.\n\nHedge funds moved aggressively into IREN before the latest delivery milestone. Insider Monkey's database showed 69 holders in Q2 2026, up from 53 in Q1. Value Aligned Research Advisors increased its position 78% to about 8.47 million shares. Short interest was 93.61 million shares as of August 31, around 25.01% of float with 2.06 days to cover.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:44 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is UroGen\u2019s (URGN) Commercial Engine Strong Enough To Fund Its Pipeline Ambitions?", "full_content": "Skip to navigation Skip to main content Skip to right column Is UroGen\u2019s (URGN) Commercial Engine Strong Enough To Fund Its Pipeline Ambitions? Maham Fatima Wed, September 23, 2026 at 6:13 AM PDT 5 min read URGN UroGen Pharma (NASDAQ: URGN ) operates as a specialized oncology and urology therapeutics company anchored by proprietary sustained-release technology platforms. By developing localized drug delivery systems designed to retain therapeutics in targeted tissue sites for extended periods, the company addresses the significant clinical limitations of systemic toxicity and rapid clearance common in traditional cancer treatments. Its underlying business model relies on high-margin product adoption, long-term intellectual property protection, and recurring clinical validation that insulates its commercial portfolio against generic competition and supports durable portfolio compounding across specialized care channels.\n\nOn August 20, UroGen Pharma announced an Option and Research License Agreement with IntraGel Therapeutics, paired with an investment of up to $7 million in IntraGel's equity. The deal gives UroGen a research license and options to develop as many as three oncology products built on IntraGel's SRGel platform, along with a separate option to eventually acquire TumoCure, an experimental head and neck cancer therapy still working through clinical development. It is a bet on technology UroGen does not yet own outright, layered onto a business that already has one approved product and a pipeline racing toward its next milestones.\n\nUroGen's existing business gave it something to build on heading into this deal. On August 5, 2026, the company reported that ZUSDURI generated $50.4 million in revenue for the second quarter of 2026, up 73% from the first quarter.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "AMD Is Up 293% in a Year and Still Climbing. This is Where It\u2019ll Trade in 2027", "full_content": "Skip to navigation Skip to main content Skip to right column AMD Is Up 293% in a Year and Still Climbing. This is Where It\u2019ll Trade in 2027 Vandita Jadeja Wed, September 23, 2026 at 6:11 AM PDT 5 min read AMD META Quick Read AMD crossed $1 trillion in market cap, up 291% in a year, with Lisa Su pledging to significantly exceed a $20 annual EPS target.\n\nFY2027 EPS estimates climbed nearly 20% in just 90 days, with 33 upward analyst revisions signaling Wall Street is still playing catch-up.\n\nA path to $900 runs through gigawatt-scale MI450 GPU deals with Anthropic, Meta, and OpenAI, plus gross margins expanding from 43% to 56%.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AMD didn't make the cut. Enter your email to see the names that beat AMD. The report is free. Enter your email and see if any of your stocks made the cut.\n\nThe AI chip race has a new heavyweight, and AMD ( NASDAQ: AMD ) is no longer playing catch-up. Shares are up 291.07% over the past year and 187.4% year-to-date, with the stock crossing the $1 trillion market cap milestone this week.\n\nChair and CEO Lisa Su told investors the company will \"significantly exceed its $20 annual EPS target within its strategic timeframe,\" a stunning upgrade tied to gigawatt-scale Instinct deployments with Anthropic, Meta, and OpenAI.\n\nWith momentum this strong, the question is how high shares can climb. Here is the path for AMD to hit $900 per share in 2027.\n\nThe analyst consensus one-year target sits at $616.51, essentially in line with today's $615.50 share price. That reflects a lag more than skepticism: 80% of covering analysts rate AMD a Buy or Strong Buy, with zero sells.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron vs. Sandisk: Which AI Memory Stock Has More Room to Run?", "full_content": "Skip to navigation Skip to main content Skip to right column Micron vs. Sandisk: Which AI Memory Stock Has More Room to Run? Harsh Chauhan, The Motley Fool Wed, September 23, 2026 at 6:11 AM PDT 3 min read MU NVDA SNDK Micron Technology (NASDAQ: MU) and Sandisk (NASDAQ: SNDK) have been multibagger investments over the past year, making investors significantly richer owing to the incredible demand for memory in artificial intelligence (AI) data centers.\n\nWhile Micron stock has surged by an incredible 541% over the past year, Sandisk has clocked phenomenal gains of 1,600%. The good news for investors is that Wall Street expects both stocks to jump higher. Let's take a closer look at their prospects and check which one of these two stocks is likely to deliver bigger gains.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nMicron's 12-month median price target of $1,600 points to a 53% jump from current levels, according to 57 analysts covering the stock. Sandisk stock, on the other hand, is projected to jump by 24% over the coming year, based on its median price target of $2,200 as per 32 analysts covering it.\n\nIt is easy to see why analysts are forecasting a bigger jump in Micron stock. The company sells both dynamic random-access memory (DRAM) and NAND flash memory, while Sandisk is a pure-play NAND flash manufacturer. What's more, Micron enjoys a bigger market share of 15% in NAND flash compared to Sandisk's share of 11%, according to Counterpoint Research.\n\nAdditionally, Micron has been gaining share in the fast-growing DRAM market. Its share of this space increased to 24% in Q2 this year, up from 22% in Q1.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil holds near two-week lows while diesel cracks hit record", "full_content": "Skip to navigation Skip to main content Skip to right column Oil holds near two-week lows while diesel cracks hit record By Anushree Mukherjee Wed, September 23, 2026 at 6:10 AM PDT 3 min read CL=F By Anushree Mukherjee\n\nLONDON, Sept 23 (Reuters) - Oil prices held near their lowest in more than two weeks on Wednesday as improving Gulf crude supplies weighed on the market, though diesel refining margins hit a record \u200chigh on potential restrictions to US diesel exports.\n\nBrent crude futures rose $1.33, or 1.34%, to $100.58 a barrel by 1303 \u200cGMT while West Texas Intermediate futures gained 65 cents, or 0.72%, to $91.17.\n\nThe Brent benchmark hit its lowest since September 8 in the previous session at $97.36. \u200bWTI touched its lowest since September 1 earlier on Wednesday.\n\nMeanwhile, European low-sulphur gasoil's premium to Brent crude futures hit a record of about $95 a barrel after U.S. President Donald Trump said he backed the idea of a diesel export ban to lower prices that have hit record highs owing to a global supply shortage.\n\nEurope has been highly dependent on diesel and jet fuel imports from the \u200cUnited States since the US-Israeli war on Iran \u2060has disrupted Middle East supplies.\n\n\"Brent is being underpinned by surging gasoil prices amid renewed worries the US may introduce a diesel export ban,\" said Ole Hansen, head of commodity strategy at Saxo \u2060Bank.\n\nAnalysts and market watchers, however, have warned that such a measure would do little to ease high energy prices and could worsen supply and economic disruptions around the globe.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "One of These S&P 500 Funds Has Trailed for 10 Years. Its Fans Say That\u2019s the Point.", "full_content": "Skip to navigation Skip to main content Skip to right column One of These S&P 500 Funds Has Trailed for 10 Years. Its Fans Say That\u2019s the Point. Trey Thoelcke Wed, September 23, 2026 at 6:10 AM PDT 4 min read AAPL RSP Quick Read SPYM's cap-weighted structure delivered +323% over 10 years versus RSP's +203%, as mega-cap tech giants automatically captured more capital with every gain.\n\nApple alone holds 6.59% of SPYM's $154 billion in assets, making it a concentrated mega-cap bet disguised as broad market diversification.\n\nRSP weights all 500 stocks equally and tilts toward industrials and financials, only outperforming SPYM when mega-cap tech leadership durably fades.\n\nTwo retirees, same $1 million, same 4% rule, buy one finished with $1.4 million, the other hit $0 in 12 years. Our free reader guide explains the flaw that separated them, and the income-first method built to avoid it.\n\nTwo funds hold nearly identical rosters of large American companies drawn from the same S&P benchmark. The only meaningful difference between SPDR Portfolio S&P 500 ETF ( NYSEARCA:SPYM ) and Invesco S&P 500 Equal Weight ETF ( NYSEARCA:RSP ) is how much of each name they own. That single choice has produced a decade of divergent returns, and the very reason SPYM won is why its owners should look closely at what they hold.\n\nSPYM last traded at $91.12, and RSP at $212.70, both delayed intraday marks pulled on Wednesday morning. Both funds have a full decade of price history on record, so every window below is a clean, like-for-like comparison.\n\nSPYM leads across every window, and the separation widens over longer horizons. The one-month column shows the gap still opening in real time.\n\nSPYM weights each S&P 500 constituent by market capitalization, so the biggest companies drive the bulk of returns. The N-PORT filing dated June 30, 2026, shows Apple alone at 6.59% of net assets, worth roughly $10.1 billion inside a fund carrying $153.9 billion in total net assets.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Morgan Stanley Just Put a $54 Target on This AI-Pivoting Bitcoin Miner. Amazon Is Already a Customer", "full_content": "Skip to navigation Skip to main content Skip to right column Morgan Stanley Just Put a $54 Target on This AI-Pivoting Bitcoin Miner. Amazon Is Already a Customer Habib Ur Rehman Wed, September 23, 2026 at 6:09 AM PDT 3 min read CIFR AMZN BTC-USD Cipher Digital's transformation from Bitcoin miner to AI-infrastructure landlord is becoming easier to value because the company now has a real hyperscaler customer. Morgan Stanley raised its price target on September 18 to $54 from $43.50 while keeping an Overweight rating. A major asset supporting Cipher's AI-infrastructure thesis is a 15-year, roughly $5.5 billion lease at Cipher's Black Pearl site with Amazon.com, Inc. (NASDAQ: AMZN ). For Cipher Digital Inc. (NASDAQ: CIFR ), the trade is no longer simply that old mining sites might someday host AI. It is whether long-term cloud contracts can justify the capital required to turn power into data-center capacity.\n\nCipher Digital Inc. (NASDAQ:CIFR) agreed to provide about 300 megawatts at Black Pearl to Amazon Web Services under a 15-year arrangement. Cipher began delivering capacity in August 2026, two months ahead of schedule, and said rent had commenced. Cipher also has a separate Barber Lake transaction backed by Google, which adds another hyperscaler validation point. The bull case is that powered sites with interconnection rights have become scarce enough that Cipher can monetize land and electricity at infrastructure-like contract values rather than crypto-cycle multiples.\n\nThe bear case is financing and execution. A long lease only becomes valuable after the data center is built, commissioned and delivered on schedule. Construction overruns, equipment lead times or a higher cost of capital can eat into returns before rent starts. Cipher's legacy mining exposure also means investors are underwriting a business-model transition while new projects consume cash.\n\nAmazon.com, Inc.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:39 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zcash Surges 72% in a Month After Paradigm Reveals ZEC Holdings. Is It Too Late to Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column Zcash Surges 72% in a Month After Paradigm Reveals ZEC Holdings. Is It Too Late to Buy? Sam Daodu Wed, September 23, 2026 at 6:09 AM PDT 6 min read ZCASH-USD Quick Read Zcash tripled since July 1 and gained 221% before Paradigm's September 16 ZEC disclosure, meaning 83% of the rally predated that news.\n\nCypherpunk Technologies is targeting a 5% ZEC stake, implying roughly $840 million in additional buying at current prices.\n\nZcash's $25.6 billion market cap sits near an all-time high, and a Grayscale ETF approval could open mainstream brokerage demand.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Grayscale Zcash Trust didn't make the cut. Enter your email to see the names that beat ZCSH. The report is free. Enter your email and see if any of your stocks made the cut.\n\nZcash (CRYPTO:ZEC) has grown impressively, rising about 72% in just a month and more than tripling since July 1, 2026. This surge was fueled further when Paradigm, a major player in crypto funding, announced on September 16 that it owns ZEC. Given that these events occurred in such close succession, it's easy to speculate whether Paradigm's announcement sparked the rally and if it's too late to buy Zcash now.\n\nHowever, the rally began before Paradigm made its announcement, which affects whether early or late investors have an advantage. As of September 22, Zcash is trading at $1,520, only 4% below its recent peak of $1,585 reached on September 18. So, the question remains: Is it too late to buy Zcash, and what could trigger the next wave of growth?\n\nZcash closed at $417 on July 1 and soared to $1,337 by September 16\u2014the day Paradigm co-founder Matt Huang shared on X that his firm holds ZEC. This represents a remarkable 221% gain before Paradigm's news.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Our top 10 things to watch in the stock market Wednesday", "full_content": "Microsoft lands an analyst upgrade, and Meta Connect is here.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 06:38 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. 30-year mortgage rate hits 7.12%, highest since May 2024", "full_content": "Skip to navigation Skip to main content Skip to right column U.S. 30-year mortgage rate hits 7.12%, highest since May 2024 Cris Tolomia Wed, September 23, 2026 at 6:07 AM PDT 2 min read The average rate on a 30-year fixed-rate mortgage climbed to 7.12% in the week ended September 18, the highest level since May 2024, according to the Mortgage Bankers Association. The week-over-week move represented a rise of 15 basis points from 6.97%.\n\nThe rate increase weighed on loan demand. Overall, the MBA's seasonally adjusted index showed application volume down 1.5% compared with the week prior. Refinance applications slid 3% over the week and stood 62% below year-ago levels \u2014 marking the slowest refinancing pace since February 2025. Purchase applications slipped 1% from the previous week and came in 11% under the pace recorded a year earlier.\n\nWith fixed rates elevated, more borrowers shifted toward adjustable-rate mortgages. The ARM share of applications rose to 9.8% from 8.4% the prior week. \"With fixed rates much higher, more borrowers opted for ARMs, with the ARM share reaching 9.8%, as rates for 5/1 ARMs were more than a percentage point lower than those for fixed rate loans,\" Mike Fratantoni, MBA's senior vice president and chief economist, said in a statement. The average rate on 5/1 ARMs fell to 6.10% from 6.23%.\n\nThe Federal Reserve last week raised its benchmark interest rate by a quarter of a percentage point to the 3.75%\u20134.00% range, according to Reuters . Nearly all Fed policymakers projected at least one additional rate increase before year-end. Because mortgage rates move in tandem with U.S. Treasury yields, the upward pressure on oil prices and the inflation fears that followed the joint U.S.-Israeli strikes against Iran in late February have fed directly into borrowing costs.\n\nSince the Iran conflict broke out, mortgage rates have climbed by more than one percentage point in total, according to Reuters.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Space investment more than doubled to $23 billion in year to June, report says", "full_content": "Skip to navigation Skip to main content Skip to right column Space investment more than doubled to $23 billion in year to June, report says By Akash Sriram Wed, September 23, 2026 at 6:06 AM PDT 2 min read SPCX By Akash Sriram\n\nSept 23 (Reuters) - Private investment in space companies globally climbed to $23 billion in the year through June, more \u200cthan double the $9.7 billion raised a year earlier, according to \u200ca report by Relm Insurance and British investment firm Seraphim on Wednesday.\n\nSpaceX's June IPO has \u200breshaped the funding landscape for the sector, drawing in new investors as venture firms look for the next space company capable of a similar payoff.\n\nInvestors are funneling capital toward companies that can show operational proof rather \u200cthan early-stage promise, with the \u2060space economy moving from \"hype to commercial reality\", according to the report covering Earth observation (EO), in-orbit manufacturing and satellite \u2060supply chains.\n\n\"EO is already an established category \u2014 the tech is well established, if still improving,\" said Andrew Bonwick, Relm's VP of Product Development.\n\n\"The real value \u200bis \u200bin the analytics. Customers buying these \u200bservices don't think of them \u200cas space services \u2014 they're sold on what they actually want: where are my ships, when should I plant my crops, is that refinery switched on, where's at risk of wildfire.\"\n\nCapital grew more selective toward Earth observation companies with visible revenue and experienced leadership, the report said.\n\nIn-orbit manufacturing \u200cis still in its early days, held \u200bback by limited ways to launch and \u200bbring products back to Earth, \u200bwith some companies merging while others struggle to grow \u200cbeyond small pilot projects.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:36 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Sunrun\u2019s (RUN) Virtual Power Plant Strategy Changes Everything For Its Valuation", "full_content": "Skip to navigation Skip to main content Skip to right column Why Sunrun\u2019s (RUN) Virtual Power Plant Strategy Changes Everything For Its Valuation Maham Fatima Wed, September 23, 2026 at 6:05 AM PDT 5 min read RUN TSLA Sunrun (NASDAQ: RUN ) anchors the residential solar and distributed energy storage landscape through a vertically integrated asset-ownership and service model. By transforming rooftops into localized generation sites, the company addresses the structural shift toward decentralized power and grid resilience. Its core operational drivers rely on recurring customer contracts, long-term asset monetization, and high-margin hardware attachment rates that insulate its portfolio against volatile utility pricing and provide durable cash compounding over multi-decade residential agreements.\n\nOn September 21, Sunrun and Tesla (NASDAQ: TSLA ) announced that their combined fleets of home batteries pushed 580 megawatts onto California's grid during a heat wave on September 9. That is enough power to cover every household in Sacramento County during peak hours, and it came not from a power plant but from more than 140,000 batteries sitting in garages and closets across the state. For a company whose growth numbers have looked shakier lately, the event raises a real question: is Sunrun's fleet now valuable enough to matter to the grid itself?\n\nThe mechanics behind that dispatch matter as much as the number itself. Sunrun and Tesla coordinated 517 megawatts from Tesla Powerwalls and another 63 megawatts from additional battery brands, activated through two state programs, the California Energy Commission's Demand Side Grid Support program and the California Public Utilities Commission's Emergency Load Reduction Program. The California Independent System Operator triggered the dispatch once day-ahead wholesale prices topped $200 per megawatt-hour.", "source": "Yahoo Finance", "pub_date_str": "23 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}], "updated_at": "23 Sep 2026, 07:05 PM IST", "total_stories": 403};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
