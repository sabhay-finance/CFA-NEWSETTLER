UR 4B backlog", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 09:19 PM IST", "pub_date_relative": "16m ago"}, {"title": "Jensen Huang's exit from Nvidia raises critical questions about the future of AI", "full_content": "Michael Dell described Jensen Huang as a \"visionary of the AI age.\" Deutsche Telekom CEO Tim H\u00f6ttges said a photo with the Nvidia CEO produced more media coverage for his company than its iPhone launch. During the keynote of his annual Dreamforce conference, Salesforce's Marc Benioff said, \"Jensen, we're all following you, bro,\" as the two paced through the audience.\n\nHis fame extended way beyond tech. In May, Jensen Huang joined President Donald Trump on Air Force One for a trip to China to meet with President Xi Jinping . Three months later, Jensen Huang gathered six of the biggest names at the Nasdaq to announce on CNBC a proposed $500 billion artificial intelligence buildout plan, cementing his central role at the intersection of Wall Street and Silicon Valley.\n\nAs Nvidia became the first company to rip past a $5 trillion market cap, bending the laws of physics with its advanced graphics processing units and pushing the AI boom to seemingly endless bounds, the now 63-year-old Jensen Huang, clad in a black leather jacket, traversed the globe as the face of the brand powering the next industrial revolution.\n\nOver the past week it all came crashing down. Following two reported extramarital affairs \u2014 one with an alleged Chinese spy and another with an employee \u2014 Jensen Huang is leaving the company he co-founded 33 years ago in crisis, and thrusting the AI market into chaos. The board is now left to pick a successor for a company that's been run by a singular figure with no second-in-command. Chief Financial Officer Colette Kress has been named interim CEO. Harvey Jones has been appointed chairman.\n\n\"How companies handle a crisis determines their future,\" former Cisco CEO John Chambers, now a startup investor, told CNBC's \" Fast Money \" on Wednesday.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 09:16 PM IST", "pub_date_relative": "19m ago"}, {"title": "China Link Confirmed? Alice Huang's Firms Promised DeepSeek Nvidia Chips, Says Report", "full_content": "Companies linked to Alice Huang reportedly invested in DeepSeek's second funding round and pledged to supply Nvidia's restricted Blackwell chips, raising fresh questions over technology transfers to China.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 09:15 PM IST", "pub_date_relative": "20m ago"}, {"title": "What really happens during Medicare counseling", "full_content": "Open enrollment can bring unexpected challenges for seniors.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 09:10 PM IST", "pub_date_relative": "26m ago"}, {"title": "Anthropic IPO: Who is Krishna Rao? Meet the CFO whose $1.30 stock options could unlock a \u20b97,000 crore fortune", "full_content": "Anthropic is preparing an IPO that could value the company at up to $1.4 trillion. CFO Krishna Rao\u2019s 9.497 million shares, acquired through options with a $1.30 exercise price, could gain about 5,600% at the proposed $74 share price. The company plans to list on Nasdaq as ANT.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 09:09 PM IST", "pub_date_relative": "26m ago"}, {"title": "Disney's 'Star Wars' is coming to Cosm domes ahead of 50th anniversary as part of multiyear film deal", "full_content": "On Thursday, the immersive entertainment technology company announced a new studio partnership with The Walt Disney Company that will bring the original \"Star Wars\" to its domes early next year as part of a multiyear, multifilm collaboration.\n\nCosm's massive concave screens will drop film fans into a galaxy far, far away starting in March, just ahead of the Academy Award-winning film's 50th anniversary in May.\n\n\"We are thrilled to add the Disney partnership,\" Alexis Scalice, head of Cosm Studios, told CNBC. \"We do look for those opportunities of these like anniversary and commemorative moments. We look for those opportunities to celebrate with the fans, but also find this mutually beneficial partnership between both parties.\"\n\nThis will be Cosm's sixth theatrical collaboration with Hollywood, having already partnered with Warner Bros. to bring \"The Matrix,\" \"Willy Wonka & the Chocolate Factory,\" \"Harry Potter and the Sorcerer's Stone\" and \"It\" to its locations. The company is set to launch immersive screenings of Universal's \"Shrek\" in December.\n\nEach Cosm dome has stadium-style seating, with booths and tables set on each level. The dome's width fills much of the viewers' periphery, giving the sensation that they are part of the onscreen environment.\n\nIn this case, \"Star Wars\" will be displayed in a large rectangle in the center of the dome while the background is transformed into the iconic planets of Tatooine and Yavin IV that are featured in the film as well as the infamous Death Star. Audiences will also see elements that will make it appear like they're traveling at lightspeed and getting trapped in an intergalactic trash compactor.\n\nCosm is working directly with studios Lucasfilm and Industrial Light and Magic as well as creative studio MakeMake to create the visuals and the sound mixing for the unique presentation of the film.\n\n\"We look for those moments where sound, music ... listening to Darth Vader's breath for the first time ...", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 09:06 PM IST", "pub_date_relative": "30m ago"}, {"title": "\u2018The thought of living to 100 terrifies me\u2019: Is Social Security a giant Ponzi scheme?", "full_content": "There is already a demographic \u2018run\u2019 on Social Security.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 09:00 PM IST", "pub_date_relative": "36m ago"}, {"title": "Nebius falls 16% as company expects increased 2026 capex spend, issues weak outlook", "full_content": "Nebius shares sank 16% on Thursday as one of the biggest publicly traded neoclouds reported third-quarter revenue that beat analysts' estimates, but issued disappointing guidance.\n\nIt was not immediately clear if the loss per share was comparable to the 69 cents expected by analysts.\n\nRevenue jumped 571% in the quarter, according to a statement. The company reported a net loss of $37.5 million, a loss of 13 cents per share, compared with $119.6 million, a loss of 50 cents per share, a year earlier.\n\nThe stock move also comes amid the resignation of Nvidia CEO Jensen Huang , after stinging revelations about multiple extramarital affairs, including one with an alleged Chinese spy.\n\nNvidia, which has developed the neocloud market by investing in the companies and backstopping some of their projects, held about $329 million in Nebius shares at the end of June, according to a filing .\n\nIn a letter to shareholders , CEO Arkady Volozh said the company expects fiscal year 2026 revenue at the low end of the company's $3 billion to $3.4 billion range. FactSet expected full-year revenue of $3.35 billion.\n\nNebius also shared an initial outlook for 2027, expecting revenue of $12 billion to $13 billion, \"reflecting a conservative approach to the pace of our build-out.\" FactSet expected 2027 revenue of $12.09 billion.\n\nThe company expects FY2026 capital expenditures of $27 billion, higher than its previous capex guidance of $20 billion to $25 billion and the FactSet expectation of $23.85 billion.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:57 PM IST", "pub_date_relative": "38m ago"}, {"title": "Who is Colette Kress? Nvidia's finance chief steps in as interim CEO after Huang exit", "full_content": "Nvidia CFO Colette Kress, a 13-year company veteran, is taking the helm of the world's most valuable chipmaker on an interim basis after Jensen Huang's sudden resignation.\n\n\"She's the only one internally that has this significant respect,\" Dan Ives, an analyst at Yorkville Ives & Co., told CNBC before the news had been made official. \"She's more than just a CFO. I'd almost view her as more of a COO.\"\n\nNvidia hasn't announced a succession plan and said the board is considering internal and external candidates.\n\nKress joined Nvidia in September 2013, after holding finance roles at Cisco , Microsoft and Texas Instruments . At Nvidia, Kress has been the other big voice on earnings calls, reporting the company's results and taking questions alongside Huang.\n\n\"NVIDIA's strength has always come from its people, and together with our leadership team, I am committed to building on the extraordinary foundation Jensen created over the last 33 years,\" Kress said in Thursday's statement . \"We will continue advancing the work that has made NVIDIA a leader in accelerated computing and AI, and execute on the opportunities ahead. Our focus remains on serving our customers, partners, developers and shareholders.\"\n\nHuang, who co-founded Nvidia in 1993, was known for running the company with no clear second-in-command, personally deciding which projects are a priority and emailing engineers about details.\n\nBut when it came to Kress, \"Jensen didn't do anything without her,\" Ives said. \"She's a Swiss Army knife for Nvidia. Anything strategically: customers, partners, technology. She was involved.\"\n\nCNBC spoke to nearly a dozen Nvidia insiders and former Kress co-workers. They described her as savvy, knowledgeable, thoughtful and clear-headed.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:56 PM IST", "pub_date_relative": "40m ago"}, {"title": "\u2018He calls my plans a fantasy\u2019: My husband says we can\u2019t afford our $200,000-a-year dream retirement. I think he\u2019s cheap.", "full_content": "\u201cWe have $2 million saved in our retirement accounts and a house worth $1.3 million.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 08:56 PM IST", "pub_date_relative": "40m ago"}, {"title": "\u2018It had to happen\u2019 \u2014 Jim Cramer on Jensen Huang\u2019s resignation and future for Nvidia stock", "full_content": "\"There's way too much evidence,\" Jim said Thursday, moments after the news broke.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 08:55 PM IST", "pub_date_relative": "40m ago"}, {"title": "SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows The Economic Times daily newspaper is available online now. Read Today's Paper SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows SECTIONS SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows By PTI Last Updated: Nov 12, 2026, 08:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis State Bank of India has revised its estimate for the upcoming Reserve Bank of India rate hike. The new projection suggests a 0.25 percent increase instead of a previously expected 0.50 percent. This adjustment follows improvements in external conditions and a revival in foreign fund inflows. Analysts note that inflation is projected to remain above 6 percent in November before easing.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Nov 2026, 08:54 PM IST", "pub_date_relative": "42m ago"}, {"title": "Here\u2019s what Megaspeed, the company at the forefront of the Nvidia scandal, is now saying", "full_content": "The Singaporean company Megaspeed, which stands at the center of the scandal engulfing Nvidia, on Thursday issued its first public statement since the scandal erupted.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 08:53 PM IST", "pub_date_relative": "43m ago"}, {"title": "\u2018A dark day for Nvidia\u2019: Here\u2019s what analysts have been saying about Jensen Huang\u2019s departure", "full_content": "Nvidia investors are preparing for a future without Jensen Huang after the CEO's resignation was announced on Thursday.\n\nMarkets were on tenterhooks ahead of the decision amid reports that the chip giant's board had convened to discuss his future with the company. By the time of the announcement, at least six analysts had downgraded the stock between Wednesday night and Thursday morning.\n\nThe New York Times on Wednesday reported that Huang had engaged in a second extramarital affair with an employee. The CEO was already under scrutiny after Huang admitted to having a romantic relationship with a woman U.S. intelligence believes is a Chinese spy.\n\nNvidia announced on Thursday morning that, following a board meeting, Huang would step down after more than 30 years at the company's helm.\n\nThose downgrading the stock included longtime Nvidia bull Ben Reitzes of Melius Research.\n\nNvidia shares were seen down more than 12% shortly after the open on Wall Street, bringing losses for the last month close to 25%.\n\nHere's what analysts and investors are saying about the company and the stock.\n\nReitzes changed his rating for Nvidia to hold from buy. His price target is now $185 \u2014 down from $315 \u2014 is 6% above the level at which shares last closed.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:52 PM IST", "pub_date_relative": "43m ago"}, {"title": "Note: Coinbase CEO Brian Armstrong interview cut short by breaking news", "full_content": "(Editor's note: Armstrong's appearance was abruptly ended because of breaking news.)\n\nCoinbase CEO Brian Armstrong was scheduled on \"Squawk Box\" for his first TV interview since the Binance hack to share his perspective on the crypto market, cybersecurity in light of the breach and the future of agentic finance.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:52 PM IST", "pub_date_relative": "44m ago"}, {"title": "Scene Box Office Collection Day 7: Suriya Starrer Sees Earnings Slow Down, Check Latest Update", "full_content": "Jithu Madhavan's Tamil action-comedy Scene stars Suriya alongside Nazriya Nazim, Naslen, Pooja Hegde and Joju George.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:50 PM IST", "pub_date_relative": "46m ago"}, {"title": "Colette Kress Net Worth: How Nvidia\u2019s Interim CEO Built A $750M Fortune Without Founding A Company", "full_content": "Nvidia interim CEO Colette Kress owns approximately 4.44 million shares in the chipmaker, valued at around $750 million at Wednesday's closing price.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:43 PM IST", "pub_date_relative": "52m ago"}, {"title": "These home buyers bought their first house with help from their employer. \u2018Why not jump at the chance?\u2019", "full_content": "The rise in home-buying help from employers \u201cspeaks volumes about how difficult buying a home has become, even for people with steady jobs.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 08:43 PM IST", "pub_date_relative": "53m ago"}, {"title": "Oil prices mixed after Trump says no Iran deal needed: 'We've got their Strait'", "full_content": "U.S. oil prices were mixed Thursday, as comments from President Donald Trump stoked worries that an end to the U.S.-Iran war was not in sight.\n\nBrent crude traded 1.1% higher at $93.73 per barrel. West Texas Intermediate futures were up just 0.3% at $86.76 per barrel.\n\nBrent and WTI- YTD \"We don't need a deal with Iran. Those days have long since passed. We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump said in a Truth Social post .\n\nThursday's moves come as oil prices have been under pressure after comments from Trump following the U.S. midterm elections eased fears of further strikes on Iran. WTI is down 16% in November, and Brent has lost 20%.\n\nTrump said Sunday that fresh attacks were highly unlikely as talks to end the conflict progressed, despite both \u2060countries reporting that shipping had been hit in or near the Strait of Hormuz. He also said further military action did not appear necessary \"at this point,\" easing concerns about prolonged disruptions to Middle East oil supplies.\n\nJohn Kilduff, a partner at Again Capital, said investors may have been too quick to price in an end to the fighting.\n\n\"The market may have gotten ahead of itself on pricing in a cessation of hostilities,\" Kilduff told CNBC. He warned that renewed doubts about a deal would push the security premium in oil prices higher.\n\nTrump's assertion that the U.S. controls the Strait of Hormuz could spur further Iranian attacks on shipping, increasing the risk of prolonged supply disruptions, according to Kilduff.", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 08:38 PM IST", "pub_date_relative": "57m ago"}, {"title": "Ian Healy Accuses Usman Khawaja Of Faking Injury, Questions His Claims In New Book 'Sabr'", "full_content": "David Warner has also backed Khawaja's claims about the 2018 ball-tampering scandal, adding to the debate surrounding the autobiography.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:38 PM IST", "pub_date_relative": "58m ago"}, {"title": "SoftBank To Sell Meesho Shares Worth Up To Rs 1,175 Crore Via Block Deal", "full_content": "The offer floor price for Meesho's block deal is expected to be set at Rs 246.23 per share with a 3.1% discount.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:37 PM IST", "pub_date_relative": "58m ago"}, {"title": "Nvidia Hit By Seven Downgrades In 24 Hours As Jensen Huang's Exit Rattles Wall Street", "full_content": "Baird, Oppenheimer, Bernstein, Evercore ISI, William Blair, KeyBanc Capital Markets and Melius Research all moved Nvidia off their buy-equivalent ratings.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:36 PM IST", "pub_date_relative": "59m ago"}, {"title": "Nvidia Shares Steady Decline To 7% After Falling Over 14% At Opening Bell", "full_content": "Huang's resignation and the continued downturn of the firm's stock follows the reports of his affiar withAlice Huang.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen and Lori Huang's Nvidia fortune is jointly controlled. How that makes things complicated now that he's resigned", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions straight to your inbox.\n\nJensen Huang's $140 billion stake in Nvidia is largely held by trusts that are co-owned with his wife, Lori, creating added uncertainty for the shares and his financial future following his resignation from the company, according to attorneys and SEC filings.\n\nHuang and his wife jointly own about 800 million Nvidia shares worth roughly $135 billion through a complex web of trusts and LLCs created for tax and estate planning purposes, according to SEC filings. Jensen Huang directly owns about 70 million shares valued at about $12 billion.\n\nWhile owning company stock through a trust is common among tech founders and CEOs, it's less typical for a founder to have equal ownership with a spouse, tax experts say. The arrangement further complicates Huang's sudden exit from the company, but could prove to be a stabilizing force for the shares, since the trusts make it more difficult for either Huang or his wife to quickly sell.\n\n\"Each of Mr. Huang and his wife may be deemed to have shared beneficial ownership of, and to exercise shared voting and investment power over,\" according to an SEC filing.\n\nAccording to the filings, Jensen and Lori Huang own about 530 million shares as co-trustees of the Jen-Hsun and Lori Huang Living Trust, created in 1995. They're also co-trustees of the Huang 2012 Irrevocable Trust, which owns 31.4 million shares, and the Huang Irrevocable Remainder Trust, which owns 109 million shares.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 08:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Home Sales in October Plummet to 16-Year Low - WSJ", "full_content": "Home Sales in October Plummet to 16-Year Low WSJ 'A tough market': Home sales fall to lowest level since 2010 as high mortgage rates paralyze activity Yahoo Finance Home listings pile up in October, but sellers won't slash prices CNBC US home sales slumped in October to slowest pace in more than 16 years as mortgage rates surged AP News Existing-Home Sales Decreased 5.5% in October, According to NAR Report National Association of REALTORS\u00ae", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 08:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI\u2019s Central Bank Is in Crisis. Intel and These Stocks Are Feeling the Pain. - Barron's", "full_content": "AI\u2019s Central Bank Is in Crisis. Intel and These Stocks Are Feeling the Pain. Barron's Analysis: Jensen Huang\u2019s exit tests Nvidia\u2019s role as the \u2018central bank of AI\u2019 CNBC The Bank of Nvidia just lost its banker \u2014 here\u2019s where the AI trade is exposed Yahoo Finance The Comprehensive Guide to the Bank of Nvidia Hunterbrook Huang has to go. That could stop AI\u2019s money-go-round AFR", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 08:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Today: Nasdaq In Deep Red As Nvidia Leads AI Stocks Plunge; Dow Flat", "full_content": "Wall Street opened under pressure as Nvidia shares plunged more than 11% following Jensen Huang's exit, dragging the Nasdaq lower, while the Dow remained largely unchanged.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bain Capital\u2019s Head of Real Estate uses this strategy to counter the economy\u2019s \u2018cocktail of disruption'", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nOver the last few years, macro shocks have rocked the U.S. economy about every six months, from tariffs to the Iran war to the Democratic sweep of the midterm elections. All of that has a direct impact on real estate, according to Ryan Cotton, Bain Capital's head of real estate.\n\nCotton oversees $18 billion of real estate assets under management. In this week's Property Play video podcast , Cotton says that every time the market starts to get back on its feet and find its balance and level, a new shock comes around, and there's another digestion period that has to happen.\n\n\"I think it is disorienting as people try to rebase values, and in the midst of transactions, you're seeing value retrades at the 11th hour, deals getting pulled, and volume slowing down yet again in the market,\" said Cotton. \"It's definitely a confusing and complicated time to be a real estate investor.\"\n\nThe overall market is still working through an oversupply in several sectors, which was brought on by extremely low interest rates at the start of this decade.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq falls as Nvidia declines, but Dow inches higher: Live updates", "full_content": "The Nasdaq Composite fell on Thursday as Nvidia shares slumped on the departure of CEO Jensen Huang .\n\nThe Nasdaq Composite lost 0.1%, while the Dow Jones Industrial Average added 133 points, or 0.3%. The S&P 500 traded up 0.1%.\n\nSelling pressure on Nvidia resumed after the company announced that Huang has resigned and named CFO Colette Kress as interim CEO. This comes after Huang reportedly had an affair with an alleged Chinese spy. Shares were down more than 5% following the announcement. The stock has risen nearly 3% in the previous session.\n\nNvidia shares, 5-day \"Jensen Huang's resignation is the worst case scenario during this entire saga, as he was not just a leader, but a visionary for the company, and while CFO Colette Kress is highly capable and respected, there are still big questions about how the innovation of Nvidia will evolve without Jensen,\" said Michael Landsberg, chief investment officer at Landsberg Bennett Private Wealth Management.\n\n\"We expect continued downside pressure on Nvidia because part of the value proposition of this stock was not just its chips, but Jensen's vision and ability to steer the company,\" he added.\n\nInvestors moved into fellow chipmakers Advanced Micro Devices and Broadcom . AMD shares were up 4%, while Broadcom gained 5%.\n\nHowever, other key stocks in the AI trade were still down alongside Nvidia. Shares of software company Oracle lost 1%, while another chipmaker, Micron Technology , declined 3%. Neocloud Nebius moved 17% lower after the company posted better-than-expected third-quarter revenue but offered underwhelming guidance.\n\nIn addition to some AI-related pressure, oil prices were higher after President Donald Trump said in a Truth Social post , \"We don't need a deal with Iran. Those days have long since passed.\" U.S. West Texas Intermediate futures traded above $86 per barrel, while international benchmark Brent crude futures traded above $93.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 09:35 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia live updates: Trump says Tim Cook should replace Jensen Huang as CEO", "full_content": "Nvidia CEO Jensen Huang is stepping down as CEO of the chipmaker he co-founded 33 years ago and built into a $4 trillion company that powered the artificial intelligence boom, the company announced Thursday.\n\n\"The Board has full confidence in Colette and the leadership team, and we expect the company's operations, customer commitments and product roadmap to continue without interruption,\" said board chair Harvey Jones in a release announcing the news.\n\nThe company will begin the search for a permanent CEO to replace Huang and will consider both internal and external candidates, according to the release.\n\nKress also provided a statement in the release, but Huang was not quoted.\n\nAfter a meteoric rise to fame due to Nvidia's central role in AI, Huang's dramatic fall has been even more rapid, following a series of stinging revelations about his romantic ties to a woman believed by the U.S. intelligence community to be a Chinese spy.\n\nHuang, 63, apologized on Sunday for being \"unfaithful to my wife,\" though he provided no details about the affair with businesswoman Alice Huang, who has worked for a Chinese company and Nvidia customer called Megaspeed. Late Wednesday, The New York Times reported that the Nvidia CEO also had a separate affair, this one with Kimberly Powell, vice president of health care at the chipmaker. Later that afternoon, The Times and other outlets reported that Nvidia's board met to discuss the company's future.\n\nHuang's downfall also puts the spotlight on President Donald Trump , who formed a particularly close relationship with the CEO of what, until recently, was the world's most valuable company. Huang became a key voice on U.S. AI policy while pushing for issues that were in Nvidia's interest, such as preserving access to open-source AI, and lobbying to allow chip exports to China.\n\nCreative Strategies CEO Ben Bajarin called Huang a \"trendsetter\" and said his exit creates \"a huge shakeup and an impact to the industry.\"", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 09:33 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Federal Reserve Board issues enforcement action with former employee of United Community Bank", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 11:00 a.m. EST Share --> --> --> --> --> --> The Federal Reserve Board on Thursday announced the execution of the enforcement action listed below:\n\nConsent prohibition against Katilyn M. Robinson Former employee of United Community Bank, Greenville, South Carolina Misappropriation of customer funds\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "12 Nov 2026, 09:30 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nvidia is spending more than ever on Washington lobbying. It may not stop Congress from limiting China chip sales now.", "full_content": "\u2018There\u2019s no question that Congress is going to push for a complete ban on the sale of advanced semiconductors into China,\u2019 says a former U.S. ambassador to Beijing", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 09:25 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold Price Slumps To Lowest In Over A Year. What's Triggering The Selloff?", "full_content": "Gold slipped below $3,870 as rising Treasury yields and a 19-month high in the US dollar weakened bullion's appeal. Investors now await Friday's US PPI report.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 09:23 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Home sales plummet to lowest level since \u2018Great Recession\u2019 as prices hit all-time high", "full_content": "Home sales fell in October to a 16-year low as buyers bolted from the housing market in the face of 7% mortgage rates.", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 09:22 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Tecogen tops Q3 2026 estimates as shares jump 33%", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 09:21 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "StoneX raises Unity Software stock price target on revenue beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 09:20 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mookuthi Amman 2 Box Office Collection Day 7: Can Nayanthara's Film Sustain Its Theatrical Run? Check Earnings", "full_content": "Sundar C's Mookuthi Amman 2 stars Nayanthara in the lead. The Tamil fantasy comedy-thriller blends mythology, humour and drama, with Nayanthara returning as Mookuthi Amman.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 09:20 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Sagicor Financial tops Q3 2026 EPS view as core earnings rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 09:19 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OHB 9M 2026 presentation: 23% EBITDA growth, EUR 4B backlog", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 09:19 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jensen Huang's exit from Nvidia raises critical questions about the future of AI", "full_content": "Michael Dell described Jensen Huang as a \"visionary of the AI age.\" Deutsche Telekom CEO Tim H\u00f6ttges said a photo with the Nvidia CEO produced more media coverage for his company than its iPhone launch. During the keynote of his annual Dreamforce conference, Salesforce's Marc Benioff said, \"Jensen, we're all following you, bro,\" as the two paced through the audience.\n\nHis fame extended way beyond tech. In May, Jensen Huang joined President Donald Trump on Air Force One for a trip to China to meet with President Xi Jinping . Three months later, Jensen Huang gathered six of the biggest names at the Nasdaq to announce on CNBC a proposed $500 billion artificial intelligence buildout plan, cementing his central role at the intersection of Wall Street and Silicon Valley.\n\nAs Nvidia became the first company to rip past a $5 trillion market cap, bending the laws of physics with its advanced graphics processing units and pushing the AI boom to seemingly endless bounds, the now 63-year-old Jensen Huang, clad in a black leather jacket, traversed the globe as the face of the brand powering the next industrial revolution.\n\nOver the past week it all came crashing down. Following two reported extramarital affairs \u2014 one with an alleged Chinese spy and another with an employee \u2014 Jensen Huang is leaving the company he co-founded 33 years ago in crisis, and thrusting the AI market into chaos. The board is now left to pick a successor for a company that's been run by a singular figure with no second-in-command. Chief Financial Officer Colette Kress has been named interim CEO. Harvey Jones has been appointed chairman.\n\n\"How companies handle a crisis determines their future,\" former Cisco CEO John Chambers, now a startup investor, told CNBC's \" Fast Money \" on Wednesday.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 09:16 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic IPO: Who is Krishna Rao? Meet the CFO whose $1.30 stock options could unlock a \u20b97,000 crore fortune", "full_content": "Anthropic is preparing an IPO that could value the company at up to $1.4 trillion. CFO Krishna Rao\u2019s 9.497 million shares, acquired through options with a $1.30 exercise price, could gain about 5,600% at the proposed $74 share price. The company plans to list on Nasdaq as ANT.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 09:09 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nebius falls 16% as company expects increased 2026 capex spend, issues weak outlook", "full_content": "Nebius shares sank 16% on Thursday as one of the biggest publicly traded neoclouds reported third-quarter revenue that beat analysts' estimates, but issued disappointing guidance.\n\nIt was not immediately clear if the loss per share was comparable to the 69 cents expected by analysts.\n\nRevenue jumped 571% in the quarter, according to a statement. The company reported a net loss of $37.5 million, a loss of 13 cents per share, compared with $119.6 million, a loss of 50 cents per share, a year earlier.\n\nThe stock move also comes amid the resignation of Nvidia CEO Jensen Huang , after stinging revelations about multiple extramarital affairs, including one with an alleged Chinese spy.\n\nNvidia, which has developed the neocloud market by investing in the companies and backstopping some of their projects, held about $329 million in Nebius shares at the end of June, according to a filing .\n\nIn a letter to shareholders , CEO Arkady Volozh said the company expects fiscal year 2026 revenue at the low end of the company's $3 billion to $3.4 billion range. FactSet expected full-year revenue of $3.35 billion.\n\nNebius also shared an initial outlook for 2027, expecting revenue of $12 billion to $13 billion, \"reflecting a conservative approach to the pace of our build-out.\" FactSet expected 2027 revenue of $12.09 billion.\n\nThe company expects FY2026 capital expenditures of $27 billion, higher than its previous capex guidance of $20 billion to $25 billion and the FactSet expectation of $23.85 billion.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:57 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Who is Colette Kress? Nvidia's finance chief steps in as interim CEO after Huang exit", "full_content": "Nvidia CFO Colette Kress, a 13-year company veteran, is taking the helm of the world's most valuable chipmaker on an interim basis after Jensen Huang's sudden resignation.\n\n\"She's the only one internally that has this significant respect,\" Dan Ives, an analyst at Yorkville Ives & Co., told CNBC before the news had been made official. \"She's more than just a CFO. I'd almost view her as more of a COO.\"\n\nNvidia hasn't announced a succession plan and said the board is considering internal and external candidates.\n\nKress joined Nvidia in September 2013, after holding finance roles at Cisco , Microsoft and Texas Instruments . At Nvidia, Kress has been the other big voice on earnings calls, reporting the company's results and taking questions alongside Huang.\n\n\"NVIDIA's strength has always come from its people, and together with our leadership team, I am committed to building on the extraordinary foundation Jensen created over the last 33 years,\" Kress said in Thursday's statement . \"We will continue advancing the work that has made NVIDIA a leader in accelerated computing and AI, and execute on the opportunities ahead. Our focus remains on serving our customers, partners, developers and shareholders.\"\n\nHuang, who co-founded Nvidia in 1993, was known for running the company with no clear second-in-command, personally deciding which projects are a priority and emailing engineers about details.\n\nBut when it came to Kress, \"Jensen didn't do anything without her,\" Ives said. \"She's a Swiss Army knife for Nvidia. Anything strategically: customers, partners, technology. She was involved.\"\n\nCNBC spoke to nearly a dozen Nvidia insiders and former Kress co-workers. They described her as savvy, knowledgeable, thoughtful and clear-headed.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:56 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows The Economic Times daily newspaper is available online now. Read Today's Paper SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows SECTIONS SBI economists halve December RBI rate hike forecast to 25 bps on easing rupee pressure, foreign inflows By PTI Last Updated: Nov 12, 2026, 08:54:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis State Bank of India has revised its estimate for the upcoming Reserve Bank of India rate hike. The new projection suggests a 0.25 percent increase instead of a previously expected 0.50 percent. This adjustment follows improvements in external conditions and a revival in foreign fund inflows. Analysts note that inflation is projected to remain above 6 percent in November before easing.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Nov 2026, 08:54 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Note: Coinbase CEO Brian Armstrong interview cut short by breaking news", "full_content": "(Editor's note: Armstrong's appearance was abruptly ended because of breaking news.)\n\nCoinbase CEO Brian Armstrong was scheduled on \"Squawk Box\" for his first TV interview since the Binance hack to share his perspective on the crypto market, cybersecurity in light of the breach and the future of agentic finance.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 08:52 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Scene Box Office Collection Day 7: Suriya Starrer Sees Earnings Slow Down, Check Latest Update", "full_content": "Jithu Madhavan's Tamil action-comedy Scene stars Suriya alongside Nazriya Nazim, Naslen, Pooja Hegde and Joju George.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:50 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil prices mixed after Trump says no Iran deal needed: 'We've got their Strait'", "full_content": "U.S. oil prices were mixed Thursday, as comments from President Donald Trump stoked worries that an end to the U.S.-Iran war was not in sight.\n\nBrent crude traded 1.1% higher at $93.73 per barrel. West Texas Intermediate futures were up just 0.3% at $86.76 per barrel.\n\nBrent and WTI- YTD \"We don't need a deal with Iran. Those days have long since passed. We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump said in a Truth Social post .\n\nThursday's moves come as oil prices have been under pressure after comments from Trump following the U.S. midterm elections eased fears of further strikes on Iran. WTI is down 16% in November, and Brent has lost 20%.\n\nTrump said Sunday that fresh attacks were highly unlikely as talks to end the conflict progressed, despite both \u2060countries reporting that shipping had been hit in or near the Strait of Hormuz. He also said further military action did not appear necessary \"at this point,\" easing concerns about prolonged disruptions to Middle East oil supplies.\n\nJohn Kilduff, a partner at Again Capital, said investors may have been too quick to price in an end to the fighting.\n\n\"The market may have gotten ahead of itself on pricing in a cessation of hostilities,\" Kilduff told CNBC. He warned that renewed doubts about a deal would push the security premium in oil prices higher.\n\nTrump's assertion that the U.S. controls the Strait of Hormuz could spur further Iranian attacks on shipping, increasing the risk of prolonged supply disruptions, according to Kilduff.", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 08:38 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "AI\u2019s Central Bank Is in Crisis. Intel and These Stocks Are Feeling the Pain. - Barron's", "full_content": "AI\u2019s Central Bank Is in Crisis. Intel and These Stocks Are Feeling the Pain. Barron's Analysis: Jensen Huang\u2019s exit tests Nvidia\u2019s role as the \u2018central bank of AI\u2019 CNBC The Bank of Nvidia just lost its banker \u2014 here\u2019s where the AI trade is exposed Yahoo Finance The Comprehensive Guide to the Bank of Nvidia Hunterbrook Huang has to go. That could stop AI\u2019s money-go-round AFR", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 08:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stock Market Today: Nasdaq In Deep Red As Nvidia Leads AI Stocks Plunge; Dow Flat", "full_content": "Wall Street opened under pressure as Nvidia shares plunged more than 11% following Jensen Huang's exit, dragging the Nasdaq lower, while the Dow remained largely unchanged.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bain Capital\u2019s Head of Real Estate uses this strategy to counter the economy\u2019s \u2018cocktail of disruption'", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nOver the last few years, macro shocks have rocked the U.S. economy about every six months, from tariffs to the Iran war to the Democratic sweep of the midterm elections. All of that has a direct impact on real estate, according to Ryan Cotton, Bain Capital's head of real estate.\n\nCotton oversees $18 billion of real estate assets under management. In this week's Property Play video podcast , Cotton says that every time the market starts to get back on its feet and find its balance and level, a new shock comes around, and there's another digestion period that has to happen.\n\n\"I think it is disorienting as people try to rebase values, and in the midst of transactions, you're seeing value retrades at the 11th hour, deals getting pulled, and volume slowing down yet again in the market,\" said Cotton. \"It's definitely a confusing and complicated time to be a real estate investor.\"\n\nThe overall market is still working through an oversupply in several sectors, which was brought on by extremely low interest rates at the start of this decade.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US stocks: S&P 500, Nasdaq fall as Nvidia CEO exit rattles AI stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: S&P 500, Nasdaq fall as Nvidia CEO exit rattles AI stocks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: S&P 500, Nasdaq fall as Nvidia CEO exit rattles AI stocks SECTIONS US stocks: S&P 500, Nasdaq fall as Nvidia CEO exit rattles AI stocks ETMarkets.com Last Updated: Nov 12, 2026, 09:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nvidia's stock took a hit after CEO Jensen Huang stepped down, amid swirling personal controversies. This turmoil added noticeable pressure to the AI sector, dragging down the value of related stocks. Additionally, surging oil prices are exacerbating inflation worries across the market. Investors are keenly awaiting the Producer Price Index data for insights on inflation trends, even as some sectors continue to show resilience amidst the declines.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AMD Stock Gets Upgrade. What It Says About the Future of the AI Trade. - Barron's", "full_content": "AMD Stock Gets Upgrade. What It Says About the Future of the AI Trade. Barron's AMD Has Opportunity As NVDA Faces Scrutiny And Potential Leadership Vacuum, William Blair Says \u2014 Sees Runway For Shares Yahoo Finance Lisa Su Just Delivered Fantastic News for AMD Investors The Motley Fool William Blair Upgrades AMD, Sees Over 80% Revenue Growth FourWeekMBA AMD: It\u2019s Cheaper Than Before, But Not Cheap Enough (NASDAQ:AMD) Seeking Alpha", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 08:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vodafone Idea Q2 Results: ARPU Hits Rs 198, Revenue Up Slightly, But Losses Balloon To Rs 5,975 Crore", "full_content": "Vodafone Idea reported a consolidated net loss of Rs 5,975 crore in Q2 FY27, while revenue rose 1.7% sequentially to Rs 11,884 crore and ARPU increased 9.7% year-on-year to Rs 198.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Washington Shooting: 4 Shot In Logan Circle, Less Than 2 Km From White House", "full_content": "The shooting prompted school lockdowns and a major police response, with ATF and FBI agents joining the investigation.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 08:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Analysis: Jensen Huang\u2019s exit tests Nvidia\u2019s role as the \u2018central bank of AI\u2019",     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
