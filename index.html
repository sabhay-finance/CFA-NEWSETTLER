    const allData = {"general": [{"title": "Wheat falls as markets monitor Black Sea export prospects", "full_content": "BEIJING, Sept 28 (Reuters) - Chicago wheat fell on Monday as traders weighed whether diplomatic efforts could ease disruption to Black Sea grain exports from Russia and Ukraine, two of the world's biggest grain suppliers. Corn fell and soybeans gained.\n\n* The most-traded wheat contract on the Chicago Board of Trade (CBOT) was down 0.3% at $7.04-1/2 a bushel by 0109 GMT. CBOT corn fell 0.3% to $5.26-1/2 a bushel, while soybeans rose 0.2% to $13.21 a bushel.\n\n* Renewed diplomatic efforts to end the Ukraine war kept attention on the outlook for Black Sea agricultural exports.\n\n* Ukrainian President Volodymyr Zelenskiy said on Friday that India, Turkey, Egypt and other Middle Eastern countries were taking part in talks on unblocking shipping in the Black Sea.\n\n* Turkey has submitted proposals to Moscow on the security of shipping, but there were no substantive negotiations under way.\n\n* Traders hoped a truce could lead to a recovery in cargo movements that are at a near standstill in the Black Sea due to heavy attacks on ships and port infrastructure by both sides.\n\n* Russia could quickly restart up to 80% of its grain terminal capacity in the Black Sea and Sea of Azov if diplomatic efforts to halt mutual attacks by Russia and Ukraine result in a ceasefire, a Reuters analysis of industry data showed\n\n* Top wheat importers in Asia, the Middle East and Africa that rely on the Black Sea region for grain have struggled to secure supplies.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:54 AM IST", "pub_date_relative": "11m ago"}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for Monday, 28 Sept - GIFT Nifty, Kospi, Nikkei signals", "full_content": "Stock market prediction on Monday, 28 September, 2026 : The Indian stock market is likely to open on a negative note, as GIFT Nifty signalled a flat-to-muted opening on Monday, 28 September.\n\nMeanwhile, Asian markets traded on a mixed note on Monday, while US stock futures also traded weak after US President Donald Trump rejected Iran\u2019s latest proposal to reopen the Strait of Hormuz.\n\nBenchmark indices Sensex and Nifty staged a recovery on Friday, led by value buying in blue-chip stocks across the banking, oil and gas, and automobile sectors following the recent sharp decline in equities.\n\nThe 30-share BSE Sensex rose 315.20 points, or 0.43%, to settle at 73,895.74. As many as 19 of its 30 constituents ended higher, while 11 closed in the red. The index moved between an intraday high of 73,968.05 and a low of 73,477.77, recording a range of 490.28 points. In the previous session, the Sensex had slipped to its lowest level in more than three months.\n\nThe 50-share NSE Nifty also rebounded, gaining 77.40 points, or 0.34%, to close at 23,140.50. Of the index\u2019s constituents, 34 stocks ended with gains, 15 declined and one remained unchanged.\n\nGift Nifty was trading around the 23,161.50 level, down nearly 25.20 points from the Nifty futures\u2019 previous close, indicating a muted start for the Indian stock market indices.\n\nThe BSE Sensex ended at 73,895.74 on Monday, rising 315.20 points, or 0.43%. The benchmark opened at 73,525.92 and moved between an intraday high of 73,968.05 and a low of 73,477.77. After a cautious opening, the index traded largely within a narrow range before buying activity picked up in the afternoon session, helping it close in positive territory.\n\nAccording to Sachin Gupta, VP \u2013 Technical Research at Choice Equity Broking Private Limited, the Sensex continues to show a sideways-to-bearish trend, with the 73,200\u201373,450 range emerging as a key support zone.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:50 AM IST", "pub_date_relative": "15m ago"}, {"title": "Northern Star shares pop as Australian gold miner rejects $27-billion takeover proposal", "full_content": "Northern Star Resources shares jumped more than 9% Monday after the Australian gold miner rejected a $27-billion takeover proposal from South Africa's Gold Fields, saying the offer undervalued the company.\n\nGold Fields proposed acquiring 100% of Northern Star through a combination of shares and cash, offering 0.3125 Gold Fields shares and 7.25 Australian dollars in cash for each Northern Star share, according to a Northern Star statement Monday.\n\nShares of Northern Star Resources. The proposal, received Sept. 14, initially valued Northern Star at A$38.7 billion ($27.15 billion), representing a 22% premium to its closing price on Sept. 11. Based on Gold Fields' closing share price on Friday, Sept. 25, the implied value had fallen to A$36.1 billion.\n\nNorthern Star said its board unanimously rejected the proposal, adding it \"materially undervalues\" the company and was \"highly opportunistic.\"\n\n\"Gold Fields has sought to acquire one of the world's premier gold portfolios at a price that falls well short of what the Board considers to be its fundamental value and at a highly opportunistic time,\" Northern Star Chairman Michael Chaney said.\n\nThe miner also raised concerns that most of the offer would be paid in Gold Fields shares and that the proposal was subject to several conditions.\n\nNorthern Star told Gold Fields on Friday that its board did not consider it appropriate to engage further on the proposal.\n\nBloomberg earlier reported that Gold Fields had approached Northern Star about a potential takeover.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:49 AM IST", "pub_date_relative": "16m ago"}, {"title": "Foreign banks have expressed UBS merger interest, Swiss newspaper reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:42 AM IST", "pub_date_relative": "23m ago"}, {"title": "Bank of Japan debated need for faster rate hikes, July minutes show", "full_content": "", "source": "Investi ORIENT' brand name.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:34 AM IST", "pub_date_relative": "31m ago"}, {"title": "Boeing flags 737 MAX software glitch affecting landing navigation feature, WSJ reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:31 AM IST", "pub_date_relative": "34m ago"}, {"title": "Stock recommendations for 28 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap : On Friday, Indian equities recovered modestly after Thursday's sharp selloff, as hopes of a U.S.-Iran truce cooled crude oil prices and prompted value buying in beaten-down stocks. Nifty 50 rose 77.40 points, or 0.34%, to close at 23,140.50, while Sensex gained 315.20 points, or 0.43%, to settle at 73,895.74.\n\nBrent crude eased more than 1% from around $105 per barrel on reports that the U.S. and Iran are exploring a phased path to end the war, including reopening the Strait of Hormuz. The session stayed volatile, with the U.S. 10-year Treasury yield climbing further to about 5.2% and investors tracking the Trump-Xi summit in Washington.\n\nAutos and Consumer Durables led the gains, while Banks and FMCG also ended higher. IT, Healthcare, and Oil and Gas stocks lagged. Insurance-linked stocks remained under pressure, with PB Fintech falling by another 7% on regulatory concerns.\n\nDespite the bounce, Nifty ended the week about 0.9% lower. Breadth was positive, with 1,925 stocks advancing, 1,594 stocks declining, and 128 remaining unchanged, pointing to steady but selective buying.\n\nOn 25 September Indian equities ended the session on a firmer note after a volatile start, with Nifty 50 at 23,140.50, up 77.40 points or 0.34%, based on the closing snapshot provided. The index recovered sharply from an intraday low of 23,020.95, with buying strengthening after 2 PM. Easing geopolitical concerns around reported U.S.-Iran negotiations also supported sentiment during the session.\n\nKotak Neo Market breadth was constructive, with 1,925 stocks advancing, 1,594 stocks declining, and 128 remaining unchanged, translating into an advance-decline ratio of about 1.21, indicating broader participation beyond the headline index. On the sectoral front, Consumer Durables (+0.95%), Realty (+0.92%), and Auto (+0.89%) led gains, while Private Banks, FMCG, and Metals also advanced.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:30 AM IST", "pub_date_relative": "35m ago"}, {"title": "IPO rush continues: 20 issues to raise over Rs 1,257 crore this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO rush continues: 20 issues to raise over Rs 1,257 crore this week The Economic Times daily newspaper is available online now. Read Today's Paper IPO rush continues: 20 issues to raise over Rs 1,257 crore this week SECTIONS IPO rush continues: 20 issues to raise over Rs 1,257 crore this week ET Bureau Last Updated: Sep 28, 2026, 06:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Ab r markets failed to participate, as midcaps and smallcaps slipped, highlighting selective recovery.\n\nTrends remained in distress as the higher levels were used to supply on a continuous basis. With the markets not behaving as expected the trends ahead will continue to remain in a challenging mode.\n\nROLEXRINGS: Buy above \u20b9 196, stop \u20b9 187 target \u20b9 218 (Multiday)\n\nMANINFRA: Buy above \u20b9 131, stop \u20b9 127.50 target \u20b9 139 (Multiday)\n\nSectoral performance was mixed, with pharma and realty indices gaining over 1%, while metals came under pressure.\n\nDespite the early strength, sentiment weakened midweek as global bond yields remained elevated and geopolitical tensions in the Middle East persisted. Foreign institutional investors continued to offload equities, keeping the undertone cautious. By the end of the week, Nifty had surrendered gains, closing at 23,346.40, down 51.70 points (-0.22%) week-on-week. Sensex lost 486.80 points (-0.65%), while Bank Nifty slipped 247.85 points (-0.44%). Reuters noted this was the longest streak of weekly declines for Indian equities since 2020, underscoring the persistent bearish pressure.\n\nThis week majority of the sectors we note have seen a sharp decline seen through the week had taken a toll on the sectors overall and the selling pressure could be seen across the board. Due to some sector rotation into defensives, and optimism around housing demand and REIT valuations the Real Estate sector got some tailwind. The Pharma and FMCG also attracted some buying interest.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:20 AM IST", "pub_date_relative": "45m ago"}, {"title": "Nifty outlook for today: Bears to keep volatility elevated in monthly expiry week; Check resistance, support levels", "full_content": "The Nifty remained under pressure last week, slipping below the June low of 23,072 and marking a fresh swing low of 23,021. The index declined by 205.90 points, or 0.88%, extending its losing streak to seven consecutive weeks \u2014 the first such stretch since the COVID-19-led market fall.\n\nTrading volumes remained subdued compared with recent weeks, while the index continued to trade below all major short- and long-term moving averages. The overall technical structure also remains weak, with the Nifty forming a sequence of lower highs and lower lows. More importantly, the index has repeatedly failed to sustain a close above the previous session's high, indicating selling pressure at higher levels.\n\nAlthough the Nifty slipped below 23,072 during the week, it managed to recover and close above this level on a weekly basis. This makes the 23,072 zone an important support for the coming sessions.\n\nIn the near term, the decline could pause if the index manages to close above Friday's high of 23,163. Such a move would be the first indication of a possible relief rally. Above 23,163, the 8-day EMA near 23,284 would become the immediate hurdle. If the rebound gathers strength, the index could extend towards 23,353 and subsequently 23,559.\n\nHowever, these levels should still be viewed as resistance within a broader weak trend unless the index begins to sustain above its key moving averages.\n\nThe Nifty is currently trading around 3.56% below its 50-day moving average, highlighting the extent of the recent weakness. The weekly Bollinger Bands have also started expanding, suggesting that larger price moves could continue in the near term.\n\nThe weekly RSI has slipped to around 37, reflecting weak momentum, while the MACD remains bearish across multiple timeframes. Together, these indicators suggest that the underlying momentum continues to favour the bears.\n\nThe coming week is likely to remain volatile, with the September derivatives monthly expiry scheduled for Tuesday.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:18 AM IST", "pub_date_relative": "47m ago"}, {"title": "Equities must remain in retirement portfolio despite ll_content": "Oil prices climbed more than 1% Monday in early Asia trading after U.S. President Donald Trump rejected an Iranian peace proposal aimed at ending the Middle East conflict and reopening the Strait of Hormuz.\n\nU.S. crude futures for November delivery rose 1.3% to $93.62 a barrel, while international benchmark Brent gained 1.8% to $106.31 a barrel.\n\nTrump has turned down Iran's conditional offer to reopen the Strait of Hormuz and told aides he expects U.S. strikes on the country to resume after November's midterm elections, The Wall Street Journal reported Saturday, citing unnamed U.S. officials.\n\nTrump later confirmed to reporters that he had rejected Tehran's latest proposal: \"They made a proposal but I rejected it.\"\n\nSeparately, Yemen's Saudi-led coalition said on Saturday it had intercepted projectiles launched by Iran-backed Houthi rebels.\n\nIranian Foreign Minister Abbas Araghchi on Friday offered to reopen the key shipping route and restart nuclear negotiations with Washington within seven days, if the Trump administration agreed to Tehran's conditions.\n\n\"If certain conditions are met, the Strait of Hormuz will be open at the end of seven days, and talks will be restarted,\" Araghchi told reporters on the sidelines of the United Nations General Assembly in New York.\n\nThose conditions include an end to what Tehran describes as U.S. \"acts of aggression,\" the lifting of the naval blockade and economic warfare, and the release of Iranian assets, according to Iranian foreign ministry spokesman Esmaeil Baghaei.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. stock futures dip as markets parse Iran tensions, OpenAI training halt", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Centuri Holdings director Dustin DeMaria buys $100,204 CTRI", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Wheat falls as markets monitor Black Sea export prospects", "full_content": "BEIJING, Sept 28 (Reuters) - Chicago wheat fell on Monday as traders weighed whether diplomatic efforts could ease disruption to Black Sea grain exports from Russia and Ukraine, two of the world's biggest grain suppliers. Corn fell and soybeans gained.\n\n* The most-traded wheat contract on the Chicago Board of Trade (CBOT) was down 0.3% at $7.04-1/2 a bushel by 0109 GMT. CBOT corn fell 0.3% to $5.26-1/2 a bushel, while soybeans rose 0.2% to $13.21 a bushel.\n\n* Renewed diplomatic efforts to end the Ukraine war kept attention on the outlook for Black Sea agricultural exports.\n\n* Ukrainian President Volodymyr Zelenskiy said on Friday that India, Turkey, Egypt and other Middle Eastern countries were taking part in talks on unblocking shipping in the Black Sea.\n\n* Turkey has submitted proposals to Moscow on the security of shipping, but there were no substantive negotiations under way.\n\n* Traders hoped a truce could lead to a recovery in cargo movements that are at a near standstill in the Black Sea due to heavy attacks on ships and port infrastructure by both sides.\n\n* Russia could quickly restart up to 80% of its grain terminal capacity in the Black Sea and Sea of Azov if diplomatic efforts to halt mutual attacks by Russia and Ukraine result in a ceasefire, a Reuters analysis of industry data showed\n\n* Top wheat importers in Asia, the Middle East and Africa that rely on the Black Sea region for grain have struggled to secure supplies.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:54 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for Monday, 28 Sept - GIFT Nifty, Kospi, Nikkei signals", "full_content": "Stock market prediction on Monday, 28 September, 2026 : The Indian stock market is likely to open on a negative note, as GIFT Nifty signalled a flat-to-muted opening on Monday, 28 September.\n\nMeanwhile, Asian markets traded on a mixed note on Monday, while US stock futures also traded weak after US President Donald Trump rejected Iran\u2019s latest proposal to reopen the Strait of Hormuz.\n\nBenchmark indices Sensex and Nifty staged a recovery on Friday, led by value buying in blue-chip stocks across the banking, oil and gas, and automobile sectors following the recent sharp decline in equities.\n\nThe 30-share BSE Sensex rose 315.20 points, or 0.43%, to settle at 73,895.74. As many as 19 of its 30 constituents ended higher, while 11 closed in the red. The index moved between an intraday high of 73,968.05 and a low of 73,477.77, recording a range of 490.28 points. In the previous session, the Sensex had slipped to its lowest level in more than three months.\n\nThe 50-share NSE Nifty also rebounded, gaining 77.40 points, or 0.34%, to close at 23,140.50. Of the index\u2019s constituents, 34 stocks ended with gains, 15 declined and one remained unchanged.\n\nGift Nifty was trading around the 23,161.50 level, down nearly 25.20 points from the Nifty futures\u2019 previous close, indicating a muted start for the Indian stock market indices.\n\nThe BSE Sensex ended at 73,895.74 on Monday, rising 315.20 points, or 0.43%. The benchmark opened at 73,525.92 and moved between an intraday high of 73,968.05 and a low of 73,477.77. After a cautious opening, the index traded largely within a narrow range before buying activity picked up in the afternoon session, helping it close in positive territory.\n\nAccording to Sachin Gupta, VP \u2013 Technical Research at Choice Equity Broking Private Limited, the Sensex continues to show a sideways-to-bearish trend, with the 73,200\u201373,450 range emerging as a key support zone.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:50 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Northern Star shares pop as Australian gold miner rejects $27-billion takeover proposal", "full_content": "Northern Star Resources shares jumped more than 9% Monday after the Australian gold miner rejected a $27-billion takeover proposal from South Africa's Gold Fields, saying the offer undervalued the company.\n\nGold Fields proposed acquiring 100% of Northern Star through a combination of shares and cash, offering 0.3125 Gold Fields shares and 7.25 Australian dollars in cash for each Northern Star share, according to a Northern Star statement Monday.\n\nShares of Northern Star Resources. The proposal, received Sept. 14, initially valued Northern Star at A$38.7 billion ($27.15 billion), representing a 22% premium to its closing price on Sept. 11. Based on Gold Fields' closing share price on Friday, Sept. 25, the implied value had fallen to A$36.1 billion.\n\nNorthern Star said its board unanimously rejected the proposal, adding it \"materially undervalues\" the company and was \"highly opportunistic.\"\n\n\"Gold Fields has sought to acquire one of the world's premier gold portfolios at a price that falls well short of what the Board considers to be its fundamental value and at a highly opportunistic time,\" Northern Star Chairman Michael Chaney said.\n\nThe miner also raised concerns that most of the offer would be paid in Gold Fields shares and that the proposal was subject to several conditions.\n\nNorthern Star told Gold Fields on Friday that its board did not consider it appropriate to engage further on the proposal.\n\nBloomberg earlier reported that Gold Fields had approached Northern Star about a potential takeover.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:49 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Foreign banks have expressed UBS merger interest, Swiss newspaper reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:42 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Can Orient Cables IPO deliver long-term growth for high-risk investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Can Orient Cables IPO deliver long-term growth for high-risk investors? Havells India Share Price Polycab India Share Price LG Electronics India Share Price R R Kabel Share Price Finolex Cables Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Can Orient Cables IPO deliver long-term growth for high-risk investors? SECTIONS Can Orient Cables IPO deliver long-term growth for high-risk investors? By Sachin Kumar , ET Bureau Last Updated: Sep 28, 2026, 06:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Orient Cables is aiming to raise \u20b9320 crore through a fresh equity issue and \u20b9232 crore via an offer for sale. The company has seen growth in revenue and profit but faces challenges with operating margins and customer concentration. Its promoter stake will decrease to 82.2% post-IPO from 100%. The company is also involved in a dispute concerning the usage of the 'ORIENT' brand name.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budge  Fintech falling by another 7% on regulatory concerns.\n\nDespite the bounce, Nifty ended the week about 0.9% lower. Breadth was positive, with 1,925 stocks advancing, 1,594 stocks declining, and 128 remaining unchanged, pointing to steady but selective buying.\n\nOn 25 September Indian equities ended the session on a firmer note after a volatile start, with Nifty 50 at 23,140.50, up 77.40 points or 0.34%, based on the closing snapshot provided. The index recovered sharply from an intraday low of 23,020.95, with buying strengthening after 2 PM. Easing geopolitical concerns around reported U.S.-Iran negotiations also supported sentiment during the session.\n\nKotak Neo Market breadth was constructive, with 1,925 stocks advancing, 1,594 stocks declining, and 128 remaining unchanged, translating into an advance-decline ratio of about 1.21, indicating broader participation beyond the headline index. On the sectoral front, Consumer Durables (+0.95%), Realty (+0.92%), and Auto (+0.89%) led gains, while Private Banks, FMCG, and Metals also advanced.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:30 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPO rush continues: 20 issues to raise over Rs 1,257 crore this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO rush continues: 20 issues to raise over Rs 1,257 crore this week The Economic Times daily newspaper is available online now. Read Today's Paper IPO rush continues: 20 issues to raise over Rs 1,257 crore this week SECTIONS IPO rush continues: 20 issues to raise over Rs 1,257 crore this week ET Bureau Last Updated: Sep 28, 2026, 06:25:0 port levels", "full_content": "The Nifty remained under pressure last week, slipping below the June low of 23,072 and marking a fresh swing low of 23,021. The index declined by 205.90 points, or 0.88%, extending its losing streak to seven consecutive weeks \u2014 the first such stretch since the COVID-19-led market fall.\n\nTrading volumes remained subdued compared with recent weeks, while the index continued to trade below all major short- and long-term moving averages. The overall technical structure also remains weak, with the Nifty forming a sequence of lower highs and lower lows. More importantly, the index has repeatedly failed to sustain a close above the previous session's high, indicating selling pressure at higher levels.\n\nAlthough the Nifty slipped below 23,072 during the week, it managed to recover and close above this level on a weekly basis. This makes the 23,072 zone an important support for the coming sessions.\n\nIn the near term, the decline could pause if the index manages to close above Friday's high of 23,163. Such a move would be the first indication of a possible relief rally. Above 23,163, the 8-day EMA near 23,284 would become the immediate hurdle. If the rebound gathers strength, the index could extend towards 23,353 and subsequently 23,559.\n\nHowever, these levels should still be viewed as resistance within a broader weak trend unless the index begins to sustain above its key moving averages.\n\nThe Nifty is currently trading around 3.56% below its 50-day moving average, highlighting the extent of the recent weakness. The weekly Bollinger Bands have also started expanding, suggesting that larger price moves could continue in the near term.\n\nThe weekly RSI has slipped to around 37, reflecting weak momentum, while the MACD remains bearish across multiple timeframes. Together, these indicators suggest that the underlying momentum continues to favour the bears.\n\nThe coming week is likely to remain volatile, with the September derivative ice , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:17 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market Today: Asian shares subdued as rising oil fuels rate hike concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian shares subdued as rising oil fuels rate hike concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian shares subdued as rising oil fuels rate hike concerns SECTIONS Global Market Today: Asian shares subdued as rising oil fuels rate hike concerns Bloomberg Last Updated: Sep 28, 2026, 06:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MSCI\u2019s gauge of Asian stocks opened slightly lower with South Korea\u2019s benchmark slipping as markets returned from a holiday, while Japanese stocks edged higher. Futures for the S&P 500 Index fell around 0.2%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:12 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil gains over 1% as Trump rejects Iranian proposal to reopen Hormuz Strait", "full_content": "Oil prices climbed more than 1% Monday in early Asia trading after U.S. President Donald Trump rejected an Iranian peace proposal aimed at ending the Middle East conflict and reopening the Strait of Hormuz.\n\nU.S. crude futures for November delivery rose 1.3% to $93.62 a barrel, while international benchmark Brent gained 1.8% to $106.31 a barrel.\n\nTrump has turned down Iran's conditional offer to reopen the Strait of Hormuz and told aides he expects U.S. strikes on the country to resume after November's midterm elections, The Wall Street Journal reported Saturday, citing unnamed U.S. officials.\n\nTrump later confirmed to reporters that he had rejected Tehran's latest proposal: \"They made a proposal but I rejected it.\"\n\nSeparately, Yemen's Saudi-led coalition said on Saturday it had intercepted projectiles launched by Iran-backed Houthi rebels.\n\nIranian Foreign Minister Abbas Araghchi on Friday offered to reopen the key shipping route and restart nuclear negotiations with Washington within seven days, if the Trump administration agreed to Tehran's conditions.\n\n\"If certain conditions are met, the Strait of Hormuz will be open at the end of seven days, and talks will be restarted,\" Araghchi told reporters on the sidelines of the United Nations General Assembly in New York.\n\nThose conditions include an end to what Tehran describes as U.S. \"acts of aggression,\" the lifting of the naval blockade and economic warfare, and the release of Iranian assets, according to Iranian foreign ministry spokesman Esmaeil Baghaei.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "U.S. stock futures dip as markets parse Iran tensions, OpenAI training halt", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "India's AI enablers surge as data centre buildout gathers pace", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndia may not have pure-play artificial intelligence (AI) companies like those that dominate US markets, but investors are finding different ways to bet on the technology boom. A clutch of companies supplying the power, data centres, equipment and components needed to build AI infrastructure has delivered outsized returns this year, even as the benchmark index has struggled.\n\nIn a 17 September note to investors, Goldman Sachs\u2019s research division listed 42 \u2018AI enablers\u2019\u2014companies in power infrastructure, data centre hardware, semiconductors and other parts of the supply chain\u2014that recorded an average 60% rise in stock prices since 1 January, compared to a 12% decline in Nifty 50.\n\nThese include Adani Green Energy, Tata Power, Cummins India, Kirloskar Oil Engines, CG Power, Kaynes Technology and Syrma SGS, among others, which the US investment bank identifies as companies benefiting from the AI buildout across sectors. The list of data centre and AI operators and leaders includes, according to Goldman Sachs, some of India's largest conglomerates such as Larsen & Toubro, Reliance Industries, Adani Enterprises and Bharti Airtel.\n\n\u201cBeneath the surface of a laggard benchmark, a distinct and rapidly compounding pocket of AI-infrastructure beneficiaries, predominantly mid, small and micro cap, are delivering some of the strongest equity returns in India,\" the note by Goldman Sachs analysts Amorita Goel, Sunil Koul, Timothy Moe, Alvin So, John Kwon and Terry Chan read. \"While the Nifty is down 12% in 2026, the \u2018AI Enablers\u2019 cohort of Indian AI infrastructure with a combined market cap of $670 billion, is up ~60% over the same period.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stocks in news: Adani Power, SAIL, BCCL, SAIL, Cupid and CleanMax Enviro", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks in news: Adani Power, SAIL, BCCL, SAIL, Cupid and CleanMax Enviro Power Grid Corporation of India Share Price Adani Energy Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Stocks in news: Adani Power, SAIL, BCCL, SAIL, Cupid and CleanMax Enviro SECTIONS Stocks in news: Adani Power, SAIL, BCCL, SAIL, Cupid and CleanMax Enviro By Kumar Gaurav , ETMarkets.com Last Updated: Sep 28, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity benchmarks experienced an increase on Friday, noting that volatility in crude oil and bond yields affected investor sentiment. The Nifty 50 and Sensex closed higher, although gains were limited due to market conditions. Several companies, including Adani Power and SAIL, are expected to be in focus following corporate developments. Notably, Adani Power completed a merger of subsidiaries, while SAIL signed a memorandum for coal block development.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Pre-market action: Here's the trade setup for today's session The Economic Times daily newspaper is available online now. Read Today's Paper Pre-market action: Here's the trade setup for today's session SECTIONS Pre-market action: Here's the trade setup for today's session By Akash Podishetti , ETMarkets.com Last Updated: Sep 28, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian stock markets are currently witnessing a correction influenced by global geopolitical tensions and excessive valuations. Foreign investors have turned into net sellers, contrasting with the ongoing net buying patterns from domestic institutional investors. The rupee has strengthened against the US dollar, hinting at a positive shift in global risk appetite.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed tightening bets weigh on gold prices", "full_content": "Sept 28 (Reuters) - Gold prices fell on Monday as a rise in oil prices heightened inflation concerns and reinforced expectations of further Federal Reserve interest rate hikes.\n\n* Spot gold was down 0.7% at $4,254.77 per ounce, as of 0010 GMT. US gold futures drifted 0.7% lower to $4,289.70.\n\n* Iran insisted that only diplomacy can solve its conflict with the United States and Israel, after US President Donald Trump said he rejected an Iranian proposal to reopen the Strait of Hormuz and end fighting. Oil prices rebounded more than 1%.\n\n* The Fed raised rates earlier this month, lifting its target rate range by a quarter percentage point to between 3.75% and 4%. According to CME's FedWatch Tool, traders are pricing in a 66% chance of a US rate hike in October.\n\n* Higher energy prices can fuel inflation by raising costs across the economy. Gold is widely viewed as a hedge against inflation, but it can struggle in a high interest rate environment as rising yields increase the opportunity cost of holding the non-yielding metal.\n\n* Cleveland Fed President Beth Hammack said on Friday she is concerned that persistently high inflation risks conditioning the American public to accept elevated prices as the norm, adding the central bank cannot let that happen.\n\n* A survey showed US consumer sentiment slipped to a four-month low in September amid worries that rising inflation would erode households' purchasing power.\n\n* Among other metals, spot silver fell 1% to $63.67, platinum was down 0.7% at $1,765.28 and palladium lost 0.7% to $1,257.70.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 05:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Emerging market investors shun riskiest bonds as US yields soar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Emerging market investors shun riskiest bonds as US yields soar Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Emerging market investors shun riskiest bonds as US yields soar SECTIONS Emerging market investors shun riskiest bonds as US yields soar Bloomberg Last Updated: Sep 28, 2026, 05:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Emerging-market investors are pulling back from riskier bond investments amid a significant selloff in global credit markets. The recent turmoil has resulted in high yields for US Treasuries, raising concerns among money managers. With credit spreads at tight levels not seen since 2007, investors are worried about potential bond selloffs. Some analysts are trimming exposure to certain countries while favoring higher-rated credits like Indonesia and the Philippines.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 05:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dubai is an important market for us, says SBI Funds\u2019 MD & CEO Debasish Mishra", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen Debasish Mishra took charge as managing director and chief executive officer of SBI Funds Management, the initial public offering (IPO) was already underway. After the listing, the fund house is turning its attention to the next phase\u2014strengthening post-IPO compliance, risk management and business development, while expanding its reach across B100 cities and overseas markets such as Dubai.\n\nDuring the IPO outreach, Mishra said cities such as Rajkot, Indore and Coimbatore saw encouraging investor interest, while the fund house is also looking closely at Dubai. Obtaining the appropriate fund management licence in the Gulf city, he said, would help make the business more structured and strengthen its institutional framework for investors.\n\nThe near-term environment is likely to remain influenced by earnings, global interest rates, energy costs and geopolitical developments. In my view, the earnings trajectory will increasingly be important in determining the direction of Indian equities. The encouraging aspect is that the earnings cycle has begun to recover, with broad-based growth across key sectors. Large-cap valuations have also moderated from earlier levels, while domestic investment flows continue to provide resilience to the market. Therefore, the outlook remains constructive, but investors should continue to approach equities with a long-term perspective and an understanding of market volatility.\n\nThe conversations have been extremely encouraging. I have met several family offices and institutional investors, and what stood out was the quality of their questions. Their focus was not just on returns, but on value creation and governance, how research works, how investment ideas are evaluated, valuations assessed and research translated into investment decisions. This tells us something important about the evolving investor.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 05:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures slip after winning week on Wall Street: Live updates", "full_content": "Stock futures fell slightly on Sunday night following a winning week despite Treasury yields spiking to multiyear highs.\n\nDow Jones Industrial Average futures pulled back 97 points, or 0.2%. S&P 500 futures lost 0.2% along with Nasdaq-100 futures .\n\nA rise in oil prices weighed on equity futures in early trading. Brent crude traded more than 1% higher at $105.86 per barrel. West Texas Intermediate futures gained around 1% as well to $93.20, after President Donald Trump rejected conditions for a ceasefire presented by Iran.\n\nThe Dow eked out a 0.3% advance last week, snapping a three-week slide. The S&P 500 and Nasdaq Composite had their best weekly performances since early August, advancing 1.2% and 2.1%, respectively.\n\nIn Asia, Japan's Nikkei 225 added 0.29% while the broader Topix rose 0.17%. South Korea's Kospi dropped 0.41% at open following a two-day holiday, while the small-cap Kosdaq slipped 0.16%. Australia's S&P/ASX 200 was flat.\n\nU.S. Tech-linked stocks led the way last week. Meta Platforms rallied nearly 13% in that time, as traders cheered the company's Muse artificial intelligence agent. Microsoft climbed more than 4%, while Apple and Nvidia advanced more than 1% each.\n\nThose gains came even as Treasury yields raced to highs not seen in years, with traders increasing bets of more Federal Reserve rate hikes due to persistent inflation. The benchmark 10-year Treasury note yield scaled to a level not seen since 2007. The 30-year bond yield reach a 2004 high. The 2-year note yield also jumped around 17 basis points last week.\n\n\"The rapid rise in 2-year government note yields worldwide signals that major central banks need to raise their policy rates further in response to the inflationary impact of higher-for-longer oil prices resulting from the recent re-escalation of the Middle East war,\" wrote Ed Yardeni, president of Yardeni Research. \"Unfortunately, these higher rates also exacerbate the outlook for large government deficits worldwide.\"", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 05:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "28 Sep 2026, 07:05 AM IST", "total_stories": 276};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
