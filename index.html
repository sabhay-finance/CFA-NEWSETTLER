s to be awarded today | What is EPF, EPS, PMVBRY, Vishwas 2026 scheme", "full_content": "On the occasion of the 74th Foundation Day of the Employees\u2019 Provident Fund Organisation ( EPFO ), which is celebrated on 1 November every year, the Ministry of Labour & Employment organised the \u201cEPFO Foundation Day Quiz 2026\u201d in collaboration with MyGov. The winners of the quiz will be felicitated at a function in New Delhi on Sunday.\n\nThe quiz was conducted from 13 to 23 October 2026 and drew 8,584 participants from across India. It aimed to create awareness regarding EPFO's schemes and services, including the Employees\u2019 Provident Fund Scheme, 2026, the Employees\u2019 Pension Scheme, 2026, PMVBRY and Vishwas 2026.\n\nIn a blog post, MyGov announced that all participants would receive e-certificates and added, \"EPFO and MyGov extend their appreciation to all participants for their enthusiastic participation and look forward to their continued engagement in future MyGov activities.\"\n\nThe quiz focused on four EPFO schemes and initiatives aimed at supporting employees and employers. Here\u2019s a closer look at each.\n\nAccording to an official release, the new EPF 2026 scheme, launched under the Code on Social Security, 2020, replaced the erstwhile Employees' Provident Fund Scheme. The EPF 2026 scheme enables members to build their retirement savings through contributions and accrued interest. It also permits members to make partial withdrawals from their savings for specified purposes, including housing, higher education, marriage, and medical treatment, subject to prescribed conditions.\n\nThe erstwhile Employees' Pension Scheme , 1995, was replaced by the new EPS 2026 under the Code. EPS 2026 provides monthly pension benefits to eligible members on superannuation, retirement, or disability.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Actuate Therapeutics CEO Daniel Schmitt purchases $49,999 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Explained | EPFO new initiatives: WhatsApp services, inactive PF accounts to get automatic settlement - What we know", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) is celebrating its 74th Foundation Day in New Delhi today, i.e., Sunday, 1 November 2026, with Union Labour and Employment Minister Dr Mansukh Mandaviya inaugurating the proceedings, as detailed in a recent press release by the Press Information Bureau.\n\nThe event is of immense significance, as it marks a milestone in the organisation\u2019s efforts to make provident fund services more accessible and convenient for eligible subscribers.\n\nAmong the key initiatives scheduled for launch are the automatic settlement of eligible inoperative EPF accounts with balances of up to \u20b9 1,000, as well as the introduction of EPFO services via WhatsApp. The objective of these initiatives is to simplify service delivery and boost subscriber\u2019s access to their provident fund accounts.\n\nIn the proposed automatic settlement initiative, eligible inoperative EPF accounts with balances of up to \u20b9 1,000 will be settled automatically. This feature will go a long way toward ensuring that small, inactive account balances are cleared without requiring eligible members to go through a separate settlement process that might take a lot of time.\n\nEPFO will also introduce services through WhatsApp, providing subscribers with another channel to avail and access services. The initiative is part of the organisation's broader efforts to make its services more convenient and enhance engagement with eligible members.\n\nThe Ministry's press release, however, does not specify the detailed eligibility criteria or the complete list of services available via WhatsApp.\n\nThe Foundation Day celebrations will also include the presentation of the Bhavishya Nidhi Awards 2026.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week The Economic Times daily newspaper is available online now. Read Today's Paper FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week SECTIONS FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week PTI Last Updated: Nov 01, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amidst rising economic fears, foreign portfolio investors withdrew Rs 34,843 crore from Indian equities in October. Although they had made significant contributions in July and August, outflows continued through September. By late October, a turnaround occurred as foreign investors became net buyers, infusing approximately Rs 6,300 crore into the market. Support from domestic institutional investors provided much-needed stability as all eyes turn to potential global impacts on investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Police clear new Lisbon housing protest camp after thousands rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Binance to resume crypto withdrawals in phases after record $6 billion hack", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bank First Corp director Sprang buys $59,348 of common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 11:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Private Equity Fund Gates Are Features, Not Bugs", "full_content": "The sound of fund gates slamming shut is never welcome. But when it comes to private equity, investors should be less surprised than with real estate or private credit. Still, Wednesday\u2019s news that Partners Group Holdings AG has capped withdrawals from a $8.6 billion vehicle aimed at rich people is troubling for an industry that has put the wealth market at the center of its growth plans.\n\nPrivate equity has struggled to satisfy investors for years now because managers are finding it hard to sell portfolio companies for decent returns and hand cash back. Sentiment and fund raising have suffered; growing withdrawal demands from individual customers won\u2019t help. But this is less of a problem than in private credit because these redeemable funds make up an even tinier portion of total assets in private equity. Most investors in the sector are big institutions that have willingly locked their money up for years,\n\nPartners Group is a bit of an outlier. The Swiss private asset manager has long targeted the rich clients of private banks and is more dependent on them than many rivals, with almost 20% of its money from that source. It first launched these kinds of permanent private equity funds for the wealthy with redemption windows roughly 20 years ago.\n\nHowever, the signal sent by its restriction of withdrawals from its Global Value SICAV evergreen fund weighed on the stock prices of listed peers as well as on Partners Group itself. Partners declined more than 17% on Wednesday, while EQT AB and CVC Capital Partners Plc both slipped more than 6%.\n\nThe gated fund had requests for nearly 10% of net assets to be redeemed, but has an automatic stop at 5%. The fund has plenty of spare cash to hand and could easily have met a higher level of redemptions, but Partners\u2019 Chief Executive Officer David Layton said its mandate was to keep investing in deals and needed money available for that. Investors who really want their money will join a queue to get it back in future quarters.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fuel, forex and farmers: Why India is betting big on maize", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Fuel, forex and farmers: Why India is betting big on maize The Economic Times daily newspaper is available online now. Read Today's Paper Fuel, forex and farmers: Why India is betting big on maize SECTIONS Fuel, forex and farmers: Why India is betting big on maize By M L Jat , ET CONTRIBUTORS Last Updated: Nov 01, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A grain that once fed chickens now fuels cars and, soon, planes. The harder question is whether Indian farms can keep up with the demand it has created.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Companies promised AI gains\u2014 here's how the payoff showed up in earnings", "full_content": "Some companies are beginning to report financial benefits from artificial intelligence investments, as interest in the technology shifts from hype to measurable returns in the latest quarter.\n\nCorporate AI investment has surged as companies look to boost efficiency and become more profitable, reaching $581.7 billion in 2025, up 130% from the previous year, according to the Stanford HAI 2026 AI Index report .\n\nAs CEOs tout the tech's benefits and hyperscalers like Microsoft , Amazon , Google and Meta are expected to spend $700 billion combined this year on its infrastructure, investors are looking for measurable gains.\n\nNow, with third-quarter earnings season underway, some companies are beginning to put numbers around those benefits.\n\nSpanish banking giant Santander said Wednesday that it saw AI initiatives generate 194 million euros ($216 million) in business value in the first nine months of 2026 .\n\nSantander Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera told CNBC that AI is helping the bank reduce low-value tasks so employees can focus on higher-value work.\n\n\"This affects both revenue and costs, so we are actually in the quarter where we can actually link directly to AI a positive contribution,\" Cantera said.\n\n\"AI is being embedded in all the processes that we are conducting at the bank, so it's really difficult to just say how much comes from AI, but clearly AI is improving the quality of our services to clients.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Best 3 stocks to buy: SBI, Britannia, Biocon by Ganesh Dongre of Anand Rathi | Targets, stop-loss, stock market views", "full_content": "BIOCON Asit Manohar Published 1 Nov 2026, 11:29 AM IST Prefer Livemint on Google Stocks to buy | Shares to buy | Ganesh Dongre's stock recommendations: The Indian equity benchmarks ended the week on a positive note, with the Nifty gaining nearly 2% to close at 23,053, while the Bank Nifty advanced 0.75% to settle at 54,686. However, the Nifty 50 index witnessed buying interest at lower levels and recovered towards the 23,200 mark, although it continues to face resistance at higher levels. Sectoral performance remained broadly positive, with most major sectors witnessing gains in the range of 2%\u20137%.\n\nThe Pharma sector emerged as the top performer, rallying nearly 7% during the week. However, despite the recovery in domestic equities, Brent crude oil remains elevated, hovering in the $110\u2013$115 per barrel range, keeping inflationary concerns and global uncertainties in focus.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes a sustained weekly close of the Nifty 50 index above 23,200\u201323,400 would improve the near-term technical outlook of the Indian stock market. Ganesh Dongre of Anand Rathi said that both the Nifty 50 and Bank Nifty index remain in a cautious technical phase. The rebound from oversold levels has improved near-term sentiment; however, a sustained recovery will require the Nifty to establish itself above the 23,200\u201323,400 resistance zone and subsequently reclaim the 24,000\u201324,200 range. Similarly, the Bank Nifty needs to move decisively above 56,400\u201356,500 to strengthen its technical outlook.\n\n\u201cUntil these crucial resistance levels are convincingly breached, markets are likely to remain volatile, with intermittent recovery attempts, range-bound consolidation and selling pressure at higher levels.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Crypto Heist: Binance To Resume Withdrawals After Covering 95% Of $6.3 Billion Theft", "full_content": "The largest cryptocurrency exchange has said that it will restart phase 1 of withdrawals on Sunday after the Federal Bureau of Investigation (FBI) linked the theft to North Korea.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 11:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite SECTIONS ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite By Akash Podishetti , ETMarkets.com Last Updated: Nov 01, 2026, 11:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ITC is expected to report a weak Q2, with brokerages forecasting an 8% decline in cigarette volumes and a drop of u onial rule during a time of famine.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up Jio Platforms Share Price Bharti Airtel Share Price Vodafone Idea Share Price Bharti Hexacom Share Price Tata Communications Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up SECTIONS IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up By Akash Podishetti , ETMarkets.com Last Updated: Nov 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s IPO market is set for a quiet week, with just one fresh issue worth Rs 56.68 crore opening for subscription and no mainboard launches. Vedant Poly Fabs will be the only new IPO, while 13 companies are expected to list. The slowdown follows October\u2019s blockbuster Rs 30,188 crore Jio Platforms IPO, which was subscribed over 22 times.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "'Fire Them By Friday': Chennai IT Manager's Anonymous Account Hits A Nerve", "full_content": "On Reddit, the account became the backdrop to a familiar Indian employment debate: how much is job security worth?", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 11:09 AM IST", "pub_date_relative": "2h ago"}, {"title": "5 money lessons from The Simple Path to Wealth by JL Collins: Harness world's most powerful wealth-building tool | List", "full_content": "JL Collins believes building wealth is simple although following the plan can be difficult. His approach uses low-cost index funds to help people become financially independent. His examples are American and need to be adjusted for other countries.\n\nJL Collins says debt weakens your ability to build wealth. Interest payments reduce the income available for your needs and investments. List your debts, reduce unnecessary spending and pay every minimum amount. Use extra money to pay off the debt with the highest interest rate.\n\nRepay debts above 5% quickly. Those charging 3-5% can wait longer. Below 3%, Collins prefers investing the money instead. Remember, the book was published a decade ago. These rates may need to be updated in line with the current market conditions.\n\nCollins recommends Vanguard's Total Stock Market Index Fund, known as VTSAX. It spreads investments across many companies while keeping costs low.\n\nHe says picking winning shares is difficult, even for professionals. He writes, \"Don't feel bad. I can't either.\"\n\nHe admires Vanguard founder Jack Bogle for developing the modern low-cost index fund. Collins also believes complicated investments are less likely to produce profits.\n\nMarket crashes are normal, and Collins highlights the market's long-term recovery record. However, emotions can push investors to buy high and sell low.\n\nHis advice is to remain calm and avoid selling during panic. Keep investing and treat falling prices as opportunities to buy. Staying invested and adding money during crashes can increase wealth over time.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Jio Platforms vs Bharti Airtel shares: Which telecom stock to buy after Reliance arm\u2019s IPO listing? Experts suggestions", "full_content": "The listing of Jio Platforms has put the spotlight on India\u2019s telecom sector, with investors now weighing whether the newly listed Reliance Industries-backed company or established rival Bharti Airtel offers a better investment opportunity.\n\nJio Platforms shares have surged nearly 28% from their issue price of \u20b9 1,119 since making their market debut on Wednesday, 28 October, taking its market capitalisation to nearly \u20b9 13.18 lakh crore and making it India\u2019s second-most valuable listed company after Reliance Industries. The strong debut and subsequent gains follow an IPO that attracted bids for 22.19 times the shares on offer.\n\nBharti Airtel, meanwhile, has built a strong long-term track record, with its shares delivering returns of 586.10% over the past decade and 187.07% over five years. However, the stock remains down 6.64% so far in 2026. With Jio commanding a substantial valuation and Airtel offering an established earnings track record, which telecom stock should investors consider now? Experts weigh in on their growth prospects, valuations and investment appeal.\n\nThe listing of Reliance Industries\u2019 telecom arm Jio has brought the comparison with Bharti Airtel into sharper focus, but experts believe the investment decision goes beyond subscriber scale and growth prospects. While Jio offers an opportunity to tap into its expanding 5G network and digital ecosystem, its rich valuation raises questions about the returns investors can expect.\n\nBharti Airtel, meanwhile, remains a stronger proposition for investors seeking earnings visibility, higher ARPU, robust cash flows and disciplined capital allocation. Experts say investors should weigh valuations, earnings growth and execution risks before choosing between the two telecom stocks.\n\nGaurav Arora, Head of Research at SAHI, said Jio\u2019s listing at a valuation of around \u20b9 10.3 lakh crore places it among India\u2019s top five companies by market capitalisation from day one.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:03 AM IST", "pub_date_relative": "2h ago"}, {"title": "IIM Bangalore Achieves 100% Summer Placement; 608 Students Secure Offers As Median Stipend Hits Rs 2 Lakh", "full_content": "The recruitment process was conducted between October 26-29 and covered students enrolled in the Post Graduate Programme in Management (PGP) and the Post Graduate Programme in Business Analytics.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "8th Pay Commission: How a \u20b969,000 minimum wage demand translates into a proposed \u20b91.12 lakh salary; Check calculations", "full_content": "The 8th Pay Commission was constituted by the central government on 3 November 2025. This is a temporary 3-member panel headed by Justice Ranjana Prakash Desai. The commission was given 18 months, as per the Terms of Reference (ToR) of the commission, to have a discussion with eligible central government unions, pensioners and associations on aspects such as fitment factor, salary revisions, pension reforms, employee grievances, along with a host of other factors and submit its final report to the central government.\n\nOn 3 November 2026, the 8th Pay Commission will complete 12 months of the initially allocated 18 months, as we move towards the final few months before it tables its final report to the central government.\n\nIt is vital to keep in mind that, in its most recent meetings in Bengaluru and Mumbai that concluded on 8 October and 23 October, respectively, the commission gave an opportunity for eligible unions to present their views and highlight their chief grievances in order to bring meaningful and positive changes in the lives of the central government employees and pensioners.\n\nSimilar meetings have been held across the country over the last few months in states such as West Bengal, New Delhi, and Ladakh. In all these meetings and in the memorandums submitted by prominent employee unions over the last few months, a lot of focus has been placed on key aspects such as basic pay and the fitment factor multiplier.\n\nSome unions, such as the Bharatiya Pratiraksha Mazdoor Sangh (BPMS) , have demanded a fitment factor multiplier of 4 to ensure that eligible employees can meaningfully cope with rising inflation.\n\nOn similar lines, the Staff Side of the National Council-Joint Consultative Machinery (NC-JCM) has proposed a minimum monthly basic salary of \u20b9 69,000 for central government employees under the 8th Pay Commission. It has also recommended a fitment factor of 3.833.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dividend Watchlist: Key Ex-Dates For Infosys, Mazagon Dock, Coal India And More Next Week", "full_content": "To be eligible for these payouts, investors must be mindful of the ex-dividend date, which is the day the share price adjusts to reflect the upcoming dividend.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:42 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bangladesh Govt Forms Wage Board As Garment Workers Strike Shuts Factories. 140% Hike Next?", "full_content": "The dispute has raised \u200bconcerns about disruption to an industry that employs about 4 \u2060million workers, generates more than 80% of Bangladesh's export earni cation Extends Class 12 Semester 3 Answer Key Challenge Deadline", "full_content": "Students will now have until 3 pm on November 2, 2026, to submit their challenges through the council's official portal.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "Crude Tensions: OPEC+ To Keep Oil Targets Unchanged As Iran War Curbs Gulf Supply", "full_content": "OPEC+ is expected to hold fourth-quarter production targets steady before reviewing its 2027 output policy. Reports in July had already indicated the group would likely avoid further policy changes during this period.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Who Is Auqib Nabi, The Pacer Who Left Virat Kohli Frustrated In The Nets Ahead Of New Zealand ODIs?", "full_content": "For Kohli, it was a demanding spell within a longer workout, with good shots mixed in among the beaten edges. For Nabi, the immediate task is earning a place in the XI in Auckland. He is still waiting for his first ODI wicket.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "Reliance shares: Buy, sell or hold after Q2 results 2026? RIL stock up 384% in 10 yrs! Brokerages advice to investors", "full_content": "Reliance Industries shares are likely to remain in focus on Monday, 2 November, after the Mukesh Ambani-led conglomerate reported a record quarterly profit for the July-September quarter on Friday, 30 October. The company\u2019s strong performance was driven by a sharp recovery in its oil-to-chemicals (O2C) business and continued growth in digital services, which helped offset relatively subdued earnings from retail.\n\nReliance Industries Ltd (RIL) reported a consolidated profit after tax, including its share of associates and joint ventures, of \u20b9 29,550 crore in the second quarter of FY27, marking a 33.8% increase from \u20b9 22,092 crore in the corresponding period last year. Net profit attributable to owners of the company rose 40% year-on-year to \u20b9 25,548 crore.\n\nConsolidated revenue increased 27.8% year-on-year to \u20b9 3,62,268 crore, while EBITDA grew 23.9% to a record \u20b9 62,409 crore. The latest quarterly profit also exceeded the \u20b9 23,196 crore reported in the previous quarter, setting a new high for India\u2019s largest listed company by market capitalisation.\n\nThe O2C business emerged as the biggest contributor to earnings growth, benefiting from stronger global transportation fuel cracks and improving petrochemical margins. EBITDA from the segment jumped 67.9% year-on-year to \u20b9 25,203 crore, while revenue rose 44.2% to \u20b9 2,31,601 crore.\n\nGlobal supply disruptions linked to the West Asia conflict, including tensions around the Strait of Hormuz, along with attacks on refining infrastructure in the region and Russia, pushed fuel cracks to 3.0\u20133.7 times their year-ago levels. Dated Brent crude averaged $97 per barrel during the quarter, up 40.6% year-on-year.\n\nThe improvement in refining margins came despite challenges from geopolitical disruptions, higher crude premiums and rising freight costs. Reliance said its diversified crude sourcing strategy and ability to optimise product placement helped it capture stronger margins.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 10:01 AM IST", "pub_date_relative": "3h ago"}, {"title": "Namibia vs Ireland: Live Streaming: When And Where To Watch 5th ODI Match Live In India", "full_content": "Namibia face Ireland in the fifth ODI on November 1, with the series level 2-2. Check the match time, venue and where to watch the NAM vs IRE decider live in India.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "Netanyahu Out? Eisenkot Firm At Forming Next Israel Govt Amid Calls Of Jew-Arab Alliance", "full_content": "The newly elected Knesset is scheduled to convene on November 10, while the certified election results are expected to be submitted to President Isaac Herzog on November 4.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 09:57 AM IST", "pub_date_relative": "3h ago"}, {"title": "FBI blames North Korean group for $6.3bn Binance cyber heist", "full_content": "Crypto exchanges move to tighten security after record theft from world\u2019s biggest digital assets venue", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 09:54 AM IST", "pub_date_relative": "3h ago"}, {"title": "'Can Do That In 10 Mins': Trump Renews Threat To Strike Iran's Pickaxe Mountain", "full_content": "As Iran denies any nuclear work at the site, IAEA monitors cannot confirm its operational status or nuclear material. Meanwhile, Washington pursues diplomacy despite doubts over Tehran's reliability in honoring deals.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 09:53 AM IST", "pub_date_relative": "3h ago"}, {"title": "New GST reforms start today: Relief for online businesses, no need to open offices in every state; check all the changes", "full_content": "Several GST process reforms will start on November 1. They cover registration, returns and refunds. The 57th GST Council meeting approved them on October 8. These administrative changes will roll out in phases starting Sunday.\n\nThe first reform helps small sellers on e-commerce platforms. Many such online companies sell goods in several states or Union Territories. They have no physical presence in those places.\n\nThey can now name the platform's warehouse there as their principal place of business. It covers sellers who pass on input tax credit. The limit is \u20b9 2.5 lakh a month.\n\nA seller must have a genuine presence in one state. Physical verification and Aadhaar authentication will be done there. Registrations in other states can be obtained with the platform's consent. No tax officer needs to be involved.\n\nThis could help around 9.5 lakh small sellers. They can reach the national market without opening offices in every state. It also creates greater tax parity among competing e-commerce business models.\n\nThe second GST reform simplifies registration for everyone. The GST department has specified the documents and information required for registration, effective from November 1. This will make filing and processing of applications easier.\n\nThe GST portal will also get a user-friendly interface. It will have clear navigation paths, drop-down lists and tooltips. This should reduce rejections and queries due to incorrect or missing details. Applications should also be processed faster.\n\nThe third reform is about faster refunds. The system will automatically sanction full refund claims for excess electronic cash ledger balances. No officer will need to step in.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 09:51 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Bonus share: Just single issue with record date this week: Pharma firm's free shares with 68% returns since IPO; ratio", "full_content": "Sharmila Bhadoria Published 1 Nov 2026, 01:09 PM IST Prefer Livemint on Google Bonus issue record date this week: Shares of Concord Biotech Limited will remain in focus next week due to their upcoming record date for the issuance of bonus shares to eligible investors. The Ahmedabad-headquartered bio-pharmaceutical components manufacturer has fixed Wednesday as the record date for bonus issue.\n\nShares of Concord Biotech ended higher on Friday as part of overall bullish sentiment prevailing across the pharmaceutical sector stocks through the week. As the bonus issue record date approaches, here are all the details about the corporate earnings.\n\nThe company\u2019s board of directors approved a bonus issue in the ratio of 1:1. Which means that every shareholder will receive one equity share for every one existing fully paid up shares held. The issuance of additional shares will be subject to statutory and regulatory approvals.\n\nIt is the only bonus issue record date scheduled for the coming week, as per BSE website data as on November 1. The company has fixed Wednesday, November 4, as the record date to determine eligibility of shareholders for the payout.\n\nWhich means that investors must own the stock before the record date to qualify for the corporate action, ie Tuesday (Nov 3) in this case.\n\nThe stock closed 1.25% higher at \u20b9 1245.30 per share on BSE with a market capitalisation of \u20b9 13,027.86 crore on Friday, October 30. The stock has delivered 1.34% return in one week. Concord Biotech share price touched its 52-week high of \u20b9 1,614.05 per share on August 20, 2026. The stock dipped to its 52-week low of \u20b9 987.05 per share on April 2, 2026.\n\nMeanwhile, its share price value has declined 6.97% in two weeks, 9.33% in one month, and around 14.28% in one year. Concord Biotech listed on exchanges in August 2023.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 01:09 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin tests 38.2% Fib after triangle breakdown: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 12:31 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Binance resumes bitcoin withdrawals after covering bulk of stolen $6.3 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 12:24 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nifty: Will November 2026 bring more returns or disappoint? What does history suggest? What 25 yrs of market data reveal", "full_content": "Indian equities are heading into November after a prolonged phase of weakness, with persistent foreign investor outflows, elevated crude oil prices, rupee depreciation and global uncertainty weighing on market sentiment. The recent correction has also put the spotlight on whether the Nifty 50 can stage a recovery in the final two months of 2026 or if investors should brace for further volatility.\n\nHistorical trends, however, offer some reasons for optimism. Data from 2001 to 2025 shows that November and December have been the strongest months for the Nifty 50, delivering average returns of 2.5% and 2.6%, respectively. The index has ended November in positive territory in 15 of the past 25 years, while December has recorded gains in 17 of those 25 years, according to NSE data analysed by SAMCO Research.\n\nWith Diwali falling on 8 November this year, festive demand, improved consumption sentiment and year-end portfolio adjustments could provide additional support to equities. But will seasonal strength be enough to revive the bulls, or will global headwinds continue to cap gains? A look at 25 years of market data and expert views offers clues on what may lie ahead for Dalal Street.\n\nJahol Prajapati, Equity Research Analyst at SAMCO Securities, said November and December could provide a seasonal boost to Indian equities after several months of persistent weakness.\n\nHistorical data since 2001 shows that November and December are among the Nifty\u2019s strongest months, with average returns of 2.5% and 2.6%, respectively. The index has ended these months in positive territory in 60% and 68% of instances, respectively.\n\nPrajapati noted that Diwali falling on 8 November this year could extend festive activity through the month, potentially supporting consumption sentiment, retail investor participation and market liquidity.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 12:24 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's October Gross GST collections jump 22.9% to Rs 2.31 lakh crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's October Gross GST collections jump 22.9% to Rs 2.31 lakh crore The Economic Times daily newspaper is available online now. Read Today's Paper India's October Gross GST collections jump 22.9% to Rs 2.31 lakh crore SECTIONS India's October Gross GST collections jump 22.9% to Rs 2.31 lakh crore ET Online Last Updated: Nov 01, 2026, 12:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's gross GST collection reached Rs 2.31 lakh crore in October, representing a 22.9% increase from last year. The gross GST collected for the April-October period totaled Rs 14.78 lakh crore, showing a 13.2% growth year-on-year. Maharashtra recorded the highest revenue for October at Rs 35,150 crore, followed by Karnataka and Gujarat. Some states, including Sikkim and Ladakh, experienced significant declines in GST collections during the month.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange  Nov 01, 2026, 01:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian benchmark indices Sensex and Nifty ended the week higher, gaining up to 0.5%, even as broader markets declined amid rising crude oil prices above $117 a barrel. Investors will track oil price movements, foreign institutional investor (FII) activity, global cues and domestic market trends for direction. FIIs turned net buyers after a 10-week selling streak, lending support to sentiment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EPFO Foundation Day Quiz 2026: Full list of winners to be awarded today | What is EPF, EPS, PMVBRY, Vishwas 2026 scheme", "full_content": "On the occasion of the 74th Foundation Day of the Employees\u2019 Provident Fund Organisation ( EPFO ), which is celebrated on 1 November every year, the Ministry of Labour & Employment organised the \u201cEPFO Foundation Day Quiz 2026\u201d in collaboration with MyGov. The winners of the quiz will be felicitated at a function in New Delhi on Sunday.\n\nThe quiz was conducted from 13 to 23 October 2026 and drew 8,584 participants from across India. It aimed to create awareness regarding EPFO's schemes and services, including the Employees\u2019 Provident Fund Scheme, 2026, the Employees\u2019 Pension Scheme, 2026, PMVBRY and Vishwas 2026.\n\nIn a blog post, MyGov announced that all participants would receive e-certificates and added, \"EPFO and MyGov extend their appreciation to all participants for their enthusiastic participation and look forward to their continued engagement in future MyGov activities.\"\n\nThe quiz focused on four EPFO schemes and initiatives aimed at supporting employees and employers. Here\u2019s a closer look at each.\n\nAccording to an official release, the new EPF 2026 scheme, launched under the Code on Social Security, 2020, replaced the erstwhile Employees' Provident Fund Scheme. The EPF 2026 scheme enables members to build their retirement savings through contributions and accrued interest. It also permits members to make partial withdrawals from their savings for specified purposes, including housing, higher education, marriage, and medical treatment, subject to prescribed conditions.\n\nThe erstwhile Employees' Pension Scheme , 1995, was replaced by the new EPS 2026 under the Code. EPS 2026 provides monthly pension benefits to eligible members on superannuation, retirement, or disability.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week The Economic Times daily newspaper is available online now. Read Today's Paper FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week SECTIONS FPIs pull out Rs 34,843 cr from equities in Oct; turn net buyers last week PTI Last Updated: Nov 01, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amidst rising economic fears, foreign portfolio investors withdrew Rs 34,843 crore from Indian equities in October. Although they had made significant contributions in July and August, outflows continued through September. By late October, a turnaround occurred as foreign investors became net buyers, infusing approximately Rs 6,300 crore into the market. Support from domestic institutional investors provided much-needed stability as all eyes turn to potential global impacts on investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Binance to resume crypto withdrawals in phases after record $6 billion hack", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Private Equity Fund Gates Are Features, Not Bugs", "full_content": "The sound of fund gates slamming shut is never welcome. But when it comes to private equity, investors should be less surprised than with real estate or private credit. Still, Wednesday\u2019s news that Partners Group Holdings AG has capped withdrawals from a $8.6 billion vehicle aimed at rich people is troubling for an industry that has put the wealth market at the center of its growth plans.\n\nPrivate equity has struggled to satisfy investors for years now because managers are finding it hard to sell portfolio companies for decent returns and hand cash back. Sentiment and fund raising have suffered; growing withdrawal demands from individual customers won\u2019t help. But this is less of a problem than in private credit because these redeemable funds make up an even tinier portion of total assets in private equity. Most investors in the sector are big institutions that have willingly locked their money up for years,\n\nPartners Group is a bit of an outlier. The Swiss private asset manager has long targeted the rich clients of private banks and is more dependent on them than many rivals, with almost 20% of its money from that source. It first launched these kinds of permanent private equity funds for the wealthy with redemption windows roughly 20 years ago.\n\nHowever, the signal sent by its restriction of withdrawals from its Global Value SICAV evergreen fund weighed on the stock prices of listed peers as well as on Partners Group itself. Partners declined more than 17% on Wednesday, while EQT AB and CVC Capital Partners Plc both slipped more than 6%.\n\nThe gated fund had requests for nearly 10% of net assets to be redeemed, but has an automatic stop at 5%. The fund has plenty of spare cash to hand and could easily have met a higher level of redemptions, but Partners\u2019 Chief Executive Officer David Layton said its mandate was to keep investing in deals and needed money available for that. Investors who really want their money will join a queue to get it back in future quarters.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Fuel, forex and farmers: Why India is betting big on maize", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Fuel, forex and farmers: Why India is betting big on maize The Economic Times daily newspaper is available online now. Read Today's Paper Fuel, forex and farmers: Why India is betting big on maize SECTIONS Fuel, forex and farmers: Why India is betting big on maize By M L Jat , ET CONTRIBUTORS Last Updated: Nov 01, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A grain that once fed chickens now fuels cars and, soon, planes. The harder question is whether Indian farms can keep up with the demand it has created.\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nCan new data protection law guard against SBI-like data breaches?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Companies promised AI gains\u2014 here's how the payoff showed up in earnings", "full_content": "Some companies are beginning to report financial benefits from artificial intelligence investments, as interest in the technology shifts from hype to measurable returns in the latest quarter.\n\nCorporate AI investment has surged as companies look to boost efficiency and become more profitable, reaching $581.7 billion in 2025, up 130% from the previous year, according to the Stanford HAI 2026 AI Index report .\n\nAs CEOs tout the tech's benefits and hyperscalers like Microsoft , Amazon , Google and Meta are expected to spend $700 billion combined this year on its infrastructure, investors are looking for measurable gains.\n\nNow, with third-quarter earnings season underway, some companies are beginning to put numbers around those benefits.\n\nSpanish banking giant Santander said Wednesday that it saw AI initiatives generate 194 million euros ($216 million) in business value in the first nine months of 2026 .\n\nSantander Chief Financial Officer Jos\u00e9 Garc\u00eda Cantera told CNBC that AI is helping the bank reduce low-value tasks so employees can focus on higher-value work.\n\n\"This affects both revenue and costs, so we are actually in the quarter where we can actually link directly to AI a positive contribution,\" Cantera said.\n\n\"AI is being embedded in all the processes that we are conducting at the bank, so it's really difficult to just say how much comes from AI, but clearly AI is improving the quality of our services to clients.\"", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Best 3 stocks to buy: SBI, Britannia, Biocon by Ganesh Dongre of Anand Rathi | Targets, stop-loss, stock market views", "full_content": "BIOCON Asit Manohar Published 1 Nov 2026, 11:29 AM IST Prefer Livemint on Google Stocks to buy | Shares to buy | Ganesh Dongre's stock recommendations: The Indian equity benchmarks ended the week on a positive note, with the Nifty gaining nearly 2% to close at 23,053, while the Bank Nifty advanced 0.75% to settle at 54,686. However, the Nifty 50 index witnessed buying interest at lower levels and recovered towards the 23,200 mark, although it continues to face resistance at higher levels. Sectoral performance remained broadly positive, with most major sectors witnessing gains in the range of 2%\u20137%.\n\nThe Pharma sector emerged as the top performer, rallying nearly 7% during the week. However, despite the recovery in domestic equities, Brent crude oil remains elevated, hovering in the $110\u2013$115 per barrel range, keeping inflationary concerns and global uncertainties in focus.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes a sustained weekly close of the Nifty 50 index above 23,200\u201323,400 would improve the near-term technical outlook of the Indian stock market. Ganesh Dongre of Anand Rathi said that both the Nifty 50 and Bank Nifty index remain in a cautious technical phase. The rebound from oversold levels has improved near-term sentiment; however, a sustained recovery will require the Nifty to establish itself above the 23,200\u201323,400 resistance zone and subsequently reclaim the 24,000\u201324,200 range. Similarly, the Bank Nifty needs to move decisively above 56,400\u201356,500 to strengthen its technical outlook.\n\n\u201cUntil these crucial resistance levels are convincingly breached, markets are likely to remain volatile, with intermittent recovery attempts, range-bound consolidation and selling pressure at higher levels.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crypto Heist: Binance To Resume Withdrawals After Covering 95% Of $6.3 Billion Theft", "full_content": "The largest cryptocurrency exchange has said that it will restart phase 1 of withdrawals on Sunday after the Federal Bureau of Investigation (FBI) linked the theft to North Korea.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 11:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a ITC Q2 Results Preview: Profit seen falling nearly 30% YoY as cigarette tax hikes bite JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ITC Q2 Results Preview: Profit seen fall , "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up Jio Platforms Share Price Bharti Airtel Share Price Vodafone Idea Share Price Bharti Hexacom Share Price Tata Communications Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up SECTIONS IPO Calendar: Primary market cools after Jio frenzy, but 13 listings lined up By Akash Podishetti , ETMarkets.com Last Updated: Nov 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India\u2019s IPO market is set for a quiet week, with just one fresh issue worth Rs 56.68 crore opening for subscription and no mainboard launches. Vedant Poly Fabs will be the only new IPO, while 13 companies are expected to list. The slowdown follows October\u2019s blockbuster Rs 30,188 crore Jio Platforms IPO, which was subscribed over 22 times.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 11:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "5 money lessons from The Simple Path to Wealth by JL Collins: Harness world's most powerful wealth-building tool | List", "full_content": "JL Collins believes building wealth is simple although following the plan can be difficult. His approach uses low-cost index funds to help people become financially independent. His examples are American and need to be adjusted for other countries.\n\nJL Collins says debt weakens your ability to build wealth. Interest payments reduce the income available for your needs and investments. List your debts, reduce unnecessary spending and pay every minimum amount. Use extra money to pay off the debt with the highest interest rate.\n\nRepay debts above 5% quickly. Those charging 3-5% can wait longer. Below 3%, Collins prefers investing the money instead. Remember, the book was published a decade ago. These rates may need to be updated in line with the current market conditions.\n\nCollins recommends Vanguard's Total Stock Market Index Fund, known as VTSAX. It spreads investments across many companies while keeping costs low.\n\nHe says picking winning shares is difficult, even for professionals. He writes, \"Don't feel bad. I can't either.\"\n\nHe admires Vanguard founder Jack Bogle for developing the modern low-cost index fund. Collins also believes complicated investments are less likely to produce profits.\n\nMarket crashes are normal, and Collins highlights the market's long-term recovery record. However, emotions can push investors to buy high and sell low.\n\nHis advice is to remain calm and avoid selling during panic. Keep investing and treat falling prices as opportunities to buy. Staying invested and adding money during crashes can increase wealth over time.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 11:06 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio Platforms vs Bharti Airtel shares: Which telecom stock to buy after Reliance arm\u2019s IPO listing? Experts suggestions", "full_content": "The listing of Jio Platforms has put the spotlight on India\u2019s telecom sector, with investors now weighing whether the newly listed Reliance Industries-backed company or established rival Bharti Airtel offers a better investment opportunity.\n\nJio Platforms shares have surged nearly 28% from their issue price of \u20b9 1,119 since making their market debut on Wednesday, 28 October, taking its market capitalisation to nearly \u20b9 13.18 lakh crore and making it India\u2019s second-most valuable listed company after Reliance Industries. The strong debut and subsequent gains follow an IPO that attracted bids for 22.19 times the shares on offer.\n\nBharti Airtel, meanwhile, has built a strong long-term track record, with its shares delivering returns of 586.10% over the past decade and 187.07% over five years. However, the stock remains down 6.64% so far in 2026. With Jio commanding a substantial valuation and Airtel offering an established earnings track record, which telecom stock should investors consider now? Experts weigh in on their growth prospects, valuations and investment appeal.\n\nThe listing of Reliance Industries\u2019 telecom arm Jio has brought the comparison with Bharti Airtel into sharper focus, but experts believe the investment decision goes beyond subscriber scale and growth prospects. While Jio offers an opportunity to tap into its expanding 5G network and digital ecosystem, its rich valuation raises questions about the returns investors can expect.\n\nBharti Airtel, meanwhile, remains a stronger proposition for investors seeking earnings visibility, higher ARPU, robust cash flows and disciplined capital allocation. Experts say investors should weigh valuations, earnings growth and execution risks before choosing between the two telecom stocks.\n\nGaurav Arora, Head of Research at SAHI, said Jio\u2019s listing at a valuation of around \u20b9 10.3 lakh crore places it among India\u2019s top five companies by market capitalisation from day one.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 11:03 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: How a \u20b969,000 minimum wage demand translates into a proposed \u20b91.12 lakh salary; Check calculations", "full_content": "The 8th Pay Commission was constituted by the central government on 3 November 2025. This is a temporary 3-member panel headed by Justice Ranjana Prakash Desai. The commission was given 18 months, as per the Terms of Reference (ToR) of the commission, to have a discussion with eligible central government unions, pensioners and associations on aspects such as fitment factor, salary revisions, pension reforms, employee grievances, along with a host of other factors and submit its final report to the central government.\n\nOn 3 November 2026, the 8th Pay Commission will complete 12 months of the initially allocated 18 months, as we move towards the final few months before it tables its final report to the central government.\n\nIt is vital to keep in mind that, in its most recent meetings in Bengaluru and Mumbai that concluded on 8 October and 23 October, respectively, the commission gave an opportunity for eligible unions to present their views and highlight their chief grievances in order to bring meaningful and positive changes in the lives of the central government employees and pensioners.\n\nSimilar meetings have been held across the country over the last few months in states such as West Bengal, New Delhi, and Ladakh. In all these meetings and in the memorandums submitted by prominent employee unions over the last few months, a lot of focus has been placed on key aspects such as basic pay and the fitment factor multiplier.\n\nSome unions, such as the Bharatiya Pratiraksha Mazdoor Sangh (BPMS) , have demanded a fitment factor multiplier of 4 to ensure that eligible employees can meaningfully cope with rising inflation.\n\nOn similar lines, the Staff Side of the National Council-Joint Consultative Machinery (NC-JCM) has proposed a minimum monthly basic salary of \u20b9 69,000 for central government employees under the 8th Pay Commission. It has also recommended a fitment factor of 3.833.", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend Watchlist: Key Ex-Dates For Infosys, Mazagon Dock, Coal India And More Next Week", "full_content": "To be eligible for these payouts, investors must be mindful of the ex-dividend date, which is the day the share price adjusts to reflect the upcoming dividend.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:42 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bangladesh Govt Forms Wage Board As Garment Workers Strike Shuts Factories. 140% Hike Next?", "full_content": "The dispute has raised \u200bconcerns about disruption to an industry that employs about 4 \u2060million workers, generates more than 80% of Bangladesh's export earnings and supplies \u200bclothing to many leading Western brands.", "source": "NDTV Profit", "pub_date_str": "01 Nov 2026, 10:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bonus issues, stock splits, dividends: Infosys, Asian Paints among over 40 stocks turning ex-date this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bonus issues, stock splits, dividends: Infosys, Asian Paints among over 40 stocks turning ex-date this week Power Grid Corporation of India Share Price Adani Energy Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bonus issues, stock splits, dividends: Infosys, Asian Paints among over 40 stocks turning ex-date this week SECTIONS Bonus issues, stock splits, dividends: Infosys, Asian Paints among over 40 stocks turning ex-date this week By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 01, 2026, 11:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis More than 40 companies have scheduled record dates for dividends, bonus issues, rights issues and stock splits during November 2\u20136, 2026. Major names include Infosys, Asian Paints, Coal India, Power Grid and Info Edge, while Sanofi India will offer the week\u2019s highest announced dividend of Rs 75 per share.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 10:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Quant hedge fund to spin out of Tudor in record $9bn launch", "full_content": "Xantium to separate from company controlled by billionaire Paul Tudor Jones II next year", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond investors sit out \u2018most consequential\u2019 US midterm elections in years", "full_content": "Big fund managers are pressing \u2018pause\u2019 as vote and economic data releases loom", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Reliance shares: Buy, sell or hold after Q2 results 2026? RIL stock up 384% in 10 yrs! Brokerages advice to investors", "full_content": "Reliance Industries shares are likely to remain in focus on Monday, 2 November, after the Mukesh Ambani-led conglomerate reported a record quarterly profit for the July-September quarter on Friday, 30 October. The company\u2019s strong performance was driven by a sharp recovery in its oil-to-chemicals (O2C) business and continued growth in digital services, which helped offset relatively subdued earnings from retail.\n\nReliance Industries Ltd (RIL) reported a consolidated profit after tax, including its share of associates and joint ventures, of \u20b9 29,550 crore in the second quarter of FY27, marking a 33.8% increase from \u20b9 22,092 crore in the corresponding period last year. Net profit attributable to owners of the company rose 40% year-on-year to \u20b9 25,548 crore.\n\nConsolidated revenue increased 27.8% year-on-year to \u20b9 3,62,268 crore, while EBITDA grew 23.9% to a record \u20b9 62,409 crore. The latest quarterly profit also exceeded the \u20b9 23,196 crore reported in the previous quarter, setting a new high for India\u2019s largest listed company by market capitalisation.\n\nThe O2C business emerged as the biggest contributor to earnings growth, benefiting from stronger global transportation fuel cracks and improving petrochemical margins. EBITDA from the segment jumped 67.9% year-on-year to \u20b9 25,203 crore, while revenue rose 44.2% to \u20b9 2,31,601 crore.\n\nGlobal supply disruptions linked to the West Asia conflict, including tensions around the Strait of Hormuz, along with attacks on refining infrastructure in the region and Russia, pushed fuel cracks to 3.0\u20133.7 times their year-ago levels. Dated Brent crude averaged $97 per barrel during the quarter, up 40.6% year-on-year.\n\nThe improvement in refining margins came despite challenges from geopolitical disruptions, higher crude premiums and rising freight costs. Reliance said its diversified crude sourcing strategy and ability to optimise product placement helped it capture stronger margins.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 10:01 AM IST", "pub_date_relative": "3h ago", "cfa_topi     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
