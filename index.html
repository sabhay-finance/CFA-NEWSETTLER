    const allData = {"general": [{"title": "Hassett denies report he's leaving White House: 'Not true'", "full_content": "National Economic Council Director Kevin Hassett on Friday poured cold water on a report that he's expected to leave the White House in the coming weeks.\n\nThat report is \"not true,\" Hassett told CNBC's Eamon Javers in a text message.\n\nSemafor reported earlier Friday afternoon that Hassett \"has been inquiring about roles outside the administration,\" even before Republicans' drubbing in last week's midterm election.\n\nTreasury Secretary Scott Bessent , and his counselor David Zervos , are among the names being floated to replace Hassett, according to Semafor, which cited unnamed people familiar with his plans.\n\nBut a White House official told CNBC in a statement later Friday, \"There is no factual basis for this reporting.\"\n\n\"Kevin Hassett is a key member of President Trump's economic team and will continue working to advance President Trump's economic policies,\" the official said on condition of anonymity to discuss the matter.\n\nZervos, reached by phone after Semafor's story published, declined to comment.\n\nWhile Hassett denies he is departing the White House, several other Trump administration officials have stepped down since Democrats' staggering wins in the Nov. 3 midterm, flipping Congress blue and overhauling President Donald Trump's plans for the rest of his term.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:57 AM IST", "pub_date_relative": "5m ago"}, {"title": "Nvidia hasn\u2019t selected search firm for permanent Huang replacement, board tells CNBC", "full_content": "Nvidia hasn't yet selected a search firm to work with in identifying a successor for former CEO Jensen Huang , the company's board told CNBC.\n\n\"We are in the process of selecting a search firm for the Nvidia CEO role,\" the board said in a Friday statement. \"We have not formally engaged any potential candidates.\"\n\nThe comments come ices - AP News", "full_content": "Microsoft outage shows the risks of relying on a single technology provider for essential services AP News Microsoft\u2019s Global Outage and Fixes: What We Know The New York Times How the Microsoft outage impacted courts and governments Axios Is Outlook down? Widespread outage hits Microsoft email and other apps AP News Microsoft\u2019s latest email outage turned into a full-blown global cloud crisis TechCrunch", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:48 AM IST", "pub_date_relative": "15m ago"}, {"title": "US SEC proposes scaling back rules on executive pay disclosure", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:42 AM IST", "pub_date_relative": "20m ago"}, {"title": "Enjoei Q3 2026 slides: record GMV growth masks margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:39 AM IST", "pub_date_relative": "24m ago"}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates", "full_content": "The Nasdaq Composite fell on Friday as Nvidia shares added to their recent losses, though the index still headed for a winning week alongside the other two major averages.\n\nThe tech-heavy Nasdaq dropped 0.9%, while the S&P 500 slid 0.5%. The Dow Jones Industrial Average traded around the flatline.\n\nEquities initially popped after October's producer price index reading \u2014 a measure of wholesale inflation \u2014 showed an increase of 0.3% on the month. Economists polled by Dow Jones had seen headline PPI rising 0.4%.\n\nHowever, the report also showed producer prices gaining 6.5% from 12 months earlier \u2014 the biggest annual advance since November 2022.\n\nNvidia shares weighed on the broader market for another day. The stock fell more than 2% Friday, extending the more than 4% drop it saw in the previous session. The pressure came after the exit of the scandal-hit chipmaker's founder and CEO Jensen Huang.\n\nHSBC downgraded the chipmaker Friday to hold, believing that the stock will languish until the company lays out a permanent succession plan.\n\nNvidia's chief financial officer Colette Kress , who's worked at the company for more than a decade, will lead the chipmaker as interim CEO. The company's board is looking both internally and externally for a full-time replacement for Huang.\n\nThomas Martin of Globalt Investments expects the process of finding a new CEO to \"take a lot of time\" and spur even more uncertainty for the name.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "24m ago"}, {"title": "Earnings call transcript: Grupo Mateus posts mixed Q3 2026 results as shares jump", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "24m ago"}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates - CNBC", "full_content": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates CNBC Stock Market Midday, Nov. 13: Nasdaq Plunges as Nvidia Turmoil Deepens and Treasury Yields Hit 5% Yahoo Finance US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap Bloomberg.com What\u2019s Moving Markets Today? WSJ Stock Market Today: Dow, S&P 500 and Nasdaq fall as tech stocks struggle after Nvidia turmoil, but the U.S. equities market remains on track for weekly gain \u2014 live updates MarketWatch", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "25m ago"}, {"title": "CFTC Chair Selig tells CNBC crypto industry is embracing agency rules as legislation hopes fade", "full_content": "The Commodity Futures Trading Commission is already seeing demand from crypto exchanges planning to opt in to its newly proposed rules governing digital assets, according to Chairman Michael Selig.\n\nThe commodities regulator in October proposed rules aimed at preventing abuse in crypto markets and codifying crypto transaction rules under a federal rulebook. In the announcement , Selig said the move was a \"critical step\" in ensuring the United States remains the crypto capital of the world.\n\nSpeaking this week at Cantor Convergence, an annual FinTech conference held in Miami Beach, Selig told CNBC in an exclusive interview that many of the major crypto exchanges are already registered with the CFTC because they offer financial derivatives, including perpetual futures, on their platforms and would now be able to add spot trading.\n\n\"We're also getting interest from new entrants who say, 'Look, signing up with 50 different state regimes is tough.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 01:37 AM IST", "pub_date_relative": "25m ago"}, {"title": "Transcontinental Realty Investors holds annual meeting, elects directors and approves share issuance", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:36 AM IST", "pub_date_relative": "26m ago"}, {"title": "Foreign investors head to Caracas amid political transition in Venezuela, US", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:36 AM IST", "pub_date_relative": "26m ago"}, {"title": "First Merchants declares $0.37 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:34 AM IST", "pub_date_relative": "28m ago"}, {"title": "Earnings week scorecard: beats rewarded selectively as AI-infrastructure names pull back", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:33 AM IST", "pub_date_relative": "29m ago"}, {"title": "American Realty Investors elects board members and ratifies auditor at annual meeting", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:33 AM IST", "pub_date_relative": "30m ago"}, {"title": "US securities watchdog plans to loosen rules for executive pay disclosure", "full_content": "Only CEOs and CFOs would be required to disclose pay packages under Securities and Exchange Commission\u2019s proposal", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 01:33 AM IST", "pub_date_relative": "30m ago"}, {"title": "Cerebras earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:32 AM IST", "pub_date_relative": "30m ago"}, {"title": "Retirees should be big beneficiaries of the midterms: \u2018Democrats will hold every gavel that matters for aging and public policy\u2019", "full_content": "Here\u2019s what might be coming for Social Security, Medicare and long-term care.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 01:32 AM IST", "pub_date_relative": "31m ago"}, {"title": "Supreme Court agrees to hear Robinhood challenge to IPO information omission lawsuit", "full_content": "The Supreme Court on Friday agreed to hear a case in which Robinhood seeks to block a class-action lawsuit over the omission of interim financial data from the online broker's initial public offering in 2021.\n\nRobinhood wants the Supreme Court to overturn a ruling by the 9th Circuit U.S. Court of Appeals that revived a lawsuit by investors against the company and firms involved with the IPO, including Goldman Sachs and J.P. Morgan Securities .\n\nA San Francisco federal court judge had previously dismissed the lawsuit.\n\nThe Trump administration and the Securities and Exchange Commission had urged the Supreme Court to hear Robinhood's appeal.\n\n\"We are pleased the Supreme Court has agreed to hear our case and look forward to presenting our argument,\" a Robinhood spokesperson said in a statement.\n\nCNBC has requested comment from the attorneys representing the plaintiffs in the case.\n\nRobinhood's IPO came on the heels of a surge in investor interest during the Covid-19 pandemic of so-called meme stocks, and trading in the crypto asset Dogecoin.\n\nIn July 2021, Robinhood conducted its IPO, \"for which it prepared a registration statement\" that \"contained only limited information about Robinhood's performance during the second quarter of 2021,\" the 9th Circuit panel that heard the case noted.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "My husband inherited $500,000, but he refuses to spend it on our home. Should I be worried?", "full_content": "\u201cOur kitchen dates from 1999 and the oven only works if you hit the door a certain way.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 01:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Wall St slides as Nvidia uncertainty drags tech shares lower", "full_content": "NEW YORK, Nov 13 (Reuters) - US stocks were lower on Friday, as concerns about Nvidia pressured technology shares, while a reading on inflation failed to alter expectations for more rate hikes from the Federal Reserve.\n\nNvidia's shares fell 2.2% and were poised for their sixth straight week of declines, their longest streak since October 2012, after CEO Jensen Huang's resignation on Thursday, following revelations of his relationship with a businesswoman suspected by the US of spying for Beijing.\n\nThe Financial Times reported that Nvidia's board has approached British chipmaker Arm Holdings CEO Rene Haas in its search for a potential successor to Huang.\n\nThe uncertainty about leadership at the chipmaker has raised concerns about the durability of the AI trade, given Nvidia's primary role in the industry's boom and its financial ties to several companies in the sector, which has been a pillar of the bull market in equities.\n\n\"The tech trade, the AI trade, Nvidia is going to go through a period of volatility, and you're going to see the bulls and bears kind of wrestle on where this narrative goes through the rest of the year ... there's been a loss of confidence,\" said Anthony Saglimbene, chief market strategist at Ameriprise Financial in Troy, Michigan.\n\n\"The market and investors are trying to navigate what does the AI theme look like when we have the absence of Jensen Huang, who was basically the AI champion and willing to use Nvidia's balance sheet to fund a lot of this AI expansion. That's gone.\"\n\nThe Dow Jones Industrial Average fell 5.36 points, or 0.01%, to 52,291.73, the S&P 500 lost 38.87 points, or 0.51%, to 7,553.53 and the Nasdaq Composite lost 236.49 points, or 0.93%, to 25,129.60.\n\nDespite the recent volatility, the major indexes were on track for weekly gains, with the Nasdaq and S&P 500 both set to snap a four-week streak of declines.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 01:28 AM IST", "pub_date_relative": "34m ago"}, {"title": "After Jensen Huang\u2019s exit, what top financial advisors are doing with Nvidia: Exclusive CNBC poll", "full_content": "Shares of Nvidia continued to slide after the market open on Friday after declining 4% on Thursday following news of co-founder Jensen Huang's resignation as chief executive, amid reports about his personal relationships and national security concerns. The news has raised questions for investors about what comes next for a company at the center of the artificial intelligence boom.\n\nTo gauge how wealth managers are responding, CNBC polled members of its Financial Advisor 100 and Financial Advisor Council. Thirty of the 122 firms and professionals contacted responded to the online, multiple-choice flash poll, conducted between 11 a.m. and 5 p.m. EST on Nov. 12. The poll is a snapshot of respondents' views, not a measure of all financial advisors.\n\nMost respondents, 19, said they are holding their Nvidia positions steady. Another four said they are increasing their stake, while seven said they do not own the stock. None said they were selling at the time of the poll.\n\n\"Most of our clients are in a position to hold; the reason is because it makes up a smaller percentage of an overall diversified portfolio,\" Winnie Sun , managing director and founding partner of Irvine, California-based Sun Group Wealth Partners, said in an interview. Sun is a member of the CNBC Financial Advisor Council.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nIn open responses, several advisors wrote that they are taking a \"wait-and-see\" approach before changing their investment strategy with Nvidia and are telling their clients to do the same.\n\n\"Don't react to short-term headlines,\" wrote certified financial planner Peyton Jamison, president of Jamison Private Wealth Management in Alpharetta, Georgia. \"The company's valuation is extremely attractive, and the focus should remain on its underlying fundamentals and long-term investment potential.\" His firm is ranked No.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:23 AM IST", "pub_date_relative": "39m ago"}, {"title": "Jensen Huang Lost His Job. Wall Street Lost Its Biggest Prize. - The New York Times", "full_content": "Jensen Huang Lost His Job. Wall Street Lost Its Biggest Prize. The New York Times EXCLUSIVE: Former Nvidia CEO Huang had a relationship with a second employee, sources say Reuters The powerful figures caught up in the Nvidia scandal Axios Lovers and spies: How foreign agents use \u2018honey traps\u2019 to steal secrets CNN Jensen Huang\u2019s Resignation From Nvidia Worries the A.I. Start-Up World The New York Times", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:22 AM IST", "pub_date_relative": "41m ago"}, {"title": "Goldman Sachs looks to cash in on Anthropic's IPO, twice. Here's how and who else wants to", "full_content": "While co-leading the offering, Goldman also wants a shot at managing the billions of dollars in new wealth that the deal creates. It's not the only one.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:15 AM IST", "pub_date_relative": "47m ago"}, {"title": "Global oil markets swing to surplus as Gulf shipments rebound", "full_content": "IEA analysts warn it will take months to rebuild stockpiles depleted by US-Iran war", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 01:15 AM IST", "pub_date_relative": "47m ago"}, {"title": "Anthropic\u2019s Amodei \u2018not super fussed\u2019 about market turmoil ahead of IPO", "full_content": "AI lab\u2019s chief executive brushes off tech stock turbulence less than a week before planned $1.5tn listing", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 01:11 AM IST", "pub_date_relative": "51m ago"}, {"title": "Budget airlines are going upscale with first-class seats and faster wifi", "full_content": "Forget no-frills: Frontier and JetBlue are chasing luxury flyers, and Wall Street is buying in.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 01:10 AM IST", "pub_date_relative": "53m ago"}, {"title": "Nvidia turmoil reshuffles the AI trade. Winners, losers and what investors should watch", "full_content": "Some chipmakers stand to benefit from Nvidia's fallout, but other AI companies face pressure", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:08 AM IST", "pub_date_relative": "55m ago"}, {"title": "Stock Market Today: Nvidia Slides Again as Investors Brace for More Fallout; Nasdaq Slumps\u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nvidia Slides Again as Investors Brace for More Fallout; Nasdaq Slumps\u2014 Live Updates WSJ Nvidia Has Been the Market\u2019s Golden Goose. Now It\u2019s in Crisis Morningstar How Nvidia's stock decline could impact your 401(k) and portfolio Yahoo Finance EXCLUSIVE: Huang exit and US scrutiny imperil $3 billion in Chinese AI projects reliant on Nvidia Reuters Nvidia\u2019s turmoil is prompting a rotation across chip stocks. Here's what we know CNBC", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:06 AM IST", "pub_date_relative": "57m ago"}, {"title": "Rate-hike bets keep gold on track for worst week in four months", "full_content": "* Spot gold down about 4.5% this week, the most since early June\n\n* Silver, platinum and palladium also head for weekly declines\n\nNov 13 (Reuters) - Gold firmed on Friday as a largely in-line US inflation reading alleviated some bets on a bigger rate hike, but Thursday\u2019s selloff to a more-than-a-year low kept bullion on track for a weekly decline.\n\nSpot gold ticked up 0.1% at $3,879.71 per ounce as of 2:05 p.m. ET (1905 GMT), after briefly touching a session high of $3,922.97 when the US Producer Price Index data came out.\n\nUS gold futures for December delivery settled largely unchanged at $3,886.30 per ounce.\n\nThe Producer Price Index for final demand rose 0.3% last month, after an upwardly revised 1.4% surge in September, data showed on Friday. A Reuters poll had forecast PPI climbing 0.4%.\n\n\"Gold is struggling to hold initial gains from PPI as bond markets continue to struggle, confronted with Fed hawkishness,\" independent analyst Tai Wong said. \"PPI didn't surprise high like last month, but core at 0.3% month-on-month remains too high for policymakers.\"\n\nGold prices slid 3% on Thursday, hitting a more-than-one-year low, as oil climbed, spurring fears of higher inflation and elevated interest rates. The fall was accentuated by hotter-than-expected Consumer Price Index data earlier this week.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 01:04 AM IST", "pub_date_relative": "58m ago"}, {"title": "A trading strategy to ride out the Nvidia uncertainty and generate income in the process", "full_content": "Jensen Huang's abrupt resignation has sent shockwaves through the tech sector, dragging Nvidia's (NVDA) stock down roughly 30% since Oct. 6. The market despises uncertainty, and losing a visionary founder, particularly one without a well-telegraphed succession plan, makes it worse.\n\nHowever, for opportunistic investors, this panic has made the stock cheaper (obviously) while options have become significantly more expensive. Trading in the $160s, Nvidia's valuation has taken a big haircut, yet its underlying business fundamentals remain largely intact. While Huang was the architect of Nvidia's AI dominance, the company's moat \u2014 superior GPUs, the CUDA software ecosystem, and networking expertise \u2014 does not walk out the door with him. The company's structural advantage in the global artificial intelligence rollout persists.\n\nBuying good companies at a discount is investing 101, but the current market dynamics may do something else for those who use options. Huang's departure guarantees that Nvidia will be operating under a cloud of transition for the foreseeable future. Executing a permanent CEO search while navigating global regulatory scrutiny takes time. Consequently, Nvidia's implied volatility (IV)\u2014the market's pricing of expected future price swings \u2014 has spiked to highs not seen since the tariff tantrum in the first half of 2025, and this elevated IV is highly likely to persist for several months as the leadership drama slowly unfolds.\n\nThis prolonged period of high implied volatility can be a goldmine for option sellers, specifically those executing options overlays such as covered call strategies. When you buy NVDA shares at these depressed levels and simultaneously sell out-of-the-money call options against your position, the premiums you collect are directly tied to IV.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock sinks 2% in fallout from Jensen Huang resignation", "full_content": "Nvidia stock sank 2% on Friday, falling below $4 trillion in market cap during midday trading as investors navigated the fallout from CEO Jensen Huang 's resignation .\n\nColette Kress , Nvidia's CFO, will take over as interim CEO, the company announced Thursday.\n\nFollowing the announcement of Huang's departure, shares of Nvidia declined sharply Thursday morning before recovering to close just 4% lower.\n\nHuang was under increasing scrutiny after a series of reports that the CEO was in a relationship with a Chinese woman believed to be a spy for Beijing. Huang disclosed that he had an affair on Sunday in a note to employees. The board also announced an investigation into the matter on Sunday.\n\nNvidia stock chart The New York Times reported on Wednesday that Huang had another extramarital romantic relationship, this one with Kimberly Powell, vice president of health care at Nvidia .\n\nReuters reported on Thursday the existence of yet another affair with an Nvidia employee, which the news agency did not name. Nvidia did not immediately respond to CNBC's request for comment.\n\nBefore Huang resigned, several Wall Street analysts told CNBC that his departure could cost Nvidia as much as 20% of its market value, given how critical he has been to the company's success. Nvidia's stock was already down more than 20% over the last month.\n\nStephane Houri, head of equity research at ODDO BHF, said much of the company's success has been built around Huang, and his influence extended into the broader industry.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Medicare at age 50? What \u2018Medicare for more\u2019 could mean for American workers.", "full_content": "It\u2019s not \u201cMedicare for All,\u201d but a new bill would lower the Medicare age to 50, expanding coverage for 60 million adults", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "The scandal at Nvidia is exactly what\u2019s wrong with the S&P 500", "full_content": "A big chunk of your retirement is likely invested in the computer-chip giant.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "Washington\u2019s efforts to block Beijing\u2019s access to Nvidia chips could spark a \u2018short-lived U.S.-China trade war\u2019 that rattles markets", "full_content": "Meanwhile, top officials from Nvidia and the Commerce Department face a series of congressional hearings next month.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "I inherited $1.4 million from my father. Am I wrong to ask my husband of 25 years for a postnuptial agreement?", "full_content": "\u201cHe has always said he wants his daughter to inherit a chunk of his estate, and I\u2019ve never objected to that.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Lutnick faces questions over Nvidia spy scandal. His sons\u2019 firm has deep ties to the chipmaker", "full_content": "In late September, Cantor Fitzgerald hosted Nvidia CEO Jensen Huang and other top executives from the chipmaker for investor meetings in New York, according to a Cantor research report reviewed by CNBC.\n\n\"We continue to view NVDA as the best risk/reward in our coverage,\" Cantor analyst C.J. Muse and his colleagues wrote in a research report dated Oct. 3 that maintained a $350 price target and overweight rating on the stock.\n\nYet the firm formerly run by Commerce Secretary Howard Lutnick and now led by his sons, Brandon and Kyle, reported a nearly 50% decline in the number of Nvidia shares it held between September 2025 and March 2026 , according to a CNBC analysis of securities filings that excludes options. Nvidia had been one of the largest stock positions reported in Cantor's filings.\n\nThe decline coincided with White House and U.S. intelligence officials pressing Lutnick to crack down on Megaspeed , a Singapore-based company suspected of funneling Nvidia's advanced artificial intelligence chips to China . Lutnick repeatedly resisted those efforts, according to Axios .\n\nBy the time Cantor hosted Huang in New York, Lutnick had also received a classified intelligence warning, according to Axios, about Huang's ties to a suspected Chinese spy and had appeared alongside the CEO at a G20 technology summit in North Carolina.\n\nEven as Cantor pared back its Nvidia stake, it continued doing business across the chipmaker's AI empire.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "US Treasuries set for worst week since Trump\u2019s \u2018liberation day\u2019", "full_content": "Higher than expected inflation and hawkish remarks by Fed officials have stung investors who bet a global bond rout was over", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 12:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Retirees sometimes tap savings for one-off expenses. Here\u2019s what advisors say to consider first", "full_content": "Retirees facing a large expense that's not in their regular household budget may turn to their traditional 401(k) or individual retirement account balances to cover it.\n\nWhile retirement savings may be the easiest place to turn for the money, financial advisors say there are a few things worth considering before making one-off withdrawals.\n\n\"Be aware of the fact that it's not as simple as just taking out the amount of money that [covers] what you want it for,\" said certified financial planner Victoria Trumbower, managing member of Trumbower Financial Advisors in Bethesda, Maryland. The firm ranked No. 19 on CNBC's Financial Advisor 100 list for 2026.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nAt the same time, research shows that many retirees aren't even spending their nest egg . About a third still have 100% or more of their initial assets when they reach their mid-80s, according to a May study by the Employee Benefit Research Institute, a nonpartisan research group.\n\n\"Retirement savings are meant to be spent,\" said CFP Alex Canellopoulos, director of wealth and a partner with Vista Capital Partners in Portland, Oregon. \"A one-time withdrawal isn't necessarily a bad decision, as long as it fits within a sustainable retirement plan.\"\n\nIn 2025, about 15% of 401(k) owners ages 60 to 72 with balances of at least $100,000 who had left their employer made an ad hoc withdrawal from their account, according to Vanguard's How America Retires 2026 report, which analyzed more than 125,000 ex-plan participants.\n\nThis age group falls between the onset of penalty-free withdrawals \u2014 age 59\u00bd \u2014 and the threshold for starting required minimum distributions \u2014 currently age 73. RMDs are amounts that retirees must withdraw annually from traditional 401(k)s and IRAs.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 12:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Strangely calming and unnerving\u2019: How Microsoft\u2019s massive outage upended the corporate workday", "full_content": "A widespread Outlook outage delayed a corporate earnings report, and left users scrambling to submit their schoolwork or find alternate forms of communication.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "What really happens during Medicare open enrollment? High stakes and lots of uncertainty.", "full_content": "Open enrollment can bring unexpected challenges for seniors.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI launches ChatGPT Wallet, allowing its 'dots' AI agents to make purchases for users", "full_content": "OpenAI on Friday announced ChatGPT Wallet, a new payment feature that enables its \"dots\" artificial intelligence agents to make purchases on behalf of users.\n\nThe company built ChatGPT Wallet in partnership with American Express , Mastercard and Visa , and it allows cardholders to maintain their existing credit card rewards and protections. Eligible users enter their card information once, prompt their dot to find items to buy and approve each purchase with a security check.\n\nOpenAI said its dots agents will never actually access a user's card details. Instead, their payment networks will provide the dot with a \"payment token,\" which contains a scoped card number, security code and expiration date that is specific to a given transaction.\n\n\"Our goal here is to really focus on merchants and our network partners and start building out a really great foundation that's safe and easy to use,\" Chaya Nayak, who leads product for monetization and payments at OpenAI, told CNBC in an interview.\n\nChatGPT Wallet comes as a growing number of consumers are exploring how to use personal AI agents to manage their calendars, book travel and complete other day-to-day tasks. OpenAI introduced the dots agents during its annual developer conference in late September, shortly after Meta's Muse offering topped the App Store charts .\n\nPurchases made through ChatGPT Wallet could eventually kick-start a new revenue stream for OpenAI, but the company said it is not taking a cut of transactions to start. With the initial launch, OpenAI is working to build relationships with merchants and position itself as a serious platform for shoppers, especially as vendors are beginning to experiment with personal agents.\n\nOpenAI has pushed deeper into AI-enabled commerce over the last year, but some of its early attempts failed to take off. The company introduced an \" Instant Checkout \" feature last fall, which it quickly pivoted away from.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices set for second straight weekly decline on growing signs of supply surplus", "full_content": "HOUSTON, Nov 13 (Reuters) - Oil prices sagged on Friday, set for a second straight weekly decline, as signs of a growing global supply surplus weighed on the market and Washington's focus on blockading Iran while ramping up other economic pressures allayed fears of renewed hostilities in the nine-month war.\n\nBrent futures were down 5 cents, or 0.05%, to $95.77 a barrel at 11:46 a.m. CDT (1746 GMT). US West Texas Intermediate futures fell 17 cents, or 0.19%, to $88.57 a barrel.\n\nFor the week, Brent and WTI were both on track for a drop of around 2%. The benchmarks fell 16% and 13%, respectively, last week.\n\nWith lower geopolitical risk from the US-Israeli war against Iran and the release on Friday of an International Energy Agency report pointing to a rise in the global oil surplus, the market is going through a major shift.\n\n\"It's clear the biggest fear a few months ago was a fear of shortage,\" said Phil Flynn, senior analyst with the Price Futures Group. \"Now it looks like the biggest fear is a surplus.\"\n\nOil had a volatile trading week, with earlier hopes for a rapprochement between the US and Iran offset by strikes on Saudi Arabian infrastructure by Yemen's Iran-backed Houthis and attacks on tankers shipping crude out of the Gulf.\n\nUS President Donald Trump said on Truth Social that a deal with Iran was not necessary to end the war.\n\n\"Trump's indications that further military escalation against Iran may not be necessary have raised expectations that Washington could increasingly rely on economic sanctions and restrictions on oil shipments rather than intensifying military operations,\" said Sugandha Sachdeva, founder of SS WealthStreet, a New Delhi-based research firm.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Edges Up, Still On Track for Worst Weekly Slump Since June", "full_content": "(Bloomberg) -- Gold edged higher at the end of a downbeat week that saw the metal drop to its lowest point in more than a year.\n\nBullion rose slightly to trade just below $3,900 an ounce. Prices briefly hit a 13-month low on Thursday as investors ramped up bets on the Federal Reserve raising interest rates. Yields on some Treasuries surged by more than 12 basis points in the previous session, with the biggest increases seen in short-term securities that are more sensitive to changes in central bank policy.\n\nThe decline \u201cat the end of the New York session was concerning but correlated well with the rising bond yields,\u201d said Rajeev De Mello, global macro portfolio manager at GAMA Asset Management SA. Friday\u2019s gain \u201ccan only be explained by reserve managers stepping in,\u201d after gold slipped below $4,000 an ounce earlier this week, he added.\n\nGold previously tested that key psychological level in July and again in late October, with demand from long-term investors such as central banks and large institutional buyers, along with Chinese households, supporting prices.\n\nStill, bullion was set for a weekly drop of about 4.3%, the largest since June. The decline was triggered by a report showing faster-than-expected increase in US consumer prices, and hawkish comments from Fed officials. Higher borrowing costs tend to weigh on gold, as it doesn\u2019t pay interest.\n\nTraders are pricing in a quarter-point rate increase from the Fed next month, with an an outside chance of a half-point move. Some also see hikes extending beyond December.\n\nSpot gold rose 0.5% to $3,894.79 an ounce as of 12:16 p.m. London time, while silver edged higher to $50.05. Platinum declined, and palladium advanced. The Bloomberg Dollar Spot Index was little changed.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Friday: Nvidia, Cisco Systems, AMD, Apple, Modine & more", "full_content": "Selling resumed in a swath of artificial intelligence names on Friday, with Advanced Micro Devices , CoreWeave and Dell Technologies skidding in afternoon trading.\n\nCisco Systems also fell, even as top- and bottom-line results delivered late Thursday surpassed estimates and projections for the current quarter came in ahead of expectations.\n\nNvidia continued its slump to cap a rocky week for the dominant maker of chips for use in artificial intelligence. Shares are on pace for their worst weekly performance since January 2025.\n\nApple shares climbed nearly 1% Friday, reaching an intraday record of $360.80, lifting the company's market value above $5.2 trillion.\n\nApple stock price The stock has benefited as investors move away from companies exposed to the AI infrastructure boom.\n\nWhile many of its Magnificent Seven peers are committed to AI infrastructure buildouts, Apple has managed to stay away from the costly AI arms race. Bernstein analysts recently called Apple a \"safe haven \" and reiterated an outperform rating on Apple in the report, and a $380 price target, implying about 7% upside from Thursday's close.\n\nLiftoff Mobile, a mobile advertising platform, soared 22% on the back of a quarterly beat and solid guidance.\n\nLiftoff Mobile on Friday Third-quarter earnings of 47 cents per share and revenue of $238 million surpassed the FactSet consensus estimate of 18 cents a share and $221.7 million.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 12:02 AM IST", "pub_date_relative": "2h ago"}, {"title": "Argentina vs Uruguay Live Streaming: When And Where To Watch International Friendly ?", "full_content": "Argentina are set to begin life without Lionel Messi as they take on Uruguay in an international friendly.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:01 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia Eyes Arm CEO Rene Haas\u2014A Seven-Year Nvidia Veteran\u2014To Replace Jensen Huang", "full_content": "Nvidia has reportedly approached Arm CEO Rene Haas as it searches for a permanent successor to Jensen Huang. Haas is among several candidates under consideration, according to the Financial Times.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Microsoft apologizes for massive outage that took down Outlook and other 365 services", "full_content": "Microsoft issued an apology Friday for a wide-ranging outage that shut down Outlook and other Microsoft 365 products, as the company worked to restore service nearly 24 hours after connectivity problems began.\n\n\"We are deeply sorry for the disruption this incident has caused our customers and partners. We know the trust they place in our services and take that responsibility extremely seriously,\" a Microsoft spokesperson said Friday. \"We are seeing broad recovery and stability across our services.\"\n\nIn a statement, Microsoft said the connectivity disruption stemmed from \"an issue during an earlier network capacity upgrade.\" The software giant said the underlying cause of the outage had been addressed and that they were still working to restore services to some customers.\n\nEngineers scrambled to solve connectivity problems that began shortly before 1 p.m. ET on Thursday.\n\nEmail and calendar service Outlook, along with multiple Microsoft 365 services such as Sharepoint and Copilot, were largely down during the morning hours in the U.S. on Friday and throughout the Asian and European business days. Numerous external services that connect with Microsoft products were also hit. Users began to regain access to email and other services Friday morning.\n\nIn an update around 10:30 a.m. ET, Microsoft noted \"encouraging recovery progress\" and said that \"service availability and email delivery performance [was] improving across a growing portion of affected infrastructure\" as Outlook and other Microsoft 365 tools began to come back online.\n\nIn an earlier update Friday morning, Microsoft said that email queues were \"approaching normal levels,\" but that intermittent issues were expected as recovery efforts continue. It had previously given updates by region, with Asia Pacific services among the first to start normalizing.\n\nEngineering teams have been taking affected systems offline for fixes and bringing them back online gradually stages.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 11:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Short-duration vs long-duration debt mutual funds: Where should you invest as interest rates are expected to rise now?", "full_content": "Investors looking to invest in debt mutual funds may want to focus on short-duration strategies as interest rates are expected to rise further. Axis Mutual Fund expects the Reserve Bank of India (RBI) to tighten monetary policy by another 50\u201375 basis points in the near term. Against this backdrop, the fund house favours high-quality corporate bonds with three-to-five-year maturities and short-duration, accrual-focused investment strategies.\n\nIn its November 2026 fixed-income outlook, Axis Mutual Fund said bond yields could remain volatile over the next three to six months as markets respond to domestic and global developments. It expects the operative policy rate to move towards 6\u20136.25%, although the pace of further tightening will depend on inflation, crude oil prices and economic growth.\n\nThe 10-year government security (G-Sec) yield rose from 7.18% at the end of September to 7.41% at the end of October, according to the report. Axis Mutual Fund attributed the increase to elevated crude oil prices, tighter domestic liquidity, foreign investor outflows and a more restrictive monetary policy.\n\nThe RBI raised the repo rate by 25 basis points to 5.5%, its first rate hike since February 2023, and shifted its policy stance from neutral to calibrated tightening. It also raised its FY27 consumer price index (CPI) inflation forecast to 5.2%, while projecting GDP growth at 7.1%.\n\nAxis expects bond yields to trade in a broad range over the next three to six months, with intermittent volatility. While a meaningful part of the anticipated monetary tightening appears to have been reflected in market yields, the direction of rates will remain sensitive to domestic inflation and global developments.\n\nAxis Mutual Fund prefers high-quality corporate bonds in the three-to-five-year maturity segment.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic CEO Dario Amodei aims to 'underpromise and overdeliver' as IPO valuation drops below $2T hopes - Yahoo Finance", "full_content": "Anthropic CEO Dario Amodei aims to 'underpromise and overdeliver' as IPO valuation drops below $2T hopes Yahoo Finance Wall Street Braces for Anthropic\u2019s Aggressive Spending The New York Times Anthropic, PBC - S-1/A-2 SEC.gov How Anthropic stacks up against some of the biggest US IPOs Reuters Anthropic CEO Calls Computing Power \u2018Deepest Business Dilemma\u2019 Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 11:42 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Hassett denies report he's leaving White House: 'Not true'", "full_content": "National Economic Council Director Kevin Hassett on Friday poured cold water on a report that he's expected to leave the White House in the coming weeks.\n\nThat report is \"not true,\" Hassett told CNBC's Eamon Javers in a text message.\n\nSemafor reported earlier Friday afternoon that Hassett \"has been inquiring about roles outside the administration,\" even before Republicans' drubbing in last week's midterm election.\n\nTreasury Secretary Scott Bessent , and his counselor David Zervos , are among the names being floated to replace Hassett, according to Semafor, which cited unnamed people familiar with his plans.\n\nBut a White House official told CNBC in a statement later Friday, \"There is no factual basis for this reporting.\"\n\n\"Kevin Hassett is a key member of President Trump's economic team and will continue working to advance President Trump's economic policies,\" the official said on condition of anonymity to discuss the matter.\n\nZervos, reached by phone after Semafor's story published, declined to comment.\n\nWhile Hassett denies he is departing the White House, several other Trump administration officials have stepped down since Democrats' staggering wins in the Nov. 3 midterm, flipping Congress blue and overhauling President Donald Trump's plans for the rest of his term.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:57 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nvidia hasn\u2019t selected search firm for permanent Huang replacement, board tells CNBC", "full_content": "Nvidia hasn't yet selected a search firm to work with in identifying a successor for former CEO Jensen Huang , the company's board told CNBC.\n\n\"We are in the process of selecting a search firm for the Nvidia CEO role,\" the board said in a Friday statement. \"We have not formally engaged any potential candidates.\"\n\nThe comments come after speculation has swirled about who might be tapped to replace Huang. Nvidia announced Thursday that Huang would step down as CEO of the chipmaker after multiple reported affairs, including one with a woman purported to be a Chinese spy.\n\nNvidia named CFO Colette Kress as interim CEO and said it will begin a search for a permanent CEO to replace Huang, adding that it will consider both internal and external candidates. Kress conducted her first meeting as interim CEO on Thursday afternoon with high-level executives at Nvidia's headquarters in Santa Clara, Calif., according to a person familiar with the matter, who asked not to be named in order to discuss internal details.\n\nThe Financial Times reported Friday that Nvidia's board has approached Arm CEO Rene Haas in its search for Huang's successor, citing people familiar with the matter.\n\nNvidia's board said, \"Any speculation regarding individual candidates, whether internal or external, is premature.\"\n\nBefore joining the SoftBank-backed chip company in 2013, Haas spent seven years at Nvidia, serving in a variety of roles including vice president of its computing products business.\n\nNvidia shares fell more than 2% on Friday, dragging the company's market cap below $4 trillion as investors digested the news of Huang's departure, and the specter of ongoing probes into his conduct.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 01:51 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US SEC proposes scaling back rules on executive pay disclosure", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:42 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates", "full_content": "The Nasdaq Composite fell on Friday as Nvidia shares added to their recent losses, though the index still headed for a winning week alongside the other two major averages.\n\nThe tech-heavy Nasdaq dropped 0.9%, while the S&P 500 slid 0.5%. The Dow Jones Industrial Average traded around the flatline.\n\nEquities initially popped after October's producer price index reading \u2014 a measure of wholesale inflation \u2014 showed an increase of 0.3% on the month. Economists polled by Dow Jones had seen headline PPI rising 0.4%.\n\nHowever, the report also showed producer prices gaining 6.5% from 12 months earlier \u2014 the biggest annual advance since November 2022.\n\nNvidia shares weighed on the broader market for another day. The stock fell more than 2% Friday, extending the more than 4% drop it saw in the previous session. The pressure came after the exit of the scandal-hit chipmaker's founder and CEO Jensen Huang.\n\nHSBC downgraded the chipmaker Friday to hold, believing that the stock will languish until the company lays out a permanent succession plan.\n\nNvidia's chief financial officer Colette Kress , who's worked at the company for more than a decade, will lead the chipmaker as interim CEO. The company's board is looking both internally and externally for a full-time replacement for Huang.\n\nThomas Martin of Globalt Investments expects the process of finding a new CEO to \"take a lot of time\" and spur even more uncertainty for the name.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Grupo Mateus posts mixed Q3 2026 results as shares jump", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates - CNBC", "full_content": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates CNBC Stock Market Midday, Nov. 13: Nasdaq Plunges as Nvidia Turmoil Deepens and Treasury Yields Hit 5% Yahoo Finance US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap Bloomberg.com What\u2019s Moving Markets Today? WSJ Stock Market Today: Dow, S&P 500 and Nasdaq fall as tech stocks struggle after Nvidia turmoil, but the U.S. equities market remains on track for weekly gain \u2014 live updates MarketWatch", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:38 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CFTC Chair Selig tells CNBC crypto industry is embracing agency rules as legislation hopes fade", "full_content": "The Commodity Futures Trading Commission is already seeing demand from crypto exchanges planning to opt in to its newly proposed rules governing digital assets, according to Chairman Michael Selig.\n\nThe commodities regulator in October proposed rules aimed at preventing abuse in crypto markets and codifying crypto transaction rules under a federal rulebook. In the announcement , Selig said the move was a \"critical step\" in ensuring the United States remains the crypto capital of the world.\n\nSpeaking this week at Cantor Convergence, an annual FinTech conference held in Miami Beach, Selig told CNBC in an exclusive interview that many of the major crypto exchanges are already registered with the CFTC because they offer financial derivatives, including perpetual futures, on their platforms and would now be able to add spot trading.\n\n\"We're also getting interest from new entrants who say, 'Look, signing up with 50 different state regimes is tough.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 01:37 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "First Merchants declares $0.37 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:34 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings week scorecard: beats rewarded selectively as AI-infrastructure names pull back", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:33 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US securities watchdog plans to loosen rules for executive pay disclosure", "full_content": "Only CEOs and CFOs would be required to disclose pay packages under Securities and Exchange Commission\u2019s proposal", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 01:33 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Cerebras earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:32 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Supreme Court agrees to hear Robinhood challenge to IPO information omission lawsuit", "full_content": "The Supreme Court on Friday agreed to hear a case in which Robinhood seeks to block a class-action lawsuit over the omission of interim financial data from the online broker's initial public offering in 2021.\n\nRobinhood wants the Supreme Court to overturn a ruling by the 9th Circuit U.S. Court of Appeals that revived a lawsuit by investors against the company and firms involved with the IPO, including Goldman Sachs and J.P. Morgan Securities .\n\nA San Francisco federal court judge had previously dismissed the lawsuit.\n\nThe Trump administration and the Securities and Exchange Commission had urged the Supreme Court to hear Robinhood's appeal.\n\n\"We are pleased the Supreme Court has agreed to hear our case and look forward to presenting our argument,\" a Robinhood spokesperson said in a statement.\n\nCNBC has requested comment from the attorneys representing the plaintiffs in the case.\n\nRobinhood's IPO came on the heels of a surge in investor interest during the Covid-19 pandemic of so-called meme stocks, and trading in the crypto asset Dogecoin.\n\nIn July 2021, Robinhood conducted its IPO, \"for which it prepared a registration statement\" that \"contained only limited information about Robinhood's performance during the second quarter of 2021,\" the 9th Circuit panel that heard the case noted.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:30 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall St slides as Nvidia uncertainty drags tech shares lower", "full_content": "NEW YORK, Nov 13 (Reuters) - US stocks were lower on Friday, as concerns about Nvidia pressured technology shares, while a reading on inflation failed to alter expectations for more rate hikes from the Federal Reserve.\n\nNvidia's shares fell 2.2% and were poised for their sixth straight week of declines, their longest streak since October 2012, after CEO Jensen Huang's resignation on Thursday, following revelations of his relationship with a businesswoman suspected by the US of spying for Beijing.\n\nThe Financial Times reported that Nvidia's board has approached British chipmaker Arm Holdings CEO Rene Haas in its search for a potential successor to Huang.\n\nThe uncertainty about leadership at the chipmaker has raised concerns about the durability of the AI trade, given Nvidia's primary role in the industry's boom and its financial ties to several companies in the sector, which has been a pillar of the bull market in equities.\n\n\"The tech trade, the AI trade, Nvidia is going to go through a period of volatility, and you're going to see the bulls and bears kind of wrestle on where this narrative goes through the rest of the year ... there's been a loss of confidence,\" said Anthony Saglimbene, chief market strategist at Ameriprise Financial in Troy, Michigan.\n\n\"The market and investors are trying to navigate what does the AI theme look like when we have the absence of Jensen Huang, who was basically the AI champion and willing to use Nvidia's balance sheet to fund a lot of this AI expansion. That's gone.\"\n\nThe Dow Jones Industrial Average fell 5.36 points, or 0.01%, to 52,291.73, the S&P 500 lost 38.87 points, or 0.51%, to 7,553.53 and the Nasdaq Composite lost 236.49 points, or 0.93%, to 25,129.60.\n\nDespite the recent volatility, the major indexes were on track for weekly gains, with the Nasdaq and S&P 500 both set to snap a four-week streak of declines.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 01:28 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "After Jensen Huang\u2019s exit, what top financial advisors are doing with Nvidia: Exclusive CNBC poll", "full_content": "Shares of Nvidia continued to slide after the market open on Friday after declining 4% on Thursday following news of co-founder Jensen Huang's resignation as chief executive, amid reports about his personal relationships and national security concerns. The news has raised questions for investors about what comes next for a company at the center of the artificial intelligence boom.\n\nTo gauge how wealth managers are responding, CNBC polled members of its Financial Advisor 100 and Financial Advisor Council. Thirty of the 122 firms and professionals contacted responded to the online, multiple-choice flash poll, conducted between 11 a.m. and 5 p.m. EST on Nov. 12. The poll is a snapshot of respondents' views, not a measure of all financial advisors.\n\nMost respondents, 19, said they are holding their Nvidia positions steady. Another four said they are increasing their stake, while seven said they do not own the stock. None said they were selling at the time of the poll.\n\n\"Most of our clients are in a position to hold; the reason is because it makes up a smaller percentage of an overall diversified portfolio,\" Winnie Sun , managing director and founding partner of Irvine, California-based Sun Group Wealth Partners, said in an interview. Sun is a member of the CNBC Financial Advisor Council.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nIn open responses, several advisors wrote that they are taking a \"wait-and-see\" approach before changing their investment strategy with Nvidia and are telling their clients to do the same.\n\n\"Don't react to short-term headlines,\" wrote certified financial planner Peyton Jamison, president of Jamison Private Wealth Management in Alpharetta, Georgia. \"The company's valuation is extremely attractive, and the focus should remain on its underlying fundamentals and long-term investment potential.\" His firm is ranked No.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:23 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman Sachs looks to cash in on Anthropic's IPO, twice. Here's how and who else wants to", "full_content": "While co-leading the offering, Goldman also wants a shot at managing the billions of dollars in new wealth that the deal creates. It's not the only one.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:15 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic\u2019s Amodei \u2018not super fussed\u2019 about market turmoil ahead of IPO", "full_content": "AI lab\u2019s chief executive brushes off tech stock turbulence less than a week before planned $1.5tn listing", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 01:11 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Nvidia Slides Again as Investors Brace for More Fallout; Nasdaq Slumps\u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nvidia Slides Again as Investors Brace for More Fallout; Nasdaq Slumps\u2014 Live Updates WSJ Nvidia Has Been the Market\u2019s Golden Goose. Now It\u2019s in Crisis Morningstar How Nvidia's stock decline could impact your 401(k) and portfolio Yahoo Finance EXCLUSIVE: Huang exit and US scrutiny imperil $3 billion in Chinese AI projects reliant on Nvidia Reuters Nvidia\u2019s turmoil is prompting a rotation across chip stocks. Here's what we know CNBC", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 01:06 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rate-hike bets keep gold on track for worst week in four months", "full_content": "* Spot gold down about 4.5% this week, the most since early June\n\n* Silver, platinum and palladium also head for weekly declines\n\nNov 13 (Reuters) - Gold firmed on Friday as a largely in-line US inflation reading alleviated some bets on a bigger rate hike, but Thursday\u2019s selloff to a more-than-a-year low kept bullion on track for a weekly decline.\n\nSpot gold ticked up 0.1% at $3,879.71 per ounce as of 2:05 p.m. ET (1905 GMT), after briefly touching a session high of $3,922.97 when the US Producer Price Index data came out.\n\nUS gold futures for December delivery settled largely unchanged at $3,886.30 per ounce.\n\nThe Producer Price Index for final demand rose 0.3% last month, after an upwardly revised 1.4% surge in September, data showed on Friday. A Reuters poll had forecast PPI climbing 0.4%.\n\n\"Gold is struggling to hold initial gains from PPI as bond markets continue to struggle, confronted with Fed hawkishness,\" independent analyst Tai Wong said. \"PPI didn't surprise high like last month, but core at 0.3% month-on-month remains too high for policymakers.\"\n\nGold prices slid 3% on Thursday, hitting a more-than-one-year low, as oil climbed, spurring fears of higher inflation and elevated interest rates. The fall was accentuated by hotter-than-expected Consumer Price Index data earlier this week.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 01:04 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A trading strategy to ride out the Nvidia uncertainty and generate income in the process", "full_content": "Jensen Huang's abrupt resignation has sent shockwaves through the tech sector, dragging Nvidia's (NVDA) stock down roughly 30% since Oct. 6. The market despises uncertainty, and losing a visionary founder, particularly one without a well-telegraphed succession plan, makes it worse.\n\nHowever, for opportunistic investors, this panic has made the stock cheaper (obviously) while options have become significantly more expensive. Trading in the $160s, Nvidia's valuation has taken a big haircut, yet its underlying business fundamentals remain largely intact. While Huang was the architect of Nvidia's AI dominance, the company's moat \u2014 superior GPUs, the CUDA software ecosystem, and networking expertise \u2014 does not walk out the door with him. The company's structural advantage in the global artificial intelligence rollout persists.\n\nBuying good companies at a discount is investing 101, but the current market dynamics may do something else for those who use options. Huang's departure guarantees that Nvidia will be operating under a cloud of transition for the foreseeable future. Executing a permanent CEO search while navigating global regulatory scrutiny takes time. Consequently, Nvidia's implied volatility (IV)\u2014the market's pricing of expected future price swings \u2014 has spiked to highs not seen since the tariff tantrum in the first half of 2025, and this elevated IV is highly likely to persist for several months as the leadership drama slowly unfolds.\n\nThis prolonged period of high implied volatility can be a goldmine for option sellers, specifically those executing options overlays such as covered call strategies. When you buy NVDA shares at these depressed levels and simultaneously sell out-of-the-money call options against your position, the premiums you collect are directly tied to IV.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia stock sinks 2% in fallout from Jensen Huang resignation", "full_content": "Nvidia stock sank 2% on Friday, falling below $4 trillion in market cap during midday trading as investors navigated the fallout from CEO Jensen Huang 's resignation .\n\nColette Kress , Nvidia's CFO, will take over as interim CEO, the company announced Thursday.\n\nFollowing the announcement of Huang's departure, shares of Nvidia declined sharply Thursday morning before recovering to close just 4% lower.\n\nHuang was under increasing scrutiny after a series of reports that the CEO was in a relationship with a Chinese woman believed to be a spy for Beijing. Huang disclosed that he had an affair on Sunday in a note to employees. The board also announced an investigation into the matter on Sunday.\n\nNvidia stock chart The New York Times reported on Wednesday that Huang had another extramarital romantic relationship, this one with Kimberly Powell, vice president of health care at Nvidia .\n\nReuters reported on Thursday the existence of yet another affair with an Nvidia employee, which the news agency did not name. Nvidia did not immediately respond to CNBC's request for comment.\n\nBefore Huang resigned, several Wall Street analysts told CNBC that his departure could cost Nvidia as much as 20% of its market value, given how critical he has been to the company's success. Nvidia's stock was already down more than 20% over the last month.\n\nStephane Houri, head of equity research at ODDO BHF, said much of the company's success has been built around Huang, and his influence extended into the broader industry.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The scandal at Nvidia is exactly what\u2019s wrong with the S&P 500", "full_content": "A big chunk of your retirement is likely invested in the computer-chip giant.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Lutnick faces questions over Nvidia spy scandal. His sons\u2019 firm has deep ties to the chipmaker", "full_content": "In late September, Cantor Fitzgerald hosted Nvidia CEO Jensen Huang and other top executives from the chipmaker for investor meetings in New York, according to a Cantor research report reviewed by CNBC.\n\n\"We continue to view NVDA as the best risk/reward in our coverage,\" Cantor analyst C.J. Muse and his colleagues wrote in a research report dated Oct. 3 that maintained a $350 price target and overweight rating on the stock.\n\nYet the firm formerly run by Commerce Secretary Howard Lutnick and now led by his sons, Brandon and Kyle, reported a nearly 50% decline in the number of Nvidia shares it held between September 2025 and March 2026 , according to a CNBC analysis of securities filings that excludes options. Nvidia had been one of the largest stock positions reported in Cantor's filings.\n\nThe decline coincided with White House and U.S. intelligence officials pressing Lutnick to crack down on Megaspeed , a Singapore-based company suspected of funneling Nvidia's advanced artificial intelligence chips to China . Lutnick repeatedly resisted those efforts, according to Axios .\n\nBy the time Cantor hosted Huang in New York, Lutnick had also received a classified intelligence warning, according to Axios, about Huang's ties to a suspected Chinese spy and had appeared alongside the CEO at a G20 technology summit in North Carolina.\n\nEven as Cantor pared back its Nvidia stake, it continued doing business across the chipmaker's AI empire.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "US Treasuries set for worst week since Trump\u2019s \u2018liberation day\u2019", "full_content": "Higher than expected inflation and hawkish remarks by Fed officials have stung investors who bet a global bond rout was over", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 12:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Retirees sometimes tap savings for one-off expenses. Here\u2019s what advisors say to consider first", "full_content": "Retirees facing a large expense that's not in their regular household budget may turn to their traditional 401(k) or individual retirement account balances to cover it.\n\nWhile retirement savings may be the easiest place to turn for the money, financial advisors say there are a few things worth considering before making one-off withdrawals.\n\n\"Be aware of the fact that it's not as simple as just taking out the amount of money that [covers] what you want it for,\" said certified financial planner Victoria Trumbower, managing member of Trumbower Financial Advisors in Bethesda, Maryland. The firm ranked No. 19 on CNBC's Financial Advisor 100 list for 2026.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nAt the same time, research shows that many retirees aren't even spending their nest egg . About a third still have 100% or more of their initial assets when they reach their mid-80s, according to a May study by the Employee Benefit Research Institute, a nonpartisan research group.\n\n\"Retirement savings are meant to be spent,\" said CFP Alex Canellopoulos, director of wealth and a partner with Vista Capital Partners in Portland, Oregon. \"A one-time withdrawal isn't necessarily a bad decision, as long as it fits within a sustainable retirement plan.\"\n\nIn 2025, about 15% of 401(k) owners ages 60 to 72 with balances of at least $100,000 who had left their employer made an ad hoc withdrawal from their account, according to Vanguard's How America Retires 2026 report, which analyzed more than 125,000 ex-plan participants.\n\nThis age group falls between the onset of penalty-free withdrawals \u2014 age 59\u00bd \u2014 and the threshold for starting required minimum distributions \u2014 currently age 73. RMDs are amounts that retirees must withdraw annually from traditional 401(k)s and IRAs.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 12:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "\u2018Strangely calming and unnerving\u2019: How Microsoft\u2019s massive outage upended the corporate workday", "full_content": "A widespread Outlook outage delayed a corporate earnings report, and left users scrambling to submit their schoolwork or find alternate forms of communication.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Nov 2026, 12:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI launches ChatGPT Wallet, allowing its 'dots' AI agents to make purchases for users", "full_content": "OpenAI on Friday announced ChatGPT Wallet, a new payment feature that enables its \"dots\" artificial intelligence agents to make purchases on behalf of users.\n\nThe company built ChatGPT Wallet in partnership with American Express , Mastercard and Visa , and it allows cardholders to maintain their existing credit card rewards and protections. Eligible users enter their card information once, prompt their dot to find items to buy and approve each purchase with a security check.\n\nOpenAI said its dots agents will never actually access a user's card details. Instead, their payment networks will provide the dot with a \"payment token,\" which contains a scoped card number, security code and expiration date that is specific to a given transaction.\n\n\"Our goal here is to really focus on merchants and our network partners and start building out a really great foundation that's safe and easy to use,\" Chaya Nayak, who leads product for monetization and payments at OpenAI, told CNBC in an interview.\n\nChatGPT Wallet comes as a growing number of consumers are exploring how to use personal AI agents to manage their calendars, book travel and complete other day-to-day tasks. OpenAI introduced the dots agents during its annual developer conference in late September, shortly after Meta's Muse offering topped the App Store charts .\n\nPurchases made through ChatGPT Wallet could eventually kick-start a new revenue stream for OpenAI, but the company said it is not taking a cut of transactions to start. With the initial launch, OpenAI is working to build relationships with merchants and position itself as a serious platform for shoppers, especially as vendors are beginning to experiment with personal agents.\n\nOpenAI has pushed deeper into AI-enabled commerce over the last year, but some of its early attempts failed to take off. The company introduced an \" Instant Checkout \" feature last fall, which it quickly pivoted away from.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil prices set for second straight weekly decline on growing signs of supply surplus", "full_content": "HOUSTON, Nov 13 (Reuters) - Oil prices sagged on Friday, set for a second straight weekly decline, as signs of a growing global supply surplus weighed on the market and Washington's focus on blockading Iran while ramping up other economic pressures allayed fears of renewed hostilities in the nine-month war.\n\nBrent futures were down 5 cents, or 0.05%, to $95.77 a barrel at 11:46 a.m. CDT (1746 GMT). US West Texas Intermediate futures fell 17 cents, or 0.19%, to $88.57 a barrel.\n\nFor the week, Brent and WTI were both on track for a drop of around 2%. The benchmarks fell 16% and 13%, respectively, last week.\n\nWith lower geopolitical risk from the US-Israeli war against Iran and the release on Friday of an International Energy Agency report pointing to a rise in the global oil surplus, the market is going through a major shift.\n\n\"It's clear the biggest fear a few months ago was a fear of shortage,\" said Phil Flynn, senior analyst with the Price Futures Group. \"Now it looks like the biggest fear is a surplus.\"\n\nOil had a volatile trading week, with earlier hopes for a rapprochement between the US and Iran offset by strikes on Saudi Arabian infrastructure by Yemen's Iran-backed Houthis and attacks on tankers shipping crude out of the Gulf.\n\nUS President Donald Trump said on Truth Social that a deal with Iran was not necessary to end the war.\n\n\"Trump's indications that further military escalation against Iran may not be necessary have raised expectations that Washington could increasingly rely on economic sanctions and restrictions on oil shipments rather than intensifying military operations,\" said Sugandha Sachdeva, founder of SS WealthStreet, a New Delhi-based research firm.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Gold Edges Up, Still On Track for Worst Weekly Slump Since June", "full_content": "(Bloomberg) -- Gold edged higher at the end of a downbeat week that saw the metal drop to its lowest point in more than a year.\n\nBullion rose slightly to trade just below $3,900 an ounce. Prices briefly hit a 13-month low on Thursday as investors ramped up bets on the Federal Reserve raising interest rates. Yields on some Treasuries surged by more than 12 basis points in the previous session, with the biggest increases seen in short-term securities that are more sensitive to changes in central bank policy.\n\nThe decline \u201cat the end of the New York session was concerning but correlated well with the rising bond yields,\u201d said Rajeev De Mello, global macro portfolio manager at GAMA Asset Management SA. Friday\u2019s gain \u201ccan only be explained by reserve managers stepping in,\u201d after gold slipped below $4,000 an ounce earlier this week, he added.\n\nGold previously tested that key psychological level in July and again in late October, with demand from long-term investors such as central banks and large institutional buyers, along with Chinese households, supporting prices.\n\nStill, bullion was set for a weekly drop of about 4.3%, the largest since June. The decline was triggered by a report showing faster-than-expected increase in US consumer prices, and hawkish comments from Fed officials. Higher borrowing costs tend to weigh on gold, as it doesn\u2019t pay interest.\n\nTraders are pricing in a quarter-point rate increase from the Fed next month, with an an outside chance of a half-point move. Some also see hikes extending beyond December.\n\nSpot gold rose 0.5% to $3,894.79 an ounce as of 12:16 p.m. London time, while silver edged higher to $50.05. Platinum declined, and palladium advanced. The Bloomberg Dollar Spot Index was little changed.\n\nCatch a
