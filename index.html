<script>

    const allData = {"general": [{"title": "abrdn director Gordon Baird buys $612 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 11:31 AM IST", "pub_date_relative": "19m ago"}, {"title": "Should Aggregators block AI Agents?", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 11:30 AM IST", "pub_date_relative": "20m ago"}, {"title": "Stable fees, volatile earnings: What investors should know about EAAA IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEAAA India Alternatives Ltd, backed by Edelweiss Alternatives, is an alternative investment platform focused on real assets and private credit. Institutional clients, including pension funds and insurance companies, account for 49.32% of its assets under management (AUM), while non-institutional clients contribute the remaining 50.68%.\n\nThe company is looking to raise around \u20b9 1,200 crore through its initial public offering (IPO), which is entirely an offer for sale, at a price band of \u20b9 1,585-1,665 per share. The issue opens on 26 October. At the upper end of the price band, EAAA India Alternatives would have an implied market capitalization of \u20b9 10,765 crore.\n\nThe investment case hinges on how EAAA generates income, the visibility of its fee streams and the extent to which its assets are locked in for the long term.\n\nEAAA invests across equity, quasi-equity and debt instruments, including convertible debt, and generates income through three primary streams: management and advisory fees, variable additional returns and general partner (GP) income.\n\nManagement and advisory fees are earned for managing funds and providing advisory services. Variable additional returns represent performance-linked income earned after a fund crosses its hurdle rate of return, while GP income arises from investments in funds or co-investments in portfolio companies.\n\nManagement and advisory fees accounted for around 61% of the company's revenue in fiscal year 2026 (FY26), making them a significant source of income. The stream is relatively stable because it largely comes from multi-year contractual arrangements.\n\nExplaining the underlying investments, a source close to the company said, \u201cOur income and yield strategies invest in assets such as completed roads and commercial properties, where tolls, annuities and rents generate regular cash flows for investors.\u201d", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 11:28 AM IST", "pub_date_relative": "22m ago"}, {"title": "July 2026 DA Hike: Will the centre announce the revised allowance before Diwali in November?", "full_content": "The festive season is in full swing across the nation now, with the Dussehra and Durga Puja festivities just concluding as we build towards Diwali in November. Central government employees and pensioners are awaiting an announcement and the final confirmation on the July 2026 dearness allowance (DA) hike.\n\nExpectations among central government employees and pensioners are mounting ahead of Diwali on 8 November, as they continue to seek a meaningful revision to help them combat rising inflation and manage day-to-day finances more effectively.\n\nStill, whether the centre will notify the revised rate before the festival remains uncertain, and eligible beneficiaries should not treat any unofficial announcement on any platform as confirmed until official updates are released by the central government.\n\nFurthermore, it is vital to keep in mind that DA is revised twice a year to help government employees manage the impact of inflation on their household expenses and protect their purchasing power. The July revision is generally effective from July 1, even if the official announcement comes a little later. This simply means that the timing of the announcement and the date from which the actual increased allowance applies can differ.\n\nThe DA hike can help serving employees and pensioners with additional income that can be of extreme importance, especially during the festive season. Still, whether the official announcement will be made before Diwali will only be known once the government issues an official notification.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 11:19 AM IST", "pub_date_relative": "31m ago"}, {"title": "KEC International shares in focus on Monday Oct 26 after \u20b92872 cr PGCIL order win; YTD orders mark crosses \u20b913.5k cr", "full_content": "KEC International shares will be in focus on Monday, 26 October, after the RPG Group company secured turnkey orders worth \u20b9 2,872 crore from Power Grid Corporation of India Ltd (PGCIL) for the design, supply and installation of 765 kV transmission lines.\n\nThe latest wins include the largest-ever order for KEC International's India transmission and distribution (T&D) business, strengthening its order book and reinforcing its presence in India's power transmission infrastructure segment.\n\nAccording to the company, the projects are associated with the evacuation of 8.5 GW of renewable energy from Gujarat. The orders come amid rising electricity demand and continued investment in strengthening India's transmission network.\n\nVimal Kejriwal, Managing Director and CEO of KEC International, said the PGCIL wins reflected strong momentum in the company's T&D business. He added that the projects had substantially expanded its domestic T&D order book.\n\nWith these orders, KEC International's year-to-date order intake has crossed \u20b9 13,500 crore, including approximately \u20b9 9,500 crore from the T&D business.\n\nThe latest announcement follows another order win disclosed by the company on 23 October, when KEC International secured fresh orders worth \u20b9 1,006 crore across its T&D, civil, and cables-and-conductors businesses.\n\nIn its T&D business, the company won an order for a 400 kV transmission line project in Oman, along with orders to supply towers, hardware, and poles in the Americas.\n\nIts civil business secured a repeat order from a prominent healthcare player in eastern India to construct a multispeciality hospital. Meanwhile, the cables and conductors business received orders in both domestic and international markets.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 11:17 AM IST", "pub_date_relative": "33m ago"}, {"title": "MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI The Economic Times daily newspaper is available online now. Read Today's Paper MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI SECTIONS MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI ANI Last Updated: Oct 25, 2026, 11:13:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's micro, small, and medium enterprises (MSMEs) are exhibiting a strong sense of optimism for business conditions, evidenced by an uptick in the MSME Business Confidence Index. The manufacturing sector specifically showed promising growth, advancing from 59.5 to 61.0 this quarter. Both trading and services sectors are also experiencing a surge in positive sentiment, suggesting a bright future for all sectors amidst ongoing challenges.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will ors and favourable chart setups.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 11:11 AM IST", "pub_date_relative": "39m ago"}, {"title": "India Women Vs Zimbabwe Women Live Streaming: When And Where To Watch 2nd ODI", "full_content": "Pratika Rawal's century powered India to victory in the opener. Can the hosts seal the series in the second ODI?", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 11:00 AM IST", "pub_date_relative": "50m ago"}, {"title": "Aadhaar linked to your bank, demat account and SIM? Here's what UIDAI knows about you | Key facts about data security", "full_content": "Aadhaar is used for several purposes, from opening bank accounts and completing KYC to obtaining mobile connections and linking PAN. But does sharing your Aadhaar number put your personal and financial information at risk?\n\nIn its Aadhaar Mythbusters, UIDAI clarifies common misconceptions about privacy, security, banking, SIM linking, and data protection. Here is what Aadhaar holders need to know.\n\nNo. According to UIDAI, its database contains only limited information provided during Aadhaar enrolment or updates. These include basic demographic information such as name, gender, and date of birth (DOB), as well as biometric identifiers such as fingerprints, iris scans, and the photograph taken during enrolment. Providing a mobile number or email address is optional.\n\nUIDAI does not have information about your bank accounts, shares, mutual funds, property, health records, insurance, family, caste, religion, education, etc.\n\nSection 32(3) of the Aadhaar Act, 2016, also restricts UIDAI from collecting, retaining, or maintaining information about the purpose for which an individual\u2019s identity is authenticated.\n\nWhen you use your Aadhaar card for authentication with a bank, broker, mutual fund company, or mobile service provider, the requesting entity sends your Aadhaar number along with the required authentication data, such as encrypted biometrics or an OTP. Demographic details such as name and DOB may also be used, depending on the authentication process.\n\nUIDAI responds to authentication requests with a \u2018Yes\u2019 or \u2018No\u2019. If an entity requests e-KYC and authentication is successful, UIDAI can share your basic KYC details, such as your name, address, and photograph, with that entity.\n\nHowever, UIDAI does not receive your bank account details, demat account, investments or insurance information through this process.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 10:58 AM IST", "pub_date_relative": "52m ago"}, {"title": "Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? Nippon Life India Asset Management Share Price ICICI Prudential Asset Management Company Share Price HDFC Asset Management Company Share Price Aditya Birla Sun Life AMC Share Price UTI Asset Management Company Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? SECTIONS Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 10:48:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As many as 24 companies will turn ex-record date for dividends, stock splits and rights issues during the week starting October 26. Key names include Shriram Finance, CRISIL, Cyient, Chennai Petroleum and L&T Technology Services.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver prices today, 25 October: Check retail rate of 24K, 22K gold, 999 silver in Delhi, Mumbai, Kolkata, Chennai", "full_content": "Gold, Silver rates today: The yellow metal slumped to a three-month low last week, poised for a four-month low, Reuters reported. Spot gold fell 0.6% to $3,998.35 an ounce by at 1520 GMT \u2014 below the $4,000 mark for the first time since mid-July, touching session low of $3,975.23, it said, adding that US gold futures for December delivery settled 1.3% lower at $4,007.90 per ounce.\n\nHigher energy prices due to the war in Middle East, inflation concerns and expectations that no immediate rate cut seems likely from the United States Federal Reserve (US Fed ) pushed gold prices down, according to the Reuters report.\n\nOver the week, MCX gold futures fell around 3.50%, with heavy selling pulling prices down from their previous highs. On Friday alone, MCX gold futures declined 0.92%, falling \u20b9 1,315 to settle at around \u20b9 1,41,994 per 10 grams. Gold has declined around 4% this week, marking its weakest weekly performance since June.\n\nHere are gold and silver rates in key Indian cities on Sunday, 25 October 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 25 October, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,42,240 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,30,387 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,06,680 per 10 grams.\n\nThe silver price in Mumbai today, 25 October, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,96,230 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 25 October. The 24-karat gold price in Delhi was \u20b9 1,42,000 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Got a WhatsApp loan offer? Check these 5 things before clicking the lending app link", "full_content": "In the ongoing festive season, with Dussehra and Durga Puja recently concluded on 22 October and Diwali festivities set to take over in November, the need for funds can be urgent. Especially if you are an aspiring borrower looking to purchase new products and services.\n\nIn such an environment, a relatively harmless WhatsApp message promising instant loans, minimal to no paperwork, and seamless approval may seem like a straightforward way to arrange money.\n\nStill, it is vital to note that not every loan offer received on WhatsApp is genuine and should not be trusted blindly. This is because fraudsters often offer attractive lending rates, set urgent deadlines to secure such loans, promise relatively easy approval, and assure flexible repayment terms to persuade individuals to click suspicious links and share confidential financial information.\n\nFor these reasons, it is prudent to avoid clicking on random messages sent to you on WhatsApp. Furthermore, before accepting any such lucrative-looking loan offers , borrowers should carefully verify the basic facts, such as the lending institution credentials and whether it is regulated by the Reserve Bank of India (RBI).\n\nOnce these aspects are clear, only then should the borrower proceed with understanding the aspects such as:\n\nAlong with the above factors, it is also critical to check whether the application process is secure, before applying for any particular loan on the platform.\n\nTo put it simply, WhatsApp loan offers are messages sent to individual users that promote personal loans or other credit products via links and advertisements. Now, some of the offers might also come from legitimate financial institutions backed by the RBI or their authorised representatives.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jailer 2 Box Office Collection Day 10: Rajinikanth Film Gains Momentum, Jumps Over 66% To Earn Rs 24.15 Crore", "full_content": "Directed by Nelson Dilipkumar, Jailer 2 is a Tamil action drama starring Rajinikanth as retired jailer Tiger Muthuvel Pandian.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 10:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Maybe Tomorrow': Trump Threatens Iran With Fresh Strikes Amid Oil Rallying To $116", "full_content": "Trump has warned of possible fresh US strikes on Iran while leaving room for diplomacy. Tehran denies offering to reopen the Strait of Hormuz, as reported threats to US diplomats add to regional tensions.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mercuria challenging the \u2018Dow Jones of shipping\u2019 in court after Hormuz losses", "full_content": "Case will test the Baltic Exchange\u2019s decision to keep publishing price estimates for shipping oil through the Strait of Hormuz during the war", "source": "FT Markets", "pub_date_str": "25 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Black Sea is now the world\u2019s deadliest shipping route", "full_content": "Fatalities of commercial sailors caught in battle between Russia and Ukraine are outstripping deaths in the Gulf", "source": "FT Markets", "pub_date_str": "25 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pakistan vs England Live Streaming: When And Where To Watch ODI Tri-Series Match In India", "full_content": "Pakistan vs England explained: how to watch the ODI Tri-Nation Series clash live in India as Harry Brook's team fights to keep final hopes alive.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin price today: BTC recovers to $80,800 ahead of Fed meeting", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 10:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO GMP today: All eyes on telecom major\u2019s mega listing this week. What is grey market premium signalling?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Men : "Jio Platforms IPO allotment date: The Jio Platforms IPO share allotment will be finalised on Monday, 26 October. Investors who applied for the Jio Platforms IPO can check the Jio Platforms IPO allotment status in the registrar's portal, which is Kfin Technologies Ltd.\n\nJio Platforms IPO GMP today, or grey market premium, is +247. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Jio Platforms share price was indicated at \u20b9 1,366 apiece, which is 22.07% higher than the IPO price of \u20b9 1,119.\n\nBased on trading activity over the last 22 sessions, the IPO's GMP is up today, indicating a strong listing. The premium has ranged between \u20b9 148.00 and \u20b9 273 over that period, according to the experts.\n\nInvestors can check whether they have been allocated shares and the number of shares allocated by reviewing the allocation guidelines. A key factor in determining the IPO allotment status is the total number of shares available. The company will be commencing the refund process for those who have not been allotted any shares. Shares which have been allotted will be credited to the investor's demat account.\n\nFor individuals who were not allocated shares, the refund procedure will begin on Tuesday, 27 October. Individuals who were allocated shares will get them in their demat accounts the same day. Jio Platforms IPO listing date is scheduled for Wednesday, 28 October.\n\nReliance Industries-backed Jio Platforms\u2019 IPO received bids for 22.19 times the shares on offer, with total demand across the public issue and anchor investor placement exceeding \u20b9 7.4 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 09:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Massive Oil Spill Hits UAE Coast: Ras Al Khaimah Shuts Down All Beaches", "full_content": "The UAE has closed beaches across Ras Al Khaimah, Umm Al Quwain and parts of Sharjah after an offshore oil leak.This oil spill comes at a time when people are already worried about safety and pollution in the Gulf.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 09:49 AM IST", "pub_date_relative": "2h ago"}, {"title": "IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore IDFC First Bank Share Price Federal Bank Share Price IndusInd Bank Share Price RBL Bank Share Price YES Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore SECTIONS IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore ET Bureau Last Updated: Oct 25, 2026, 09:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IDFC First Bank\u2019s Q2 net profit tripled to Rs 1,045 crore, supported by strong loan and fee growth. Net interest income rose 21%, while net interest margin declined to 5.6%.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 09:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "Suzlon Energy shares crash 39% from 52-week high \u2014 can Q2 results 2026 bring a bounce back? Experts' views, target, SL", "full_content": "Suzlon Energy Q2 Results 2026 Date | Stock to buy today: Shares of Suzlon Energy. witnessed a re-rating once the company declared becoming a debt-free entity. In that re-rating, the Suzlon Energy share price skyrocketed from below R 6 per share in July 2022 to around \u20b9 83 per share in September 2024. However, after that post-rerating rally, Suzlon shares have remained an ideal \u2018sell-on-rise\u2019 stock. Suzlon's share price closed at \u20b9 37.40 on the NSE last Friday, around 39% below its 52-week high of \u20b9 69.50 and nearly 55% below its September 2024 high following the re-rating.\n\nAccording to stock mark et experts, Suzlon Energy shares witnessed a re-rating when it exited the group of loss-making companies and became profitable. Now, the market is waiting for a sharp improvement in the company's margins. They said that it can become possible once the company controls its higher expenses. Experts believe that Suzlon Energy Ltd is expected to contain its expenses, which would trigger a re-rating in the stock.\n\nThe stock market experts advised long-term investors to make the most of these dips and accumulate Suzon shares in one's portfolio. They predicted limited downside in Suzlon shares as the average weighted price of Suzlon shares fell to the \u20b9 38- \u20b9 40 band. They said that Suzlon Energy's Q2 results 2026 are expected to improve, so it is time to add to or accumulate Suzlon Energy shares rather than press the panic button. They said that the Suzlon Energy share price may bounce back and touch \u20b9 46 per share levels in the near term.\n\nHighlighting the reasons that are dragging Suzlon Energy's share price, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \"Suzlon Energy shares witnessed the first round of re-rating when it became a profitable company, snapping the tag of a loss-making company.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 09:38 AM IST", "pub_date_relative": "2h ago"}, {"title": "Obama attacks Trump over inflation as Democrats fight for Michigan Senate seat", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 09:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongside India's biggest listing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongside India's biggest listing The Economic Times daily newspaper is available online now. Read Today's Paper Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongside India's biggest listing SECTIONS Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongside India's biggest listing By Akash Podishetti , ETMarkets.com Last Updated: Oct 25, 2026, 09:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a bustling week for the IPO market, five mainboard offerings are set to debut between October 26 and 30, aiming to amass an impressive Rs 2,581 crore. EAAA India Alternatives spearheads the launches, while Jio Platforms makes its entrance on October 28. Other notable entries include SFC Environmental Technologies and BLS Polymers on October 27, with MK Sons Fine Jewels and Bombay Coated and Special Steels following closely.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastes ex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 09:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "Tiger Shroff Attack: How A Missed Bus Foiled The Shooters' Escape To Nepal", "full_content": "Under Plan B, the shooters were instructed to get off the train before it reached the main railway station on the outskirts of Jaipur.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 09:25 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nifty bears tighten grip as crude, geopolitical risks, FII outflows mount: 5 factors to decide D-Street\u2019s fate next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty bears tighten grip as crude, geopolitical risks, FII outflows mount: 5 factors to decide D-Street\u2019s fate next week The Economic Times daily newspaper is available online now. Read Today's Paper Nifty bears tighten grip as crude, geopolitical risks, FII outflows mount: 5 factors to decide D-Street\u2019s fate next week SECTIONS Nifty bears tighten grip as crude, geopolitical risks, FII outflows mount: 5 factors to decide D-Street\u2019s fate next week By Kumar Gaurav , ETMarkets.com Last Updated: Oct 25, 2026, 09:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian stock markets faced a setback as crude oil prices soared, triggered by increasing geopolitical tensions in the Middle East. Despite some defensive buying from domestic institutions, foreign investors pulled back. The forthcoming US Federal Reserve meeting is poised to impact global market moods. Investors will be keenly watching industrial production metrics and second-quarter earnings for insights on corporate health, as macroeconomic stability remains crucial for market trends.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 09:18 AM IST", "pub_date_relative": "2h ago"}, {"title": "PM Kisan 24th instalment: \u20b92,000 in your bank account next week; are you eligible? How to complete KYC? Explained", "full_content": "The 24th instalment of PM-Kisan Samman Nidhi will be released on 30 October. Eligible farmers will receive \u20b9 2,000 directly in their bank accounts. The Agriculture Ministry earlier announced the payment date on 23 October. Farmers awaiting this support should check their details before the release.\n\nHowever, the release date does not guarantee payment to every registered farmer. Incomplete e- KYC or incorrect records can delay the money. Problems with Aadhaar linking and land verification may also affect payment. Farmers should address these issues early rather than waiting until the last day.\n\nCompleting e-KYC is an important requirement under the scheme. This process helps confirm the identity of registered farmers. They should also check whether their bank accounts are linked with Aadhaar. Their land records must be verified and their personal details should match.\n\nFarmers can check their payment details through the official PM Kisan website. Open pmkisan.gov.in on a mobile phone or computer.\n\nSelect the Know Your Status option and enter your registration number. Next, enter the captcha code shown on the screen and select Get OTP. Enter the OTP received on your registered mobile number to continue.\n\nThe next screen will display your details and beneficiary status. Check whether your e-KYC is complete and look for errors. Follow the instructions if any requirement remains pending. Contact the relevant service centre if you need help correcting your records.\n\nFarmers have three options for completing e-KYC: OTP , fingerprints, or face authentication. The OTP method requires an active mobile number linked with Aadhaar. Farmers can use this option through the PM Kisan website or mobile app.\n\nFor website verification, select e-KYC and enter your Aadhaar number. Enter the OTP sent to your Aadhaar-linked mobile number.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 09:14 AM IST", "pub_date_relative": "2h ago"}, {"title": "Portuguese police clear Lisbon housing protest camp, make arrests", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 09:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump touts $4 billion Audi plant in Georgia as he defends tariffs", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Lula, Bolsonaro Neck-And-Neck As Brazil Votes Today: What The Final Polls Show", "full_content": "Bolsonaro leads Lula with 46.3% vs 45% support, according to a Saturday CNT/MDA poll. The election faces growing political friction over social media bias allegations, which Meta denies.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:35 AM IST", "pub_date_relative": "3h ago"}, {"title": "HSBC sees cautious optimism in VC and PE activity", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:18 AM IST", "pub_date_relative": "3h ago"}, {"title": "Operation Sindoor Enters US Midterms As Trump boasts Mediation", "full_content": "Addressing the rally on Friday, Trump took credit for stopping India and Pakistan from escalating their military conflict last year, saying he threatened to impose steep tariffs on both countries if they continued fighting.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:17 AM IST", "pub_date_relative": "3h ago"}, {"title": "Chemed president and CEO Kevin McNamara sells $1.03M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:15 AM IST", "pub_date_relative": "3h ago"}, {"title": "Verizon evp and group ceo Kyle Malady sells $51,040 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:15 AM IST", "pub_date_relative": "3h ago"}, {"title": "15-15-15 rule: How can a \u20b915,000 monthly SIP potentially grow to \u20b91 crore? Check the complete calculations", "full_content": "Are you aiming to build a meaningful corpus for your future? Do you have a proper financial plan to accomplish the same objective? Are you aware of the silent power of compounding?\n\nHaving a clear understanding of these basic concepts is indispensable for ensuring meaningful wealth creation in the long run. Now, building a corpus of \u20b9 1 crore through mutual fund investments may seem a challenging and daunting task; still, a disciplined approach, clarity of objectives and a long-term investment horizon can help investors work towards this goal.\n\nThe 15-15-15 rule of investing is a popular investment thumb rule that clearly explains how patience, consistency in investing, time, and compounding can work together to build wealth in the long run. This write-up is dedicated to discussing this rule in detail and how it can help create meaningful wealth if followed diligently.\n\nThis is an investment rule that suggests investing \u20b9 15,000 every month through SIPs, i.e., a Systematic Investment Plan, targeting an assumed annual return of 15% over an extended period of 15 years. Furthermore, the returns under this rule are reinvested, allowing the investment corpus to benefit from compounding.\n\nStill, it is vital to note that the 15-15-15 rule does not guarantee a \u20b9 1 crore corpus in 15 years. This is because market returns are subject to risks and depend on a host of other factors. Secondly, at a 15% annualised return, which is a presumed return, the estimated corpus would be approximately \u20b9 1 crore, depending on the calculation method, timing of investments and eventual compounding value.\n\nAssuming a monthly SIP of \u20b9 15,000 and an illustrative annual return of 15%, then the estimated investment outcome will be as follows:\n\nSource: SIP calculator available on Angel One's official website. The returns are indicative and can vary slightly depending on the calculation tool used.\n\nThese figures assume monthly investments and an annualised return of 15%.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:15 AM IST", "pub_date_relative": "3h ago"}, {"title": "Money changes from November 1: From Pensioner life certificate to ITR deadline \u2014 Key things that may impact your pocket", "full_content": "Key money rule changes next month: With November 2026 almost here, the next days have some changes set to come into effect, that will directly impact your pockets. Starting from November 1, here's a look at what can cost you more money, tips to save or invest in your future.\n\nRetired central and state government employees receiving pension are required to submit their annual \u2018 Life Certificate \u2019 (LC), at the nearest bank branch by November-end. Failure to do so, could result in delay or disruption of pension payments.\n\nYou can choose to submit your LC either physically, digitally using the Jeevan Praaman Patra facility with Aadhaar identification, or avail the Postal Department's doorstep life certificate facility. All of the processes are free of cost, but failure to submit the document could impact your pension from December onwards.\n\nFor pensioners aged over 80 years, the process began from 1 October, for other retirees, the process starts from 1 November. Notably, deadline is 30 November.\n\nThe Central Board of Direct Taxes (CBDT) has this year extended the income-tax returns deadline for taxpayers filing audited ITR for FY26 i.e. assessment year AY27 from 31 October to 21 November 2026.\n\nAny taxpayer with income from business or professional services, who is also required to submit an audit report, shall file their return by this deadline to avoid penalties and tax notices. Companies whose accounts are audited under company law must also file their audit reports. The requirement also applies to firms, LLPs and other entities covered under the applicable audit provisions.\n\nFor businesses, a tax audit is required if their total sales, annual turnover or gross receipts exceed \u20b9 1 crore in a relevant financial year.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:05 AM IST", "pub_date_relative": "3h ago"}, {"title": "Bank holidays in November: When are banks, such as SBI, HDFC and ICICI, closed next month? Check city-wise list", "full_content": "Bank customers should plan branch visits during November 2026, with several regional holidays ahead. Closures will differ across cities, depending on local festivals and observances.\n\nA holiday in one city does not mean banks close throughout India. Customers should check their branch\u2019s holiday schedule before travelling for work.\n\nRegional holidays fall on 9, 10, 11, 13 and 16 November. Further dates include 20, 23, 24 and 27 November. These cover Diwali celebrations, Chhath Puja, Guru Nanak Jayanti and several local festivals.\n\nBanks will also observe holidays on the second and fourth Saturdays. These fall on 14 November and 28 November, respectively.\n\nOn November 9, banks will be closed in Agartala, Bhopal, Chandigarh, Gangtok, Imphal and Jaipur. Kanpur and Lucknow will also observe a bank holiday that day. The date covers the celebrations of Diwali, Laxmi Puja, Govardhan Pooja and Vishwakarma Day.\n\nThe following day, 10 November, brings closures in Ahmedabad, Belapur, Bengaluru, Dehradun, Gangtok, Mumbai and Nagpur. Celebrations include Bali Pratipada, Govardhan Puja, Laxmi Puja and Vikram Samvat New Year. Customers in these cities should complete urgent branch work before the holiday.\n\nOn 11 November, banks will be closed in Gangtok, Imphal, Kanpur, Kolkata, Lucknow and Shimla. Observances include Laxmi Puja, Ningol Chakkouba, Bhai Dooj and Chitragupt Jayanti. Gangtok therefore has three consecutive regional bank holidays, from 9 November to 11 November.\n\nShillong will observe a bank holiday for Wangala Festival on 13 November. Patna and Ranchi will have bank holidays for Chhath Puja on 16 November. Dehradun will observe Igas-Bagwal on 20 November, leading to another local closure. Shillong banks will be closed again for Seng Kut Snem on 23 November.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:02 AM IST", "pub_date_relative": "3h ago"}, {"title": "'Finding My Identity Took 10 To 15 years': Hariharan On The Struggles Behind His Success And His Wife's Crucial Role", "full_content": "Singer Hariharan opens up to Neelesh Misra about his musical journey, his wife's influence on his career and the importance of finding one's own identity, while sharing advice for young singers.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "UAE vs Netherlands: Live Streaming: When And Where To Watch ICC Cricket World Cup League 2 Match Live In India", "full_content": "Rahul Chopra-led UAE face Bas de Leede's Netherlands in a Cricket World Cup League 2 ODI in Dubai. Check the match timing, squads and live-streaming details.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:00 AM IST", "pub_date_relative": "3h ago"}, {"title": "China's $3.5 Trillion Stock Rout: Why Low Valuations Aren't Enough To Entice Investors", "full_content": "The rout intensified last week, pushing the onshore benchmark CSI 300 Index into a bear market and a technology sector gauge in Hong Kong toward erasing all its gains since Beijing's sweeping growth support package two years ago.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:49 AM IST", "pub_date_relative": "4h ago"}, {"title": "Trump announces Audi will build $4 billion U.S. factory in Georgia", "full_content": "President Donald Trump announced Saturday that Audi plans to build a $4 billion assembly plant in Georgia to produce 200,000 SUVs annually, as he seeks to convince Americans to back Republicans in the Nov. 3 midterm elections.\n\nTrump, who has pressured automakers to move \u200bproduction to the United States and has raised tariffs on autos, steel, aluminum, and parts, made the announcement at a rally in Perry, near Macon, in central Georgia, where Volkswagen's premium subsidiary plans to build its first U.S. assembly plant.\n\nLast year, Trump's tariffs dealt Audi a 1.2 billion euro ($1.4 billion) blow, as it imports all its vehicles for the U.S. market from Europe or Mexico.\n\nGeorgia has competitive election races for U.S. Senate and governor. Trump is eager to argue that his auto tariffs are helping the U.S. economy. Critics say they have boosted vehicle prices and that the trade uncertainty has delayed some automaker investments.\n\n\"We are planning to bring our biggest and most premium SUVs, and produce them here in Macon, Georgia,\" Audi CEO Gernot Doellner said at the event. \"This is a long-term investment because we believe in the American market.\"\n\nAudi said the investment will create approximately 4,500 jobs. Construction is scheduled to begin next year, with production starting in the early 2030s, Audi said.\n\nThe plant is expected to assemble the Audi Q7, Q8 and Q9 SUVs, a U.S. official told Reuters.\n\nAudi also plans to build 25,000 vehicles a year in neighboring South Carolina, the official said. Some of the vehicles, now built in Europe, would be exported, the official added. VW will assemble those vehicles at a $2 billion plant for its off-road brand, Scout Motors, under construction in Blythewood, near the state capital, Columbia, the official said.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 07:47 AM IST", "pub_date_relative": "4h ago"}, {"title": "'Tariffs Bring In Jobs': Trump Defends Protectionist Policy With Massive $4.2B Audi Deal", "full_content": "Trump was speaking as Republicans are trying to flip a Senate seat held by Democrat Jon Ossoff in the midterm elections, despite trailing in the polls.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:40 AM IST", "pub_date_relative": "4h ago"}, {"title": "Trump Announces Audi\u2019s First-Ever U.S. Factory in Georgia as Tariffs Bite - WSJ", "full_content": "Trump Announces Audi\u2019s First-Ever U.S. Factory in Georgia as Tariffs Bite WSJ Audi to invest $4B in Georgia for first US auto plant FOX 5 Atlanta Audi to build Georgia factory near Macon The Atlanta Journal-Constitution Trump Defends Tariffs at Rally as He Touts New US Audi Plant Bloomberg.com Trump announces Audi will build $4 billion US factory in Georgia Reuters", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 07:25 AM IST", "pub_date_relative": "4h ago"}, {"title": "Fuel prices today: Check petrol, diesel and CNG rates on 25 October in different cities across India", "full_content": "Petrol and diesel prices remain unchanged across most Indian cities on 25 October. However, CNG prices have increased in several cities, adding to daily travel costs.\n\nIn New Delhi, petrol costs \u20b9 102.12 per litre, while diesel costs \u20b9 95.20 per litre. Mumbai residents pay \u20b9 111.21 per litre for petrol and \u20b9 97.83 per litre for diesel. Kolkata\u2019s petrol price stands at \u20b9 113.51 per litre, with diesel at \u20b9 99.82 per litre.\n\nIn Chennai, petrol costs \u20b9 107.76, and diesel costs \u20b9 99.55 per litre. Chandigarh has recorded a small rise in petrol prices of three paise per litre.\n\nHyderabad has the highest petrol price among these cities, at \u20b9 116.15 per litre. Petrol costs \u20b9 115.49 in Thiruvananthapuram, \u20b9 113.37 in Patna, and \u20b9 113.19 in Jaipur.\n\nBengaluru\u2019s petrol price stands at \u20b9 111.68 while Bhubaneswar records \u20b9 108.97 per litre. These prices remain unchanged, offering some stability for people planning their travel expenses.\n\nAround Delhi, petrol costs \u20b9 102.97 per litre in Gurugram and \u20b9 101.96 per litre in Noida. Lucknow\u2019s petrol price stands at \u20b9 101.86, while Chandigarh records \u20b9 101.54 per litre.\n\nDespite its small increase, Chandigarh has the lowest petrol price among these listed cities. The gap between Chandigarh and Hyderabad stands at \u20b9 14.61 per litre.\n\nDiesel prices also vary widely across cities, despite showing no changes today. Thiruvananthapuram records \u20b9 104.40 per litre, followed by Hyderabad at \u20b9 104.23 and Bhubaneswar at \u20b9 100.68.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 07:07 AM IST", "pub_date_relative": "4h ago"}, {"title": "Why your good fund feels bad", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThink of an investor who puts a large sum of money into a good equity fund a few months before a market peak. It's a well-managed fund, and in the fall that follows, it loses 18% while the index drops 24%. On any sensible basis, the fund has done well: the market has fallen sharply, but the fund manager has lost much less.\n\nWhen the market turns, this head start will matter. The fund needs to rise about 22% to get back to where it started; the index needs about 32%. But our investor sees none of the good news. On his screen, there\u2019s a big red number next to the fund. The fact that it beat the index feels like a meaningless statistic.\n\nThe difficulty is obvious: two different things are being compared. Judged against its benchmark, especially during a fall, any analyst would say that this fund did well. The investor\u2019s yardstick, though, is not benchmark-relative returns but his own absolute returns. Those depend on when he invested, whether he made a lump-sum investment or used an SIP, and simply where he entered the market cycle. In my experience, his own loss drives the decision to sell, but he blames the fund to justify it. This allows the investor to ignore the responsibility he should take and shifts it to the fund manager .\n\nWhen the market turns, this head start will matter. The fund needs to rise about 22% to get back to where it started; the index needs about 32%. But our investor sees none of the good news. On his screen, there\u2019s a big red number next to the fund. The fact that it beat the index feels like a meaningless statistic.\n\nThe difficulty is obvious: two different things are being compared. Judged against its benchmark, especially during a fall, any analyst would say that this fund did well. The investor\u2019s yardstick, though, is not benchmark-relative returns but his own absolute returns.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "Gold, Silver Prices Dip But Many Gold ETF FoFs Temporarily Halt Fresh Inflows: What Are Your Options?", "full_content": "As Dhanteras approaches gold loses its glitter, silver loses its shine and fund of fund ETFs halt fresh inflows. Let's explore what other gold investment options remain for investors.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "IPOs This Week: EAAA India Alternatives, BLS Polymers, M K Sons Fine Jewels Among Others To Hit Primary Market", "full_content": "M K Sons Fine Jewels, SFC Environmental Technologies, BLS Polymers and EAAA India Alternatives will open for subscription for the week starting on October 26.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:00 AM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Stable fees, volatile earnings: What investors should know about EAAA IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEAAA India Alternatives Ltd, backed by Edelweiss Alternatives, is an alternative investment platform focused on real assets and private credit. Institutional clients, including pension funds and insurance companies, account for 49.32% of its assets under management (AUM), while non-institutional clients contribute the remaining 50.68%.\n\nThe company is looking to raise around \u20b9 1,200 crore through its initial public offering (IPO), which is entirely an offer for sale, at a price band of \u20b9 1,585-1,665 per share. The issue opens on 26 October. At the upper end of the price band, EAAA India Alternatives would have an implied market capitalization of \u20b9 10,765 crore.\n\nThe investment case hinges on how EAAA generates income, the visibility of its fee streams and the extent to which its assets are locked in for the long term.\n\nEAAA invests across equity, quasi-equity and debt instruments, including convertible debt, and generates income through three primary streams: management and advisory fees, variable additional returns and general partner (GP) income.\n\nManagement and advisory fees are earned for managing funds and providing advisory services. Variable additional returns represent performance-linked income earned after a fund crosses its hurdle rate of return, while GP income arises from investments in funds or co-investments in portfolio companies.\n\nManagement and advisory fees accounted for around 61% of the company's revenue in fiscal year 2026 (FY26), making them a significant source of income. The stream is relatively stable because it largely comes from multi-year contractual arrangements.\n\nExplaining the underlying investments, a source close to the company said, \u201cOur income and yield strategies invest in assets such as completed roads and commercial properties, where tolls, annuities and rents generate regular cash flows for investors.\u201d", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 11:28 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "July 2026 DA Hike: Will the centre announce the revised allowance before Diwali in November?", "full_content": "The festive season is in full swing across the nation now, with the Dussehra and Durga Puja festivities just concluding as we build towards Diwali in November. Central government employees and pensioners are awaiting an announcement and the final confirmation on the July 2026 dearness allowance (DA) hike.\n\nExpectations among central government employees and pensioners are mounting ahead of Diwali on 8 November, as they continue to seek a meaningful revision to help them combat rising inflation and manage day-to-day finances more effectively.\n\nStill, whether the centre will notify the revised rate before the festival remains uncertain, and eligible beneficiaries should not treat any unofficial announcement on any platform as confirmed until official updates are released by the central government.\n\nFurthermore, it is vital to keep in mind that DA is revised twice a year to help government employees manage the impact of inflation on their household expenses and protect their purchasing power. The July revision is generally effective from July 1, even if the official announcement comes a little later. This simply means that the timing of the announcement and the date from which the actual increased allowance applies can differ.\n\nThe DA hike can help serving employees and pensioners with additional income that can be of extreme importance, especially during the festive season. Still, whether the official announcement will be made before Diwali will only be known once the government issues an official notification.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 11:19 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "KEC International shares in focus on Monday Oct 26 after \u20b92872 cr PGCIL order win; YTD orders mark crosses \u20b913.5k cr", "full_content": "KEC International shares will be in focus on Monday, 26 October, after the RPG Group company secured turnkey orders worth \u20b9 2,872 crore from Power Grid Corporation of India Ltd (PGCIL) for the design, supply and installation of 765 kV transmission lines.\n\nThe latest wins include the largest-ever order for KEC International's India transmission and distribution (T&D) business, strengthening its order book and reinforcing its presence in India's power transmission infrastructure segment.\n\nAccording to the company, the projects are associated with the evacuation of 8.5 GW of renewable energy from Gujarat. The orders come amid rising electricity demand and continued investment in strengthening India's transmission network.\n\nVimal Kejriwal, Managing Director and CEO of KEC International, said the PGCIL wins reflected strong momentum in the company's T&D business. He added that the projects had substantially expanded its domestic T&D order book.\n\nWith these orders, KEC International's year-to-date order intake has crossed \u20b9 13,500 crore, including approximately \u20b9 9,500 crore from the T&D business.\n\nThe latest announcement follows another order win disclosed by the company on 23 October, when KEC International secured fresh orders worth \u20b9 1,006 crore across its T&D, civil, and cables-and-conductors businesses.\n\nIn its T&D business, the company won an order for a 400 kV transmission line project in Oman, along with orders to supply towers, hardware, and poles in the Americas.\n\nIts civil business secured a repeat order from a prominent healthcare player in eastern India to construct a multispeciality hospital. Meanwhile, the cables and conductors business received orders in both domestic and international markets.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 11:17 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI The Economic Times daily newspaper is available online now. Read Today's Paper MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI SECTIONS MSME business confidence improves despite rising input costs, manufacturing sentiment strongest: SIDBI ANI Last Updated: Oct 25, 2026, 11:13:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's micro, small, and medium enterprises (MSMEs) are exhibiting a strong sense of optimism for business conditions, evidenced by an uptick in the MSME Business Confidence Index. The manufacturing sector specifically showed promising growth, advancing from 59.5 to 61.0 this quarter. Both trading and services sectors are also experiencing a surge in positive sentiment, suggesting a bright future for all sectors amidst ongoing challenges.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 11:13 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Motilal Oswal Nifty Midcap150 Plus 8-13 Yr G-Sec 70:30 Index Fund: A Growth And Stability Engine", "full_content": "Motilal Oswal's hybrid index fund combines 70% midcap equities with 30% government securities to balance growth potential and portfolio stability.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 11:12 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Swiggymayrebound to Rs 190, butchartsdonotsignal a trendreversal: LKP\u2019s VatsalBhuva", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Swiggymayrebound to Rs 190, butchartsdonotsignal a trendreversal: LKP\u2019s VatsalBhuva HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Swiggymayrebound to Rs 190, butchartsdonotsignal a trendreversal: LKP\u2019s VatsalBhuva SECTIONS Swiggymayrebound to Rs 190, butchartsdonotsignal a trendreversal: LKP\u2019s VatsalBhuva By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 25, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis LKP Securities\u2019 Vatsal Bhuva sees continued downside risks for Nifty and Bank Nifty, while identifying potential rebounds in Swiggy and HDFC Bank. He also recommends Oriental Hotels and Apollo Hospitals, citing improving technical indicators and favourable chart setups.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 11:11 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aadhaar linked to your bank, demat account and SIM? Here's what UIDAI knows about you | Key facts about data security", "full_content": "Aadhaar is used for several purposes, from opening bank accounts and completing KYC to obtaining mobile connections and linking PAN. But does sharing your Aadhaar number put your personal and financial information at risk?\n\nIn its Aadhaar Mythbusters, UIDAI clarifies common misconceptions about privacy, security, banking, SIM linking, and data protection. Here is what Aadhaar holders need to know.\n\nNo. According to UIDAI, its database contains only limited information provided during Aadhaar enrolment or updates. These include basic demographic information such as name, gender, and date of birth (DOB), as well as biometric identifiers such as fingerprints, iris scans, and the photograph taken during enrolment. Providing a mobile number or email address is optional.\n\nUIDAI does not have information about your bank accounts, shares, mutual funds, property, health records, insurance, family, caste, religion, education, etc.\n\nSection 32(3) of the Aadhaar Act, 2016, also restricts UIDAI from collecting, retaining, or maintaining information about the purpose for which an individual\u2019s identity is authenticated.\n\nWhen you use your Aadhaar card for authentication with a bank, broker, mutual fund company, or mobile service provider, the requesting entity sends your Aadhaar number along with the required authentication data, such as encrypted biometrics or an OTP. Demographic details such as name and DOB may also be used, depending on the authentication process.\n\nUIDAI responds to authentication requests with a \u2018Yes\u2019 or \u2018No\u2019. If an entity requests e-KYC and authentication is successful, UIDAI can share your basic KYC details, such as your name, address, and photograph, with that entity.\n\nHowever, UIDAI does not receive your bank account details, demat account, investments or insurance information through this process.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 10:58 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? Nippon Life India Asset Management Share Price ICICI Prudential Asset Management Company Share Price HDFC Asset Management Company Share Price Aditya Birla Sun Life AMC Share Price UTI Asset Management Company Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? SECTIONS Dividends & stock splits: L&T Tech, Shriram Finance among 24 stocks turning ex-record date this week. Do you own? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 10:48:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As many as 24 companies will turn ex-record date for dividends, stock splits and rights issues during the week starting October 26. Key names include Shriram Finance, CRISIL, Cyient, Chennai Petroleum and L&T Technology Services.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 10:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold, silver prices today, 25 October: Check retail rate of 24K, 22K gold, 999 silver in Delhi, Mumbai, Kolkata, Chennai", "full_content": "Gold, Silver rates today: The yellow metal slumped to a three-month low last week, poised for a four-month low, Reuters reported. Spot gold fell 0.6% to $3,998.35 an ounce by at 1520 GMT \u2014 below the $4,000 mark for the first time since mid-July, touching session low of $3,975.23, it said, adding that US gold futures for December delivery settled 1.3% lower at $4,007.90 per ounce.\n\nHigher energy prices due to the war in Middle East, inflation concerns and expectations that no immediate rate cut seems likely from the United States Federal Reserve (US Fed ) pushed gold prices down, according to the Reuters report.\n\nOver the week, MCX gold futures fell around 3.50%, with heavy selling pulling prices down from their previous highs. On Friday alone, MCX gold futures declined 0.92%, falling \u20b9 1,315 to settle at around \u20b9 1,41,994 per 10 grams. Gold has declined around 4% this week, marking its weakest weekly performance since June.\n\nHere are gold and silver rates in key Indian cities on Sunday, 25 October 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 25 October, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,42,240 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,30,387 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,06,680 per 10 grams.\n\nThe silver price in Mumbai today, 25 October, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,96,230 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 25 October. The 24-karat gold price in Delhi was \u20b9 1,42,000 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jailer 2 Box Office Collection Day 10: Rajinikanth Film Gains Momentum, Jumps Over 66% To Earn Rs 24.15 Crore", "full_content": "Directed by Nelson Dilipkumar, Jailer 2 is a Tamil action drama starring Rajinikanth as retired jailer Tiger Muthuvel Pandian.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 10:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mercuria challenging the \u2018Dow Jones of shipping\u2019 in court after Hormuz losses", "full_content": "Case will test the Baltic Exchange\u2019s decision to keep publishing price estimates for shipping oil through the Strait of Hormuz during the war", "source": "FT Markets", "pub_date_str": "25 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are funda en allotted will be credited to the investor's demat account.\n\nFor individuals who were not allocated shares, the refund procedure will begin on Tuesday, 27 October. Individuals who were allocated shares will get them in their demat accounts the same day. Jio Platforms IPO listing date is scheduled for Wednesday, 28 October.\n\nReliance Industries-backed Jio Platforms\u2019 IPO received bids for 22.19 times the shares on offer, with total demand across the public issue and anchor investor placement exceeding \u20b9 7.4 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 09:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore IDFC First Bank Share Price Federal Bank Share Price IndusInd Bank Share Price RBL Bank Share Price YES Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore SECTIONS IDFC First Bank Q2 profit nearly triples to Rs 1,045 crore ET Bureau Last Updated: Oct 25, 2026, 09:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IDFC First Bank\u2019s Q2 net profit tripled to Rs 1,045 crore, supported by strong loan and fee growth. Net interest income rose 21%, while net interest margin declined to 5.6%.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on B  believe that Suzlon Energy Ltd is expected to contain its expenses, which would trigger a re-rating in the stock.\n\nThe stock market experts advised long-term investors to make the most of these dips and accumulate Suzon shares in one's portfolio. They predicted limited downside in Suzlon shares as the average weighted price of Suzlon shares fell to the \u20b9 38- \u20b9 40 band. They said that Suzlon Energy's Q2 results 2026 are expected to improve, so it is time to add to or accumulate Suzlon Energy shares rather than press the panic button. They said that the Suzlon Energy share price may bounce back and touch \u20b9 46 per share levels in the near term.\n\nHighlighting the reasons that are dragging Suzlon Energy's share price, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \"Suzlon Energy shares witnessed the first round of re-rating when it became a profitable company, snapping the tag of a loss-making company.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 09:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Obama attacks Trump over inflation as Democrats fight for Michigan Senate seat", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 09:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongside India's biggest listing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Post Jio boost: 5 IPOs to raise Rs 2,581 crore next week alongsi securities lending rules", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi to revamp short-selling, securities lending rules The Economic Times daily newspaper is available online now. Read Today's Paper Sebi to revamp short-selling, securities lending rules SECTIONS Sebi to revamp short-selling, securities lending rules ET Bureau Last Updated: Oct 25, 2026, 09:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi is reviewing short-selling and securities lending rules to improve liquidity and price discovery. The regulator is also planning reforms in clearing, broker compliance, custodial services and corporate bond market-making to deepen capital markets and reduce compliance costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 09:28 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nifty bears tighten grip as crude
