ng questions about whether there is support inside the administration to continue the conflict.\n\nHouse Minority Leader Hakeem Jeffries, who will likely take over the House speaker's gavel in January, said Wednesday that Democrats will \"end this reckless and costly war of choice that has skyrocketed gas prices all across the country.\"\n\nThe new Congress will try to rein in the administration by passing legislation to stop the conflict, said Rep. Ted Lieu, vice chairman of the Democratic caucus.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gathering AI storm clouds doom tech stocks to darkest day in a year", "full_content": "Nov 5 (Reuters) - Big tech stocks slumped Thursday, putting them on track for their biggest decline since the \"Liberation Day\" rout last year, the most significant shakeout yet in what has been a punishing autumn for the AI trade.\n\nThe Nasdaq 100 index was set for market-value declines exceeding $2 trillion on investor fears that the Democratic Party's sweeping midterm victory could stall AI infrastructure expansion and force a chaotic reckoning for smaller firms whose capacity to raise funds has already been limited by higher interest rates and tighter financial conditions.\n\nAnalysts and portfolio managers said declines in once-hot areas such as semiconductors and AI infrastructure weren't entirely surprising, given the scale of earlier gains in many of these stocks and the financing concerns that have shadowed the so-called neoclouds, smaller infrastructure firms such as Nebius and CoreWeave, since US interest rates rose late in the summer.\n\nBut many said the scale of the declines for a second straight day suggest a change in sentiment that could portend further selling.\n\n\"Despite the magnitude of today\u2019s move, volatility has not yet reached the capitulation or contrarian extremes historically associated with capitulation points,\" said Adam Turnquist, chief cross-asset strategist for LPL Financial in Charlotte, North Carolina.\n\nShares of semiconductor and neocloud companies posted the most significant declines, reflecting worries that data center buildouts worth billions of dollars could face delays. The Philadelphia SE Semiconductor index fell as much as 11.2% to touch its lowest level in more than six months. Nvidia dropped 9% and Advanced Micro slumped 15%.\n\nHyperscalers, which defied Wednesday's broad tech selloff, also dropped.", "source": "LiveMint Markets", "pub_date_str": "06 Nov 2026, 12:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sandisk Stock Is Down 45% Over the Past Four Months. Is It a Bargain or a Value Trap? - Yahoo Finance", "full_content": "Sandisk Stock Is Down 45% Over the Past Four Months. Is It a Bargain or a Value Trap? Yahoo Finance Sandisk: A PEG Of 0.12x Is Just Too Cheap (NASDAQ:SNDK) Seeking Alpha Down 51% From Its High: Is This 84.6% Margin NAND Flash Maker a Bargain? Yahoo Finance Why is SanDisk stock tumbling today? Investing.com Memory Chip Stocks Fall Broadly in Pre-Market Trading; Seagate Technology (STX.US) Drops Over 4% Moomoo", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "As Nvidia\u2019s stock heads for a bear market, bargain hunters see a golden buying opportunity", "full_content": "Portfolio managers say chip demand should be resilient even in a period of political uncertainty.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Nov 2026, 12:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "HSA-eligible health plans in 2027: What to know about tax savings vs. higher deductibles", "full_content": "Healthcare affordability was part of the midterm election cost-of-living debate .\n\nIt is uncertain how a new Congress might try to address that pain point. Now, as workers choose their 2027 health insurance coverage , millions face a more immediate decision: whether to pick a plan that lets them contribute to a health savings account, or HSA.\n\nThe question is whether an HSA-eligible plan with lower premiums and tax benefits is worth the higher deductible and potential out-of-pocket costs.\n\n\"You have a triple tax advantage,\" said Kalei Cadinha-Pua'a, vice chair and CEO of Honolulu-based Cadinha & Co., which ranked No. 21 on this year's CNBC Financial Advisor 100 list.\n\nEmployer and employee contributions go into the fund before taxes, earnings in the account aren't taxed while they remain in the HSA, and withdrawals for qualified medical expenses are tax-free.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nFinancial advisors say employees often overlook another potential tax savings. HSA contributions made through an employer's Section 125 cafeteria plan generally aren't subject to Social Security and Medicare taxes.\n\nThat can make payroll contributions more tax-efficient than contributing on your own and claiming a deduction later, said certified financial planner and enrolled agent Andy Panko, the founder of Tenon Financial in Metuchen, New Jersey.", "source": "CNBC Top News", "pub_date_str": "06 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jim Cramer says the AI trade is not going away as Nasdaq enters correction", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC World Economy", "pub_date_str": "06 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman Traders\u2019 Phones Blow Up With Investors Seeking Answers to AI Rout - Bloomberg.com", "full_content": "Goldman Traders\u2019 Phones Blow Up With Investors Seeking Answers to AI Rout Bloomberg.com Goldman Sachs flags 'frozen' institutional buyers amid tech de-risking Seeking Alpha Goldman Sachs\u2019 Trading Desk Sees Buyers Disappear During Selloff TipRanks COIN and CRCL Stock Outlook as Goldman Sachs Flags 7 Recovery Signals for US Equities Cryptonews.net Wall Street's Risk Appetite Breaks: Goldman Finds a Market Still Carrying Too Much Leverage The Dark Side Of The Boom", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:10 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall Street fear gauge jumps most since 'Liberation Day' as AI trade stumbles - Reuters", "full_content": "Wall Street fear gauge jumps most since 'Liberation Day' as AI trade stumbles Reuters Wall Street's fear gauge surges the most since April. Why traders think it should be even higher CNBC VIX Takes Biggest Leap Since 2025 WSJ The VIX Hasn't Surged Like This Since Trump Tariff Chaos Barron's VIX spikes to seven-month high, erasing post-midterm relief (VIX:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "06 Nov 2026, 12:03 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wife's LinkedIn isn't proof of income, rules Bengaluru court; can financially independent woman be denied maintenance?", "full_content": "A woman's educational qualifications and an active LinkedIn profile do not necessarily mean that she is financially independent, a Bengaluru court has recently held, rejecting a husband\u2019s argument that his wife was capable of earning and therefore did not need maintenance.\n\nThe husband argued that his wife, an engineering graduate, had completed a Systems, Applications and Products in Data Processing (SAP) course from New Jersey in the United States and was capable of earning.\n\nHe also submitted her photographs, LinkedIn and Facebook profiles as evidence to claim that she was working at a private company. However, he failed to provide details of her alleged employment or actual income.\n\nThe court noted that the wife was unemployed when she filed the domestic violence petition in 2021. Her husband\u2019s own statement of assets and liabilities also did not mention that she had a job, earned an income or owned any exclusive property that would generate income.\n\nIn its ruling pronounced on October 28, 2026, the Bengaluru court noted that photographs and social media profiles produced during arguments could not be relied upon as proof of her employment or earnings.\n\n\u201cEven if it is presumed that the petitioner has joined some job after 2023, then also it cannot be held that the petitioner is having sufficient income so as to maintain herself and her child,\u201d the ruling read.\n\nThe court also recognised the responsibilities involved in raising a minor child, observing that the time and effort spent on childcare cannot be measured merely in monetary terms.", "source": "LiveMint Money", "pub_date_str": "06 Nov 2026, 12:01 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia Stock Is Below $200. What History Suggests Is the Floor. - Barron's", "full_content": "Nvidia Stock Is Below $200. What History Suggests Is the Floor. Barron's Nvidia has lost nearly $1.4 trillion since its October record Yahoo Finance Nvidia: Trade The Fear With NVDL (NASDAQ:NVDA) Seeking Alpha As Nvidia\u2019s stock heads for a bear market, bargain hunters see a golden buying opportunity MarketWatch Jim Cramer Says Nvidia Should Buy Shares on Thursday\u2019s 8% Drop: \u2018If the Cheapest Asset is Your Stock, You Benzinga", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 11:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock market today: Nasdaq plunges 5% as chip stocks sell off, Dow and S&P 500 give back post-election rally gains - Yahoo Finance", "full_content": "Stock market today: Nasdaq plunges 5% as chip stocks sell off, Dow and S&P 500 give back post-election rally gains Yahoo Finance Here's what the Democratic election rout could mean for the U.S. economy CNBC Wall Street welcomes gridlock after Democrats take control of Congress WJLA Stock markets diverge, oil prices rebound tracking Trump and AI Yahoo Finance What\u2019s Likely to Change for the U.S. Economy After Democrats\u2019 Resounding Victory in the Midterms? Investopedia", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 11:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Monzo explores fundraising at \u00a37.5bn valuation as private equity talks stall", "full_content": "Lender had shifted focus to talks with buyout groups after failing to clinch a \u00a310bn takeover by Brazilian fintech Nubank", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 11:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US stock market crash: Chip stocks extend sell-off, AMD, Arm, Qualcomm and Sandisk plunge up to 17%; Nasdaq down 6%", "full_content": "Chip stocks came under renewed selling pressure in Thursday's trade, extending previous day sell-off, with AMD, Arm Holdings, Qualcomm, Micron Technology and Sandisk leading the declines.\n\nThe stocks fell between 9% and 17% amid concerns that a Democrat-led Congress could push for tighter restrictions on artificial intelligence (AI) infrastructure and data centre development. Disappointing reactions to earnings and business outlooks from Arm Holdings and Qualcomm added to the selling pressure.\n\nQualcomm shares plunged 14% after investors were disappointed with the company's profit forecast, while Arm Holdings (ARM) dropped 15% after the chip designer's revenue guidance failed to impress Wall Street.\n\nMicron Technology was another major laggard, falling 13% after the memory chipmaker paused plans for a Taiwanese plant amid labour disputes. Following a 7% decline in the previous session, Sandisk shares lost another 15% at their intraday low.\n\nSK Hynix's ADRs also fell 14% after shares of the South Korean memory maker tumbled in overseas trading, alongside Samsung Electronics. Nvidia shares extended their decline to 9%, marking their biggest drop since April 2025.\n\nSimilarly, Intel shares declined 10%, while AMD plunged 17%. The AI-led rally has powered Wall Street to multiple record highs this year, even as concerns over inflation, economic policies and the possibility of higher interest rates have weighed on the broader market.\n\nMeanwhile, Elon Musk-led Tesla and SpaceX shares extended their declines, falling 9% and 11%, respectively, amid reports that the billionaire had spent at least $445 million to help Republicans retain control of Congress.\n\nThe steep sell-off also weighed on the broader market, with the S&P 500 falling 4% and the Nasdaq 100 declining as much as 6.4%. The PHLX Semiconductor Index, which tracks US-listed semiconductor stocks, dropped 11%, extending its losses from Wednesday. The Dow Jones Industrial Average also declined 3%.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stockal scam: Nearly 30 Indian investors allege \u20b9100 crore losses after US stock holdings sold without authorisation", "full_content": "Nearly 30 retail Indian investors have allegedly lost more than \u20b9 100 crore in a suspected trading scam involving Bengaluru-headquartered fintech platform Stockal Securities, after their accounts were reportedly accessed without authorisation and their US stock portfolios liquidated, Moneycontrol reported.\n\nThe news outlet reported that the affected investors told that their holdings in major American companies were sold without their consent on October 15, with the proceeds allegedly used to purchase large quantities of thinly traded Chinese stocks. The transactions reportedly resulted in substantial losses to their investment portfolios.\n\nStockal Securities is a Bengaluru-based fintech platform registered with the Securities and Exchange Board of India (Sebi). It enables Indian retail investors to invest in US stocks, exchange-traded funds (ETFs) and other overseas securities.\n\nThe platform offers an India-facing application for account funding, trading and portfolio tracking, while working with US-based clearing brokers, including DriveWealth LLC, to execute trades and hold assets in custody.\n\nAccording to the news outlet, one of the affected investors, a senior official at a leading Indian beverage company, said 10 of his major US stock holdings, including Apple, Tesla, Amazon, Alphabet, Nvidia and AMD, were liquidated without authorisation.\n\nThe total value of the shares reportedly sold was $335,768. The proceeds were subsequently used to place an unauthorised order for 300,000 shares of Chinese company Zhibao Technology Inc. at an average price of $1.05 per share.\n\nThe investor told Moneycontrol that he suffered losses of approximately $450,000, equivalent to around \u20b9 4.26 crore, as a result of the transactions.\n\nHe also raised concerns over the absence of individual trade confirmations or warnings for the large-scale liquidation and subsequent purchase.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 11:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Incorrect details in your provident fund records? Here's how to correct them on EPFO member portal", "full_content": "If a salaried employee has errors in their Employees\u2019 Provident Fund (EPF) records, they could create problems and delay the transfer of provident fund balance, withdrawal of money or settlement of a claim.\n\nEven minor discrepancies in details such as your name, date of birth, gender or date of joining can lead to delays or complications in processing your requests. Hence, it's advisable to check your account and passbook once in a while.\n\nThe Employees\u2019 Provident Fund Organisation ( EPFO ), which manages around \u20b9 30 lakh crore in retirement savings for nearly 30 crore people, allows members to correct eligible personal and employment details through its member portal.\n\nHere is a step-by-step guide on how to identify errors in your provident fund records and submit a correction request online.\n\nStep 1: Go to the EPFO member portal: ( https://unifiedportal-mem.epfindia.gov.in/memberinterface/ ) and use your Universal Account Number (UAN) and password to log in.\n\nStep 4: Enter correct information and upload supporting documents.\n\nOnce submitted, you can check the status of the form on the member portal to know if the rectified details have been updated.\n\nIn case you wish to submit the joint declaration form for EPF offline, you need to either download it from the EPFO portal or collect it from your employer. Afterwards, you can fill in the necessary details and submit the form to your nearest EPFO office along with supporting documents.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 11:18 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Democrats to probe JPMorgan's relationship with Jeffrey Epstein when they take Senate control", "full_content": "Senate Democrats are gearing up to investigate JPMorgan Chase 's banking relationship with the late sex offender Jeffrey Epstein once they take control of Congress early next year.\n\nDemocratic staffers on the Senate Finance Committee intend to home in on how high-ranking executives at JPMorgan handled Epstein, a source familiar with the panel's thinking told CNBC on Thursday. The person spoke on condition of anonymity because the probe of the nation's biggest bank has not been announced.\n\nThe Finance Committee is likely to be chaired beginning in January by Sen. Ron Wyden , an Oregon Democrat who currently is the panel's ranking member. Wyden has made clear he plans to make full use of the subpoena powers that committee majorities wield.\n\nDemocratic staffers aim to f     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
