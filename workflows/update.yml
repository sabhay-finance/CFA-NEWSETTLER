name: Update CFA Daily Digest

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
    # 1:00 PM IST = 7:30 AM UTC
    - cron: '30 7 * * *'
    # 7:00 PM IST = 1:30 PM UTC
    - cron: '30 13 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and build site
        run: python build.py

      - name: Commit and push updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "📰 Daily digest update — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
